name: Build HP256G8 RTL8821CE v8.5.5 PHY TX Diagnostic

"on":
  workflow_dispatch:

permissions:
  contents: read

env:
  FEIXIAO_REF: e963f43188382eced4ef2fa75d19ce4db2315c68
  RTW88_REF: d029a677c49266fad86750714eb5612becd134d3
  BUILD_NAME: Feixiao-HP256G8-v8.5.5-PHY-TX-Diagnostic

jobs:

  build:

    name: Build HP256G8 v8.5.5
    runs-on: macos-latest
    timeout-minutes: 30

    steps:

      # ================================================================
      # 01
      # EXACT STABLE FEIXIAO SOURCE
      # ================================================================

      - name: Checkout exact stable Feixiao
        uses: actions/checkout@v4
        with:
          repository: thegwchr/Feixiao
          ref: ${{ env.FEIXIAO_REF }}
          path: Feixiao
          fetch-depth: 1
          submodules: recursive


      # ================================================================
      # 02
      # VERIFY EXACT FEIXIAO COMMIT
      # ================================================================

      - name: Validate Feixiao revision
        shell: bash
        run: |
          set -eu

          ACTUAL="$(
            git \
              -C Feixiao \
              rev-parse HEAD
          )"

          echo
          echo "============================================================"
          echo "FEIXIAO"
          echo "============================================================"
          echo

          echo "Expected:"
          echo "${FEIXIAO_REF}"

          echo
          echo "Actual:"
          echo "${ACTUAL}"

          if [ "${ACTUAL}" != "${FEIXIAO_REF}" ]; then
            echo
            echo "ERROR: wrong Feixiao revision"
            exit 1
          fi

          echo
          echo "Feixiao stable base: OK"


      # ================================================================
      # 03
      # MACKERNELSDK
      # ================================================================

      - name: Validate MacKernelSDK
        shell: bash
        run: |
          set -eu

          if [ ! -d Feixiao/MacKernelSDK ]; then
            echo "ERROR: MacKernelSDK missing"
            exit 1
          fi

          if [ ! -d Feixiao/MacKernelSDK/Headers ]; then
            echo "ERROR: MacKernelSDK Headers missing"
            exit 1
          fi

          SDK_COMMIT="$(
            git \
              -C Feixiao/MacKernelSDK \
              rev-parse HEAD
          )"

          HEADER_COUNT="$(
            find \
              Feixiao/MacKernelSDK/Headers \
              -type f \
              | wc -l \
              | tr -d ' '
          )"

          echo
          echo "============================================================"
          echo "MACKERNELSDK"
          echo "============================================================"
          echo

          echo "Commit:"
          echo "${SDK_COMMIT}"

          echo
          echo "Headers:"
          echo "${HEADER_COUNT}"

          if [ "${HEADER_COUNT}" -lt 100 ]; then
            echo
            echo "ERROR: MacKernelSDK incomplete"
            exit 1
          fi

          echo
          echo "MacKernelSDK: OK"


      # ================================================================
      # 04
      # EXACT RTW88-STABLE SOURCE
      # ================================================================

      - name: Clone exact rtw88-stable
        shell: bash
        run: |
          set -eu

          rm -rf rtw88-stable

          git clone \
            https://github.com/thegwchr/rtw88-stable.git \
            rtw88-stable

          git \
            -C rtw88-stable \
            checkout \
            "${RTW88_REF}"

          ACTUAL="$(
            git \
              -C rtw88-stable \
              rev-parse HEAD
          )"

          echo
          echo "============================================================"
          echo "RTW88-STABLE"
          echo "============================================================"
          echo

          echo "Expected:"
          echo "${RTW88_REF}"

          echo
          echo "Actual:"
          echo "${ACTUAL}"

          if [ "${ACTUAL}" != "${RTW88_REF}" ]; then
            echo
            echo "ERROR: wrong rtw88-stable revision"
            exit 1
          fi

          echo
          echo "rtw88-stable: OK"


      # ================================================================
      # 05
      # VALIDATE REQUIRED FILES
      # ================================================================

      - name: Validate required source files
        shell: bash
        run: |
          set -eu

          FILES="
          Feixiao/Makefile
          Feixiao/src/kext/RTW88PCIDevice.cpp
          Feixiao/src/kext/RTW88PCIDevice.hpp
          Feixiao/src/kext/RTW88IEEE80211.cpp
          Feixiao/src/kext/RTW88IEEE80211.hpp
          Feixiao/src/kext/RTW88UserClient.cpp
          Feixiao/src/kext/RTW88UserClient.hpp
          Feixiao/src/compat/rtw88_compat.c
          Feixiao/src/compat/rtw88_compat.h
          Feixiao/ctl/main.c
          rtw88-stable/drivers/net/wireless/realtek/rtw88/main.c
          rtw88-stable/drivers/net/wireless/realtek/rtw88/pci.c
          rtw88-stable/drivers/net/wireless/realtek/rtw88/rx.c
          rtw88-stable/drivers/net/wireless/realtek/rtw88/tx.c
          "

          echo
          echo "============================================================"
          echo "REQUIRED SOURCE FILES"
          echo "============================================================"
          echo

          for FILE in ${FILES}
          do

            if [ ! -f "${FILE}" ]; then
              echo "ERROR: missing ${FILE}"
              exit 1
            fi

            echo "[OK] ${FILE}"

          done


      # ================================================================
      # 06
      # SAVE DATAPATH HASHES BEFORE BUILD CHANGES
      # ================================================================

      - name: Snapshot stable datapath
        shell: bash
        run: |
          set -eu

          FILES="
          Feixiao/src/kext/RTW88PCIDevice.cpp
          Feixiao/src/kext/RTW88PCIDevice.hpp
          Feixiao/src/kext/RTW88IEEE80211.cpp
          Feixiao/src/kext/RTW88IEEE80211.hpp
          Feixiao/src/kext/RTW88UserClient.cpp
          Feixiao/src/kext/RTW88UserClient.hpp
          Feixiao/src/compat/rtw88_compat.c
          Feixiao/src/compat/rtw88_compat.h
          rtw88-stable/drivers/net/wireless/realtek/rtw88/main.c
          rtw88-stable/drivers/net/wireless/realtek/rtw88/pci.c
          rtw88-stable/drivers/net/wireless/realtek/rtw88/rx.c
          rtw88-stable/drivers/net/wireless/realtek/rtw88/tx.c
          "

          rm -f /tmp/v855-before.sha256

          for FILE in ${FILES}
          do
            shasum \
              -a 256 \
              "${FILE}" \
              >> /tmp/v855-before.sha256
          done

          echo
          echo "============================================================"
          echo "ORIGINAL DATAPATH HASHES"
          echo "============================================================"

          cat /tmp/v855-before.sha256


      # ================================================================
      # 07
      # VERIFY THE PREVIOUS PANIC CHANGES ARE ABSENT
      # ================================================================

      - name: Reject v8.6 panic-producing modifications
        shell: bash
        run: |
          set -eu

          PCI="Feixiao/src/kext/RTW88PCIDevice.cpp"
          MAIN="rtw88-stable/drivers/net/wireless/realtek/rtw88/main.c"

          echo
          echo "============================================================"
          echo "PANIC REGRESSION CHECK"
          echo "============================================================"
          echo

          if grep -q \
            'flushRxQueue' \
            "${PCI}"
          then
            echo "ERROR: v8.6.3 RX batching detected"
            exit 1
          fi

          if grep -q \
            -A 1 \
            'if (rtw88_disable_watchdog_work)' \
            "${MAIN}" \
            | grep -q \
              'rtw_hci_dynamic_rx_agg(rtwdev, true)'
          then
            echo "ERROR: v8.6.2 forced RX aggregation detected"
            exit 1
          fi

          echo "RX batching: ABSENT"
          echo "Forced dynamic RX aggregation: ABSENT"
          echo
          echo "Known panic modifications are not present."


      # ================================================================
      # 08
      # VERIFY ORIGINAL SAFE RX DELIVERY
      # ================================================================

      - name: Validate stable RX delivery
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/src/kext/RTW88PCIDevice.cpp"

          grep -q \
            '_iface->inputPacket(m, 0, IONetworkInterface::kInputOptionQueuePacket);' \
            "${FILE}"

          grep -q \
            '_iface->flushInputQueue();' \
            "${FILE}"

          grep -q \
            'mbuf_pkthdr_len' \
            "${FILE}"

          grep -q \
            'mbuf_len' \
            "${FILE}"

          grep -q \
            'dropping bogus mbuf' \
            "${FILE}"

          echo
          echo "============================================================"
          echo "RX DELIVERY"
          echo "============================================================"
          echo

          echo "inputPacket: stable"
          echo "per-packet flush: stable"
          echo "mbuf validation: stable"
          echo "RX batching: disabled"


      # ================================================================
      # 09
      # VERIFY ORIGINAL SAFE DMA
      # ================================================================

      - name: Validate stable DMA
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/src/kext/RTW88PCIDevice.cpp"

          grep -q \
            'compat_dma_map' \
            "${FILE}"

          grep -q \
            'compat_dma_unmap' \
            "${FILE}"

          grep -q \
            'compat_dma_sync_cpu' \
            "${FILE}"

          grep -q \
            'syncBounceForCpu' \
            "${FILE}"

          echo
          echo "============================================================"
          echo "DMA"
          echo "============================================================"
          echo

          echo "DMA map: stable"
          echo "DMA unmap: stable"
          echo "DMA sync: stable"
          echo "Bounce DMA: stable"


      # ================================================================
      # 10
      # VERIFY ORIGINAL TX FLOW CONTROL
      # ================================================================

      - name: Validate stable TX backpressure
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/src/kext/RTW88PCIDevice.cpp"

          grep -q \
            'kRTW88TxStallAvail = 96;' \
            "${FILE}"

          grep -q \
            'kRTW88TxResumeAvail = 160;' \
            "${FILE}"

          echo
          echo "============================================================"
          echo "TX FLOW CONTROL"
          echo "============================================================"
          echo

          echo "Stall : 96"
          echo "Resume: 160"
          echo
          echo "TX thresholds unchanged."


      # ================================================================
      # 11
      # VERIFY STABLE WATCHDOG
      # ================================================================

      - name: Validate watchdog safe mode
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/src/compat/rtw88_compat.c"

          grep -q \
            'bool rtw88_disable_watchdog_work = true;' \
            "${FILE}"

          echo
          echo "============================================================"
          echo "WATCHDOG"
          echo "============================================================"
          echo

          echo "Full RF dynamic watchdog: disabled"
          echo "Known stable behavior retained."


      # ================================================================
      # 12
      # VERIFY VHT80 NEGOTIATION CODE
      # ================================================================

      - name: Validate VHT 80 MHz negotiation
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          grep -q \
            '_connChanWidth = 20;' \
            "${FILE}"

          grep -q \
            '_connChanWidth = 40;' \
            "${FILE}"

          grep -q \
            '_connChanWidth = 80;' \
            "${FILE}"

          grep -q \
            'NL80211_CHAN_WIDTH_80' \
            "${FILE}"

          grep -q \
            'WLAN_EID_VHT_OPERATION' \
            "${FILE}"

          grep -q \
            'connected chandef:' \
            "${FILE}"

          echo
          echo "============================================================"
          echo "CHANNEL NEGOTIATION"
          echo "============================================================"
          echo

          echo "HT20 parser : present"
          echo "HT40 parser : present"
          echo "VHT80 parser: present"
          echo "Runtime chandef logging: present"


      # ================================================================
      # 13
      # VERIFY STA 80 MHZ PATH
      # ================================================================

      - name: Validate STA VHT80 configuration
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          grep -q \
            'IEEE80211_STA_RX_BW_80' \
            "${FILE}"

          grep -q \
            'vht_cap' \
            "${FILE}"

          grep -q \
            'ht_cap' \
            "${FILE}"

          echo
          echo "STA BW80: present"
          echo "HT capabilities: present"
          echo "VHT capabilities: present"


      # ================================================================
      # 14
      # VERIFY A-MPDU / BLOCKACK
      # ================================================================

      - name: Validate A-MPDU and BlockAck
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          grep -q \
            'startTxAggregation' \
            "${FILE}"

          grep -q \
            'sendAddbaRequest' \
            "${FILE}"

          grep -q \
            'sendAddbaResponse' \
            "${FILE}"

          grep -q \
            'handleBackAction' \
            "${FILE}"

          grep -q \
            '_txBaActive' \
            "${FILE}"

          grep -q \
            'rxReorderInput' \
            "${FILE}"

          echo
          echo "============================================================"
          echo "A-MPDU / BLOCKACK"
          echo "============================================================"
          echo

          echo "TX ADDBA request : present"
          echo "RX ADDBA response: present"
          echo "TX BlockAck state: present"
          echo "RX reorder       : present"


      # ================================================================
      # 15
      # VERIFY RATE ADAPTATION
      # ================================================================

      - name: Validate firmware rate adaptation
        shell: bash
        run: |
          set -eu

          COMPAT="Feixiao/src/compat/rtw88_compat.c"
          MAIN="rtw88-stable/drivers/net/wireless/realtek/rtw88/main.c"

          grep -q \
            'fix_rate = 0xFF' \
            "${COMPAT}"

          grep -q \
            'RA_MASK_VHT_RATES_1SS' \
            "${MAIN}"

          grep -q \
            'RTW_RATEID_ARFR1_AC_1SS' \
            "${MAIN}"

          grep -q \
            'RTW_CHANNEL_WIDTH_80' \
            "${MAIN}"

          echo
          echo "============================================================"
          echo "RATE ADAPTATION"
          echo "============================================================"
          echo

          echo "Fixed legacy rate: disabled"
          echo "VHT 1SS RA       : present"
          echo "80 MHz RA        : present"


      # ================================================================
      # 16
      # ENABLE O2 ONLY
      #
      # Same compiler strategy as v8.5.4.
      #
      # NO DRIVER LOGIC CHANGE.
      # ================================================================

      - name: Enable O2 optimization
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/Makefile"

          if grep -q \
            -- '-O2' \
            "${FILE}"
          then
            echo "O2 already present."
          else

            COUNT="$(
              grep -c \
                '^[[:space:]]*-fno-stack-protector -mkernel \\' \
                "${FILE}" \
                || true
            )"

            if [ "${COUNT}" -ne 1 ]; then
              echo "ERROR: KEXT_FLAGS insertion point not found"
              exit 1
            fi

            sed -i '' \
              's/-fno-stack-protector -mkernel \\/-fno-stack-protector -mkernel -O2 -fno-strict-aliasing \\/' \
              "${FILE}"

          fi

          grep -q \
            -- '-O2' \
            "${FILE}"

          grep -q \
            -- '-fno-strict-aliasing' \
            "${FILE}"

          echo
          echo "============================================================"
          echo "COMPILER"
          echo "============================================================"
          echo

          echo "-O2"
          echo "-fno-strict-aliasing"


      # ================================================================
      # 17
      # DO NOT ALLOW AGGRESSIVE OPTIMIZATION
      # ================================================================

      - name: Reject unsafe compiler flags
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/Makefile"

          if grep -q \
            -- '-O3' \
            "${FILE}"
          then
            echo "ERROR: O3 not allowed"
            exit 1
          fi

          if grep -q \
            -- '-Ofast' \
            "${FILE}"
          then
            echo "ERROR: Ofast not allowed"
            exit 1
          fi

          if grep -q \
            -- '-ffast-math' \
            "${FILE}"
          then
            echo "ERROR: fast-math not allowed"
            exit 1
          fi

          echo "Compiler safety validation: OK"


      # ================================================================
      # 18
      # VERIFY DATAPATH SOURCE DID NOT CHANGE
      # ================================================================

      - name: Verify datapath unchanged
        shell: bash
        run: |
          set -eu

          FILES="
          Feixiao/src/kext/RTW88PCIDevice.cpp
          Feixiao/src/kext/RTW88PCIDevice.hpp
          Feixiao/src/kext/RTW88IEEE80211.cpp
          Feixiao/src/kext/RTW88IEEE80211.hpp
          Feixiao/src/kext/RTW88UserClient.cpp
          Feixiao/src/kext/RTW88UserClient.hpp
          Feixiao/src/compat/rtw88_compat.c
          Feixiao/src/compat/rtw88_compat.h
          rtw88-stable/drivers/net/wireless/realtek/rtw88/main.c
          rtw88-stable/drivers/net/wireless/realtek/rtw88/pci.c
          rtw88-stable/drivers/net/wireless/realtek/rtw88/rx.c
          rtw88-stable/drivers/net/wireless/realtek/rtw88/tx.c
          "

          rm -f /tmp/v855-after.sha256

          for FILE in ${FILES}
          do

            shasum \
              -a 256 \
              "${FILE}" \
              >> /tmp/v855-after.sha256

          done

          if ! cmp \
            -s \
            /tmp/v855-before.sha256 \
            /tmp/v855-after.sha256
          then

            echo
            echo "ERROR:"
            echo "Stable driver source changed."

            echo
            echo "BEFORE:"
            cat /tmp/v855-before.sha256

            echo
            echo "AFTER:"
            cat /tmp/v855-after.sha256

            exit 1

          fi

          echo
          echo "============================================================"
          echo "DATAPATH VALIDATION"
          echo "============================================================"
          echo

          echo "RX     : byte-for-byte stable"
          echo "TX     : byte-for-byte stable"
          echo "DMA    : byte-for-byte stable"
          echo "WPA2   : byte-for-byte stable"
          echo "A-MPDU : byte-for-byte stable"
          echo "Watchdog: byte-for-byte stable"


      # ================================================================
      # 19
      # CREATE USERSPACE DIAGNOSTIC SCRIPT
      #
      # IMPORTANT:
      # This script does NOT run in kernel space.
      # It cannot change driver behavior.
      # ================================================================

      - name: Create rtw88diag diagnostic tool
        shell: bash
        run: |
          set -eu

          mkdir -p diagnostic

          cat > diagnostic/rtw88diag.sh <<'DIAG'
          #!/bin/bash

          set -u

          CTL="${1:-./rtw88ctl}"

          echo
          echo "============================================================"
          echo "RTW88 RTL8821CE PERFORMANCE DIAGNOSTIC"
          echo "============================================================"
          echo

          echo "Date:"
          date

          echo
          echo "macOS:"
          sw_vers

          echo
          echo "Kernel:"
          uname -a

          echo
          echo "------------------------------------------------------------"
          echo "RTW88 STATUS"
          echo "------------------------------------------------------------"
          echo

          if [ -x "${CTL}" ]; then
            "${CTL}" status || true
          else
            echo "rtw88ctl not found/executable:"
            echo "${CTL}"
          fi

          echo
          echo "------------------------------------------------------------"
          echo "NETWORK INTERFACES"
          echo "------------------------------------------------------------"
          echo

          ifconfig || true

          echo
          echo "------------------------------------------------------------"
          echo "DEFAULT ROUTE"
          echo "------------------------------------------------------------"
          echo

          route -n get default 2>/dev/null || true

          echo
          echo "------------------------------------------------------------"
          echo "RTW88 KEXT"
          echo "------------------------------------------------------------"
          echo

          kmutil showloaded 2>/dev/null \
            | grep -i rtw88 \
            || true

          echo
          echo "------------------------------------------------------------"
          echo "CHANNEL WIDTH / VHT"
          echo "------------------------------------------------------------"
          echo

          log show \
            --last 15m \
            --style compact \
            --predicate \
            'process == "kernel" AND eventMessage CONTAINS[c] "connected chandef"' \
            2>/dev/null \
            | tail -50 \
            || true

          echo
          echo "------------------------------------------------------------"
          echo "AUTHENTICATION / ASSOCIATION"
          echo "------------------------------------------------------------"
          echo

          log show \
            --last 15m \
            --style compact \
            --predicate \
            'process == "kernel" AND senderImagePath CONTAINS[c] "rtw88"' \
            2>/dev/null \
            | grep -Ei \
            'auth|assoc|WPA2|EAPOL|connected' \
            | tail -150 \
            || true

          echo
          echo "------------------------------------------------------------"
          echo "A-MPDU / BLOCKACK / ADDBA"
          echo "------------------------------------------------------------"
          echo

          log show \
            --last 15m \
            --style compact \
            --predicate \
            'process == "kernel"' \
            2>/dev/null \
            | grep -Ei \
            'rtw88.*(ADDBA|BlockAck|A-MPDU|AMPDU|BA active|aggregation)' \
            | tail -150 \
            || true

          echo
          echo "------------------------------------------------------------"
          echo "PCI / DMA ERRORS"
          echo "------------------------------------------------------------"
          echo

          log show \
            --last 15m \
            --style compact \
            --predicate \
            'process == "kernel"' \
            2>/dev/null \
            | grep -Ei \
            'rtw88.*(pci|dma|timeout|bus timeout|ring|descriptor|ENOSPC|stall)' \
            | tail -200 \
            || true

          echo
          echo "------------------------------------------------------------"
          echo "DEAUTH / DISASSOC"
          echo "------------------------------------------------------------"
          echo

          log show \
            --last 15m \
            --style compact \
            --predicate \
            'process == "kernel"' \
            2>/dev/null \
            | grep -Ei \
            'rtw88.*(deauth|disassoc|reason=)' \
            | tail -100 \
            || true

          echo
          echo "------------------------------------------------------------"
          echo "RECENT RTW88 KERNEL LOG"
          echo "------------------------------------------------------------"
          echo

          log show \
            --last 10m \
            --style compact \
            --predicate \
            'process == "kernel"' \
            2>/dev/null \
            | grep -i rtw88 \
            | tail -300 \
            || true

          echo
          echo "============================================================"
          echo "END OF DIAGNOSTIC"
          echo "============================================================"
          DIAG

          chmod +x diagnostic/rtw88diag.sh

          bash -n diagnostic/rtw88diag.sh

          echo
          echo "rtw88diag.sh: OK"


      # ================================================================
      # 20
      # CREATE SPEED TEST COLLECTION SCRIPT
      #
      # Run this immediately after the browser Speedtest.
      # ================================================================

      - name: Create post-speedtest collector
        shell: bash
        run: |
          set -eu

          cat > diagnostic/after-speedtest.sh <<'COLLECT'
          #!/bin/bash

          set -u

          CTL="${1:-./rtw88ctl}"

          OUT="rtw88-speedtest-$(date +%Y%m%d-%H%M%S).txt"

          {
            echo "============================================================"
            echo "RTW88 POST SPEEDTEST"
            echo "============================================================"
            echo

            date
            echo

            if [ -x "${CTL}" ]; then
              "${CTL}" status || true
            fi

            echo
            echo "============================================================"
            echo "RTW88 LOG"
            echo "============================================================"

            log show \
              --last 5m \
              --style compact \
              --predicate \
              'process == "kernel"' \
              2>/dev/null \
              | grep -i rtw88 \
              | tail -500 \
              || true

          } > "${OUT}"

          echo
          echo "Saved:"
          echo "${OUT}"
          COLLECT

          chmod +x diagnostic/after-speedtest.sh

          bash -n diagnostic/after-speedtest.sh

          echo "after-speedtest.sh: OK"


      # ================================================================
      # 21
      # DOWNLOAD REALTEK FIRMWARE
      # ================================================================

      - name: Download Realtek firmware
        shell: bash
        run: |
          set -eu

          cd Feixiao/firmware

          FIRMWARE_FILES="
          rtw8822b_fw.bin
          rtw8822c_fw.bin
          rtw8821c_fw.bin
          rtw8821a_fw.bin
          rtw8812a_fw.bin
          rtw8814a_fw.bin
          "

          for FW in ${FIRMWARE_FILES}
          do

            if [ ! -s "${FW}" ]; then

              echo
              echo "Downloading ${FW}"

              curl \
                --location \
                --fail \
                --retry 3 \
                --retry-delay 2 \
                "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtw88/${FW}" \
                --output "${FW}"

            fi

            if [ ! -s "${FW}" ]; then
              echo
              echo "ERROR: firmware missing:"
              echo "${FW}"
              exit 1
            fi

            echo "[OK] ${FW}"
            ls -lh "${FW}"

          done


      # ================================================================
      # 22
      # VERIFY RTL8821C FIRMWARE
      # ================================================================

      - name: Validate RTL8821C firmware
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/firmware/rtw8821c_fw.bin"

          if [ ! -s "${FILE}" ]; then
            echo "ERROR: RTL8821C firmware missing"
            exit 1
          fi

          SIZE="$(
            stat \
              -f "%z" \
              "${FILE}"
          )"

          echo
          echo "RTL8821C firmware:"
          echo "${SIZE} bytes"

          if [ "${SIZE}" -lt 50000 ]; then
            echo
            echo "ERROR: suspicious firmware size"
            exit 1
          fi

          echo
          echo "Firmware: OK"


      # ================================================================
      # 23
      # BUILD ENVIRONMENT
      # ================================================================

      - name: Show build environment
        shell: bash
        run: |
          set -eu

          echo
          echo "============================================================"
          echo "MACOS"
          echo "============================================================"

          sw_vers

          echo
          echo "============================================================"
          echo "XCODE"
          echo "============================================================"

          xcodebuild -version

          echo
          echo "============================================================"
          echo "CLANG"
          echo "============================================================"

          clang --version

          echo
          echo "============================================================"
          echo "MACKERNELSDK"
          echo "============================================================"

          git \
            -C Feixiao/MacKernelSDK \
            rev-parse HEAD


      # ================================================================
      # 24
      # CLEAN BUILD
      # ================================================================

      - name: Clean previous build
        shell: bash
        working-directory: Feixiao
        run: |
          set -eu

          make clean || true

          rm -rf \
            build/out \
            || true

          echo
          echo "Clean: OK"


      # ================================================================
      # 25
      # BUILD
      # ================================================================

      - name: Build HP256G8 v8.5.5
        shell: bash
        working-directory: Feixiao
        run: |
          set -eu

          echo
          echo "============================================================"
          echo "HP 256 G8"
          echo "REALTEK RTL8821CE"
          echo "V8.5.5 STABLE PHY/TX DIAGNOSTIC"
          echo "============================================================"
          echo

          echo "Stable driver source : unchanged"
          echo "RX                   : unchanged"
          echo "TX                   : unchanged"
          echo "DMA                  : unchanged"
          echo "Watchdog             : unchanged"
          echo "WPA2                 : unchanged"
          echo "A-MPDU               : unchanged"
          echo "TX thresholds        : 96 / 160"
          echo "RX batching          : disabled"
          echo "Forced RX aggregation: disabled"
          echo "Compiler             : O2"
          echo

          make all


      # ================================================================
      # 26
      # VERIFY GENERATED FIRMWARE BLOB SOURCE
      # ================================================================

      - name: Validate embedded firmware
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/src/compat/fw_blobs.c"

          if [ ! -s "${FILE}" ]; then
            echo
            echo "ERROR: fw_blobs.c missing"
            exit 1
          fi

          SIZE="$(
            stat \
              -f "%z" \
              "${FILE}"
          )"

          echo
          echo "fw_blobs.c:"
          echo "${SIZE} bytes"

          if [ "${SIZE}" -lt 10000 ]; then
            echo
            echo "ERROR: firmware source unexpectedly small"
            exit 1
          fi


      # ================================================================
      # 27
      # VERIFY BUILD OUTPUT
      # ================================================================

      - name: Verify v8.5.5 output
        shell: bash
        run: |
          set -eu

          KEXT="Feixiao/build/out/rtw88.kext"
          CTL="Feixiao/build/out/rtw88ctl"

          test -d \
            "${KEXT}"

          test -f \
            "${KEXT}/Contents/Info.plist"

          test -f \
            "${KEXT}/Contents/MacOS/rtw88"

          test -f \
            "${CTL}"

          echo
          echo "rtw88.kext: OK"
          echo "rtw88ctl : OK"


      # ================================================================
      # 28
      # VALIDATE PLIST
      # ================================================================

      - name: Validate Info.plist
        shell: bash
        run: |
          set -eu

          PLIST="Feixiao/build/out/rtw88.kext/Contents/Info.plist"

          plutil \
            -lint \
            "${PLIST}"

          echo
          echo "Bundle ID:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "${PLIST}"


      # ================================================================
      # 29
      # VALIDATE MACH-O
      # ================================================================

      - name: Validate Mach-O
        shell: bash
        run: |
          set -eu

          BIN="Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88"
          CTL="Feixiao/build/out/rtw88ctl"

          echo
          echo "Kext:"
          file "${BIN}"

          echo
          echo "UUID:"
          dwarfdump \
            --uuid \
            "${BIN}"

          echo
          echo "rtw88ctl:"
          file "${CTL}"


      # ================================================================
      # 30
      # CHECK IMPORTANT BINARY STRINGS
      # ================================================================

      - name: Validate diagnostic markers in kext
        shell: bash
        run: |
          set -eu

          BIN="Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88"

          echo
          echo "============================================================"
          echo "BINARY DIAGNOSTIC MARKERS"
          echo "============================================================"
          echo

          if strings "${BIN}" \
            | grep -q \
              'connected chandef'
          then
            echo "[OK] connected chandef"
          else
            echo "ERROR: connected chandef marker missing"
            exit 1
          fi

          if strings "${BIN}" \
            | grep -q \
              'WPA2 connected'
          then
            echo "[OK] WPA2 connected marker"
          else
            echo "ERROR: WPA2 marker missing"
            exit 1
          fi

          if strings "${BIN}" \
            | grep -qi \
              'ADDBA'
          then
            echo "[OK] ADDBA marker"
          else
            echo "WARNING: ADDBA text marker not found"
          fi

          if strings "${BIN}" \
            | grep -q \
              'pci bus timeout'
          then
            echo "[OK] PCI timeout marker"
          else
            echo "PCI timeout text not found in binary"
          fi


      # ================================================================
      # 31
      # PREPARE ARTIFACT
      # ================================================================

      - name: Prepare v8.5.5 artifact
        shell: bash
        run: |
          set -eu

          OUT="${RUNNER_TEMP}/${BUILD_NAME}"

          rm -rf \
            "${OUT}"

          mkdir -p \
            "${OUT}"

          cp -R \
            Feixiao/build/out/rtw88.kext \
            "${OUT}/"

          cp \
            Feixiao/build/out/rtw88ctl \
            "${OUT}/"

          chmod +x \
            "${OUT}/rtw88ctl"

          cp \
            diagnostic/rtw88diag.sh \
            "${OUT}/"

          cp \
            diagnostic/after-speedtest.sh \
            "${OUT}/"

          chmod +x \
            "${OUT}/rtw88diag.sh"

          chmod +x \
            "${OUT}/after-speedtest.sh"

          cp \
            Feixiao/Makefile \
            "${OUT}/Makefile.build-used"


      # ================================================================
      # 32
      # BUILD INFO
      # ================================================================

      - name: Create v8.5.5 build info
        shell: bash
        run: |
          set -eu

          OUT="${RUNNER_TEMP}/${BUILD_NAME}"

          FEIXIAO_HASH="$(
            git \
              -C Feixiao \
              rev-parse HEAD
          )"

          RTW88_HASH="$(
            git \
              -C rtw88-stable \
              rev-parse HEAD
          )"

          SDK_HASH="$(
            git \
              -C Feixiao/MacKernelSDK \
              rev-parse HEAD
          )"

          KEXT_UUID="$(
            dwarfdump \
              --uuid \
              Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88 \
              | awk '{print $2}' \
              | head -1
          )"

          cat > "${OUT}/BUILD-INFO.txt" <<EOF
          ============================================================
          HP 256 G8
          REALTEK RTL8821CE
          V8.5.5 STABLE PHY/TX DIAGNOSTIC
          ============================================================


          SOURCE
          ============================================================

          Feixiao:
          ${FEIXIAO_HASH}

          rtw88-stable:
          ${RTW88_HASH}

          MacKernelSDK:
          ${SDK_HASH}

          Kext UUID:
          ${KEXT_UUID}


          PURPOSE
          ============================================================

          Diagnose the approximately:

          30 Mbps download
          sub-1 Mbps upload

          condition without modifying the stable driver datapath.


          DRIVER BEHAVIOR
          ============================================================

          RX:
          unchanged

          per-packet flushInputQueue:
          unchanged

          RX batching:
          disabled

          TX:
          unchanged

          TX stall:
          96

          TX resume:
          160

          DMA:
          unchanged

          bounce buffers:
          unchanged

          mbuf safety:
          unchanged

          forced dynamic RX aggregation:
          disabled

          full RF watchdog:
          disabled

          WPA2:
          unchanged

          VHT:
          unchanged

          A-MPDU:
          unchanged


          COMPILER
          ============================================================

          -O2
          -fno-strict-aliasing


          DIAGNOSTIC TOOLS
          ============================================================

          rtw88diag.sh

          Collects:

          driver status
          channel width
          authentication
          association
          WPA2
          A-MPDU / ADDBA
          PCI errors
          DMA errors
          bus timeouts
          TX stalls
          deauthentication
          recent rtw88 kernel log


          after-speedtest.sh

          Run immediately after a Speedtest.

          It creates a timestamped text report containing:

          rtw88ctl status
          recent rtw88 kernel messages


          GOAL
          ============================================================

          Determine whether the <100 Mbps limitation is caused by:

          20/40/80 MHz negotiation
          VHT association
          BlockAck/A-MPDU
          TX path
          PCI/DMA stalls
          excessive reconnect/deauth behavior


          IMPORTANT
          ============================================================

          This version intentionally does NOT attempt another
          risky performance datapath modification.

          It is designed to identify the exact bottleneck before
          applying the next targeted fix.

          Keep the known-working stable build available as fallback.
          EOF


      # ================================================================
      # 33
      # CREATE TEST INSTRUCTIONS
      # ================================================================

      - name: Create test instructions
        shell: bash
        run: |
          set -eu

          OUT="${RUNNER_TEMP}/${BUILD_NAME}"

          cat > "${OUT}/TESTE.txt" <<'EOF'
          ============================================================
          TESTE V8.5.5
          ============================================================


          1. Instale rtw88.kext.

          2. Reinicie o macOS.

          3. Abra o Terminal.

          4. Entre na pasta deste pacote.

          Exemplo:

          cd ~/Downloads/Feixiao-HP256G8-v8.5.5-PHY-TX-Diagnostic


          5. Faça um scan:

          ./rtw88ctl scan


          6. Conecte SOMENTE no Wi-Fi 5 GHz.

          Use:

          ./rtw88ctl connect "NOME_DA_REDE_5G"

          Não coloque a senha na linha de comando se puder evitá-lo.


          7. Confira:

          ./rtw88ctl status


          O Channel deverá ser superior a 14.

          Exemplo:

          Channel: 36


          8. Execute o diagnóstico:

          sudo ./rtw88diag.sh ./rtw88ctl


          9. Faça UM Speedtest completo.


          10. Imediatamente depois:

          sudo ./after-speedtest.sh ./rtw88ctl


          11. O script criará um arquivo:

          rtw88-speedtest-AAAAMMDD-HHMMSS.txt


          12. Envie esse TXT para análise.


          PRINCIPAL INFORMAÇÃO A PROCURAR
          ============================================================

          Procure no resultado por:

          connected chandef:


          Exemplos:


          connected chandef: 20 MHz

          Isso indica um forte limitador PHY.


          connected chandef: 40 MHz

          Ainda abaixo da capacidade máxima 802.11ac da placa.


          connected chandef: 80 MHz

          A largura de canal está correta e devemos investigar
          TX/A-MPDU/rate control/PCI.


          NÃO USE
          ============================================================

          v8.6.2 dynamic RX aggregation

          v8.6.3 RX batching


          Esses caminhos apresentaram kernel panic neste hardware.
          EOF


      # ================================================================
      # 34
      # SHA256
      # ================================================================

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -eu

          OUT="${RUNNER_TEMP}/${BUILD_NAME}"

          cd "${OUT}"

          shasum \
            -a 256 \
            rtw88ctl \
            rtw88diag.sh \
            after-speedtest.sh \
            > SHA256SUMS.txt

          find \
            rtw88.kext \
            -type f \
            -exec shasum -a 256 {} \; \
            >> SHA256SUMS.txt

          echo
          cat SHA256SUMS.txt


      # ================================================================
      # 35
      # PACKAGE
      # ================================================================

      - name: Package HP256G8 v8.5.5
        shell: bash
        run: |
          set -eu

          cd "${RUNNER_TEMP}"

          ZIP="Feixiao_HP256G8_v8_5_5_PHY_TX_Diagnostic.zip"

          rm -f \
            "${ZIP}"

          zip \
            -r \
            "${ZIP}" \
            "${BUILD_NAME}"

          echo
          echo "============================================================"
          echo "PACKAGE"
          echo "============================================================"
          echo

          ls -lh \
            "${ZIP}"


      # ================================================================
      # 36
      # UPLOAD
      # ================================================================

      - name: Upload HP256G8 v8.5.5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Feixiao-HP256G8-v8.5.5-PHY-TX-Diagnostic
          path: ${{ runner.temp }}/Feixiao_HP256G8_v8_5_5_PHY_TX_Diagnostic.zip
          if-no-files-found: error
          retention-days: 7
