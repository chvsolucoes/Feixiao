name: Build HP256G8 RTL8821CE v8.5.5 PHY TX Diagnostic

"on":
  workflow_dispatch:

permissions:
  contents: read

env:
  FEIXIAO_REF: e963f43188382eced4ef2fa75d19ce4db2315c68
  RTW88_REF: d029a677c49266fad86750714eb5612becd134d3
  BUILD_NAME: Feixiao-HP256G8-v8.5.5-PHY-TX-Diagnostic

jobs:

  build:

    name: Build HP256G8 v8.5.5
    runs-on: macos-latest
    timeout-minutes: 30

    steps:

      # ================================================================
      # 01 - CHECKOUT EXACT STABLE FEIXIAO
      # ================================================================

      - name: Checkout exact stable Feixiao
        uses: actions/checkout@v4
        with:
          repository: thegwchr/Feixiao
          ref: ${{ env.FEIXIAO_REF }}
          path: Feixiao
          fetch-depth: 1
          submodules: recursive


      # ================================================================
      # 02 - VALIDATE FEIXIAO REVISION
      # ================================================================

      - name: Validate Feixiao revision
        shell: bash
        run: |
          set -eu

          ACTUAL="$(git -C Feixiao rev-parse HEAD)"

          echo
          echo "============================================================"
          echo "FEIXIAO"
          echo "============================================================"
          echo

          echo "Expected:"
          echo "${FEIXIAO_REF}"

          echo
          echo "Actual:"
          echo "${ACTUAL}"

          if [ "${ACTUAL}" != "${FEIXIAO_REF}" ]; then
            echo "ERROR: wrong Feixiao revision"
            exit 1
          fi

          echo
          echo "Feixiao stable base: OK"


      # ================================================================
      # 03 - VALIDATE MACKERNELSDK
      # ================================================================

      - name: Validate MacKernelSDK
        shell: bash
        run: |
          set -eu

          if [ ! -d Feixiao/MacKernelSDK ]; then
            echo "ERROR: MacKernelSDK missing"
            exit 1
          fi

          if [ ! -d Feixiao/MacKernelSDK/Headers ]; then
            echo "ERROR: MacKernelSDK Headers missing"
            exit 1
          fi

          SDK_COMMIT="$(git -C Feixiao/MacKernelSDK rev-parse HEAD)"

          HEADER_COUNT="$(
            find Feixiao/MacKernelSDK/Headers \
              -type f \
              | wc -l \
              | tr -d ' '
          )"

          echo
          echo "============================================================"
          echo "MACKERNELSDK"
          echo "============================================================"
          echo

          echo "Commit:"
          echo "${SDK_COMMIT}"

          echo
          echo "Headers:"
          echo "${HEADER_COUNT}"

          if [ "${HEADER_COUNT}" -lt 100 ]; then
            echo "ERROR: MacKernelSDK incomplete"
            exit 1
          fi

          echo
          echo "MacKernelSDK: OK"


      # ================================================================
      # 04 - CLONE EXACT RTW88-STABLE
      # ================================================================

      - name: Clone exact rtw88-stable
        shell: bash
        run: |
          set -eu

          rm -rf rtw88-stable

          git clone \
            https://github.com/thegwchr/rtw88-stable.git \
            rtw88-stable

          git \
            -C rtw88-stable \
            checkout \
            "${RTW88_REF}"

          ACTUAL="$(git -C rtw88-stable rev-parse HEAD)"

          echo
          echo "============================================================"
          echo "RTW88-STABLE"
          echo "============================================================"
          echo

          echo "Expected:"
          echo "${RTW88_REF}"

          echo
          echo "Actual:"
          echo "${ACTUAL}"

          if [ "${ACTUAL}" != "${RTW88_REF}" ]; then
            echo "ERROR: wrong rtw88-stable revision"
            exit 1
          fi

          echo
          echo "rtw88-stable: OK"


      # ================================================================
      # 05 - VALIDATE REQUIRED SOURCE FILES
      # ================================================================

      - name: Validate required source files
        shell: bash
        run: |
          set -eu

          FILES="
          Feixiao/Makefile
          Feixiao/src/kext/RTW88PCIDevice.cpp
          Feixiao/src/kext/RTW88PCIDevice.hpp
          Feixiao/src/kext/RTW88IEEE80211.cpp
          Feixiao/src/kext/RTW88IEEE80211.hpp
          Feixiao/src/kext/RTW88UserClient.cpp
          Feixiao/src/kext/RTW88UserClient.hpp
          Feixiao/src/compat/rtw88_compat.c
          Feixiao/src/compat/rtw88_compat.h
          Feixiao/ctl/main.c
          rtw88-stable/drivers/net/wireless/realtek/rtw88/main.c
          rtw88-stable/drivers/net/wireless/realtek/rtw88/pci.c
          rtw88-stable/drivers/net/wireless/realtek/rtw88/rx.c
          rtw88-stable/drivers/net/wireless/realtek/rtw88/tx.c
          "

          echo
          echo "============================================================"
          echo "REQUIRED FILES"
          echo "============================================================"

          for FILE in ${FILES}
          do

            if [ ! -f "${FILE}" ]; then
              echo "ERROR: missing ${FILE}"
              exit 1
            fi

            echo "[OK] ${FILE}"

          done


      # ================================================================
      # 06 - SNAPSHOT DATAPATH HASHES
      # ================================================================

      - name: Snapshot stable datapath hashes
        shell: bash
        run: |
          set -eu

          FILES="
          Feixiao/src/kext/RTW88PCIDevice.cpp
          Feixiao/src/kext/RTW88PCIDevice.hpp
          Feixiao/src/kext/RTW88IEEE80211.cpp
          Feixiao/src/kext/RTW88IEEE80211.hpp
          Feixiao/src/kext/RTW88UserClient.cpp
          Feixiao/src/kext/RTW88UserClient.hpp
          Feixiao/src/compat/rtw88_compat.c
          Feixiao/src/compat/rtw88_compat.h
          rtw88-stable/drivers/net/wireless/realtek/rtw88/main.c
          rtw88-stable/drivers/net/wireless/realtek/rtw88/pci.c
          rtw88-stable/drivers/net/wireless/realtek/rtw88/rx.c
          rtw88-stable/drivers/net/wireless/realtek/rtw88/tx.c
          "

          rm -f /tmp/v855-before.sha256

          for FILE in ${FILES}
          do
            shasum -a 256 "${FILE}" \
              >> /tmp/v855-before.sha256
          done

          echo
          echo "============================================================"
          echo "ORIGINAL DATAPATH HASHES"
          echo "============================================================"

          cat /tmp/v855-before.sha256


      # ================================================================
      # 07 - REJECT V8.6 PANIC MODIFICATIONS
      # ================================================================

      - name: Reject v8.6 panic-producing modifications
        shell: bash
        run: |
          set -eu

          PCI="Feixiao/src/kext/RTW88PCIDevice.cpp"
          MAIN="rtw88-stable/drivers/net/wireless/realtek/rtw88/main.c"

          echo
          echo "============================================================"
          echo "PANIC REGRESSION CHECK"
          echo "============================================================"
          echo

          if grep -q \
            'flushRxQueue' \
            "${PCI}"
          then
            echo "ERROR: v8.6.3 RX batching detected"
            exit 1
          fi

          if grep -A 2 \
            'if (rtw88_disable_watchdog_work)' \
            "${MAIN}" \
            | grep -q \
              'rtw_hci_dynamic_rx_agg(rtwdev, true)'
          then
            echo "ERROR: v8.6.2 forced dynamic RX aggregation detected"
            exit 1
          fi

          echo "RX batching: ABSENT"
          echo "Forced dynamic RX aggregation: ABSENT"


      # ================================================================
      # 08 - VALIDATE STABLE RX DELIVERY
      # ================================================================

      - name: Validate stable RX delivery
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/src/kext/RTW88PCIDevice.cpp"

          grep -q \
            '_iface->inputPacket(m, 0, IONetworkInterface::kInputOptionQueuePacket);' \
            "${FILE}"

          grep -q \
            '_iface->flushInputQueue();' \
            "${FILE}"

          grep -q \
            'mbuf_pkthdr_len' \
            "${FILE}"

          grep -q \
            'mbuf_len' \
            "${FILE}"

          grep -q \
            'dropping bogus mbuf' \
            "${FILE}"

          echo
          echo "Stable RX path: OK"


      # ================================================================
      # 09 - VALIDATE STABLE DMA
      # ================================================================

      - name: Validate stable DMA
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/src/kext/RTW88PCIDevice.cpp"

          grep -q 'compat_dma_map' "${FILE}"
          grep -q 'compat_dma_unmap' "${FILE}"
          grep -q 'compat_dma_sync_cpu' "${FILE}"
          grep -q 'syncBounceForCpu' "${FILE}"

          echo
          echo "Stable DMA path: OK"


      # ================================================================
      # 10 - VALIDATE STABLE TX THRESHOLDS
      # ================================================================

      - name: Validate stable TX backpressure
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/src/kext/RTW88PCIDevice.cpp"

          grep -q \
            'kRTW88TxStallAvail = 96;' \
            "${FILE}"

          grep -q \
            'kRTW88TxResumeAvail = 160;' \
            "${FILE}"

          echo
          echo "TX stall : 96"
          echo "TX resume: 160"


      # ================================================================
      # 11 - VALIDATE SAFE WATCHDOG
      # ================================================================

      - name: Validate watchdog safe mode
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/src/compat/rtw88_compat.c"

          grep -q \
            'bool rtw88_disable_watchdog_work = true;' \
            "${FILE}"

          echo
          echo "RF watchdog safe mode: OK"


      # ================================================================
      # 12 - VALIDATE VHT 80 MHZ
      # ================================================================

      - name: Validate VHT 80 MHz negotiation
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          grep -q '_connChanWidth = 20;' "${FILE}"
          grep -q '_connChanWidth = 40;' "${FILE}"
          grep -q '_connChanWidth = 80;' "${FILE}"

          grep -q \
            'NL80211_CHAN_WIDTH_80' \
            "${FILE}"

          grep -q \
            'WLAN_EID_VHT_OPERATION' \
            "${FILE}"

          grep -q \
            'connected chandef:' \
            "${FILE}"

          echo
          echo "VHT80 negotiation code: OK"


      # ================================================================
      # 13 - VALIDATE STA VHT80
      # ================================================================

      - name: Validate STA VHT80 configuration
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          grep -q \
            'IEEE80211_STA_RX_BW_80' \
            "${FILE}"

          grep -q \
            'vht_cap' \
            "${FILE}"

          grep -q \
            'ht_cap' \
            "${FILE}"

          echo
          echo "STA VHT80 configuration: OK"


      # ================================================================
      # 14 - VALIDATE A-MPDU / BLOCKACK
      # ================================================================

      - name: Validate A-MPDU and BlockAck
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          grep -q 'startTxAggregation' "${FILE}"
          grep -q 'sendAddbaRequest' "${FILE}"
          grep -q 'sendAddbaResponse' "${FILE}"
          grep -q 'handleBackAction' "${FILE}"
          grep -q '_txBaActive' "${FILE}"
          grep -q 'rxReorderInput' "${FILE}"

          echo
          echo "A-MPDU / BlockAck code: OK"


      # ================================================================
      # 15 - VALIDATE RATE ADAPTATION
      # ================================================================

      - name: Validate firmware rate adaptation
        shell: bash
        run: |
          set -eu

          COMPAT="Feixiao/src/compat/rtw88_compat.c"
          MAIN="rtw88-stable/drivers/net/wireless/realtek/rtw88/main.c"

          grep -q \
            'fix_rate = 0xFF' \
            "${COMPAT}"

          grep -q \
            'RA_MASK_VHT_RATES_1SS' \
            "${MAIN}"

          grep -q \
            'RTW_RATEID_ARFR1_AC_1SS' \
            "${MAIN}"

          grep -q \
            'RTW_CHANNEL_WIDTH_80' \
            "${MAIN}"

          echo
          echo "Firmware rate adaptation: OK"


      # ================================================================
      # 16 - ENABLE O2
      # ================================================================

      - name: Enable O2 optimization
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/Makefile"

          if grep -q \
            -- '-O2' \
            "${FILE}"
          then

            echo "O2 already present."

          else

            COUNT="$(
              grep -c \
                '^[[:space:]]*-fno-stack-protector -mkernel \\' \
                "${FILE}" \
                || true
            )"

            if [ "${COUNT}" -ne 1 ]; then
              echo "ERROR: KEXT_FLAGS insertion point not found"
              exit 1
            fi

            sed -i '' \
              's/-fno-stack-protector -mkernel \\/-fno-stack-protector -mkernel -O2 -fno-strict-aliasing \\/' \
              "${FILE}"

          fi

          grep -q \
            -- '-O2' \
            "${FILE}"

          grep -q \
            -- '-fno-strict-aliasing' \
            "${FILE}"

          echo
          echo "Compiler:"
          echo "-O2"
          echo "-fno-strict-aliasing"


      # ================================================================
      # 17 - REJECT AGGRESSIVE COMPILER FLAGS
      # ================================================================

      - name: Reject unsafe compiler flags
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/Makefile"

          if grep -q -- '-O3' "${FILE}"; then
            echo "ERROR: O3 not allowed"
            exit 1
          fi

          if grep -q -- '-Ofast' "${FILE}"; then
            echo "ERROR: Ofast not allowed"
            exit 1
          fi

          if grep -q -- '-ffast-math' "${FILE}"; then
            echo "ERROR: fast-math not allowed"
            exit 1
          fi

          echo "Compiler safety: OK"


      # ================================================================
      # 18 - VERIFY DRIVER DATAPATH UNCHANGED
      # ================================================================

      - name: Verify datapath unchanged
        shell: bash
        run: |
          set -eu

          FILES="
          Feixiao/src/kext/RTW88PCIDevice.cpp
          Feixiao/src/kext/RTW88PCIDevice.hpp
          Feixiao/src/kext/RTW88IEEE80211.cpp
          Feixiao/src/kext/RTW88IEEE80211.hpp
          Feixiao/src/kext/RTW88UserClient.cpp
          Feixiao/src/kext/RTW88UserClient.hpp
          Feixiao/src/compat/rtw88_compat.c
          Feixiao/src/compat/rtw88_compat.h
          rtw88-stable/drivers/net/wireless/realtek/rtw88/main.c
          rtw88-stable/drivers/net/wireless/realtek/rtw88/pci.c
          rtw88-stable/drivers/net/wireless/realtek/rtw88/rx.c
          rtw88-stable/drivers/net/wireless/realtek/rtw88/tx.c
          "

          rm -f /tmp/v855-after.sha256

          for FILE in ${FILES}
          do
            shasum -a 256 "${FILE}" \
              >> /tmp/v855-after.sha256
          done

          if ! cmp \
            -s \
            /tmp/v855-before.sha256 \
            /tmp/v855-after.sha256
          then

            echo
            echo "ERROR:"
            echo "Stable driver source changed."

            echo
            echo "BEFORE:"
            cat /tmp/v855-before.sha256

            echo
            echo "AFTER:"
            cat /tmp/v855-after.sha256

            exit 1
          fi

          echo
          echo "Datapath byte-for-byte unchanged."


      # ================================================================
      # 19 - CREATE RTW88 DIAGNOSTIC SCRIPT
      # ================================================================

      - name: Create rtw88diag diagnostic tool
        shell: bash
        run: |
          set -eu

          mkdir -p diagnostic

          cat > diagnostic/rtw88diag.sh <<'DIAG'
          #!/bin/bash

          set -u

          CTL="${1:-./rtw88ctl}"

          echo
          echo "============================================================"
          echo "RTW88 RTL8821CE PERFORMANCE DIAGNOSTIC"
          echo "============================================================"
          echo

          echo "Date:"
          date

          echo
          echo "macOS:"
          sw_vers

          echo
          echo "Kernel:"
          uname -a

          echo
          echo "------------------------------------------------------------"
          echo "RTW88 STATUS"
          echo "------------------------------------------------------------"

          if [ -x "${CTL}" ]; then
            "${CTL}" status || true
          else
            echo "rtw88ctl not found:"
            echo "${CTL}"
          fi

          echo
          echo "------------------------------------------------------------"
          echo "DEFAULT ROUTE"
          echo "------------------------------------------------------------"

          route -n get default 2>/dev/null || true

          echo
          echo "------------------------------------------------------------"
          echo "RTW88 KEXT"
          echo "------------------------------------------------------------"

          kmutil showloaded 2>/dev/null \
            | grep -i rtw88 \
            || true

          echo
          echo "------------------------------------------------------------"
          echo "CHANNEL WIDTH"
          echo "------------------------------------------------------------"

          log show \
            --last 20m \
            --style compact \
            --predicate \
            'process == "kernel"' \
            2>/dev/null \
            | grep -i \
              'connected chandef' \
            | tail -50 \
            || true

          echo
          echo "------------------------------------------------------------"
          echo "AUTH / ASSOC / WPA2"
          echo "------------------------------------------------------------"

          log show \
            --last 20m \
            --style compact \
            --predicate \
            'process == "kernel"' \
            2>/dev/null \
            | grep -Ei \
              'rtw88.*(auth|assoc|WPA2|EAPOL|connected)' \
            | tail -200 \
            || true

          echo
          echo "------------------------------------------------------------"
          echo "A-MPDU / BLOCKACK / ADDBA"
          echo "------------------------------------------------------------"

          log show \
            --last 20m \
            --style compact \
            --predicate \
            'process == "kernel"' \
            2>/dev/null \
            | grep -Ei \
              'rtw88.*(ADDBA|BlockAck|A-MPDU|AMPDU|aggregation|BA)' \
            | tail -200 \
            || true

          echo
          echo "------------------------------------------------------------"
          echo "PCI / DMA / TX"
          echo "------------------------------------------------------------"

          log show \
            --last 20m \
            --style compact \
            --predicate \
            'process == "kernel"' \
            2>/dev/null \
            | grep -Ei \
              'rtw88.*(pci|dma|timeout|bus timeout|ring|descriptor|ENOSPC|stall|tx)' \
            | tail -300 \
            || true

          echo
          echo "------------------------------------------------------------"
          echo "DEAUTH / DISASSOC"
          echo "------------------------------------------------------------"

          log show \
            --last 20m \
            --style compact \
            --predicate \
            'process == "kernel"' \
            2>/dev/null \
            | grep -Ei \
              'rtw88.*(deauth|disassoc|reason=)' \
            | tail -150 \
            || true

          echo
          echo "------------------------------------------------------------"
          echo "RECENT RTW88 LOG"
          echo "------------------------------------------------------------"

          log show \
            --last 10m \
            --style compact \
            --predicate \
            'process == "kernel"' \
            2>/dev/null \
            | grep -i rtw88 \
            | tail -500 \
            || true

          echo
          echo "============================================================"
          echo "END"
          echo "============================================================"
          DIAG

          chmod +x diagnostic/rtw88diag.sh

          bash -n diagnostic/rtw88diag.sh

          echo "rtw88diag.sh: OK"


      # ================================================================
      # 20 - CREATE AFTER-SPEEDTEST SCRIPT
      # ================================================================

      - name: Create post-speedtest collector
        shell: bash
        run: |
          set -eu

          cat > diagnostic/after-speedtest.sh <<'COLLECT'
          #!/bin/bash

          set -u

          CTL="${1:-./rtw88ctl}"

          OUT="rtw88-speedtest-$(date +%Y%m%d-%H%M%S).txt"

          {
            echo "============================================================"
            echo "RTW88 POST SPEEDTEST"
            echo "============================================================"
            echo

            date
            echo

            if [ -x "${CTL}" ]; then
              "${CTL}" status || true
            fi

            echo
            echo "============================================================"
            echo "CHANNEL WIDTH"
            echo "============================================================"

            log show \
              --last 10m \
              --style compact \
              --predicate \
              'process == "kernel"' \
              2>/dev/null \
              | grep -i \
                'connected chandef' \
              | tail -50 \
              || true

            echo
            echo "============================================================"
            echo "ADDBA / BLOCKACK"
            echo "============================================================"

            log show \
              --last 10m \
              --style compact \
              --predicate \
              'process == "kernel"' \
              2>/dev/null \
              | grep -Ei \
                'rtw88.*(ADDBA|BlockAck|A-MPDU|AMPDU|aggregation|BA)' \
              | tail -200 \
              || true

            echo
            echo "============================================================"
            echo "PCI / DMA / TX"
            echo "============================================================"

            log show \
              --last 10m \
              --style compact \
              --predicate \
              'process == "kernel"' \
              2>/dev/null \
              | grep -Ei \
                'rtw88.*(pci|dma|timeout|ring|descriptor|stall|tx)' \
              | tail -300 \
              || true

            echo
            echo "============================================================"
            echo "COMPLETE RTW88 LOG"
            echo "============================================================"

            log show \
              --last 10m \
              --style compact \
              --predicate \
              'process == "kernel"' \
              2>/dev/null \
              | grep -i rtw88 \
              | tail -700 \
              || true

          } > "${OUT}"

          echo
          echo "Saved:"
          echo "${OUT}"
          COLLECT

          chmod +x diagnostic/after-speedtest.sh

          bash -n diagnostic/after-speedtest.sh

          echo "after-speedtest.sh: OK"


      # ================================================================
      # 21 - DOWNLOAD FIRMWARE
      # ================================================================

      - name: Download Realtek firmware
        shell: bash
        run: |
          set -eu

          cd Feixiao/firmware

          FIRMWARE_FILES="
          rtw8822b_fw.bin
          rtw8822c_fw.bin
          rtw8821c_fw.bin
          rtw8821a_fw.bin
          rtw8812a_fw.bin
          rtw8814a_fw.bin
          "

          for FW in ${FIRMWARE_FILES}
          do

            if [ ! -s "${FW}" ]; then

              echo "Downloading ${FW}"

              curl \
                --location \
                --fail \
                --retry 3 \
                --retry-delay 2 \
                "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtw88/${FW}" \
                --output "${FW}"

            fi

            if [ ! -s "${FW}" ]; then
              echo "ERROR: firmware missing:"
              echo "${FW}"
              exit 1
            fi

            echo "[OK] ${FW}"
            ls -lh "${FW}"

          done


      # ================================================================
      # 22 - VALIDATE RTL8821C FIRMWARE
      # ================================================================

      - name: Validate RTL8821C firmware
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/firmware/rtw8821c_fw.bin"

          if [ ! -s "${FILE}" ]; then
            echo "ERROR: RTL8821C firmware missing"
            exit 1
          fi

          SIZE="$(stat -f "%z" "${FILE}")"

          echo
          echo "RTL8821C firmware size:"
          echo "${SIZE} bytes"

          if [ "${SIZE}" -lt 50000 ]; then
            echo "ERROR: suspicious RTL8821C firmware size"
            exit 1
          fi

          echo
          echo "RTL8821C firmware: OK"


      # ================================================================
      # 23 - SHOW BUILD ENVIRONMENT
      # ================================================================

      - name: Show build environment
        shell: bash
        run: |
          set -eu

          echo
          echo "============================================================"
          echo "MACOS"
          echo "============================================================"
          sw_vers

          echo
          echo "============================================================"
          echo "XCODE"
          echo "============================================================"
          xcodebuild -version

          echo
          echo "============================================================"
          echo "CLANG"
          echo "============================================================"
          clang --version

          echo
          echo "============================================================"
          echo "MACKERNELSDK"
          echo "============================================================"
          git -C Feixiao/MacKernelSDK rev-parse HEAD


      # ================================================================
      # 24 - CLEAN
      # ================================================================

      - name: Clean previous build
        shell: bash
        working-directory: Feixiao
        run: |
          set -eu

          make clean || true
          rm -rf build/out || true

          echo
          echo "Clean: OK"


      # ================================================================
      # 25 - BUILD
      # ================================================================

      - name: Build HP256G8 v8.5.5
        shell: bash
        working-directory: Feixiao
        run: |
          set -eu

          echo
          echo "============================================================"
          echo "HP 256 G8"
          echo "REALTEK RTL8821CE"
          echo "V8.5.5 STABLE PHY/TX DIAGNOSTIC"
          echo "============================================================"
          echo

          echo "RX                   : unchanged"
          echo "TX                   : unchanged"
          echo "DMA                  : unchanged"
          echo "Watchdog             : unchanged"
          echo "WPA2                 : unchanged"
          echo "A-MPDU               : unchanged"
          echo "TX thresholds        : 96 / 160"
          echo "RX batching          : disabled"
          echo "Forced RX aggregation: disabled"
          echo "Compiler             : -O2"
          echo

          make all


      # ================================================================
      # 26 - VALIDATE EMBEDDED FIRMWARE
      # ================================================================

      - name: Validate embedded firmware
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/src/compat/fw_blobs.c"

          if [ ! -s "${FILE}" ]; then
            echo "ERROR: fw_blobs.c missing"
            exit 1
          fi

          SIZE="$(stat -f "%z" "${FILE}")"

          echo
          echo "fw_blobs.c:"
          echo "${SIZE} bytes"

          if [ "${SIZE}" -lt 10000 ]; then
            echo "ERROR: embedded firmware source too small"
            exit 1
          fi


      # ================================================================
      # 27 - VERIFY BUILD OUTPUT
      # ================================================================

      - name: Verify v8.5.5 output
        shell: bash
        run: |
          set -eu

          KEXT="Feixiao/build/out/rtw88.kext"
          CTL="Feixiao/build/out/rtw88ctl"

          test -d "${KEXT}"
          test -f "${KEXT}/Contents/Info.plist"
          test -f "${KEXT}/Contents/MacOS/rtw88"
          test -f "${CTL}"

          echo
          echo "rtw88.kext: OK"
          echo "rtw88ctl : OK"


      # ================================================================
      # 28 - VALIDATE INFO.PLIST
      # ================================================================

      - name: Validate Info.plist
        shell: bash
        run: |
          set -eu

          PLIST="Feixiao/build/out/rtw88.kext/Contents/Info.plist"

          plutil \
            -lint \
            "${PLIST}"

          echo
          echo "Bundle Identifier:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "${PLIST}"


      # ================================================================
      # 29 - VALIDATE MACH-O
      # ================================================================

      - name: Validate Mach-O
        shell: bash
        run: |
          set -eu

          BIN="Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88"
          CTL="Feixiao/build/out/rtw88ctl"

          echo
          echo "Kext:"
          file "${BIN}"

          echo
          echo "UUID:"
          dwarfdump --uuid "${BIN}"

          echo
          echo "rtw88ctl:"
          file "${CTL}"


      # ================================================================
      # 30
      # VALIDATE DIAGNOSTIC MARKERS
      #
      # FIXED VERSION:
      #
      # Do NOT use:
      #
      # strings binary | grep -q
      #
      # because grep -q closes the pipe as soon as it finds the string.
      # Xcode 26 llvm-strings then reports:
      #
      # strings: failed to flush output
      #
      # We first write all strings to a file and search that file.
      # ================================================================

      - name: Validate diagnostic markers in kext
        shell: bash
        run: |
          set -eu

          BIN="Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88"
          STRINGS_FILE="${RUNNER_TEMP}/rtw88-v855-strings.txt"

          echo
          echo "============================================================"
          echo "BINARY DIAGNOSTIC MARKERS"
          echo "============================================================"
          echo

          if [ ! -f "${BIN}" ]; then
            echo "ERROR: rtw88 binary not found"
            exit 1
          fi

          echo "Extracting binary strings..."

          strings \
            "${BIN}" \
            > "${STRINGS_FILE}"

          if [ ! -s "${STRINGS_FILE}" ]; then
            echo "ERROR: strings output is empty"
            exit 1
          fi

          echo
          echo "Extracted string lines:"
          wc -l "${STRINGS_FILE}"

          echo
          echo "------------------------------------------------------------"
          echo "CONNECTED CHANNEL WIDTH"
          echo "------------------------------------------------------------"

          if grep -F \
            'connected chandef' \
            "${STRINGS_FILE}" \
            > /dev/null
          then
            echo "[OK] connected chandef marker"
          else
            echo "ERROR: connected chandef marker missing"
            exit 1
          fi

          echo
          echo "------------------------------------------------------------"
          echo "WPA2"
          echo "------------------------------------------------------------"

          if grep -F \
            'WPA2 connected' \
            "${STRINGS_FILE}" \
            > /dev/null
          then
            echo "[OK] WPA2 connected marker"
          else
            echo "ERROR: WPA2 connected marker missing"
            exit 1
          fi

          echo
          echo "------------------------------------------------------------"
          echo "MBUF SAFETY"
          echo "------------------------------------------------------------"

          if grep -F \
            'dropping bogus mbuf' \
            "${STRINGS_FILE}" \
            > /dev/null
          then
            echo "[OK] bogus mbuf protection marker"
          else
            echo "ERROR: mbuf safety marker missing"
            exit 1
          fi

          echo
          echo "------------------------------------------------------------"
          echo "RTL8821CE"
          echo "------------------------------------------------------------"

          if grep -i \
            'RTL8821CE' \
            "${STRINGS_FILE}" \
            > /dev/null
          then
            echo "[OK] RTL8821CE marker"
          else
            echo "ERROR: RTL8821CE marker missing"
            exit 1
          fi

          echo
          echo "------------------------------------------------------------"
          echo "ADDBA"
          echo "------------------------------------------------------------"

          if grep -i \
            'ADDBA' \
            "${STRINGS_FILE}" \
            > /dev/null
          then
            echo "[OK] ADDBA marker"
          else
            echo "[INFO] ADDBA literal not found."
            echo "This does NOT fail the build."
          fi

          echo
          echo "------------------------------------------------------------"
          echo "PCI BUS TIMEOUT"
          echo "------------------------------------------------------------"

          if grep -i \
            'pci bus timeout' \
            "${STRINGS_FILE}" \
            > /dev/null
          then
            echo "[OK] PCI timeout diagnostic marker"
          else
            echo "[INFO] PCI timeout literal not found."
            echo "This does NOT fail the build."
          fi

          echo
          echo "============================================================"
          echo "V8.5.5 BINARY VALIDATION PASSED"
          echo "============================================================"


      # ================================================================
      # 31 - PREPARE ARTIFACT
      # ================================================================

      - name: Prepare v8.5.5 artifact
        shell: bash
        run: |
          set -eu

          OUT="${RUNNER_TEMP}/${BUILD_NAME}"

          rm -rf "${OUT}"
          mkdir -p "${OUT}"

          cp -R \
            Feixiao/build/out/rtw88.kext \
            "${OUT}/"

          cp \
            Feixiao/build/out/rtw88ctl \
            "${OUT}/"

          chmod +x \
            "${OUT}/rtw88ctl"

          cp \
            diagnostic/rtw88diag.sh \
            "${OUT}/"

          cp \
            diagnostic/after-speedtest.sh \
            "${OUT}/"

          chmod +x \
            "${OUT}/rtw88diag.sh"

          chmod +x \
            "${OUT}/after-speedtest.sh"

          cp \
            Feixiao/Makefile \
            "${OUT}/Makefile.build-used"

          echo
          echo "Artifact prepared."


      # ================================================================
      # 32 - CREATE BUILD INFO
      # ================================================================

      - name: Create v8.5.5 build info
        shell: bash
        run: |
          set -eu

          OUT="${RUNNER_TEMP}/${BUILD_NAME}"

          FEIXIAO_HASH="$(git -C Feixiao rev-parse HEAD)"
          RTW88_HASH="$(git -C rtw88-stable rev-parse HEAD)"
          SDK_HASH="$(git -C Feixiao/MacKernelSDK rev-parse HEAD)"

          KEXT_UUID="$(
            dwarfdump \
              --uuid \
              Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88 \
              | awk '{print $2}' \
              | head -1
          )"

          cat > "${OUT}/BUILD-INFO.txt" <<EOF
          ============================================================
          HP 256 G8
          REALTEK RTL8821CE
          V8.5.5 STABLE PHY/TX DIAGNOSTIC
          ============================================================


          FEIXIAO
          ============================================================

          ${FEIXIAO_HASH}


          RTW88-STABLE
          ============================================================

          ${RTW88_HASH}


          MACKERNELSDK
          ============================================================

          ${SDK_HASH}


          KEXT UUID
          ============================================================

          ${KEXT_UUID}


          PURPOSE
          ============================================================

          Diagnose low RTL8821CE throughput while preserving the
          stable v8.5.3 driver datapath.


          CURRENT OBSERVED PERFORMANCE
          ============================================================

          Download:
          approximately 30 Mbps

          Upload:
          below 1 Mbps

          Target:
          above 100 Mbps where hardware and radio conditions permit.


          STABLE DATAPATH
          ============================================================

          RX:
          unchanged

          RX per-packet flush:
          preserved

          RX batching:
          disabled

          Forced dynamic RX aggregation:
          disabled

          TX:
          unchanged

          TX stall:
          96

          TX resume:
          160

          DMA:
          unchanged

          mbuf safety:
          unchanged

          RF watchdog:
          stable bypass preserved

          WPA2:
          unchanged

          A-MPDU:
          unchanged

          VHT:
          unchanged


          COMPILER
          ============================================================

          -O2

          -fno-strict-aliasing


          DIAGNOSTIC TOOLS
          ============================================================

          rtw88diag.sh

          Collects:

          connected chandef
          authentication
          association
          WPA2
          A-MPDU
          BlockAck
          ADDBA
          PCI errors
          DMA errors
          TX stalls
          bus timeouts
          deauthentication
          recent rtw88 logs


          after-speedtest.sh

          Run immediately after performing Speedtest.


          IMPORTANT
          ============================================================

          v8.6.2 forced dynamic RX aggregation is NOT included.

          v8.6.3 RX batching is NOT included.

          Those experimental paths caused kernel panic on the target
          HP 256 G8 / RTL8821CE configuration.

          Keep the known-working stable build available as fallback.
          EOF


      # ================================================================
      # 33 - TEST INSTRUCTIONS
      # ================================================================

      - name: Create test instructions
        shell: bash
        run: |
          set -eu

          OUT="${RUNNER_TEMP}/${BUILD_NAME}"

          cat > "${OUT}/TESTE.txt" <<'EOF'
          ============================================================
          HP 256 G8
          RTL8821CE
          V8.5.5 TESTE
          ============================================================


          IMPORTANTE
          ============================================================

          Utilize somente o Wi-Fi 5 GHz para o teste.


          1. INSTALAÇÃO
          ============================================================

          Copie:

          rtw88.kext

          para:

          EFI/OC/Kexts


          Não deixe duas cópias da rtw88.kext.


          Utilize também o rtw88ctl presente neste mesmo pacote.


          Reinicie o computador.


          2. SCAN
          ============================================================

          Abra o Terminal.

          Entre na pasta onde estão os arquivos.

          Execute:

          ./rtw88ctl scan


          3. CONEXÃO 5 GHZ
          ============================================================

          Conecte somente na rede 5 GHz:

          ./rtw88ctl connect "NOME_DA_REDE_5G"

          Evite colocar a senha diretamente no histórico do Terminal
          quando houver outra forma de fornecê-la.


          4. STATUS
          ============================================================

          Execute:

          ./rtw88ctl status


          Verifique se:

          State:
          connected

          Channel:
          maior que 14


          Exemplo esperado para 5 GHz:

          Channel: 36


          5. DIAGNÓSTICO
          ============================================================

          Execute:

          sudo ./rtw88diag.sh ./rtw88ctl


          Procure principalmente:

          connected chandef:


          Possibilidades:


          connected chandef: 20 MHz

          Forte indicação de limitação de largura de canal.


          connected chandef: 40 MHz

          Largura intermediária.


          connected chandef: 80 MHz

          Largura correta para VHT80.


          6. SPEEDTEST
          ============================================================

          Faça UM Speedtest completo.


          Anote:

          Download

          Upload

          Ping


          7. LOG DEPOIS DO SPEEDTEST
          ============================================================

          Imediatamente depois execute:

          sudo ./after-speedtest.sh ./rtw88ctl


          Ele criará um arquivo parecido com:

          rtw88-speedtest-20260817-230000.txt


          Envie esse arquivo para análise.


          NÃO UTILIZAR
          ============================================================

          v8.6.2

          v8.6.3


          Esses caminhos apresentaram kernel panic no equipamento alvo.
          EOF


      # ================================================================
      # 34 - SHA256
      # ================================================================

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -eu

          OUT="${RUNNER_TEMP}/${BUILD_NAME}"

          cd "${OUT}"

          shasum \
            -a 256 \
            rtw88ctl \
            rtw88diag.sh \
            after-speedtest.sh \
            > SHA256SUMS.txt

          find \
            rtw88.kext \
            -type f \
            -exec shasum -a 256 {} \; \
            >> SHA256SUMS.txt

          echo
          cat SHA256SUMS.txt


      # ================================================================
      # 35 - PACKAGE ZIP
      # ================================================================

      - name: Package HP256G8 v8.5.5
        shell: bash
        run: |
          set -eu

          cd "${RUNNER_TEMP}"

          ZIP="Feixiao_HP256G8_v8_5_5_PHY_TX_Diagnostic.zip"

          rm -f "${ZIP}"

          zip \
            -r \
            "${ZIP}" \
            "${BUILD_NAME}"

          echo
          echo "============================================================"
          echo "V8.5.5 PACKAGE"
          echo "============================================================"
          echo

          ls -lh "${ZIP}"


      # ================================================================
      # 36 - UPLOAD ARTIFACT
      # ================================================================

      - name: Upload HP256G8 v8.5.5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Feixiao-HP256G8-v8.5.5-PHY-TX-Diagnostic
          path: ${{ runner.temp }}/Feixiao_HP256G8_v8_5_5_PHY_TX_Diagnostic.zip
          if-no-files-found: error
          retention-days: 7
