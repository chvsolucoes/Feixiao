# v1.9.2 CI fix: VHT80 base patch validation now checks its real VHT80-TEST1 markers.
# TEST6 2.4G Stable: forces 2.4 GHz authentication at 20 MHz and adds legacy-20 fallback.
# TEST5 Connect Stable base: automatic auth/assoc recovery and strongest/current BSS selection.
# Keeps TEST4 RX-tag tracing and TEST2 management reliability.
# Connection fixes: strongest/current BSS selection + bounded auth/assoc recovery + app multi-round retry.
# Prior TEST4 RX Tag Trace research basis:
# Linux upstream rtw8821c.c has dedicated BW80 RF18, RX-DFIR and ADCCLK programming.
# Linux rtw_update_channel derives the primary-channel index from primary-vs-center frequency.
# Feixiao constructs hw->conf.chandef itself from cached HT/VHT Operation IEs.
# This test leaves the Linux core path intact and hardens the macOS MLME/chandef layer.

name: Build CHV WiFi DMG Installer v1.9.4 2.4G Stable

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-chv-wifi-dmg-v1.9.4-24g-stable.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build CHV WiFi system controller
    runs-on: macos-26

    env:
      FEIXIAO_REF: e963f43188382eced4ef2fa75d19ce4db2315c68
      RTW88_REF: df655c7be129768b4243381c2a2170ceba45eeb0

    steps:
      - name: Checkout Feixiao stable backend
        uses: actions/checkout@v4
        with:
          repository: thegwchr/Feixiao
          ref: ${{ env.FEIXIAO_REF }}
          path: Feixiao
          fetch-depth: 1
          submodules: recursive

      - name: Checkout rtw88-stable
        uses: actions/checkout@v4
        with:
          repository: thegwchr/rtw88-stable
          ref: ${{ env.RTW88_REF }}
          path: rtw88-stable
          fetch-depth: 1

      - name: Validate RX DMA tag visibility guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C rtw88-stable rev-parse HEAD)" = "$RTW88_REF"
          PCI_C="rtw88-stable/drivers/net/wireless/realtek/rtw88/pci.c"
          grep -n 'for (i = 0; i < 30; i++)' "$PCI_C"
          grep -n 'READ_ONCE(buf_desc->total_pkt_size)' "$PCI_C"
          grep -n 'udelay(1)' "$PCI_C"
          echo "TEST4 base: bounded 30 us RX tag visibility wait is present."

      - name: Instrument RX tag mismatch without changing recovery behavior
        shell: bash
        run: |
          set -euo pipefail
          echo '' | /usr/bin/base64 -D > /tmp/chv_rxtag_trace.py
          python3 /tmp/chv_rxtag_trace.py

          PCI_C="rtw88-stable/drivers/net/wireless/realtek/rtw88/pci.c"
          grep -n 'RXDMA-TAG mismatch' "$PCI_C"
          grep -n 'chv_rx_tag_mismatch_count <= 32' "$PCI_C"
          grep -n 'expected_tag + 1' "$PCI_C"
          if grep -q 'pci bus timeout, check dma status' "$PCI_C"; then
            echo "ERROR: generic RX tag spam still present"
            exit 1
          fi
          echo "TEST4 RX-tag trace installed: behavior unchanged, logging rate-limited."

      - name: Apply RTL8821CE VHT80 base stability patch
        shell: bash
        run: |
          set -euo pipefail
          echo '' | /usr/bin/base64 -D > /tmp/chv_vht80_patch.py
          python3 /tmp/chv_vht80_patch.py
          echo "---- VHT80 base patch markers ----"
          grep -n "VHT80-TEST1" Feixiao/src/kext/RTW88IEEE80211.cpp || true
          grep -n "_force40Fallback" Feixiao/src/kext/RTW88IEEE80211.hpp

      - name: Apply 5 GHz management TX reliability patch
        shell: bash
        run: |
          set -euo pipefail
          echo '' | /usr/bin/base64 -D > /tmp/chv_mgmt5g_patch.py
          python3 /tmp/chv_mgmt5g_patch.py
          grep -n "MGMT5G-TEST2" Feixiao/src/kext/RTW88IEEE80211.cpp


      - name: Apply TEST5 2.4/5 GHz connection stability patch
        shell: bash
        run: |
          set -euo pipefail
          echo '' | /usr/bin/base64 -D > /tmp/chv_connect_stable.py
          python3 /tmp/chv_connect_stable.py
          grep -n "TEST5 connect target BSSID" Feixiao/src/kext/RTW88IEEE80211.cpp
          grep -n "TEST5 assoc timeout retry" Feixiao/src/kext/RTW88IEEE80211.cpp
          grep -n "_assocRetryCount" Feixiao/src/kext/RTW88IEEE80211.hpp


      - name: Apply TEST6 2.4 GHz 20MHz connection fix
        shell: bash
        run: |
          set -euo pipefail
          echo '' | /usr/bin/base64 -D > /tmp/chv_24g_stable.py
          python3 /tmp/chv_24g_stable.py
          grep -n "TEST6 2.4G chandef forced" Feixiao/src/kext/RTW88IEEE80211.cpp
          grep -n "force2GLegacy" Feixiao/src/kext/RTW88IEEE80211.hpp

      - name: Build RTL8821CE rtw88.kext 8.5.9 TEST6 2.4G Stable
        shell: bash
        run: |
          set -euo pipefail

          test "$(git -C Feixiao rev-parse HEAD)" = "$FEIXIAO_REF"
          test "$(git -C rtw88-stable rev-parse HEAD)" = "$RTW88_REF"

          P="Feixiao/rtw88.kext/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 8.5.9" "$P"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 8.5.9" "$P"
          /usr/libexec/PlistBuddy -c "Delete :CHVDriverVariant" "$P" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy -c "Add :CHVDriverVariant string TEST6-24G-STABLE-RXTAG" "$P"

          mkdir -p Feixiao/firmware
          BASE="https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtw88"

          for fw in \
            rtw8822b_fw.bin \
            rtw8822c_fw.bin \
            rtw8821c_fw.bin \
            rtw8821a_fw.bin \
            rtw8812a_fw.bin \
            rtw8814a_fw.bin
          do
            curl -L --fail --retry 3 --retry-delay 2 \
              "${BASE}/${fw}" \
              -o "Feixiao/firmware/${fw}"
            test -s "Feixiao/firmware/${fw}"
          done

          rm -f Feixiao/src/compat/fw_blobs.c

          cd Feixiao
          make clean
          make -j1 all

          test -f build/out/rtw88.kext/Contents/MacOS/rtw88
          strings build/out/rtw88.kext/Contents/MacOS/rtw88 | grep -F "RXDMA-TAG mismatch"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' build/out/rtw88.kext/Contents/Info.plist)" = "8.5.9"
          test "$(/usr/libexec/PlistBuddy -c 'Print :IOKitPersonalities:RTL8821CE:IOPCIMatch' build/out/rtw88.kext/Contents/Info.plist)" = "0xC82110EC"

          echo "rtw88.kext 8.5.9 2.4G Stable ready for bundling."

      - name: Create project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src build "package/CHV WiFi.app/Contents/MacOS" "package/CHV WiFi.app/Contents/Resources"

          cat > src/RTW88Client.h <<'EOF'
          #pragma once
          #import <Foundation/Foundation.h>

          typedef struct {
              uint32_t state;
              uint8_t  bssid[6];
              char     ssid[33];
              int32_t  rssi;
              uint32_t channel;
              uint8_t  mac_addr[6];
              uint16_t fw_version;
              uint8_t  fw_sub_version;
              char     chip_name[32];
              uint32_t rx_byte_count;
              uint32_t tx_byte_count;
              uint8_t  scan_offload_supported;
              uint8_t  powered;
          } RTW88StateResult;

          @interface RTW88Network : NSObject
          @property(nonatomic, copy) NSString *ssid;
          @property(nonatomic, copy) NSString *bssid;
          @property(nonatomic) NSInteger rssi;
          @property(nonatomic) NSInteger channel;
          @property(nonatomic) uint32_t cipher;
          @end

          @interface RTW88Client : NSObject
          @property(nonatomic, readonly) BOOL available;
          - (BOOL)open;
          - (void)close;
          - (BOOL)powerOn;
          - (BOOL)powerOff;
          - (BOOL)disconnect;
          - (BOOL)connectSSID:(NSString *)ssid password:(NSString *)password;
          - (nullable RTW88StateResult *)stateMalloc;
          - (NSArray<RTW88Network *> *)scan;
          - (NSString *)driverLog;
          - (BOOL)setDebugLevel:(uint64_t)level;
          @end
          EOF

          cat > src/RTW88Client.m <<'EOF'
          #import "RTW88Client.h"
          #import <IOKit/IOKitLib.h>

          enum {
              kRTW88Scan        = 0,
              kRTW88Connect     = 1,
              kRTW88Disconnect  = 2,
              kRTW88GetState    = 3,
              kRTW88GetBSSList  = 4,
              kRTW88GetRSSI     = 5,
              kRTW88SetDebug    = 6,
              kRTW88GetLog      = 7,
              kRTW88PowerOn     = 8,
              kRTW88PowerOff    = 9
          };

          typedef struct {
              char ssid[33];
              char password[64];
          } RTW88ConnectArgs;

          @implementation RTW88Network
          @end

          @interface RTW88Client () {
              io_connect_t _conn;
              BOOL _available;
          }
          @end

          @implementation RTW88Client

          - (instancetype)init {
              self = [super init];
              if (self) {
                  _conn = IO_OBJECT_NULL;
                  _available = NO;
              }
              return self;
          }

          - (BOOL)available { return _available; }

          - (BOOL)open {
              if (_conn != IO_OBJECT_NULL) return YES;

              io_service_t svc = IOServiceGetMatchingService(
                  kIOMainPortDefault,
                  IOServiceMatching("RTW88PCIDevice")
              );
              if (!svc) {
                  _available = NO;
                  return NO;
              }

              kern_return_t kr = IOServiceOpen(svc, mach_task_self(), 0, &_conn);
              IOObjectRelease(svc);
              _available = (kr == KERN_SUCCESS && _conn != IO_OBJECT_NULL);
              return _available;
          }

          - (void)close {
              if (_conn != IO_OBJECT_NULL) {
                  IOServiceClose(_conn);
                  _conn = IO_OBJECT_NULL;
              }
              _available = NO;
          }

          - (BOOL)callNoData:(uint32_t)selector {
              if (![self open]) return NO;
              kern_return_t kr = IOConnectCallStructMethod(
                  _conn, selector, NULL, 0, NULL, NULL
              );
              return kr == KERN_SUCCESS;
          }

          - (BOOL)powerOn { return [self callNoData:kRTW88PowerOn]; }
          - (BOOL)powerOff { return [self callNoData:kRTW88PowerOff]; }
          - (BOOL)disconnect { return [self callNoData:kRTW88Disconnect]; }

          - (BOOL)connectSSID:(NSString *)ssid password:(NSString *)password {
              if (![self open]) return NO;

              RTW88ConnectArgs a = {};
              NSData *s = [ssid dataUsingEncoding:NSUTF8StringEncoding];
              NSData *p = [password dataUsingEncoding:NSUTF8StringEncoding];
              NSUInteger sl = MIN((NSUInteger)32, s.length);
              NSUInteger pl = MIN((NSUInteger)63, p.length);
              memcpy(a.ssid, s.bytes, sl);
              memcpy(a.password, p.bytes, pl);

              size_t outSize = 0;
              kern_return_t kr = IOConnectCallStructMethod(
                  _conn, kRTW88Connect, &a, sizeof(a), NULL, &outSize
              );
              return kr == KERN_SUCCESS;
          }

          - (nullable RTW88StateResult *)stateMalloc {
              if (![self open]) return NULL;

              RTW88StateResult *st = calloc(1, sizeof(RTW88StateResult));
              size_t outSize = sizeof(RTW88StateResult);
              kern_return_t kr = IOConnectCallStructMethod(
                  _conn, kRTW88GetState, NULL, 0, st, &outSize
              );
              if (kr != KERN_SUCCESS || outSize < sizeof(RTW88StateResult)) {
                  free(st);
                  return NULL;
              }
              return st;
          }

          - (BOOL)setDebugLevel:(uint64_t)level {
              if (![self open]) return NO;
              uint64_t input = level;
              uint32_t outCount = 0;
              kern_return_t kr = IOConnectCallScalarMethod(
                  _conn, kRTW88SetDebug, &input, 1, NULL, &outCount
              );
              return kr == KERN_SUCCESS;
          }

          - (NSString *)driverLog {
              if (![self open]) return @"";

              /*
               * Keep every IOKit structure output <= 4095 bytes.
               * Feixiao's UserClient consumes args->structureOutput directly;
               * larger replies can switch to the MIG out-of-line path and make
               * structureOutput NULL.  Drain the 8 KiB ring in small chunks.
               */
              NSMutableData *all = [NSMutableData data];
              for (NSUInteger pass = 0; pass < 3; pass++) {
                  uint8_t buf[4095] = {};
                  size_t outSize = sizeof(buf);
                  kern_return_t kr = IOConnectCallStructMethod(
                      _conn, kRTW88GetLog, NULL, 0, buf, &outSize
                  );
                  if (kr != KERN_SUCCESS || outSize == 0) break;
                  [all appendBytes:buf length:outSize];
                  if (outSize < sizeof(buf)) break;
              }

              if (all.length == 0) return @"";
              NSString *str = [[NSString alloc]
                  initWithData:all encoding:NSUTF8StringEncoding];
              return str ?: @"";
          }

          - (NSArray<RTW88Network *> *)scan {
              if (![self open]) return @[];

              size_t noOut = 0;
              kern_return_t kr = IOConnectCallStructMethod(
                  _conn, kRTW88Scan, NULL, 0, NULL, &noOut
              );
              if (kr != KERN_SUCCESS) return @[];

              // Scan is async in Feixiao. Poll state for up to ~4.5 sec.
              for (int i = 0; i < 45; i++) {
                  usleep(100000);
                  RTW88StateResult *st = [self stateMalloc];
                  if (st) {
                      uint32_t state = st->state;
                      free(st);
                      if (state != 1) break; // RTW88_STATE_SCANNING == 1
                  }
              }

              uint8_t buf[4095] = {};
              size_t outSize = sizeof(buf);
              kr = IOConnectCallStructMethod(
                  _conn, kRTW88GetBSSList, NULL, 0, buf, &outSize
              );
              if (kr != KERN_SUCCESS || outSize < 4) return @[];

              uint32_t total = 0;
              memcpy(&total, buf, 4);
              if (total > outSize) total = (uint32_t)outSize;

              NSMutableArray<RTW88Network *> *result = [NSMutableArray array];
              uint32_t pos = 4;

              while (pos < total) {
                  uint8_t ssidLen = buf[pos++];
                  if (ssidLen > 32 || pos + ssidLen + 13 > total) break;

                  NSData *ssidData = [NSData dataWithBytes:&buf[pos] length:ssidLen];
                  NSString *ssid = [[NSString alloc] initWithData:ssidData
                                                         encoding:NSUTF8StringEncoding];
                  pos += ssidLen;

                  uint8_t *b = &buf[pos];
                  NSString *bssid = [NSString stringWithFormat:
                      @"%02x:%02x:%02x:%02x:%02x:%02x",
                      b[0],b[1],b[2],b[3],b[4],b[5]];
                  pos += 6;

                  int16_t rssi = (int16_t)((buf[pos] << 8) | buf[pos+1]);
                  pos += 2;

                  uint8_t channel = buf[pos++];

                  uint32_t cipher = 0;
                  memcpy(&cipher, &buf[pos], 4);
                  pos += 4;

                  if (!ssid || ssid.length == 0) continue;

                  RTW88Network *n = [RTW88Network new];
                  n.ssid = ssid;
                  n.bssid = bssid;
                  n.rssi = rssi;
                  n.channel = channel;
                  n.cipher = cipher;
                  [result addObject:n];
              }

              // Strongest duplicate SSID first.
              [result sortUsingComparator:^NSComparisonResult(RTW88Network *a, RTW88Network *b) {
                  if (a.rssi > b.rssi) return NSOrderedAscending;
                  if (a.rssi < b.rssi) return NSOrderedDescending;
                  return [a.ssid compare:b.ssid];
              }];

              NSMutableArray *dedup = [NSMutableArray array];
              NSMutableSet *seen = [NSMutableSet set];
              for (RTW88Network *n in result) {
                  if (![seen containsObject:n.ssid]) {
                      [seen addObject:n.ssid];
                      [dedup addObject:n];
                  }
              }
              return dedup;
          }

          @end
          EOF

          cat > src/Keychain.h <<'EOF'
          #pragma once
          #import <Foundation/Foundation.h>
          NSString *CHVLoadPassword(NSString *ssid);
          BOOL CHVSavePassword(NSString *ssid, NSString *password);
          BOOL CHVDeletePassword(NSString *ssid);
          EOF

          cat > src/Keychain.m <<'EOF'
          #import "Keychain.h"
          #import <Security/Security.h>

          static NSString * const kService = @"com.chvsolucoes.wifi";

          NSString *CHVLoadPassword(NSString *ssid) {
              NSDictionary *q = @{
                  (__bridge id)kSecClass: (__bridge id)kSecClassGenericPassword,
                  (__bridge id)kSecAttrService: kService,
                  (__bridge id)kSecAttrAccount: ssid,
                  (__bridge id)kSecReturnData: @YES,
                  (__bridge id)kSecMatchLimit: (__bridge id)kSecMatchLimitOne
              };
              CFTypeRef out = NULL;
              OSStatus s = SecItemCopyMatching((__bridge CFDictionaryRef)q, &out);
              if (s != errSecSuccess || !out) return nil;
              NSData *d = CFBridgingRelease(out);
              return [[NSString alloc] initWithData:d encoding:NSUTF8StringEncoding];
          }

          BOOL CHVSavePassword(NSString *ssid, NSString *password) {
              NSData *d = [password dataUsingEncoding:NSUTF8StringEncoding];
              NSDictionary *q = @{
                  (__bridge id)kSecClass: (__bridge id)kSecClassGenericPassword,
                  (__bridge id)kSecAttrService: kService,
                  (__bridge id)kSecAttrAccount: ssid
              };
              SecItemDelete((__bridge CFDictionaryRef)q);
              NSMutableDictionary *add = [q mutableCopy];
              add[(__bridge id)kSecValueData] = d;
              return SecItemAdd((__bridge CFDictionaryRef)add, NULL) == errSecSuccess;
          }

          BOOL CHVDeletePassword(NSString *ssid) {
              if (!ssid.length) return NO;
              NSDictionary *q = @{
                  (__bridge id)kSecClass: (__bridge id)kSecClassGenericPassword,
                  (__bridge id)kSecAttrService: kService,
                  (__bridge id)kSecAttrAccount: ssid
              };
              OSStatus status = SecItemDelete((__bridge CFDictionaryRef)q);
              return status == errSecSuccess || status == errSecItemNotFound;
          }
          EOF

          cat > src/main.m <<'EOF'
          #import <Cocoa/Cocoa.h>
          #import "RTW88Client.h"
          #import "Keychain.h"
          #import <ifaddrs.h>
          #import <net/if.h>
          #import <net/if_dl.h>

          static NSString *CHVInterfaceNameForMAC(const uint8_t mac[6]) {
              struct ifaddrs *ifap = NULL;
              if (getifaddrs(&ifap) != 0 || !ifap) return nil;

              NSString *found = nil;
              for (struct ifaddrs *ifa = ifap; ifa; ifa = ifa->ifa_next) {
                  if (!ifa->ifa_addr || ifa->ifa_addr->sa_family != AF_LINK)
                      continue;

                  struct sockaddr_dl *sdl = (struct sockaddr_dl *)ifa->ifa_addr;
                  if (sdl->sdl_alen != 6) continue;

                  const unsigned char *addr =
                      (const unsigned char *)LLADDR(sdl);

                  if (memcmp(addr, mac, 6) == 0) {
                      found = [NSString stringWithUTF8String:ifa->ifa_name];
                      break;
                  }
              }
              freeifaddrs(ifap);
              return found;
          }

          static NSString *CHVEscapeAppleScriptString(NSString *s) {
              NSString *r = [s stringByReplacingOccurrencesOfString:@"\\"
                                                          withString:@"\\\\"];
              r = [r stringByReplacingOccurrencesOfString:@"\""
                                                withString:@"\\\""];
              return r;
          }

          static void CHVActivateForInput(void) {
              dispatch_async(dispatch_get_main_queue(), ^{
                  [NSApp activateIgnoringOtherApps:YES];
                  [[NSRunningApplication currentApplication]
                      activateWithOptions:(NSApplicationActivateAllWindows |
                                           NSApplicationActivateIgnoringOtherApps)];
              });
              usleep(120000);
          }

          static NSString *CHVRunPrivilegedShellOutput(NSString *command,
                                                           NSString **errorText) {
              CHVActivateForInput();

              NSString *escaped = CHVEscapeAppleScriptString(command);
              NSString *source = [NSString stringWithFormat:
                  @"do shell script \"%@\" with administrator privileges",
                  escaped];

              NSAppleScript *script = [[NSAppleScript alloc] initWithSource:source];
              NSDictionary *errorInfo = nil;
              NSAppleEventDescriptor *result =
                  [script executeAndReturnError:&errorInfo];

              if (!result) {
                  if (errorText) {
                      *errorText = errorInfo[NSAppleScriptErrorMessage]
                          ?: @"Falha na autorização do macOS.";
                  }
                  return nil;
              }

              return result.stringValue ?: @"";
          }

          static BOOL CHVRunPrivilegedShell(NSString *command, NSString **errorText) {
              CHVActivateForInput();

              NSString *escaped = CHVEscapeAppleScriptString(command);
              NSString *source = [NSString stringWithFormat:
                  @"do shell script \"%@\" with administrator privileges",
                  escaped];

              NSAppleScript *script = [[NSAppleScript alloc] initWithSource:source];
              NSDictionary *errorInfo = nil;
              NSAppleEventDescriptor *result =
                  [script executeAndReturnError:&errorInfo];

              if (!result) {
                  if (errorText) {
                      *errorText = errorInfo[NSAppleScriptErrorMessage]
                          ?: @"Falha na autorização do macOS.";
                  }
                  return NO;
              }
              return YES;
          }

          @interface CHVNetworkMenuView : NSView
          @property(nonatomic,strong) NSTextField *label;
          @property(nonatomic,strong) RTW88Network *network;
          @property(nonatomic,weak) id owner;
          @end

          @implementation CHVNetworkMenuView

          - (instancetype)initWithNetwork:(RTW88Network *)network
                                    owner:(id)owner
                                    width:(CGFloat)width {
              self = [super initWithFrame:NSMakeRect(0, 0, width, 28)];
              if (!self) return nil;

              self.network = network;
              self.owner = owner;

              NSString *band = network.channel > 14 ? @"5 GHz" : @"2.4 GHz";
              NSString *lock = network.cipher ? @"  🔒" : @"";
              NSString *title = [NSString stringWithFormat:@"%@   %ld dBm   %@%@",
                                 network.ssid, (long)network.rssi, band, lock];

              self.label = [NSTextField labelWithString:title];
              self.label.frame = NSMakeRect(10, 5, width - 20, 18);
              self.label.lineBreakMode = NSLineBreakByTruncatingTail;
              [self addSubview:self.label];

              NSTrackingArea *tracking = [[NSTrackingArea alloc]
                  initWithRect:self.bounds
                       options:(NSTrackingMouseEnteredAndExited |
                                NSTrackingActiveAlways |
                                NSTrackingInVisibleRect)
                         owner:self
                      userInfo:nil];
              [self addTrackingArea:tracking];
              return self;
          }

          - (void)mouseEntered:(NSEvent *)event {
              self.layer.backgroundColor =
                  [[NSColor selectedContentBackgroundColor] colorWithAlphaComponent:0.22].CGColor;
          }

          - (void)mouseExited:(NSEvent *)event {
              self.layer.backgroundColor = NSColor.clearColor.CGColor;
          }

          - (void)mouseDown:(NSEvent *)event {
              if ([self.owner respondsToSelector:@selector(connectNetworkView:)]) {
                  [self.owner performSelector:@selector(connectNetworkView:) withObject:self];
              }
          }

          - (void)rightMouseDown:(NSEvent *)event {
              NSMenu *context = [NSMenu new];

              NSString *saved = CHVLoadPassword(self.network.ssid);
              BOOL known = saved.length > 0;

              NSMenuItem *forget = [[NSMenuItem alloc]
                  initWithTitle:@"Esquecer rede"
                         action:@selector(forgetNetworkFromContext:)
                  keyEquivalent:@""];
              forget.target = self.owner;
              forget.representedObject = self.network;
              forget.enabled = known;
              [context addItem:forget];

              if (!known) {
                  NSMenuItem *info = [[NSMenuItem alloc]
                      initWithTitle:@"Nenhuma senha salva"
                             action:nil
                      keyEquivalent:@""];
                  info.enabled = NO;
                  [context addItem:info];
              }

              [NSMenu popUpContextMenu:context withEvent:event forView:self];
          }

          @end

          @interface CHVConnectedMenuView : NSView
          @property(nonatomic,strong) NSTextField *label;
          @property(nonatomic,copy) NSString *ssid;
          @property(nonatomic,weak) id owner;
          @end

          @implementation CHVConnectedMenuView

          - (instancetype)initWithSSID:(NSString *)ssid
                                  rssi:(NSInteger)rssi
                                 owner:(id)owner
                                 width:(CGFloat)width {
              self = [super initWithFrame:NSMakeRect(0, 0, width, 30)];
              if (!self) return nil;

              self.ssid = ssid ?: @"";
              self.owner = owner;

              NSString *title = self.ssid.length
                  ? [NSString stringWithFormat:@"Conectado — %@ (%ld dBm)",
                     self.ssid, (long)rssi]
                  : @"Desconectado";

              self.label = [NSTextField labelWithString:title];
              self.label.frame = NSMakeRect(10, 6, width - 20, 18);
              self.label.font = [NSFont systemFontOfSize:13 weight:NSFontWeightSemibold];
              self.label.lineBreakMode = NSLineBreakByTruncatingTail;
              [self addSubview:self.label];

              return self;
          }

          - (void)rightMouseDown:(NSEvent *)event {
              if (!self.ssid.length) return;

              NSMenu *context = [NSMenu new];
              NSMenuItem *forget = [[NSMenuItem alloc]
                  initWithTitle:@"Esquecer rede"
                         action:@selector(forgetConnectedNetworkFromContext:)
                  keyEquivalent:@""];
              forget.target = self.owner;
              forget.representedObject = self.ssid;
              [context addItem:forget];

              [NSMenu popUpContextMenu:context withEvent:event forView:self];
          }

          @end

          @interface AppDelegate : NSObject <NSApplicationDelegate, NSMenuDelegate, NSWindowDelegate>
          @property(nonatomic,strong) NSStatusItem *status;
          @property(nonatomic,strong) NSMenu *menu;
          @property(nonatomic,strong) RTW88Client *client;
          @property(nonatomic,strong) NSTimer *timer;
          @property(nonatomic,strong) NSArray<RTW88Network *> *networks;
          @property(nonatomic) BOOL firstRunIntegrationChecked;
          @property(nonatomic) BOOL autoConnectAttempted;
          @property(nonatomic) NSInteger autoConnectRetryCount;
          @property(nonatomic) BOOL realtekServiceMissingAlertShown;
          @property(nonatomic) BOOL efiDriverPromptShown;
          @property(nonatomic,strong) NSWindow *diagnosticWindow;
          @property(nonatomic,strong) NSTextView *diagnosticTextView;
          @property(nonatomic,strong) NSTimer *diagnosticTimer;
          @property(nonatomic,strong) NSButton *diagnosticToggleButton;
          @property(nonatomic,strong) NSTask *diagnosticLogTask;
          @property(nonatomic) BOOL diagnosticAutoRefreshRunning;
          @property(nonatomic) BOOL diagnosticRefreshInFlight;
          @property(nonatomic) NSUInteger diagnosticGeneration;
          @end

          @implementation AppDelegate

          - (void)applicationDidFinishLaunching:(NSNotification *)notification {
              self.client = [RTW88Client new];
              [self.client open];

              self.status = [[NSStatusBar systemStatusBar]
                  statusItemWithLength:NSSquareStatusItemLength];

              /*
               * Menu bar must look native: use Apple's Wi-Fi SF Symbol.
               * The CHV logo remains only as the application/DMG icon.
               */
              if (@available(macOS 11.0, *)) {
                  NSImage *wifiIcon =
                      [NSImage imageWithSystemSymbolName:@"wifi"
                               accessibilityDescription:@"Wi-Fi"];
                  wifiIcon.template = YES;
                  self.status.button.image = wifiIcon;
                  self.status.button.imageScaling = NSImageScaleProportionallyDown;
                  self.status.button.toolTip = @"CHV WiFi";
              } else {
                  self.status.button.title = @"WiFi";
              }

              self.menu = [NSMenu new];
              self.menu.delegate = self;
              self.status.menu = self.menu;
              [self rebuildMenu];

              self.timer = [NSTimer scheduledTimerWithTimeInterval:5.0
                                                            target:self
                                                          selector:@selector(maintenanceHeartbeat)
                                                          userInfo:nil
                                                           repeats:YES];

              /*
               * First-run system integration:
               * create a macOS Network service named "Realtek Wi-Fi" for the
               * BSD interface exported by the working RTW88 backend.
               */
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 800 * NSEC_PER_MSEC),
                             dispatch_get_main_queue(), ^{
                  [self ensureRealtekNetworkService];
                  [self ensureLaunchAgent];
              });

              /*
               * At login, prioritize silent reconnection. The RTW88 driver and
               * network stack may take a few seconds to become ready.
               */
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 3000 * NSEC_PER_MSEC),
                             dispatch_get_main_queue(), ^{
                  [self attemptAutomaticConnection];
              });

              /*
               * Only offer EFI driver installation later if the backend is
               * still unavailable. This avoids a modal dialog racing the
               * automatic connection during boot.
               */
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 12000 * NSEC_PER_MSEC),
                             dispatch_get_main_queue(), ^{
                  if (![self.client open])
                      [self ensureRTW88DriverAvailable];
              });
          }

          - (void)ensureLaunchAgent {
              NSString *home = NSHomeDirectory();
              NSString *agents = [home stringByAppendingPathComponent:@"Library/LaunchAgents"];
              NSString *plist = [agents stringByAppendingPathComponent:
                                  @"com.chvsolucoes.wifi.plist"];

              NSString *bundlePath = [[NSBundle mainBundle] bundlePath];
              NSString *exePath = [[NSBundle mainBundle] executablePath];

              /*
               * Only install persistent auto-start when the app is running
               * from /Applications.  This avoids creating a login item that
               * points into a mounted DMG.
               */
              if (![bundlePath hasPrefix:@"/Applications/"]) {
                  return;
              }

              [[NSFileManager defaultManager] createDirectoryAtPath:agents
                                        withIntermediateDirectories:YES
                                                         attributes:nil
                                                              error:nil];

              NSDictionary *job = @{
                  @"Label": @"com.chvsolucoes.wifi",
                  @"ProgramArguments": @[exePath],
                  @"RunAtLoad": @YES,
                  @"KeepAlive": @NO,
                  @"ProcessType": @"Interactive",
                  @"LimitLoadToSessionType": @"Aqua"
              };

              [job writeToFile:plist atomically:YES];

              /*
               * IMPORTANT:
               * Do NOT bootout/bootstrap our own LaunchAgent from inside the
               * running application. If this process was started by launchd,
               * bootout terminates this very process and bootstrap immediately
               * starts it again, creating an endless relaunch/flicker loop.
               *
               * Writing the plist is enough for the next macOS login. If an
               * older job is already loaded, it keeps running until logout/
               * restart and then the new plist is used.
               */
              uid_t uid = getuid();
              NSString *cmd = [NSString stringWithFormat:
                  @"/bin/launchctl enable gui/%u/com.chvsolucoes.wifi >/dev/null 2>&1 || true",
                  uid];

              NSTask *task = [NSTask new];
              task.launchPath = @"/bin/sh";
              task.arguments = @[@"-c", cmd];
              @try {
                  [task launch];
                  [task waitUntilExit];
              } @catch (__unused NSException *e) {
              }
          }

          - (void)scheduleAutomaticConnectionRetry {
              if (self.autoConnectRetryCount >= 24) {
                  self.status.button.toolTip =
                      @"CHV WiFi — não foi possível reconectar automaticamente";
                  return;
              }

              self.autoConnectRetryCount += 1;
              self.autoConnectAttempted = NO;

              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 4 * NSEC_PER_SEC),
                             dispatch_get_main_queue(), ^{
                  [self attemptAutomaticConnection];
              });
          }

          - (void)attemptAutomaticConnection {
              if (self.autoConnectAttempted) return;
              self.autoConnectAttempted = YES;

              NSUserDefaults *defaults = [NSUserDefaults standardUserDefaults];
              NSString *lastSSID = [defaults stringForKey:@"CHVLastConnectedSSID"];
              if (!lastSSID.length) {
                  self.autoConnectAttempted = NO;
                  return;
              }

              if (![self.client open]) {
                  [self scheduleAutomaticConnectionRetry];
                  return;
              }

              RTW88StateResult *st = [self.client stateMalloc];
              if (!st) {
                  [self scheduleAutomaticConnectionRetry];
                  return;
              }

              BOOL powered = st->powered != 0;
              uint32_t state = st->state;
              NSString *currentSSID =
                  [NSString stringWithUTF8String:st->ssid] ?: @"";
              free(st);

              // Already connected to the desired network.
              if (state == 5 && [currentSSID isEqualToString:lastSSID]) {
                  self.autoConnectRetryCount = 0;
                  [self refreshStatusOnly];
                  return;
              }

              // If another connection is in progress, give it time first.
              if (state == 2 || state == 3 || state == 4) {
                  [self scheduleAutomaticConnectionRetry];
                  return;
              }

              if (!powered) {
                  [self.client powerOn];
                  usleep(400000);
              }

              NSString *password = CHVLoadPassword(lastSSID);
              if (!password) password = @"";

              self.status.button.toolTip =
                  [NSString stringWithFormat:@"CHV WiFi — reconectando a %@…", lastSSID];

              dispatch_async(dispatch_get_global_queue(QOS_CLASS_USER_INITIATED, 0), ^{
                  NSArray<RTW88Network *> *nets = [self.client scan];

                  BOOL found = NO;
                  for (RTW88Network *n in nets) {
                      if ([n.ssid isEqualToString:lastSSID]) {
                          found = YES;
                          break;
                      }
                  }

                  if (!found) {
                      dispatch_async(dispatch_get_main_queue(), ^{
                          [self scheduleAutomaticConnectionRetry];
                      });
                      return;
                  }

                  [self.client disconnect];
                  usleep(250000);

                  BOOL started =
                      [self.client connectSSID:lastSSID password:password];

                  if (!started) {
                      dispatch_async(dispatch_get_main_queue(), ^{
                          [self scheduleAutomaticConnectionRetry];
                      });
                      return;
                  }

                  // Confirm real connection; do not assume selector success means Wi-Fi connected.
                  BOOL connected = NO;
                  for (int i = 0; i < 60; i++) {
                      usleep(250000);
                      RTW88StateResult *now = [self.client stateMalloc];
                      if (!now) continue;

                      NSString *ssidNow =
                          [NSString stringWithUTF8String:now->ssid] ?: @"";
                      uint32_t s = now->state;
                      free(now);

                      if (s == 5 && [ssidNow isEqualToString:lastSSID]) {
                          connected = YES;
                          break;
                      }

                      if (s == 0 && i > 12) {
                          break;
                      }
                  }

                  dispatch_async(dispatch_get_main_queue(), ^{
                      if (connected) {
                          self.autoConnectRetryCount = 0;
                          self.networks = nets;
                          [self refreshStatusOnly];
                      } else {
                          [self scheduleAutomaticConnectionRetry];
                      }
                  });
              });
          }

          - (void)ensureRealtekNetworkService {
              if (self.firstRunIntegrationChecked) return;
              self.firstRunIntegrationChecked = YES;

              NSUserDefaults *defaults = [NSUserDefaults standardUserDefaults];
              if ([defaults boolForKey:@"CHVRealtekNetworkServiceInstalled"]) {
                  return;
              }

              RTW88StateResult *st = [self.client stateMalloc];
              if (!st) {
                  self.firstRunIntegrationChecked = NO;
                  return;
              }

              NSString *ifname = CHVInterfaceNameForMAC(st->mac_addr);
              free(st);

              if (!ifname.length) {
                  self.firstRunIntegrationChecked = NO;
                  return;
              }

              /*
               * We intentionally use Apple's networksetup utility because it
               * writes the same SystemConfiguration preferences used by
               * System Settings > Network.  This is a one-time setup.
               */
              NSString *cmd = [NSString stringWithFormat:
                  @"/bin/sh -c '"
                   "SERVICE=\"Realtek Wi-Fi\"; "
                   "DEV=\"%@\"; "
                   "if ! /usr/sbin/networksetup -listallnetworkservices 2>/dev/null "
                   "| /usr/bin/tail -n +2 | /usr/bin/grep -Fxq \"$SERVICE\"; then "
                     "/usr/sbin/networksetup -createnetworkservice \"$SERVICE\" \"$DEV\"; "
                   "fi; "
                   "/usr/sbin/networksetup -setdhcp \"$SERVICE\"; "
                   "/usr/sbin/networksetup -setv6automatic \"$SERVICE\" >/dev/null 2>&1 || true; "
                   "exit 0"
                  "'", ifname];

              NSAlert *intro = [NSAlert new];
              intro.messageText = @"Instalar Realtek Wi-Fi em Rede";
              intro.informativeText =
                  [NSString stringWithFormat:
                   @"O CHV WiFi detectou a interface %@. "
                    "Na primeira execução ele pode criar o serviço “Realtek Wi-Fi” "
                    "em Ajustes do Sistema > Rede e configurar DHCP automaticamente. "
                    "O macOS solicitará a senha de administrador.", ifname];
              [intro addButtonWithTitle:@"Instalar"];
              [intro addButtonWithTitle:@"Agora não"];

              CHVActivateForInput();
              [intro.window makeKeyAndOrderFront:nil];

              if ([intro runModal] != NSAlertFirstButtonReturn) {
                  self.firstRunIntegrationChecked = NO;
                  return;
              }

              NSString *err = nil;
              BOOL ok = CHVRunPrivilegedShell(cmd, &err);

              if (ok) {
                  [defaults setBool:YES forKey:@"CHVRealtekNetworkServiceInstalled"];
                  [defaults synchronize];
                  self.realtekServiceMissingAlertShown = NO;

                  NSAlert *done = [NSAlert new];
                  done.messageText = @"Realtek Wi-Fi instalado";
                  done.informativeText =
                      @"O serviço “Realtek Wi-Fi” foi adicionado em "
                       "Ajustes do Sistema > Rede e configurado para DHCP.";
                  [done addButtonWithTitle:@"OK"];
                  [done runModal];
              } else {
                  self.firstRunIntegrationChecked = NO;
                  NSAlert *fail = [NSAlert new];
                  fail.messageText = @"Não foi possível criar o serviço de rede";
                  fail.informativeText = err ?: @"A operação foi cancelada.";
                  [fail addButtonWithTitle:@"OK"];
                  [fail runModal];
              }
          }

          - (void)removeRealtekNetworkService:(id)sender {
              if (![self realtekNetworkServiceExists]) {
                  NSAlert *info = [NSAlert new];
                  info.messageText = @"Realtek Wi-Fi não está instalado";
                  info.informativeText =
                      @"O serviço “Realtek Wi-Fi” já não existe em Ajustes do Sistema > Rede.";
                  [info addButtonWithTitle:@"OK"];
                  CHVActivateForInput();
                  [info runModal];
                  return;
              }

              NSAlert *confirm = [NSAlert new];
              confirm.messageText = @"Remover Realtek Wi-Fi de Rede?";
              confirm.informativeText =
                  @"Isso remove apenas o serviço “Realtek Wi-Fi” de "
                   "Ajustes do Sistema > Rede. A rtw88.kext e o CHV WiFi "
                   "continuam instalados.";
              [confirm addButtonWithTitle:@"Remover"];
              [confirm addButtonWithTitle:@"Cancelar"];

              CHVActivateForInput();
              [confirm.window makeKeyAndOrderFront:nil];

              if ([confirm runModal] != NSAlertFirstButtonReturn)
                  return;

              NSString *cmd =
                  @"/usr/sbin/networksetup -removenetworkservice 'Realtek Wi-Fi'";

              NSString *err = nil;
              BOOL ok = CHVRunPrivilegedShell(cmd, &err);

              if (ok) {
                  NSUserDefaults *defaults = [NSUserDefaults standardUserDefaults];
                  [defaults removeObjectForKey:@"CHVRealtekNetworkServiceInstalled"];
                  [defaults synchronize];

                  self.firstRunIntegrationChecked = NO;
                  self.realtekServiceMissingAlertShown = YES;

                  NSAlert *done = [NSAlert new];
                  done.messageText = @"Realtek Wi-Fi removido";
                  done.informativeText =
                      @"O serviço foi removido de Ajustes do Sistema > Rede. "
                       "Você pode recriá-lo a qualquer momento pelo menu do CHV WiFi.";
                  [done addButtonWithTitle:@"OK"];
                  CHVActivateForInput();
                  [done runModal];
              } else {
                  NSAlert *fail = [NSAlert new];
                  fail.messageText = @"Não foi possível remover o serviço";
                  fail.informativeText = err ?: @"A operação foi cancelada.";
                  [fail addButtonWithTitle:@"OK"];
                  CHVActivateForInput();
                  [fail runModal];
              }

              [self rebuildMenu];
          }

          - (void)reinstallRealtekNetworkService:(id)sender {
              [[NSUserDefaults standardUserDefaults]
                  removeObjectForKey:@"CHVRealtekNetworkServiceInstalled"];
              self.firstRunIntegrationChecked = NO;
              [self ensureRealtekNetworkService];
          }

          - (NSArray<NSDictionary *> *)discoverOpenCoreEFIs {
              NSString *script =
                  @"/bin/sh -c '"
                   "set -e; "
                   "for D in $(/usr/sbin/diskutil list | /usr/bin/awk "
                     "\"/EFI/ {print \\$NF}\" | /usr/bin/grep \"^disk\"); do "
                     "/usr/sbin/diskutil mount \"$D\" >/dev/null 2>&1 || true; "
                     "MP=$(/usr/sbin/diskutil info \"$D\" | "
                       "/usr/bin/awk -F\": *\" \"/Mount Point/ {print \\$2}\"); "
                     "[ -n \"$MP\" ] || continue; "
                     "if [ -f \"$MP/EFI/OC/config.plist\" ] && "
                        "[ -d \"$MP/EFI/OC/Kexts\" ]; then "
                       "NAME=$(/usr/sbin/diskutil info \"$D\" | "
                         "/usr/bin/awk -F\": *\" \"/Volume Name/ {print \\$2}\"); "
                       "[ -n \"$NAME\" ] || NAME=\"EFI\"; "
                       "/usr/bin/printf \"%s\\t%s\\t%s\\n\" \"$D\" \"$MP\" \"$NAME\"; "
                     "fi; "
                   "done'";

              NSString *err = nil;
              NSString *out = CHVRunPrivilegedShellOutput(script, &err);
              if (!out.length) return @[];

              NSMutableArray<NSDictionary *> *items = [NSMutableArray array];
              for (NSString *line in [out componentsSeparatedByCharactersInSet:
                                       [NSCharacterSet newlineCharacterSet]]) {
                  if (!line.length) continue;
                  NSArray<NSString *> *parts = [line componentsSeparatedByString:@"\t"];
                  if (parts.count < 3) continue;

                  [items addObject:@{
                      @"disk": parts[0],
                      @"mount": parts[1],
                      @"name": parts[2]
                  }];
              }
              return items;
          }

          - (NSDictionary *)chooseOpenCoreEFI:(NSArray<NSDictionary *> *)items {
              if (items.count == 0) return nil;
              if (items.count == 1) return items.firstObject;

              CHVActivateForInput();

              NSAlert *alert = [NSAlert new];
              alert.messageText = @"Mais de uma EFI OpenCore foi encontrada";
              alert.informativeText =
                  @"Escolha a EFI usada para iniciar este Hackintosh. "
                   "O CHV WiFi fará backup do config.plist antes de qualquer alteração.";
              [alert addButtonWithTitle:@"Usar esta EFI"];
              [alert addButtonWithTitle:@"Cancelar"];

              NSPopUpButton *popup =
                  [[NSPopUpButton alloc] initWithFrame:NSMakeRect(0, 0, 420, 28)];

              for (NSDictionary *item in items) {
                  NSString *title = [NSString stringWithFormat:@"%@ — %@ — %@",
                                     item[@"disk"], item[@"name"], item[@"mount"]];
                  [popup addItemWithTitle:title];
              }

              alert.accessoryView = popup;
              alert.window.initialFirstResponder = popup;
              [alert.window makeKeyAndOrderFront:nil];

              if ([alert runModal] != NSAlertFirstButtonReturn)
                  return nil;

              NSInteger idx = popup.indexOfSelectedItem;
              if (idx < 0 || idx >= (NSInteger)items.count)
                  return nil;

              return items[(NSUInteger)idx];
          }

          - (BOOL)installRTW88KextIntoEFI:(NSDictionary *)efi
                                    error:(NSString **)errorText {
              NSString *kext =
                  [[NSBundle mainBundle] pathForResource:@"rtw88" ofType:@"kext"];
              if (!kext.length) {
                  if (errorText) *errorText = @"rtw88.kext não foi encontrada dentro do aplicativo.";
                  return NO;
              }

              NSString *mount = efi[@"mount"];
              if (!mount.length) {
                  if (errorText) *errorText = @"Ponto de montagem da EFI inválido.";
                  return NO;
              }

              NSString *config =
                  [mount stringByAppendingPathComponent:@"EFI/OC/config.plist"];
              NSString *kexts =
                  [mount stringByAppendingPathComponent:@"EFI/OC/Kexts"];
              NSString *dest =
                  [kexts stringByAppendingPathComponent:@"rtw88.kext"];

              NSString *qConfig = [config stringByReplacingOccurrencesOfString:@"'"
                                                                     withString:@"'\\''"];
              NSString *qKexts = [kexts stringByReplacingOccurrencesOfString:@"'"
                                                                   withString:@"'\\''"];
              NSString *qDest = [dest stringByReplacingOccurrencesOfString:@"'"
                                                                 withString:@"'\\''"];
              NSString *qSrc = [kext stringByReplacingOccurrencesOfString:@"'"
                                                                 withString:@"'\\''"];

              /*
               * Install kext + make an automatic backup + ensure exactly one
               * enabled Kernel/Add entry for rtw88.kext.
               */
              NSString *cmd = [NSString stringWithFormat:
                  @"/bin/sh -c '"
                   "set -e; "
                   "CFG='\\''%@'\\''; "
                   "KEXTS='\\''%@'\\''; "
                   "DST='\\''%@'\\''; "
                   "SRC='\\''%@'\\''; "
                   "STAMP=$(/bin/date +%%Y%%m%%d-%%H%%M%%S); "
                   "/bin/cp \"$CFG\" \"$CFG.chv-backup-$STAMP\"; "
                   "/bin/rm -rf \"$DST\"; "
                   "/bin/cp -R \"$SRC\" \"$DST\"; "
                   "/usr/sbin/chown -R 0:0 \"$DST\" 2>/dev/null || true; "
                   "/bin/chmod -R go-w \"$DST\" 2>/dev/null || true; "

                   "PB=/usr/libexec/PlistBuddy; "
                   "IDX=0; FOUND=-1; "
                   "while $PB -c \"Print :Kernel:Add:$IDX\" \"$CFG\" >/dev/null 2>&1; do "
                     "BP=$($PB -c \"Print :Kernel:Add:$IDX:BundlePath\" \"$CFG\" 2>/dev/null || true); "
                     "if [ \"$BP\" = \"rtw88.kext\" ]; then FOUND=$IDX; break; fi; "
                     "IDX=$((IDX+1)); "
                   "done; "

                   "if [ \"$FOUND\" -lt 0 ]; then "
                     "FOUND=$IDX; "
                     "$PB -c \"Add :Kernel:Add:$FOUND dict\" \"$CFG\"; "
                     "$PB -c \"Add :Kernel:Add:$FOUND:Arch string Any\" \"$CFG\"; "
                     "$PB -c \"Add :Kernel:Add:$FOUND:BundlePath string rtw88.kext\" \"$CFG\"; "
                     "$PB -c \"Add :Kernel:Add:$FOUND:Comment string CHV WiFi RTL8821CE\" \"$CFG\"; "
                     "$PB -c \"Add :Kernel:Add:$FOUND:Enabled bool true\" \"$CFG\"; "
                     "$PB -c \"Add :Kernel:Add:$FOUND:ExecutablePath string Contents/MacOS/rtw88\" \"$CFG\"; "
                     "$PB -c \"Add :Kernel:Add:$FOUND:MaxKernel string\" \"$CFG\"; "
                     "$PB -c \"Add :Kernel:Add:$FOUND:MinKernel string\" \"$CFG\"; "
                     "$PB -c \"Add :Kernel:Add:$FOUND:PlistPath string Contents/Info.plist\" \"$CFG\"; "
                   "else "
                     "$PB -c \"Set :Kernel:Add:$FOUND:Enabled true\" \"$CFG\"; "
                     "$PB -c \"Set :Kernel:Add:$FOUND:Arch Any\" \"$CFG\" 2>/dev/null || true; "
                     "$PB -c \"Set :Kernel:Add:$FOUND:ExecutablePath Contents/MacOS/rtw88\" \"$CFG\" 2>/dev/null || true; "
                     "$PB -c \"Set :Kernel:Add:$FOUND:PlistPath Contents/Info.plist\" \"$CFG\" 2>/dev/null || true; "
                   "fi; "

                   "/usr/bin/plutil -lint \"$CFG\" >/dev/null; "
                   "test -f \"$DST/Contents/MacOS/rtw88\"; "
                   "/usr/bin/printf \"OK\\n\""
                  "'",
                  qConfig, qKexts, qDest, qSrc];

              NSString *out = CHVRunPrivilegedShellOutput(cmd, errorText);
              return [out containsString:@"OK"];
          }

          - (void)promptForRestartAfterDriverInstall {
              CHVActivateForInput();

              NSAlert *alert = [NSAlert new];
              alert.messageText = @"Driver RTW88 instalado no OpenCore";
              alert.informativeText =
                  @"A rtw88.kext foi copiada para a EFI e adicionada ao config.plist. "
                   "É necessário reiniciar o computador para o OpenCore carregar o driver.";
              [alert addButtonWithTitle:@"Reiniciar agora"];
              [alert addButtonWithTitle:@"Mais tarde"];

              if ([alert runModal] == NSAlertFirstButtonReturn) {
                  NSString *err = nil;
                  CHVRunPrivilegedShell(@"/sbin/shutdown -r now", &err);
              }
          }

          - (void)installDriverIntoOpenCore:(id)sender {
              CHVActivateForInput();

              NSAlert *intro = [NSAlert new];
              intro.messageText = @"Instalar driver RTL8821CE no OpenCore";
              intro.informativeText =
                  @"O CHV WiFi vai localizar partições EFI que contenham OpenCore, "
                   "fazer backup do config.plist, copiar rtw88.kext para EFI/OC/Kexts "
                   "e habilitar a entrada em Kernel > Add.";
              [intro addButtonWithTitle:@"Procurar EFI e instalar"];
              [intro addButtonWithTitle:@"Cancelar"];

              if ([intro runModal] != NSAlertFirstButtonReturn)
                  return;

              NSArray<NSDictionary *> *efis = [self discoverOpenCoreEFIs];
              if (efis.count == 0) {
                  NSAlert *fail = [NSAlert new];
                  fail.messageText = @"EFI OpenCore não encontrada";
                  fail.informativeText =
                      @"Nenhuma partição EFI com EFI/OC/config.plist foi encontrada. "
                       "Conecte o disco/pendrive usado para iniciar o Hackintosh e tente novamente.";
                  [fail addButtonWithTitle:@"OK"];
                  [fail runModal];
                  return;
              }

              NSDictionary *chosen = [self chooseOpenCoreEFI:efis];
              if (!chosen) return;

              NSString *err = nil;
              if (![self installRTW88KextIntoEFI:chosen error:&err]) {
                  NSAlert *fail = [NSAlert new];
                  fail.messageText = @"Não foi possível instalar rtw88.kext";
                  fail.informativeText = err ?: @"Falha ao alterar a EFI.";
                  [fail addButtonWithTitle:@"OK"];
                  [fail runModal];
                  return;
              }

              [[NSUserDefaults standardUserDefaults]
                  setBool:YES forKey:@"CHVRTW88EFIInstalled"];
              [[NSUserDefaults standardUserDefaults] synchronize];

              [self promptForRestartAfterDriverInstall];
          }

          - (void)ensureRTW88DriverAvailable {
              if ([self.client open]) return;
              if (self.efiDriverPromptShown) return;

              self.efiDriverPromptShown = YES;

              NSAlert *alert = [NSAlert new];
              alert.messageText = @"Driver Realtek RTL8821CE não está carregado";
              alert.informativeText =
                  @"O CHV WiFi pode localizar automaticamente a EFI do OpenCore "
                   "e instalar a rtw88.kext necessária.";
              [alert addButtonWithTitle:@"Instalar driver"];
              [alert addButtonWithTitle:@"Agora não"];

              CHVActivateForInput();
              if ([alert runModal] == NSAlertFirstButtonReturn) {
                  [self installDriverIntoOpenCore:nil];
              }
          }

          - (BOOL)realtekNetworkServiceExists {
              NSTask *task = [NSTask new];
              task.launchPath = @"/usr/sbin/networksetup";
              task.arguments = @[@"-listallnetworkservices"];

              NSPipe *pipe = [NSPipe pipe];
              task.standardOutput = pipe;
              task.standardError = [NSPipe pipe];

              @try {
                  [task launch];
                  [task waitUntilExit];
              } @catch (__unused NSException *e) {
                  return NO;
              }

              NSData *data = [pipe.fileHandleForReading readDataToEndOfFile];
              NSString *out = [[NSString alloc] initWithData:data
                                                   encoding:NSUTF8StringEncoding] ?: @"";

              for (NSString *line in [out componentsSeparatedByCharactersInSet:
                                      [NSCharacterSet newlineCharacterSet]]) {
                  NSString *clean = [line stringByTrimmingCharactersInSet:
                                     [NSCharacterSet whitespaceAndNewlineCharacterSet]];
                  if ([clean hasPrefix:@"*"])
                      clean = [[clean substringFromIndex:1]
                          stringByTrimmingCharactersInSet:
                          [NSCharacterSet whitespaceAndNewlineCharacterSet]];

                  if ([clean isEqualToString:@"Realtek Wi-Fi"])
                      return YES;
              }

              return NO;
          }

          - (void)checkRealtekNetworkServicePresence {
              if ([self realtekNetworkServiceExists]) {
                  self.realtekServiceMissingAlertShown = NO;
                  return;
              }

              /*
               * The service was removed from System Settings > Network.
               * Ask once while missing, instead of every 5 seconds.
               */
              if (self.realtekServiceMissingAlertShown)
                  return;

              /* Never interrupt an open menu or another modal window. */
              if (self.menu.isAttached || NSApp.modalWindow != nil)
                  return;

              self.realtekServiceMissingAlertShown = YES;

              CHVActivateForInput();
              NSAlert *alert = [NSAlert new];
              alert.messageText = @"Realtek Wi-Fi foi removido de Rede";
              alert.informativeText =
                  @"O serviço “Realtek Wi-Fi” não está mais em Ajustes do Sistema > Rede. "
                   "Deseja recriá-lo agora?";
              [alert addButtonWithTitle:@"Reinstalar"];
              [alert addButtonWithTitle:@"Agora não"];

              if ([alert runModal] == NSAlertFirstButtonReturn) {
                  [[NSUserDefaults standardUserDefaults]
                      removeObjectForKey:@"CHVRealtekNetworkServiceInstalled"];
                  self.firstRunIntegrationChecked = NO;
                  self.realtekServiceMissingAlertShown = NO;
                  [self ensureRealtekNetworkService];
              }
          }

          - (void)maintenanceHeartbeat {
              [self refreshStatusOnly];

              static NSInteger tick = 0;
              tick++;
              if ((tick % 6) == 0) {
                  [self checkRealtekNetworkServicePresence];
              }
          }

          - (void)menuNeedsUpdate:(NSMenu *)menu {
              /*
               * NSMenu explicitly calls menuNeedsUpdate before displaying.
               * Rebuilding from menuWillOpen used to mutate a menu that was
               * already opening, which could make it instantly close/flicker.
               */
              [self rebuildMenu];
          }

          - (void)refreshStatusOnly {
              RTW88StateResult *st = [self.client stateMalloc];
              if (!st) {
                  self.status.button.toolTip = @"CHV WiFi — driver RTW88 indisponível";
                  return;
              }

              NSString *ssid = [NSString stringWithUTF8String:st->ssid] ?: @"";
              NSString *state = [self stateLabel:st->state];

              if (ssid.length) {
                  self.status.button.toolTip =
                      [NSString stringWithFormat:@"CHV WiFi — %@ — %@", state, ssid];
              } else {
                  self.status.button.toolTip =
                      [NSString stringWithFormat:@"CHV WiFi — %@", state];
              }
              free(st);
          }

          - (NSString *)stateLabel:(uint32_t)s {
              switch (s) {
                  case 0: return @"Desconectado";
                  case 1: return @"Procurando redes…";
                  case 2: return @"Autenticando…";
                  case 3: return @"Associando…";
                  case 4: return @"Conectando WPA2…";
                  case 5: return @"Conectado";
                  case 6: return @"Desconectando…";
                  default: return @"Estado desconhecido";
              }
          }

          - (BOOL)isDiagnosticGenerationCurrent:(NSUInteger)generation {
              return generation == self.diagnosticGeneration;
          }

          - (NSString *)runDiagnosticTask:(NSString *)path
                                 arguments:(NSArray<NSString *> *)args
                                generation:(NSUInteger)generation {
              if (![self isDiagnosticGenerationCurrent:generation])
                  return @"(diagnóstico interrompido)\n";

              NSTask *task = [NSTask new];
              task.launchPath = path;
              task.arguments = args;

              NSPipe *pipe = [NSPipe pipe];
              task.standardOutput = pipe;
              task.standardError = pipe;

              @synchronized (self) {
                  if (![self isDiagnosticGenerationCurrent:generation])
                      return @"(diagnóstico interrompido)\n";
                  self.diagnosticLogTask = task;
              }

              @try {
                  [task launch];
              } @catch (__unused NSException *e) {
                  @synchronized (self) {
                      if (self.diagnosticLogTask == task)
                          self.diagnosticLogTask = nil;
                  }
                  return @"";
              }

              /*
               * Never wait for the child before draining its pipe.  If log(1)
               * fills the pipe, waiting first can deadlock both processes.
               * A hard timeout also prevents a damaged unified-log database
               * from pinning a diagnostic forever.
               */
              __weak typeof(self) weakSelf = self;
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 6 * NSEC_PER_SEC),
                             dispatch_get_global_queue(QOS_CLASS_UTILITY, 0), ^{
                  __strong typeof(weakSelf) strongSelf = weakSelf;
                  if (!strongSelf) return;
                  @synchronized (strongSelf) {
                      if (strongSelf.diagnosticLogTask == task && task.running) {
                          [task terminate];
                      }
                  }
              });

              NSData *data = [[pipe fileHandleForReading] readDataToEndOfFile];
              [task waitUntilExit];

              @synchronized (self) {
                  if (self.diagnosticLogTask == task)
                      self.diagnosticLogTask = nil;
              }

              if (![self isDiagnosticGenerationCurrent:generation])
                  return @"(diagnóstico interrompido)\n";

              NSString *str = [[NSString alloc]
                  initWithData:data encoding:NSUTF8StringEncoding];
              return str ?: @"";
          }

          - (NSString *)diagnosticSnapshotForGeneration:(NSUInteger)generation {
              NSMutableString *out = [NSMutableString string];
              [out appendString:@"CHV WiFi - Diagnóstico RTW88\n"];
              [out appendString:@"========================================\n"];
              [out appendString:@"App: v1.9.4 2.4G Stable\n"];
              [out appendString:@"Driver esperado: 8.5.8 TEST6-24G-STABLE-RXTAG\n\n"];

              if (![self isDiagnosticGenerationCurrent:generation])
                  return @"Diagnóstico interrompido pelo usuário.\n";

              RTW88StateResult *st = [self.client stateMalloc];
              if (st) {
                  NSString *ssid = [NSString stringWithUTF8String:st->ssid] ?: @"";
                  NSString *chip = [NSString stringWithUTF8String:st->chip_name] ?: @"";
                  [out appendFormat:@"Estado: %@ (%u)\n", [self stateLabel:st->state], st->state];
                  [out appendFormat:@"SSID: %@\n", ssid.length ? ssid : @"-"];
                  [out appendFormat:@"Canal primário: %u\n", st->channel];
                  [out appendFormat:@"Banda: %@\n", st->channel > 14 ? @"5 GHz" : @"2,4 GHz"];
                  [out appendFormat:@"RSSI: %d dBm\n", st->rssi];
                  [out appendFormat:@"Chip: %@\n", chip];
                  [out appendFormat:@"Firmware: %u.%u\n", st->fw_version, st->fw_sub_version];
                  [out appendFormat:@"Power: %@\n", st->powered ? @"ON" : @"OFF"];
                  [out appendFormat:@"RX bytes: %u\n", st->rx_byte_count];
                  [out appendFormat:@"TX bytes: %u\n", st->tx_byte_count];
                  [out appendFormat:@"Scan offload: %@\n",
                                    st->scan_offload_supported ? @"SIM" : @"NÃO"];
                  free(st);
              } else {
                  [out appendString:@"Estado: driver/user client indisponível\n"];
              }

              if (![self isDiagnosticGenerationCurrent:generation])
                  return @"Diagnóstico interrompido pelo usuário.\n";

              [out appendString:@"\n--- Ring log do driver ---\n"];
              NSString *ring = [self.client driverLog];
              [out appendString:ring.length ? ring : @"(sem dados no ring log)\n"];

              if (![self isDiagnosticGenerationCurrent:generation])
                  return @"Diagnóstico interrompido pelo usuário.\n";

              [out appendString:@"\n--- Kernel log RTW88 (últimos 10 min) ---\n"];
              NSString *predicate =
                  @"(eventMessage CONTAINS[c] \"rtw88:\" OR "
                  @"eventMessage CONTAINS[c] \"[rtw88\" OR "
                  @"eventMessage CONTAINS[c] \"MGMT5G\") AND "
                  @"process != \"log\" AND process != \"CHV WiFi\"";

              NSString *klog = [self runDiagnosticTask:@"/usr/bin/log"
                                              arguments:@[@"show", @"--style", @"compact",
                                                          @"--last", @"10m",
                                                          @"--predicate", predicate]
                                             generation:generation];
              [out appendString:klog.length ? klog : @"(nenhum evento rtw88 encontrado)\n"];
              return out;
          }

          - (void)requestDiagnosticRefresh {
              if (!self.diagnosticTextView || self.diagnosticRefreshInFlight) return;

              self.diagnosticRefreshInFlight = YES;
              NSUInteger generation = self.diagnosticGeneration;
              self.status.button.toolTip = @"CHV WiFi — gerando diagnóstico em segundo plano…";

              __weak typeof(self) weakSelf = self;
              dispatch_async(dispatch_get_global_queue(QOS_CLASS_UTILITY, 0), ^{
                  __strong typeof(weakSelf) strongSelf = weakSelf;
                  if (!strongSelf) return;

                  NSString *snapshot =
                      [strongSelf diagnosticSnapshotForGeneration:generation] ?: @"";

                  dispatch_async(dispatch_get_main_queue(), ^{
                      __strong typeof(weakSelf) innerSelf = weakSelf;
                      if (!innerSelf) return;

                      innerSelf.diagnosticRefreshInFlight = NO;
                      if (![innerSelf isDiagnosticGenerationCurrent:generation]) return;

                      innerSelf.diagnosticTextView.string = snapshot;
                      innerSelf.status.button.toolTip = @"CHV WiFi";
                  });
              });
          }

          - (void)refreshDiagnosticWindow:(id)sender {
              [self requestDiagnosticRefresh];
          }

          - (void)diagnosticTimerFired:(NSTimer *)timer {
              if (!self.diagnosticAutoRefreshRunning) return;
              [self requestDiagnosticRefresh];
          }

          - (void)copyDiagnostics:(id)sender {
              NSString *s = self.diagnosticTextView.string ?: @"";
              if (!s.length) {
                  self.status.button.toolTip =
                      @"CHV WiFi — gere o diagnóstico antes de copiar";
                  return;
              }

              NSPasteboard *pb = [NSPasteboard generalPasteboard];
              [pb clearContents];
              [pb setString:s forType:NSPasteboardTypeString];
              self.status.button.toolTip = @"CHV WiFi — diagnóstico copiado";
          }

          - (void)enableDetailedDiagnostics:(id)sender {
              BOOL ok = [self.client setDebugLevel:5];
              NSAlert *a = [NSAlert new];
              a.messageText = ok ? @"Log detalhado ativado" : @"Falha ao ativar log";
              a.informativeText = ok
                  ? @"Tente conectar novamente ao 5 GHz. A coleta continuará sem bloquear a interface."
                  : @"O RTW88 não respondeu ao comando de debug.";
              [a addButtonWithTitle:@"OK"];
              [a runModal];
              [self requestDiagnosticRefresh];
          }

          - (void)startDiagnostics {
              self.diagnosticGeneration++;
              self.diagnosticAutoRefreshRunning = YES;
              self.diagnosticToggleButton.title = @"Parar diagnóstico";

              [self.diagnosticTimer invalidate];
              self.diagnosticTimer = [NSTimer scheduledTimerWithTimeInterval:10.0
                                                                      target:self
                                                                    selector:@selector(diagnosticTimerFired:)
                                                                    userInfo:nil
                                                                     repeats:YES];
              [self requestDiagnosticRefresh];
          }

          - (void)stopDiagnostics:(id)sender {
              self.diagnosticAutoRefreshRunning = NO;
              self.diagnosticGeneration++;

              [self.diagnosticTimer invalidate];
              self.diagnosticTimer = nil;

              @synchronized (self) {
                  if (self.diagnosticLogTask && self.diagnosticLogTask.running) {
                      [self.diagnosticLogTask terminate];
                  }
              }

              self.diagnosticToggleButton.title = @"Iniciar diagnóstico";
              self.status.button.toolTip = @"CHV WiFi — diagnóstico parado";

              if (self.diagnosticTextView.string.length) {
                  NSMutableString *stopped =
                      [self.diagnosticTextView.string mutableCopy];
                  [stopped appendString:@"\n\n[Diagnóstico parado pelo usuário]\n"];
                  self.diagnosticTextView.string = stopped;
              }
          }

          - (void)toggleDiagnostics:(id)sender {
              if (self.diagnosticAutoRefreshRunning)
                  [self stopDiagnostics:sender];
              else
                  [self startDiagnostics];
          }

          - (void)windowWillClose:(NSNotification *)notification {
              if (notification.object == self.diagnosticWindow) {
                  [self stopDiagnostics:nil];
              }
          }

          - (void)showDiagnostics:(id)sender {
              CHVActivateForInput();

              if (!self.diagnosticWindow) {
                  self.diagnosticWindow = [[NSWindow alloc]
                      initWithContentRect:NSMakeRect(0, 0, 780, 620)
                               styleMask:(NSWindowStyleMaskTitled |
                                          NSWindowStyleMaskClosable |
                                          NSWindowStyleMaskResizable |
                                          NSWindowStyleMaskMiniaturizable)
                                 backing:NSBackingStoreBuffered
                                   defer:NO];
                  self.diagnosticWindow.title =
                      @"CHV WiFi — Diagnóstico RTW88 / TEST6 2.4G Stable";
                  self.diagnosticWindow.delegate = self;
                  [self.diagnosticWindow center];

                  NSView *content = self.diagnosticWindow.contentView;
                  NSScrollView *scroll = [[NSScrollView alloc]
                      initWithFrame:NSMakeRect(16, 62, 748, 542)];
                  scroll.hasVerticalScroller = YES;
                  scroll.hasHorizontalScroller = YES;
                  scroll.autoresizingMask = NSViewWidthSizable | NSViewHeightSizable;

                  NSTextView *tv = [[NSTextView alloc]
                      initWithFrame:scroll.contentView.bounds];
                  tv.editable = NO;
                  tv.selectable = YES;
                  tv.richText = NO;
                  tv.font = [NSFont monospacedSystemFontOfSize:11
                                                       weight:NSFontWeightRegular];
                  tv.autoresizingMask = NSViewWidthSizable | NSViewHeightSizable;
                  scroll.documentView = tv;
                  [content addSubview:scroll];
                  self.diagnosticTextView = tv;

                  NSButton *refresh = [[NSButton alloc] initWithFrame:NSMakeRect(16, 18, 110, 32)];
                  refresh.title = @"Atualizar";
                  refresh.bezelStyle = NSBezelStyleRounded;
                  refresh.target = self;
                  refresh.action = @selector(refreshDiagnosticWindow:);
                  [content addSubview:refresh];

                  NSButton *copy = [[NSButton alloc] initWithFrame:NSMakeRect(136, 18, 155, 32)];
                  copy.title = @"Copiar diagnóstico";
                  copy.bezelStyle = NSBezelStyleRounded;
                  copy.target = self;
                  copy.action = @selector(copyDiagnostics:);
                  [content addSubview:copy];

                  NSButton *debug = [[NSButton alloc] initWithFrame:NSMakeRect(301, 18, 175, 32)];
                  debug.title = @"Ativar log detalhado";
                  debug.bezelStyle = NSBezelStyleRounded;
                  debug.target = self;
                  debug.action = @selector(enableDetailedDiagnostics:);
                  [content addSubview:debug];

                  NSButton *toggle = [[NSButton alloc] initWithFrame:NSMakeRect(486, 18, 155, 32)];
                  toggle.title = @"Parar diagnóstico";
                  toggle.bezelStyle = NSBezelStyleRounded;
                  toggle.target = self;
                  toggle.action = @selector(toggleDiagnostics:);
                  [content addSubview:toggle];
                  self.diagnosticToggleButton = toggle;
              }

              [self.diagnosticWindow makeKeyAndOrderFront:nil];
              [self startDiagnostics];
          }

          - (void)rebuildMenu {
              [self.menu removeAllItems];

              RTW88StateResult *st = [self.client stateMalloc];

              NSMenuItem *title = [[NSMenuItem alloc] initWithTitle:@"CHV Wi-Fi"
                                                            action:nil
                                                     keyEquivalent:@""];
              title.enabled = NO;
              [self.menu addItem:title];

              if (!st) {
                  NSMenuItem *e = [[NSMenuItem alloc]
                      initWithTitle:@"Driver RTW88 não encontrado"
                             action:nil keyEquivalent:@""];
                  e.enabled = NO;
                  [self.menu addItem:e];
                  [self.menu addItem:[NSMenuItem separatorItem]];
                  [self addQuit];
                  return;
              }

              NSString *ssid = [NSString stringWithUTF8String:st->ssid] ?: @"";
              NSString *state = [self stateLabel:st->state];

              if (ssid.length && st->state == 5) {
                  NSMenuItem *s = [[NSMenuItem alloc] initWithTitle:@""
                                                            action:nil
                                                     keyEquivalent:@""];
                  CHVConnectedMenuView *connectedView =
                      [[CHVConnectedMenuView alloc] initWithSSID:ssid
                                                           rssi:st->rssi
                                                          owner:self
                                                          width:360];
                  s.view = connectedView;
                  [self.menu addItem:s];
              } else {
                  NSString *statusText = ssid.length
                      ? [NSString stringWithFormat:@"%@ — %@ (%d dBm)", state, ssid, st->rssi]
                      : state;

                  NSMenuItem *s = [[NSMenuItem alloc] initWithTitle:statusText
                                                            action:nil
                                                     keyEquivalent:@""];
                  s.enabled = NO;
                  [self.menu addItem:s];
              }

              BOOL powered = st->powered != 0;
              free(st);

              NSMenuItem *power = [[NSMenuItem alloc]
                  initWithTitle:(powered ? @"Desligar Wi-Fi" : @"Ligar Wi-Fi")
                         action:@selector(togglePower:)
                  keyEquivalent:@""];
              power.target = self;
              power.representedObject = @(powered);
              [self.menu addItem:power];

              NSMenuItem *scan = [[NSMenuItem alloc]
                  initWithTitle:@"Procurar redes"
                         action:@selector(scan:)
                  keyEquivalent:@"r"];
              scan.target = self;
              [self.menu addItem:scan];

              NSMenuItem *disc = [[NSMenuItem alloc]
                  initWithTitle:@"Desconectar"
                         action:@selector(disconnect:)
                  keyEquivalent:@""];
              disc.target = self;
              [self.menu addItem:disc];

              NSMenuItem *quitTop = [[NSMenuItem alloc]
                  initWithTitle:@"Sair do CHV Wi-Fi"
                         action:@selector(terminate:)
                  keyEquivalent:@"q"];
              quitTop.target = NSApp;
              [self.menu addItem:quitTop];

              [self.menu addItem:[NSMenuItem separatorItem]];

              /*
               * Utility actions stay at the TOP. They no longer end up after
               * a long list of nearby Wi-Fi networks.
               */
              BOOL serviceExists = [self realtekNetworkServiceExists];

              NSMenuItem *serviceStatus = [[NSMenuItem alloc]
                  initWithTitle:(serviceExists
                      ? @"✓ Realtek Wi-Fi instalado em Rede"
                      : @"⚠ Realtek Wi-Fi ausente em Rede")
                         action:nil
                  keyEquivalent:@""];
              serviceStatus.enabled = NO;
              [self.menu addItem:serviceStatus];

              NSMenuItem *repairService = [[NSMenuItem alloc]
                  initWithTitle:@"Instalar/Recriar Realtek Wi-Fi em Rede"
                         action:@selector(reinstallRealtekNetworkService:)
                  keyEquivalent:@""];
              repairService.target = self;
              [self.menu addItem:repairService];

              NSMenuItem *removeService = [[NSMenuItem alloc]
                  initWithTitle:@"Remover Realtek Wi-Fi de Rede"
                         action:@selector(removeRealtekNetworkService:)
                  keyEquivalent:@""];
              removeService.target = self;
              removeService.enabled = serviceExists;
              [self.menu addItem:removeService];

              NSMenuItem *openSettings = [[NSMenuItem alloc]
                  initWithTitle:@"Abrir Ajustes de Rede"
                         action:@selector(openNetworkSettings:)
                  keyEquivalent:@""];
              openSettings.target = self;
              [self.menu addItem:openSettings];

              NSMenuItem *installDriver = [[NSMenuItem alloc]
                  initWithTitle:@"Instalar/Atualizar driver RTW88 na EFI"
                         action:@selector(installDriverIntoOpenCore:)
                  keyEquivalent:@""];
              installDriver.target = self;
              [self.menu addItem:installDriver];

              NSMenuItem *diag = [[NSMenuItem alloc]
                  initWithTitle:@"Diagnóstico da conexão RTW88"
                         action:@selector(showDiagnostics:)
                  keyEquivalent:@"d"];
              diag.target = self;
              [self.menu addItem:diag];

              NSString *savedSSID =
                  [[NSUserDefaults standardUserDefaults]
                      stringForKey:@"CHVLastConnectedSSID"];
              if (savedSSID.length) {
                  NSMenuItem *forgetAuto = [[NSMenuItem alloc]
                      initWithTitle:[NSString stringWithFormat:
                                     @"Esquecer conexão automática: %@", savedSSID]
                             action:@selector(forgetAutomaticNetwork:)
                      keyEquivalent:@""];
                  forgetAuto.target = self;
                  [self.menu addItem:forgetAuto];
              }

              [self.menu addItem:[NSMenuItem separatorItem]];

              if (self.networks.count) {
                  NSMenuItem *hdr = [[NSMenuItem alloc]
                      initWithTitle:[NSString stringWithFormat:
                                     @"Redes disponíveis (%lu)",
                                     (unsigned long)self.networks.count]
                             action:nil
                      keyEquivalent:@""];
                  hdr.enabled = NO;
                  [self.menu addItem:hdr];

                  /*
                   * Limit visible networks so the menu remains usable.
                   * The list is already sorted by RSSI, so the strongest are shown.
                   */
                  NSUInteger maxVisible = MIN((NSUInteger)18, self.networks.count);
                  for (NSUInteger i = 0; i < maxVisible; i++) {
                      RTW88Network *n = self.networks[i];
                      NSMenuItem *mi = [[NSMenuItem alloc] initWithTitle:@""
                                                                 action:nil
                                                          keyEquivalent:@""];
                      CHVNetworkMenuView *view =
                          [[CHVNetworkMenuView alloc] initWithNetwork:n
                                                               owner:self
                                                               width:360];
                      view.wantsLayer = YES;
                      mi.view = view;
                      [self.menu addItem:mi];
                  }

                  if (self.networks.count > maxVisible) {
                      NSMenuItem *more = [[NSMenuItem alloc]
                          initWithTitle:[NSString stringWithFormat:
                                         @"Mais %lu redes — use Procurar redes",
                                         (unsigned long)(self.networks.count - maxVisible)]
                                 action:nil
                          keyEquivalent:@""];
                      more.enabled = NO;
                      [self.menu addItem:more];
                  }
              } else {
                  NSMenuItem *none = [[NSMenuItem alloc]
                      initWithTitle:@"Nenhuma rede carregada — clique em Procurar redes"
                             action:nil
                      keyEquivalent:@""];
                  none.enabled = NO;
                  [self.menu addItem:none];
              }

              [self.menu addItem:[NSMenuItem separatorItem]];
          }

          - (void)addQuit {
              NSMenuItem *quit = [[NSMenuItem alloc] initWithTitle:@"Sair do CHV Wi-Fi"
                                                            action:@selector(terminate:)
                                                     keyEquivalent:@"q"];
              quit.target = NSApp;
              [self.menu addItem:quit];
          }

          - (void)togglePower:(NSMenuItem *)sender {
              BOOL powered = [sender.representedObject boolValue];
              if (powered) [self.client powerOff];
              else [self.client powerOn];
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 300 * NSEC_PER_MSEC),
                             dispatch_get_main_queue(), ^{
                  [self rebuildMenu];
              });
          }

          - (void)disconnect:(id)sender {
              [self.client disconnect];
              if (!self.menu.isAttached)
                  [self rebuildMenu];
          }

          - (void)scan:(id)sender {
              self.status.button.toolTip = @"CHV WiFi — procurando redes…";

              dispatch_async(dispatch_get_global_queue(QOS_CLASS_USER_INITIATED, 0), ^{
                  NSArray *nets = [self.client scan];
                  dispatch_async(dispatch_get_main_queue(), ^{
                      self.networks = nets;
                      self.status.button.toolTip = @"CHV WiFi";

                      /*
                       * If the menu is currently visible, leave it alone.
                       * It will refresh cleanly on the next open through
                       * menuNeedsUpdate. This prevents a sudden close.
                       */
                      if (!self.menu.isAttached)
                          [self rebuildMenu];
                  });
              });
          }

          - (void)forgetConnectedNetworkFromContext:(NSMenuItem *)sender {
              NSString *ssid = sender.representedObject;
              if (!ssid.length) return;

              NSAlert *confirm = [NSAlert new];
              confirm.messageText =
                  [NSString stringWithFormat:@"Esquecer “%@”?", ssid];
              confirm.informativeText =
                  @"A senha será apagada do Keychain, a rede será removida da "
                   "conexão automática e a conexão atual será encerrada.";
              [confirm addButtonWithTitle:@"Esquecer rede"];
              [confirm addButtonWithTitle:@"Cancelar"];

              if ([confirm runModal] != NSAlertFirstButtonReturn)
                  return;

              CHVDeletePassword(ssid);

              NSUserDefaults *defaults = [NSUserDefaults standardUserDefaults];
              NSString *autoSSID = [defaults stringForKey:@"CHVLastConnectedSSID"];
              if ([autoSSID isEqualToString:ssid])
                  [defaults removeObjectForKey:@"CHVLastConnectedSSID"];
              [defaults synchronize];

              [self.client disconnect];
              self.autoConnectAttempted = NO;
              self.autoConnectRetryCount = 0;
              [self rebuildMenu];
          }

          - (void)connectNetworkView:(CHVNetworkMenuView *)view {
              if (!view.network) return;

              NSMenuItem *shim = [[NSMenuItem alloc] initWithTitle:@""
                                                            action:nil
                                                     keyEquivalent:@""];
              shim.representedObject = view.network;
              [self connectNetwork:shim];
          }

          - (void)forgetNetworkFromContext:(NSMenuItem *)sender {
              RTW88Network *net = sender.representedObject;
              if (!net.ssid.length) return;

              NSAlert *confirm = [NSAlert new];
              confirm.messageText =
                  [NSString stringWithFormat:@"Esquecer “%@”?", net.ssid];
              confirm.informativeText =
                  @"A senha salva será apagada do Keychain e a rede será removida "
                   "da conexão automática. Na próxima conexão será necessário "
                   "informar a senha novamente.";
              [confirm addButtonWithTitle:@"Esquecer rede"];
              [confirm addButtonWithTitle:@"Cancelar"];

              if ([confirm runModal] != NSAlertFirstButtonReturn)
                  return;

              CHVDeletePassword(net.ssid);

              NSUserDefaults *defaults = [NSUserDefaults standardUserDefaults];
              NSString *autoSSID = [defaults stringForKey:@"CHVLastConnectedSSID"];
              if ([autoSSID isEqualToString:net.ssid])
                  [defaults removeObjectForKey:@"CHVLastConnectedSSID"];
              [defaults synchronize];

              RTW88StateResult *st = [self.client stateMalloc];
              if (st) {
                  NSString *currentSSID =
                      [NSString stringWithUTF8String:st->ssid] ?: @"";
                  BOOL sameNetwork =
                      (st->state == 5 && [currentSSID isEqualToString:net.ssid]);
                  free(st);
                  if (sameNetwork)
                      [self.client disconnect];
              }

              self.autoConnectAttempted = NO;
              self.autoConnectRetryCount = 0;
              [self rebuildMenu];
          }

          - (void)connectNetwork:(NSMenuItem *)sender {
              RTW88Network *net = sender.representedObject;
              if (!net) return;

              NSString *password = CHVLoadPassword(net.ssid);
              if (!password && net.cipher != 0) {
                  NSAlert *a = [NSAlert new];
                  a.messageText = [NSString stringWithFormat:@"Conectar a “%@”", net.ssid];
                  a.informativeText = @"Digite a senha do Wi-Fi:";
                  [a addButtonWithTitle:@"Conectar"];
                  [a addButtonWithTitle:@"Cancelar"];

                  NSSecureTextField *field =
                      [[NSSecureTextField alloc] initWithFrame:NSMakeRect(0,0,280,24)];
                  field.placeholderString = @"Senha do Wi-Fi";
                  field.focusRingType = NSFocusRingTypeDefault;
                  a.accessoryView = field;

                  CHVActivateForInput();
                  a.window.initialFirstResponder = field;
                  [a.window makeKeyAndOrderFront:nil];
                  [a.window makeFirstResponder:field];

                  if ([a runModal] != NSAlertFirstButtonReturn) return;
                  password = field.stringValue ?: @"";
                  if (password.length == 0) return;
                  CHVSavePassword(net.ssid, password);
              }

              if (!password) password = @"";

              self.status.button.toolTip =
                  [NSString stringWithFormat:@"CHV WiFi — conectando a %@…", net.ssid];

              /*
               * TEST5: manual connection is self-healing. A failed
               * auth/assoc cycle no longer requires another user click.
               */
              dispatch_async(dispatch_get_global_queue(QOS_CLASS_USER_INITIATED, 0), ^{
                  BOOL connected = NO;
                  BOOL everStarted = NO;
                  const int maxRounds = 4;

                  for (int round = 0; round < maxRounds && !connected; round++) {
                      [self.client disconnect];
                      usleep(round == 0 ? 350000 : 650000);

                      if (round > 0) {
                          NSArray<RTW88Network *> *fresh = [self.client scan];
                          if (fresh.count)
                              self.networks = fresh;
                          usleep(250000);
                      }

                      BOOL started =
                          [self.client connectSSID:net.ssid password:password];
                      if (!started) {
                          usleep(500000);
                          continue;
                      }
                      everStarted = YES;

                      dispatch_async(dispatch_get_main_queue(), ^{
                          self.status.button.toolTip =
                              [NSString stringWithFormat:
                               @"CHV WiFi — conectando a %@… tentativa %d/%d",
                               net.ssid, round + 1, maxRounds];
                      });

                      for (int i = 0; i < 80; i++) {
                          usleep(250000);
                          RTW88StateResult *now = [self.client stateMalloc];
                          if (!now) continue;

                          NSString *ssidNow =
                              [NSString stringWithUTF8String:now->ssid] ?: @"";
                          uint32_t stateNow = now->state;
                          free(now);

                          if (stateNow == 5 &&
                              [ssidNow isEqualToString:net.ssid]) {
                              connected = YES;
                              break;
                          }

                          if (stateNow == 0 && i > 16)
                              break;
                      }
                  }

                  dispatch_async(dispatch_get_main_queue(), ^{
                      if (connected) {
                          NSUserDefaults *defaults = [NSUserDefaults standardUserDefaults];
                          [defaults setObject:net.ssid forKey:@"CHVLastConnectedSSID"];
                          [defaults synchronize];

                          self.autoConnectRetryCount = 0;
                          [self refreshStatusOnly];
                          [self rebuildMenu];
                      } else {
                          NSAlert *fail = [NSAlert new];
                          fail.messageText = @"Falha ao conectar";
                          fail.informativeText = everStarted
                              ? [NSString stringWithFormat:
                                 @"O CHV WiFi tentou automaticamente %d vezes conectar a “%@”, mas a autenticação/associação não foi concluída. Abra Diagnóstico Wi-Fi e copie o relatório para identificar a etapa exata.",
                                 maxRounds, net.ssid]
                              : @"O driver RTW88 recusou todas as tentativas de iniciar a conexão.";
                          [fail addButtonWithTitle:@"OK"];
                          [fail runModal];
                      }
                  });
              });
          }

          - (void)forgetAutomaticNetwork:(id)sender {
              NSUserDefaults *defaults = [NSUserDefaults standardUserDefaults];
              NSString *ssid = [defaults stringForKey:@"CHVLastConnectedSSID"];
              if (!ssid.length) return;

              NSAlert *confirm = [NSAlert new];
              confirm.messageText =
                  [NSString stringWithFormat:@"Esquecer “%@”?", ssid];
              confirm.informativeText =
                  @"A senha salva será apagada do Keychain, a rede será removida "
                   "da conexão automática e a conexão atual será encerrada.";
              [confirm addButtonWithTitle:@"Esquecer rede"];
              [confirm addButtonWithTitle:@"Cancelar"];

              if ([confirm runModal] != NSAlertFirstButtonReturn)
                  return;

              CHVDeletePassword(ssid);
              [defaults removeObjectForKey:@"CHVLastConnectedSSID"];
              [defaults synchronize];

              [self.client disconnect];
              self.autoConnectAttempted = NO;
              self.autoConnectRetryCount = 0;
              [self rebuildMenu];
          }

          - (void)openNetworkSettings:(id)sender {
              NSURL *url = [NSURL URLWithString:
                  @"x-apple.systempreferences:com.apple.Network-Settings.extension"];
              [[NSWorkspace sharedWorkspace] openURL:url];
          }

          @end

          int main(int argc, const char * argv[]) {
              @autoreleasepool {
                  /*
                   * Single-instance guard.
                   * If two copies are launched (for example login + user click),
                   * only the process with the lowest PID survives.
                   */
                  NSString *bundleID = @"com.chvsolucoes.wifi";
                  pid_t myPID = getpid();

                  NSArray<NSRunningApplication *> *running =
                      [NSRunningApplication runningApplicationsWithBundleIdentifier:bundleID];

                  for (NSRunningApplication *other in running) {
                      pid_t pid = other.processIdentifier;
                      if (pid != myPID && pid < myPID) {
                          /*
                           * Another CHV WiFi instance already owns the status
                           * item. Exit silently; do not activate/steal focus.
                           */
                          return 0;
                      }
                  }

                  NSApplication *app = [NSApplication sharedApplication];
                  AppDelegate *delegate = [AppDelegate new];
                  app.delegate = delegate;
                  [app setActivationPolicy:NSApplicationActivationPolicyAccessory];
                  [app run];
              }
              return 0;
          }
