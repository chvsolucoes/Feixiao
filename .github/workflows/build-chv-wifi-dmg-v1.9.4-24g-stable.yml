      - name: Configure signing mode
        shell: bash
        env:
          CERT_P12_B64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          echo "SIGNING_MODE=adhoc" >> "$GITHUB_ENV"

          if [ -z "${CERT_P12_B64:-}" ] || [ -z "${CERT_PASSWORD:-}" ] || [ -z "${KEYCHAIN_PASSWORD:-}" ]; then
            echo "Developer ID secrets not configured."
            echo "Building in ad-hoc mode."
            exit 0
          fi

          echo "$CERT_P12_B64" | /usr/bin/base64 -D -o /tmp/chv-developer-id.p12

          security create-keychain -p "$KEYCHAIN_PASSWORD" /tmp/chv-build.keychain-db
          security set-keychain-settings -lut 21600 /tmp/chv-build.keychain-db
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" /tmp/chv-build.keychain-db

          security import /tmp/chv-developer-id.p12 \
            -k /tmp/chv-build.keychain-db \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security list-keychains -d user -s /tmp/chv-build.keychain-db
          security default-keychain -d user -s /tmp/chv-build.keychain-db
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" \
            /tmp/chv-build.keychain-db

          IDENTITY="$(security find-identity -v -p codesigning /tmp/chv-build.keychain-db \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"

          if [ -n "$IDENTITY" ]; then
            echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=developerid" >> "$GITHUB_ENV"
            echo "Developer ID signing enabled."
          else
            echo "No Developer ID Application identity found."
            echo "Falling back to ad-hoc signing."
          fi

      - name: Build native menu bar app
        shell: bash
        run: |
          set -euo pipefail

          echo "Bundling traced rtw88.kext 8.5.7 into CHV WiFi.app..."
          rm -rf "package/CHV WiFi.app/Contents/Resources/rtw88.kext"
          cp -R Feixiao/build/out/rtw88.kext             "package/CHV WiFi.app/Contents/Resources/rtw88.kext"

          test -f "package/CHV WiFi.app/Contents/Resources/rtw88.kext/Contents/MacOS/rtw88"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion'             "package/CHV WiFi.app/Contents/Resources/rtw88.kext/Contents/Info.plist")" = "8.5.9"

          SDK="$(xcrun --sdk macosx --show-sdk-path)"

          echo "Building x86_64 binary for Intel Hackintosh..."
          clang \
            -arch x86_64 \
            -fobjc-arc \
            -fblocks \
            -mmacosx-version-min=12.0 \
            -isysroot "$SDK" \
            -framework Cocoa \
            -framework IOKit \
            -framework Security \
            src/main.m src/RTW88Client.m src/Keychain.m \
            -o build/chv-wifi-x86_64

          echo "Building arm64 binary for Apple Silicon..."
          clang \
            -arch arm64 \
            -fobjc-arc \
            -fblocks \
            -mmacosx-version-min=12.0 \
            -isysroot "$SDK" \
            -framework Cocoa \
            -framework IOKit \
            -framework Security \
            src/main.m src/RTW88Client.m src/Keychain.m \
            -o build/chv-wifi-arm64

          echo "Creating Universal 2 application..."
          lipo -create \
            build/chv-wifi-x86_64 \
            build/chv-wifi-arm64 \
            -output "package/CHV WiFi.app/Contents/MacOS/CHV WiFi"

          chmod +x "package/CHV WiFi.app/Contents/MacOS/CHV WiFi"

          echo "Architectures:"
          lipo -archs "package/CHV WiFi.app/Contents/MacOS/CHV WiFi"
          file "package/CHV WiFi.app/Contents/MacOS/CHV WiFi"

          ARCHS="$(lipo -archs "package/CHV WiFi.app/Contents/MacOS/CHV WiFi")"
          echo "$ARCHS" | grep -qw x86_64
          echo "$ARCHS" | grep -qw arm64

          if [ "${SIGNING_MODE:-adhoc}" = "developerid" ]; then
            codesign --force --timestamp --sign "$CODESIGN_IDENTITY"               "package/CHV WiFi.app/Contents/Resources/rtw88.kext"

            codesign --force --deep \
              --options runtime \
              --timestamp \
              --sign "$CODESIGN_IDENTITY" \
              "package/CHV WiFi.app"
          else
            codesign --force --sign -               "package/CHV WiFi.app/Contents/Resources/rtw88.kext"
            codesign --force --deep --sign - "package/CHV WiFi.app"
          fi

          codesign --verify --deep --strict --verbose=2 "package/CHV WiFi.app"
          codesign -dv --verbose=4 "package/CHV WiFi.app" 2>&1 | head -60
          plutil -lint "package/CHV WiFi.app/Contents/Info.plist"

      - name: Create DMG installer
        shell: bash
        run: |
          set -euo pipefail

          DMG_ROOT="dmgroot"
          DMG_NAME="CHV-WiFi-24G-Stable-v1.9.4.dmg"
          APP="package/CHV WiFi.app"

          rm -rf "$DMG_ROOT"
          mkdir -p "$DMG_ROOT"

          cp -R "$APP" "$DMG_ROOT/CHV WiFi.app"
          ln -s /Applications "$DMG_ROOT/Applications"

          cat > "$DMG_ROOT/LEIA-ME.txt" <<'EOF'
          CHV WiFi 1.9.1

          INSTALAÇÃO
          ----------
          1. Arraste "CHV WiFi.app" para "Applications".
          2. Abra Aplicativos > CHV WiFi.

          Esta build usa o mesmo modo de assinatura/distribuição da v1.4.3.

          COMPATIBILIDADE
          ---------------
          Universal 2:
          - x86_64 para Hackintosh Intel
          - arm64 para Apple Silicon

          IMPORTANTE
          ----------
          O aplicativo usa a rtw88.kext funcional já carregada pelo OpenCore.
          Ele controla o Wi-Fi graficamente sem precisar usar Terminal no dia a dia.

          IDENTIDADE VISUAL
          ----------------
          A logo CHV WiFi é usada no aplicativo, Finder/Dock e no DMG.

          Na barra de menus é usado o símbolo Wi-Fi nativo do macOS,
          exatamente como solicitado, para manter a aparência do sistema.

          INÍCIO AUTOMÁTICO, INSTÂNCIA ÚNICA E AUTO-CONEXÃO
          ------------------------------------------------
          O CHV WiFi agora impede duas instâncias ao mesmo tempo. Se o macOS
          iniciar o aplicativo no login e o usuário clicar nele novamente,
          apenas uma cópia permanece ativa e somente um ícone aparece na barra.

          O menu não é mais reconstruído a cada poucos segundos. Isso elimina
          o efeito de piscar/abrir-fechar observado nas versões anteriores.

          INÍCIO AUTOMÁTICO E AUTO-CONEXÃO
          ---------------------------------
          Quando o CHV WiFi é executado a partir de /Applications, ele cria
          automaticamente um LaunchAgent em:

            ~/Library/LaunchAgents/com.chvsolucoes.wifi.plist

          Assim o ícone CHV WiFi volta para a barra de menus em cada login.

          Depois de uma conexão feita com sucesso pelo CHV WiFi, o SSID é
          lembrado. No próximo login o aplicativo:
          - liga o rádio se necessário;
          - faz scan;
          - procura o último SSID;
          - lê a senha salva no Keychain;
          - inicia a conexão automaticamente.

          O menu permite apagar a rede usada na conexão automática.

          ESQUECER REDE
          --------------
          Agora há três formas de esquecer uma rede:

          1. Botão direito na rede da lista > "Esquecer rede".
          2. Botão direito na conexão atual no topo > "Esquecer rede".
          3. "Esquecer conexão automática: NOME_DA_REDE".

          Em todos os casos:
          - a senha é apagada do Keychain;
          - a rede sai da conexão automática;
          - a conexão atual é encerrada, quando for essa rede;
          - na próxima conexão a senha será solicitada novamente.

          FOCO DOS CAMPOS E AUTORIZAÇÃO
          ------------------------------
          Esta versão força o CHV WiFi a ficar ativo antes de abrir:
          - campo de senha do Wi-Fi;
          - confirmação de instalação/remoção do serviço de Rede;
          - janela de autenticação do administrador do macOS.

          Isso corrige o problema em que o usuário via o campo mas não conseguia
          digitar nele porque o aplicativo de barra estava sem foco.

          SERVIÇO REALTEK WI-FI
          ---------------------
          O menu agora possui:
          - Instalar/Recriar Realtek Wi-Fi em Rede
          - Remover Realtek Wi-Fi de Rede
          - Abrir Ajustes de Rede

          A remoção usa networksetup e pede autenticação do administrador.

          INSTALAÇÃO AUTOMÁTICA DA KEXT NO OPENCORE
          ------------------------------------------
          O CHV WiFi inclui a rtw88.kext 8.5.7 TEST4 RX Tag Trace dentro do próprio aplicativo.

          Se o driver não estiver carregado, o aplicativo oferece:
          - localizar automaticamente todas as partições EFI;
          - montar as partições com autorização do administrador;
          - identificar somente EFIs que contenham EFI/OC/config.plist;
          - se houver uma única EFI OpenCore, usá-la automaticamente;
          - se houver várias, mostrar uma lista para o usuário escolher;
          - criar backup automático do config.plist;
          - copiar rtw88.kext para EFI/OC/Kexts;
          - criar ou atualizar Kernel > Add para rtw88.kext;
          - validar o config.plist com plutil;
          - pedir para reiniciar o computador.

          O menu também possui:
          "Instalar/Atualizar driver RTW88 na EFI"

          O aplicativo nunca modifica uma partição EFI que não contenha
          EFI/OC/config.plist.

          ============================================================
          CHV WIFI MGMT5G TEST4 RX TAG TRACE - DRIVER 8.5.7
          ============================================================

          ESTA E UMA VERSAO DE TESTE PARA RTL8821CE.

          Mudancas do teste:
          - valida centro de canal VHT80 antes de programar o PHY;
          - preserva o caminho BW80 do rtw88 Linux;
          - tenta 80 MHz primeiro;
          - repete autenticacao em 80 MHz uma vez;
          - se auth/assoc falhar em 80 MHz, cai automaticamente para 40/20 MHz;
          - nao altera o RX batching nem os thresholds estaveis da base.

          Logs importantes:
          MGMT5G-TEST2 chandef=
          MGMT5G-TEST2 auth
          MGMT5G-TEST2 assoc
          MGMT5G-TEST2 forced fallback

          DIAGNOSTICO DE CONEXAO
          ----------------------
          Menu: "Diagnóstico da conexão RTW88"

          A janela atualiza a cada 2 segundos e mostra:
          - estado, SSID, canal, banda e RSSI;
          - chip e firmware;
          - bytes RX/TX;
          - ring log interno do RTW88;
          - kernel log rtw88 dos últimos 10 minutos;
          - eventos MGMT5G-TEST2 de AUTH/ASSOC;
          - logs de chandef para identificar 20/40/80 MHz.

          O botão "Copiar diagnóstico" copia tudo.

          Estabilidade do diagnóstico (Stable):
          - coleta executada fora da thread principal;
          - impede duas coletas simultâneas;
          - atualização automática reduzida para 10 segundos;
          - botão "Parar diagnóstico" cancela o timer e encerra log(1) ativo;
          - timeout de 6 segundos no comando log show;
          - stdout/stderr são drenados antes de waitUntilExit para evitar deadlock;
          - filtro exclui o próprio processo log e o CHV WiFi;
          - ring log usa blocos de 4095 bytes compatíveis com IOKit/MIG;
          - lista BSS usa buffer de 4095 bytes pelo mesmo motivo.

          MGMT5G TEST4 RX TAG TRACE
          -------------
          Frames de gerenciamento:
          - banda informada explicitamente;
          - USE_MINRATE;
          - índice legacy 0;
          - no 5 GHz, índice 0 corresponde à taxa OFDM básica da tabela;
          - ACK/TX status habilitado;
          - até 4 tentativas;
          - NO_ACK removido.

          ESTABILIDADE NA INICIALIZAÇÃO
          ----------------------------
          A v1.9.2 corrige o ciclo de abrir/fechar/piscar na barra de menus.

          Causa corrigida:
          o aplicativo antigo fazia launchctl bootout/bootstrap do próprio
          LaunchAgent enquanto estava rodando. Quando iniciado pelo macOS,
          isso encerrava o processo atual e iniciava outro, repetidamente.

          Agora:
          - o LaunchAgent é apenas gravado/atualizado para o próximo login;
          - o app nunca reinicia a si mesmo pelo launchctl;
          - uma segunda instância encerra silenciosamente;
          - o menu é atualizado com menuNeedsUpdate, antes de aparecer;
          - o menu não é destruído/recriado enquanto estiver aberto;
          - a reconexão automática tem prioridade no boot;
          - o driver pode aguardar até cerca de 90 segundos para ficar pronto.

          AUTO-CONEXÃO NO BOOT
          --------------------
          Ao iniciar o macOS o CHV WiFi:
          - abre pela barra de menus;
          - aguarda o RTW88 ficar disponível;
          - liga o rádio se necessário;
          - procura a última rede salva;
          - lê a senha no Keychain;
          - conecta automaticamente;
          - confirma o estado realmente conectado antes de encerrar as tentativas.

          FUNÇÕES
          -------
          - ligar/desligar Wi-Fi
          - scan de redes
          - conectar/desconectar
          - salvar senha no Keychain
          - mostrar SSID, RSSI e banda 2.4/5 GHz
          - criar automaticamente "Realtek Wi-Fi" em Ajustes > Rede
          - configurar esse serviço para DHCP
          - permitir recriar o serviço pelo menu do CHV WiFi

          INTEGRAÇÃO COM AJUSTES > REDE
          -----------------------------
          Na primeira execução o aplicativo detecta a interface BSD associada
          ao MAC da RTL8821CE e oferece criar um serviço de rede chamado
          "Realtek Wi-Fi" usando a configuração oficial SystemConfiguration
          do macOS (networksetup).

          Esse item aparece em Ajustes do Sistema > Rede e recebe DHCP/IP/DNS
          normalmente.

          Observação: como a rtw88.kext funcional continua sendo baseada em
          IOEthernetController, o macOS pode exibir esse serviço com aparência
          de Ethernet. O nome será "Realtek Wi-Fi", mas o painel Apple só ganha
          comportamento/ícone Wi-Fi 100% nativo com um driver IO80211/Skywalk.

          GATEKEEPER
          ----------
          O workflow suporta dois modos:

          1) Developer ID + notarização:
             se os Secrets da Apple estiverem configurados, o app/DMG é assinado
             e notarizado. Esse é o modo que elimina o aviso do Gatekeeper.

          2) Ad-hoc:
             se os Secrets não existirem, o build continua e gera o DMG normalmente,
             mas o macOS poderá exibir o aviso de app não verificado na primeira abertura.

          Sem certificado Developer ID e notarização da Apple não existe como o
          workflow tornar o aplicativo "verificado pela Apple".

          AirDrop/AWDL e Bluetooth não fazem parte desta ferramenta.
          EOF

          echo "Creating DMG..."
          hdiutil create \
            -volname "CHV WiFi" \
            -srcfolder "$DMG_ROOT" \
            -ov \
            -format UDZO \
            "package/$DMG_NAME"

          test -f "package/$DMG_NAME"

          if [ "${SIGNING_MODE:-adhoc}" = "developerid" ]; then
            echo "Signing DMG with Developer ID..."
            codesign --force \
              --timestamp \
              --sign "$CODESIGN_IDENTITY" \
              "package/$DMG_NAME"
            codesign --verify --verbose=2 "package/$DMG_NAME"
          else
            echo "DMG created in ad-hoc mode (not notarized)."
          fi

          echo "DMG info:"
          hdiutil imageinfo "package/$DMG_NAME" | head -80

      - name: Notarize and staple DMG when credentials exist
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          DMG="package/CHV-WiFi-24G-Stable-v1.9.4.dmg"

          if [ "${SIGNING_MODE:-adhoc}" != "developerid" ]; then
            echo "Skipping notarization: Developer ID certificate is not configured."
            echo "NOTARIZED=no" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "Skipping notarization: Apple notarization secrets are not configured."
            echo "NOTARIZED=no" >> "$GITHUB_ENV"
            exit 0
          fi

          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --timeout 30m

          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

          echo "NOTARIZED=yes" >> "$GITHUB_ENV"
          spctl --assess --type open --context context:primary-signature -vv "$DMG"

      - name: Smoke test bundle and DMG
        shell: bash
        run: |
          set -euo pipefail
          test -x "package/CHV WiFi.app/Contents/MacOS/CHV WiFi"
          test -s "package/CHV WiFi.app/Contents/Resources/CHVWiFi.icns"
          test -f "package/CHV WiFi.app/Contents/Resources/rtw88.kext/Contents/MacOS/rtw88"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion'             "package/CHV WiFi.app/Contents/Resources/rtw88.kext/Contents/Info.plist")" = "8.5.9"
          test -f "package/CHV-WiFi-24G-Stable-v1.9.4.dmg"

          file "package/CHV WiFi.app/Contents/MacOS/CHV WiFi"
          lipo -archs "package/CHV WiFi.app/Contents/MacOS/CHV WiFi"
          lipo "package/CHV WiFi.app/Contents/MacOS/CHV WiFi" -verify_arch x86_64 arm64

          ARCHS="$(lipo -archs "package/CHV WiFi.app/Contents/MacOS/CHV WiFi")"
          echo "Detected architectures: $ARCHS"
          echo "$ARCHS" | grep -qw x86_64
          echo "$ARCHS" | grep -qw arm64

          codesign --verify --deep --strict --verbose=2 "package/CHV WiFi.app"
          hdiutil verify "package/CHV-WiFi-24G-Stable-v1.9.4.dmg"

          if [ "${NOTARIZED:-no}" = "yes" ]; then
            xcrun stapler validate "package/CHV-WiFi-24G-Stable-v1.9.4.dmg"
            spctl --assess --type open --context context:primary-signature -vv "package/CHV-WiFi-24G-Stable-v1.9.4.dmg"
          else
            echo "Smoke test passed in ad-hoc/non-notarized mode."
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CHV-WiFi-24G-Stable-v1.9.4
          path: package
          if-no-files-found: error
