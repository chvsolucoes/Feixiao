name: Build HP256G8 RTL8821CE v8.5.6 Stable 5GHz 40MHz

"on":
  workflow_dispatch:

permissions:
  contents: read

env:
  FEIXIAO_REF: e963f43188382eced4ef2fa75d19ce4db2315c68
  RTW88_REF: d029a677c49266fad86750714eb5612becd134d3
  BUILD_NAME: Feixiao-HP256G8-v8.5.6-Stable-5GHz-40MHz

jobs:

  build:

    name: Build HP256G8 v8.5.6
    runs-on: macos-latest
    timeout-minutes: 30

    steps:

      # ================================================================
      # 01
      # CHECKOUT EXACT STABLE FEIXIAO BASE
      #
      # Same source base that produced the known-working v8.5.3.
      # ================================================================

      - name: Checkout exact stable Feixiao
        uses: actions/checkout@v4
        with:
          repository: thegwchr/Feixiao
          ref: ${{ env.FEIXIAO_REF }}
          path: Feixiao
          fetch-depth: 1
          submodules: recursive


      # ================================================================
      # 02
      # VALIDATE EXACT FEIXIAO COMMIT
      # ================================================================

      - name: Validate exact Feixiao revision
        shell: bash
        run: |
          set -eu

          ACTUAL="$(
            git \
              -C Feixiao \
              rev-parse HEAD
          )"

          echo
          echo "============================================================"
          echo "FEIXIAO SOURCE"
          echo "============================================================"
          echo

          echo "Expected:"
          echo "${FEIXIAO_REF}"

          echo
          echo "Actual:"
          echo "${ACTUAL}"

          if [ "${ACTUAL}" != "${FEIXIAO_REF}" ]; then
            echo
            echo "ERROR: wrong Feixiao source revision"
            exit 1
          fi

          echo
          echo "Feixiao stable source: OK"


      # ================================================================
      # 03
      # VALIDATE MACKERNELSDK
      # ================================================================

      - name: Validate MacKernelSDK
        shell: bash
        run: |
          set -eu

          if [ ! -d Feixiao/MacKernelSDK ]; then
            echo "ERROR: MacKernelSDK missing"
            exit 1
          fi

          if [ ! -d Feixiao/MacKernelSDK/Headers ]; then
            echo "ERROR: MacKernelSDK Headers missing"
            exit 1
          fi

          SDK_COMMIT="$(
            git \
              -C Feixiao/MacKernelSDK \
              rev-parse HEAD
          )"

          HEADER_COUNT="$(
            find \
              Feixiao/MacKernelSDK/Headers \
              -type f \
              | wc -l \
              | tr -d ' '
          )"

          echo
          echo "============================================================"
          echo "MACKERNELSDK"
          echo "============================================================"
          echo

          echo "Commit:"
          echo "${SDK_COMMIT}"

          echo
          echo "Headers:"
          echo "${HEADER_COUNT}"

          if [ "${HEADER_COUNT}" -lt 100 ]; then
            echo
            echo "ERROR: MacKernelSDK incomplete"
            exit 1
          fi

          echo
          echo "MacKernelSDK: OK"


      # ================================================================
      # 04
      # CLONE EXACT MATCHING RTW88-STABLE
      # ================================================================

      - name: Clone exact rtw88-stable
        shell: bash
        run: |
          set -eu

          rm -rf rtw88-stable

          git clone \
            https://github.com/thegwchr/rtw88-stable.git \
            rtw88-stable

          git \
            -C rtw88-stable \
            checkout \
            "${RTW88_REF}"

          ACTUAL="$(
            git \
              -C rtw88-stable \
              rev-parse HEAD
          )"

          echo
          echo "============================================================"
          echo "RTW88-STABLE"
          echo "============================================================"
          echo

          echo "Expected:"
          echo "${RTW88_REF}"

          echo
          echo "Actual:"
          echo "${ACTUAL}"

          if [ "${ACTUAL}" != "${RTW88_REF}" ]; then
            echo
            echo "ERROR: wrong rtw88-stable revision"
            exit 1
          fi

          echo
          echo "rtw88-stable: OK"


      # ================================================================
      # 05
      # VALIDATE REQUIRED SOURCE FILES
      # ================================================================

      - name: Validate required source files
        shell: bash
        run: |
          set -eu

          FILES="
          Feixiao/Makefile
          Feixiao/src/kext/RTW88PCIDevice.cpp
          Feixiao/src/kext/RTW88PCIDevice.hpp
          Feixiao/src/kext/RTW88IEEE80211.cpp
          Feixiao/src/kext/RTW88IEEE80211.hpp
          Feixiao/src/kext/RTW88UserClient.cpp
          Feixiao/src/kext/RTW88UserClient.hpp
          Feixiao/src/compat/rtw88_compat.c
          Feixiao/src/compat/rtw88_compat.h
          Feixiao/ctl/main.c
          rtw88-stable/drivers/net/wireless/realtek/rtw88/main.c
          rtw88-stable/drivers/net/wireless/realtek/rtw88/pci.c
          rtw88-stable/drivers/net/wireless/realtek/rtw88/rx.c
          rtw88-stable/drivers/net/wireless/realtek/rtw88/tx.c
          "

          echo
          echo "============================================================"
          echo "SOURCE FILES"
          echo "============================================================"
          echo

          for FILE in ${FILES}
          do

            if [ ! -f "${FILE}" ]; then
              echo "ERROR: missing ${FILE}"
              exit 1
            fi

            echo "[OK] ${FILE}"

          done


      # ================================================================
      # 06
      # VERIFY NO O2
      #
      # v8.5.6 intentionally goes back to the original v8.5.3 compiler
      # configuration.
      # ================================================================

      - name: Verify original stable compiler flags
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/Makefile"

          echo
          echo "============================================================"
          echo "COMPILER BASELINE"
          echo "============================================================"
          echo

          if grep -q \
            -- '-O2' \
            "${FILE}"
          then
            echo "ERROR: unexpected O2 optimization detected"
            exit 1
          fi

          if grep -q \
            -- '-O3' \
            "${FILE}"
          then
            echo "ERROR: unexpected O3 optimization detected"
            exit 1
          fi

          if grep -q \
            -- '-Ofast' \
            "${FILE}"
          then
            echo "ERROR: unexpected Ofast optimization detected"
            exit 1
          fi

          echo "Original v8.5.3 compiler behavior preserved."


      # ================================================================
      # 07
      # SNAPSHOT ALL CRITICAL SOURCE HASHES
      #
      # After the patch only RTW88IEEE80211.cpp may differ.
      # ================================================================

      - name: Snapshot stable source hashes
        shell: bash
        run: |
          set -eu

          FILES="
          Feixiao/src/kext/RTW88PCIDevice.cpp
          Feixiao/src/kext/RTW88PCIDevice.hpp
          Feixiao/src/kext/RTW88IEEE80211.hpp
          Feixiao/src/kext/RTW88UserClient.cpp
          Feixiao/src/kext/RTW88UserClient.hpp
          Feixiao/src/compat/rtw88_compat.c
          Feixiao/src/compat/rtw88_compat.h
          rtw88-stable/drivers/net/wireless/realtek/rtw88/main.c
          rtw88-stable/drivers/net/wireless/realtek/rtw88/pci.c
          rtw88-stable/drivers/net/wireless/realtek/rtw88/rx.c
          rtw88-stable/drivers/net/wireless/realtek/rtw88/tx.c
          "

          rm -f /tmp/v856-unchanged-before.sha256

          for FILE in ${FILES}
          do
            shasum \
              -a 256 \
              "${FILE}" \
              >> /tmp/v856-unchanged-before.sha256
          done

          echo
          echo "Stable source hashes saved."


      # ================================================================
      # 08
      # VALIDATE STABLE RX PATH
      #
      # DO NOT repeat v8.6.3.
      # ================================================================

      - name: Validate stable RX path
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/src/kext/RTW88PCIDevice.cpp"

          grep -q \
            '_iface->inputPacket(m, 0, IONetworkInterface::kInputOptionQueuePacket);' \
            "${FILE}"

          grep -q \
            '_iface->flushInputQueue();' \
            "${FILE}"

          grep -q \
            'mbuf_pkthdr_len' \
            "${FILE}"

          grep -q \
            'mbuf_len' \
            "${FILE}"

          grep -q \
            'dropping bogus mbuf' \
            "${FILE}"

          if grep -q \
            'flushRxQueue' \
            "${FILE}"
          then
            echo "ERROR: unsafe RX batching detected"
            exit 1
          fi

          echo
          echo "============================================================"
          echo "RX"
          echo "============================================================"
          echo

          echo "Per-packet input flush : preserved"
          echo "mbuf validation        : preserved"
          echo "RX batching            : ABSENT"


      # ================================================================
      # 09
      # VALIDATE STABLE DMA
      # ================================================================

      - name: Validate stable DMA
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/src/kext/RTW88PCIDevice.cpp"

          grep -q \
            'compat_dma_map' \
            "${FILE}"

          grep -q \
            'compat_dma_unmap' \
            "${FILE}"

          grep -q \
            'compat_dma_sync_cpu' \
            "${FILE}"

          grep -q \
            'syncBounceForCpu' \
            "${FILE}"

          echo
          echo "============================================================"
          echo "DMA"
          echo "============================================================"
          echo

          echo "DMA implementation: UNCHANGED"


      # ================================================================
      # 10
      # VALIDATE STABLE TX THRESHOLDS
      # ================================================================

      - name: Validate stable TX thresholds
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/src/kext/RTW88PCIDevice.cpp"

          grep -q \
            'kRTW88TxStallAvail = 96;' \
            "${FILE}"

          grep -q \
            'kRTW88TxResumeAvail = 160;' \
            "${FILE}"

          echo
          echo "============================================================"
          echo "TX"
          echo "============================================================"
          echo

          echo "Stall : 96"
          echo "Resume: 160"
          echo
          echo "Original stable thresholds preserved."


      # ================================================================
      # 11
      # VALIDATE SAFE WATCHDOG
      #
      # DO NOT repeat v8.6.2.
      # ================================================================

      - name: Validate stable watchdog
        shell: bash
        run: |
          set -eu

          COMPAT="Feixiao/src/compat/rtw88_compat.c"
          MAIN="rtw88-stable/drivers/net/wireless/realtek/rtw88/main.c"

          grep -q \
            'bool rtw88_disable_watchdog_work = true;' \
            "${COMPAT}"

          grep -q \
            'if (rtw88_disable_watchdog_work)' \
            "${MAIN}"

          if grep -A 2 \
            'if (rtw88_disable_watchdog_work)' \
            "${MAIN}" \
            | grep \
              'rtw_hci_dynamic_rx_agg(rtwdev, true);' \
              > /dev/null
          then
            echo "ERROR: forced dynamic RX aggregation detected"
            exit 1
          fi

          echo
          echo "============================================================"
          echo "WATCHDOG"
          echo "============================================================"
          echo

          echo "RF dynamic watchdog      : safe bypass"
          echo "Forced dynamic RX agg    : ABSENT"


      # ================================================================
      # 12
      # VALIDATE 2.4 GHZ / 5 GHZ CODE
      # ================================================================

      - name: Validate channel-width source
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          echo
          echo "============================================================"
          echo "ORIGINAL CHANNEL-WIDTH LOGIC"
          echo "============================================================"
          echo

          grep -q \
            '_connChanWidth = 20;' \
            "${FILE}"

          grep -q \
            '_connChanWidth = 40;' \
            "${FILE}"

          grep -q \
            '_connChanWidth = 80;' \
            "${FILE}"

          grep -q \
            'NL80211_CHAN_WIDTH_40' \
            "${FILE}"

          grep -q \
            'NL80211_CHAN_WIDTH_80' \
            "${FILE}"

          grep -q \
            'chip40 && htStaWidth' \
            "${FILE}"

          grep -q \
            'chip80 && vhtWidth == 1 && vhtSeg0 != 0' \
            "${FILE}"

          echo "20 MHz path: present"
          echo "40 MHz path: present"
          echo "80 MHz path: present before patch"


      # ================================================================
      # 13
      #
      # THE ONLY DRIVER CHANGE IN V8.5.6
      #
      # Disable ONLY the 80 MHz override.
      #
      # ORIGINAL:
      #
      # if (chip80 && vhtWidth == 1 && vhtSeg0 != 0) {
      #
      # V8.5.6:
      #
      # if (false && chip80 && vhtWidth == 1 && vhtSeg0 != 0) {
      #
      # Result:
      #
      # 20 MHz still works.
      # 40 MHz still works.
      # VHT capabilities still exist.
      # 80 MHz PHY retune is not entered.
      #
      # ================================================================

      - name: Cap 5GHz connection width at 40 MHz
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          echo
          echo "============================================================"
          echo "V8.5.6 SAFE 5GHZ 40 MHZ"
          echo "============================================================"
          echo

          OLD='if (chip80 && vhtWidth == 1 && vhtSeg0 != 0) {'
          NEW='if (false && chip80 && vhtWidth == 1 && vhtSeg0 != 0) {'

          OLD_COUNT="$(
            grep -F \
              -c \
              "${OLD}" \
              "${FILE}" \
              || true
          )"

          echo "Original VHT80 override count: ${OLD_COUNT}"

          if [ "${OLD_COUNT}" -ne 1 ]; then
            echo
            echo "ERROR:"
            echo "Expected exactly one VHT80 override."
            exit 1
          fi

          sed -i '' \
            's/if (chip80 && vhtWidth == 1 && vhtSeg0 != 0) {/if (false \&\& chip80 \&\& vhtWidth == 1 \&\& vhtSeg0 != 0) {/' \
            "${FILE}"

          NEW_COUNT="$(
            grep -F \
              -c \
              "${NEW}" \
              "${FILE}" \
              || true
          )"

          OLD_REMAINING="$(
            grep -F \
              -c \
              "${OLD}" \
              "${FILE}" \
              || true
          )"

          echo "Safe 40 MHz guard count : ${NEW_COUNT}"
          echo "Old VHT80 blocks left   : ${OLD_REMAINING}"

          if [ "${NEW_COUNT}" -ne 1 ]; then
            echo
            echo "ERROR: safe 40 MHz guard was not applied"
            exit 1
          fi

          if [ "${OLD_REMAINING}" -ne 0 ]; then
            echo
            echo "ERROR: original active VHT80 condition remains"
            exit 1
          fi

          echo
          echo "VHT80 PHY retune disabled."
          echo "HT/VHT 40 MHz path preserved."


      # ================================================================
      # 14
      # VERIFY 40 MHZ PATH REMAINS ACTIVE
      # ================================================================

      - name: Validate active 40 MHz path
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          grep -q \
            'if (chip40 && htStaWidth && (sco == 1 || sco == 3)) {' \
            "${FILE}"

          grep -q \
            '_connChanWidth = 40;' \
            "${FILE}"

          grep -q \
            '_hw->conf.chandef.width = NL80211_CHAN_WIDTH_40;' \
            "${FILE}"

          echo
          echo "============================================================"
          echo "40 MHZ PATH"
          echo "============================================================"
          echo

          echo "HT/VHT 40 MHz configuration remains ACTIVE."


      # ================================================================
      # 15
      # VERIFY VHT CAPABILITIES WERE NOT REMOVED
      #
      # We are only capping the channel width.
      # ================================================================

      - name: Validate VHT capability remains available
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          grep -q \
            'WLAN_EID_VHT_CAPABILITY' \
            "${FILE}"

          grep -q \
            'vht_cap.vht_supported' \
            "${FILE}"

          grep -q \
            '_sta->deflink.vht_cap = sband->vht_cap;' \
            "${FILE}"

          echo
          echo "VHT capability advertisement: PRESERVED"


      # ================================================================
      # 16
      # VERIFY A-MPDU / BLOCKACK
      # ================================================================

      - name: Validate stable A-MPDU
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          grep -q \
            'startTxAggregation' \
            "${FILE}"

          grep -q \
            'sendAddbaRequest' \
            "${FILE}"

          grep -q \
            'sendAddbaResponse' \
            "${FILE}"

          grep -q \
            'handleBackAction' \
            "${FILE}"

          grep -q \
            '_txBaActive' \
            "${FILE}"

          grep -q \
            'rxReorderInput' \
            "${FILE}"

          echo
          echo "A-MPDU / BlockAck implementation: PRESERVED"


      # ================================================================
      # 17
      # VERIFY WPA2 UNCHANGED
      # ================================================================

      - name: Validate WPA2 path
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          grep -q \
            'derivePMK' \
            "${FILE}"

          grep -q \
            'derivePTK' \
            "${FILE}"

          grep -q \
            'handleEAPOL' \
            "${FILE}"

          grep -q \
            'installKey' \
            "${FILE}"

          grep -q \
            'WPA2 connected' \
            "${FILE}"

          echo
          echo "WPA2 path: PRESERVED"


      # ================================================================
      # 18
      # VERIFY RATE ADAPTATION
      # ================================================================

      - name: Validate firmware rate adaptation
        shell: bash
        run: |
          set -eu

          COMPAT="Feixiao/src/compat/rtw88_compat.c"
          MAIN="rtw88-stable/drivers/net/wireless/realtek/rtw88/main.c"

          grep -q \
            'fix_rate = 0xFF' \
            "${COMPAT}"

          grep -q \
            'RA_MASK_VHT_RATES_1SS' \
            "${MAIN}"

          grep -q \
            'RTW_RATEID_ARFR1_AC_1SS' \
            "${MAIN}"

          echo
          echo "============================================================"
          echo "RATE ADAPTATION"
          echo "============================================================"
          echo

          echo "Firmware RA: preserved"
          echo "VHT 1SS RA : preserved"


      # ================================================================
      # 19
      # VERIFY ONLY ONE FEIXIAO SOURCE FILE CHANGED
      # ================================================================

      - name: Validate patch scope
        shell: bash
        run: |
          set -eu

          cd Feixiao

          echo
          echo "============================================================"
          echo "MODIFIED SOURCE FILES"
          echo "============================================================"
          echo

          git diff \
            --name-only

          MODIFIED_COUNT="$(
            git diff \
              --name-only \
              | wc -l \
              | tr -d ' '
          )"

          MODIFIED="$(
            git diff \
              --name-only
          )"

          if [ "${MODIFIED_COUNT}" -ne 1 ]; then
            echo
            echo "ERROR:"
            echo "Expected exactly one modified Feixiao file."
            exit 1
          fi

          if [ "${MODIFIED}" != "src/kext/RTW88IEEE80211.cpp" ]; then
            echo
            echo "ERROR:"
            echo "Unexpected file was modified:"
            echo "${MODIFIED}"
            exit 1
          fi

          echo
          echo "Patch scope: EXACTLY ONE DRIVER FILE"


      # ================================================================
      # 20
      # VERIFY ALL OTHER CRITICAL FILES ARE BYTE-FOR-BYTE IDENTICAL
      # ================================================================

      - name: Verify all other stable source unchanged
        shell: bash
        run: |
          set -eu

          FILES="
          Feixiao/src/kext/RTW88PCIDevice.cpp
          Feixiao/src/kext/RTW88PCIDevice.hpp
          Feixiao/src/kext/RTW88IEEE80211.hpp
          Feixiao/src/kext/RTW88UserClient.cpp
          Feixiao/src/kext/RTW88UserClient.hpp
          Feixiao/src/compat/rtw88_compat.c
          Feixiao/src/compat/rtw88_compat.h
          rtw88-stable/drivers/net/wireless/realtek/rtw88/main.c
          rtw88-stable/drivers/net/wireless/realtek/rtw88/pci.c
          rtw88-stable/drivers/net/wireless/realtek/rtw88/rx.c
          rtw88-stable/drivers/net/wireless/realtek/rtw88/tx.c
          "

          rm -f /tmp/v856-unchanged-after.sha256

          for FILE in ${FILES}
          do
            shasum \
              -a 256 \
              "${FILE}" \
              >> /tmp/v856-unchanged-after.sha256
          done

          if ! cmp \
            -s \
            /tmp/v856-unchanged-before.sha256 \
            /tmp/v856-unchanged-after.sha256
          then

            echo
            echo "ERROR:"
            echo "A protected stable source file changed."

            echo
            echo "BEFORE:"
            cat /tmp/v856-unchanged-before.sha256

            echo
            echo "AFTER:"
            cat /tmp/v856-unchanged-after.sha256

            exit 1

          fi

          echo
          echo "============================================================"
          echo "STABILITY VALIDATION"
          echo "============================================================"
          echo

          echo "RX       : byte-for-byte original"
          echo "DMA      : byte-for-byte original"
          echo "TX       : byte-for-byte original"
          echo "Watchdog : byte-for-byte original"
          echo "UserClient: byte-for-byte original"
          echo
          echo "Only VHT80 selection condition changed."


      # ================================================================
      # 21
      # SHOW EXACT SOURCE DIFF
      # ================================================================

      - name: Show v8.5.6 source change
        shell: bash
        run: |
          set -eu

          echo
          echo "============================================================"
          echo "V8.5.6 EXACT DIFF"
          echo "============================================================"
          echo

          git \
            -C Feixiao \
            diff \
            -- \
            src/kext/RTW88IEEE80211.cpp


      # ================================================================
      # 22
      # DOWNLOAD REALTEK FIRMWARE
      # ================================================================

      - name: Download Realtek firmware
        shell: bash
        run: |
          set -eu

          cd Feixiao/firmware

          FIRMWARE_FILES="
          rtw8822b_fw.bin
          rtw8822c_fw.bin
          rtw8821c_fw.bin
          rtw8821a_fw.bin
          rtw8812a_fw.bin
          rtw8814a_fw.bin
          "

          for FW in ${FIRMWARE_FILES}
          do

            if [ ! -s "${FW}" ]; then

              echo
              echo "Downloading ${FW}"

              curl \
                --location \
                --fail \
                --retry 3 \
                --retry-delay 2 \
                "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtw88/${FW}" \
                --output "${FW}"

            fi

            if [ ! -s "${FW}" ]; then
              echo
              echo "ERROR: firmware missing:"
              echo "${FW}"
              exit 1
            fi

            echo "[OK] ${FW}"
            ls -lh "${FW}"

          done


      # ================================================================
      # 23
      # VALIDATE RTL8821C FIRMWARE
      # ================================================================

      - name: Validate RTL8821C firmware
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/firmware/rtw8821c_fw.bin"

          if [ ! -s "${FILE}" ]; then
            echo
            echo "ERROR: RTL8821C firmware missing"
            exit 1
          fi

          SIZE="$(
            stat \
              -f "%z" \
              "${FILE}"
          )"

          echo
          echo "RTL8821C firmware:"
          echo "${SIZE} bytes"

          if [ "${SIZE}" -lt 50000 ]; then
            echo
            echo "ERROR: suspicious RTL8821C firmware size"
            exit 1
          fi

          echo
          echo "RTL8821C firmware: OK"


      # ================================================================
      # 24
      # SHOW BUILD ENVIRONMENT
      # ================================================================

      - name: Show build environment
        shell: bash
        run: |
          set -eu

          echo
          echo "============================================================"
          echo "MACOS"
          echo "============================================================"

          sw_vers

          echo
          echo "============================================================"
          echo "XCODE"
          echo "============================================================"

          xcodebuild -version

          echo
          echo "============================================================"
          echo "CLANG"
          echo "============================================================"

          clang --version

          echo
          echo "============================================================"
          echo "MACKERNELSDK"
          echo "============================================================"

          git \
            -C Feixiao/MacKernelSDK \
            rev-parse HEAD


      # ================================================================
      # 25
      # CLEAN BUILD
      # ================================================================

      - name: Clean previous build
        shell: bash
        working-directory: Feixiao
        run: |
          set -eu

          make clean || true

          rm -rf \
            build/out \
            || true

          echo
          echo "Clean: OK"


      # ================================================================
      # 26
      # BUILD V8.5.6
      # ================================================================

      - name: Build HP256G8 v8.5.6
        shell: bash
        working-directory: Feixiao
        run: |
          set -eu

          echo
          echo "============================================================"
          echo "HP 256 G8"
          echo "REALTEK RTL8821CE"
          echo "V8.5.6 STABLE 5GHZ 40MHZ"
          echo "============================================================"
          echo

          echo "Base                  : v8.5.3 stable"
          echo "Compiler              : original stable flags"
          echo "2.4 GHz               : unchanged"
          echo "5 GHz                 : enabled"
          echo "20 MHz                : enabled"
          echo "40 MHz                : enabled"
          echo "80 MHz PHY retune     : disabled"
          echo "VHT capability        : preserved"
          echo "Firmware RA           : preserved"
          echo "A-MPDU                : preserved"
          echo "RX path               : unchanged"
          echo "DMA                   : unchanged"
          echo "TX thresholds         : 96 / 160"
          echo "Watchdog              : unchanged"
          echo "Forced dynamic RX agg : disabled"
          echo "RX batching           : disabled"
          echo

          make all


      # ================================================================
      # 27
      # VALIDATE EMBEDDED FIRMWARE SOURCE
      # ================================================================

      - name: Validate embedded firmware source
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/src/compat/fw_blobs.c"

          if [ ! -s "${FILE}" ]; then
            echo
            echo "ERROR: fw_blobs.c missing"
            exit 1
          fi

          SIZE="$(
            stat \
              -f "%z" \
              "${FILE}"
          )"

          echo
          echo "fw_blobs.c:"
          echo "${SIZE} bytes"

          if [ "${SIZE}" -lt 10000 ]; then
            echo
            echo "ERROR: firmware source unexpectedly small"
            exit 1
          fi


      # ================================================================
      # 28
      # VERIFY BUILD OUTPUT
      # ================================================================

      - name: Verify v8.5.6 build output
        shell: bash
        run: |
          set -eu

          KEXT="Feixiao/build/out/rtw88.kext"
          CTL="Feixiao/build/out/rtw88ctl"

          test -d \
            "${KEXT}"

          test -f \
            "${KEXT}/Contents/Info.plist"

          test -f \
            "${KEXT}/Contents/MacOS/rtw88"

          test -f \
            "${CTL}"

          echo
          echo "rtw88.kext: OK"
          echo "rtw88ctl : OK"


      # ================================================================
      # 29
      # VALIDATE INFO.PLIST
      # ================================================================

      - name: Validate Info.plist
        shell: bash
        run: |
          set -eu

          PLIST="Feixiao/build/out/rtw88.kext/Contents/Info.plist"

          plutil \
            -lint \
            "${PLIST}"

          echo
          echo "Bundle identifier:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "${PLIST}"


      # ================================================================
      # 30
      # VALIDATE MACH-O
      # ================================================================

      - name: Validate Mach-O binaries
        shell: bash
        run: |
          set -eu

          BIN="Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88"
          CTL="Feixiao/build/out/rtw88ctl"

          echo
          echo "Kext:"
          file "${BIN}"

          echo
          echo "Kext UUID:"
          dwarfdump \
            --uuid \
            "${BIN}"

          echo
          echo "rtw88ctl:"
          file "${CTL}"


      # ================================================================
      # 31
      # VALIDATE IMPORTANT BINARY MARKERS
      #
      # Write strings to a file first to avoid the Xcode 26
      # "failed to flush output" problem.
      # ================================================================

      - name: Validate binary markers
        shell: bash
        run: |
          set -eu

          BIN="Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88"
          STRINGS_FILE="${RUNNER_TEMP}/rtw88-v856-strings.txt"

          strings \
            "${BIN}" \
            > "${STRINGS_FILE}"

          if [ ! -s "${STRINGS_FILE}" ]; then
            echo
            echo "ERROR: strings extraction failed"
            exit 1
          fi

          echo
          echo "============================================================"
          echo "BINARY MARKERS"
          echo "============================================================"
          echo

          for MARKER in \
            "RTL8821CE" \
            "connected chandef" \
            "WPA2 connected" \
            "dropping bogus mbuf"
          do

            if grep -F \
              "${MARKER}" \
              "${STRINGS_FILE}" \
              > /dev/null
            then

              echo "[OK] ${MARKER}"

            else

              echo "ERROR: missing marker:"
              echo "${MARKER}"
              exit 1

            fi

          done


      # ================================================================
      # 32
      # CREATE TEST DIAGNOSTIC SCRIPT
      # ================================================================

      - name: Create v8.5.6 diagnostic script
        shell: bash
        run: |
          set -eu

          mkdir -p diagnostic

          cat > diagnostic/test-v856.sh <<'TEST'
          #!/bin/bash

          set -u

          CTL="${1:-./rtw88ctl}"

          echo
          echo "============================================================"
          echo "RTL8821CE V8.5.6 5GHZ 40MHZ TEST"
          echo "============================================================"
          echo

          echo "Current status:"
          echo

          "${CTL}" status || true

          echo
          echo "------------------------------------------------------------"
          echo "RTW88 KEXT"
          echo "------------------------------------------------------------"
          echo

          kmutil showloaded 2>/dev/null \
            | grep -i rtw88 \
            || true

          echo
          echo "------------------------------------------------------------"
          echo "CONNECTED CHANNEL WIDTH"
          echo "------------------------------------------------------------"
          echo

          log show \
            --last 10m \
            --style compact \
            --predicate \
            'process == "kernel"' \
            2>/dev/null \
            | grep -i \
              'connected chandef' \
            | tail -50 \
            || true

          echo
          echo "------------------------------------------------------------"
          echo "DISCONNECT EVENTS"
          echo "------------------------------------------------------------"
          echo

          log show \
            --last 10m \
            --style compact \
            --predicate \
            'process == "kernel"' \
            2>/dev/null \
            | grep -Ei \
              'rtw88.*(deauth|disassoc|reason=|EAPOL|WPA2|assoc|auth)' \
            | tail -200 \
            || true

          echo
          echo "------------------------------------------------------------"
          echo "PCI / DMA"
          echo "------------------------------------------------------------"
          echo

          log show \
            --last 10m \
            --style compact \
            --predicate \
            'process == "kernel"' \
            2>/dev/null \
            | grep -Ei \
              'rtw88.*(pci|dma|timeout|ring|descriptor|stall)' \
            | tail -200 \
            || true

          echo
          echo "============================================================"
          echo "END"
          echo "============================================================"
          TEST

          chmod +x \
            diagnostic/test-v856.sh

          bash -n \
            diagnostic/test-v856.sh

          echo
          echo "test-v856.sh: OK"


      # ================================================================
      # 33
      # PREPARE ARTIFACT
      # ================================================================

      - name: Prepare v8.5.6 artifact
        shell: bash
        run: |
          set -eu

          OUT="${RUNNER_TEMP}/${BUILD_NAME}"

          rm -rf \
            "${OUT}"

          mkdir -p \
            "${OUT}"

          cp -R \
            Feixiao/build/out/rtw88.kext \
            "${OUT}/"

          cp \
            Feixiao/build/out/rtw88ctl \
            "${OUT}/"

          chmod +x \
            "${OUT}/rtw88ctl"

          cp \
            diagnostic/test-v856.sh \
            "${OUT}/"

          chmod +x \
            "${OUT}/test-v856.sh"


      # ================================================================
      # 34
      # BUILD INFORMATION
      # ================================================================

      - name: Create v8.5.6 build information
        shell: bash
        run: |
          set -eu

          OUT="${RUNNER_TEMP}/${BUILD_NAME}"

          FEIXIAO_HASH="$(
            git \
              -C Feixiao \
              rev-parse HEAD
          )"

          RTW88_HASH="$(
            git \
              -C rtw88-stable \
              rev-parse HEAD
          )"

          SDK_HASH="$(
            git \
              -C Feixiao/MacKernelSDK \
              rev-parse HEAD
          )"

          UUID="$(
            dwarfdump \
              --uuid \
              Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88 \
              | awk '{print $2}' \
              | head -1
          )"

          cat > "${OUT}/BUILD-INFO.txt" <<EOF
          ============================================================
          HP 256 G8
          REALTEK RTL8821CE
          V8.5.6 STABLE 5GHZ 40MHZ
          ============================================================


          SOURCE BASE
          ============================================================

          Feixiao:
          ${FEIXIAO_HASH}

          rtw88-stable:
          ${RTW88_HASH}

          MacKernelSDK:
          ${SDK_HASH}

          Kext UUID:
          ${UUID}


          REASON FOR THIS VERSION
          ============================================================

          2.4 GHz remains connected.

          5 GHz associates successfully with strong RSSI but then
          returns to idle.

          This strongly suggests investigating the 5 GHz wide-channel
          path separately from the stable RX/DMA implementation.


          ONLY DRIVER MODIFICATION
          ============================================================

          Original:

          if (chip80 && vhtWidth == 1 && vhtSeg0 != 0)

          v8.5.6:

          if (false && chip80 && vhtWidth == 1 && vhtSeg0 != 0)


          RESULT
          ============================================================

          20 MHz:
          enabled

          40 MHz:
          enabled

          80 MHz PHY retune:
          disabled

          VHT capability:
          preserved


          STABILITY BASELINE
          ============================================================

          Compiler:
          original v8.5.3 flags

          -O2:
          NOT USED

          RX:
          unchanged

          RX batching:
          disabled

          per-packet flushInputQueue:
          preserved

          mbuf protection:
          preserved

          DMA:
          unchanged

          bounce DMA:
          unchanged

          TX:
          unchanged

          TX stall:
          96

          TX resume:
          160

          RF watchdog:
          original stable bypass

          forced dynamic RX aggregation:
          disabled

          WPA2:
          unchanged

          A-MPDU:
          unchanged

          BlockAck:
          unchanged

          Firmware rate adaptation:
          unchanged


          PURPOSE
          ============================================================

          Determine whether the unstable 5 GHz connection is caused
          specifically by entering the 80 MHz channel configuration.


          EXPECTED TEST
          ============================================================

          Connect to the 5 GHz SSID.

          Verify that the connection remains up for at least several
          minutes.

          If stable, perform Speedtest.

          The 40 MHz configuration can potentially exceed 100 Mbps
          depending on negotiated VHT/HT rate, AP, signal, interference
          and driver efficiency, but this is not guaranteed.


          FALLBACK
          ============================================================

          Keep the known-working v8.5.3 available.

          If v8.5.6 produces instability, revert immediately.
          EOF


      # ================================================================
      # 35
      # CREATE TEST INSTRUCTIONS
      # ================================================================

      - name: Create v8.5.6 test instructions
        shell: bash
        run: |
          set -eu

          OUT="${RUNNER_TEMP}/${BUILD_NAME}"

          cat > "${OUT}/TESTE.txt" <<'EOF'
          ============================================================
          V8.5.6 - TESTE 5 GHZ 40 MHZ
          ============================================================


          1. BACKUP
          ============================================================

          Guarde a rtw88.kext v8.5.3.


          2. INSTALAÇÃO
          ============================================================

          Substitua somente:

          EFI/OC/Kexts/rtw88.kext


          Não deixe duas rtw88.kext na pasta.


          Utilize o rtw88ctl deste mesmo pacote.


          Reinicie o macOS.


          3. CONFIRMAR KEXT
          ============================================================

          Execute:

          kmutil showloaded | grep -i rtw88


          Depois:

          ./rtw88ctl status


          4. CONECTAR NO 5 GHZ
          ============================================================

          Faça scan:

          ./rtw88ctl scan


          Depois conecte no SSID 5 GHz.


          Não repita o comando connect várias vezes.


          5. CONFIRMAR STATUS
          ============================================================

          Espere 10 segundos.

          Execute:

          ./rtw88ctl status


          Espere 60 segundos.

          Execute novamente:

          ./rtw88ctl status


          O objetivo é verificar se continua:

          State: connected


          6. TESTE DE ESTABILIDADE
          ============================================================

          Deixe conectado por pelo menos 5 minutos.

          Navegue normalmente.


          7. DIAGNÓSTICO
          ============================================================

          Execute:

          sudo ./test-v856.sh ./rtw88ctl


          8. SPEEDTEST
          ============================================================

          Somente se o 5 GHz continuar estável:

          Faça um Speedtest completo.


          Anote:

          download
          upload
          ping


          9. RESULTADO ESPERADO
          ============================================================

          Se o 5 GHz deixar de desconectar nesta versão, teremos uma
          forte indicação de que a instabilidade anterior estava ligada
          ao caminho de 80 MHz.


          IMPORTANTE
          ============================================================

          Esta versão NÃO contém:

          dynamic RX aggregation da v8.6.2

          RX batching da v8.6.3

          TX 64/128

          alterações de DMA

          compilação -O2


          O datapath permanece baseado na v8.5.3 estável.
          EOF


      # ================================================================
      # 36
      # SHA256
      # ================================================================

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -eu

          OUT="${RUNNER_TEMP}/${BUILD_NAME}"

          cd "${OUT}"

          shasum \
            -a 256 \
            rtw88ctl \
            test-v856.sh \
            > SHA256SUMS.txt

          find \
            rtw88.kext \
            -type f \
            -exec shasum -a 256 {} \; \
            >> SHA256SUMS.txt

          echo
          cat SHA256SUMS.txt


      # ================================================================
      # 37
      # PACKAGE ZIP
      # ================================================================

      - name: Package HP256G8 v8.5.6
        shell: bash
        run: |
          set -eu

          cd "${RUNNER_TEMP}"

          ZIP="Feixiao_HP256G8_v8_5_6_Stable_5GHz_40MHz.zip"

          rm -f \
            "${ZIP}"

          zip \
            -r \
            "${ZIP}" \
            "${BUILD_NAME}"

          echo
          echo "============================================================"
          echo "V8.5.6 PACKAGE"
          echo "============================================================"
          echo

          ls -lh \
            "${ZIP}"


      # ================================================================
      # 38
      # UPLOAD ARTIFACT
      # ================================================================

      - name: Upload HP256G8 v8.5.6 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Feixiao-HP256G8-v8.5.6-Stable-5GHz-40MHz
          path: ${{ runner.temp }}/Feixiao_HP256G8_v8_5_6_Stable_5GHz_40MHz.zip
          if-no-files-found: error
          retention-days: 7
