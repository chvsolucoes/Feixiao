name: RTW88 v9.0.2 Tahoe IO80211 ABI Probe

"on":
  workflow_dispatch:

permissions:
  contents: read

env:
  FEIXIAO_REF: e963f43188382eced4ef2fa75d19ce4db2315c68
  ITLWM_REF: 53c51c2cdd6e4b69beb91f310d74c53422b0f8bd
  EXPECTED_TAHOE_IO80211_ENTRIES: "463"
  OLD_RTW88_ENTRIES: "457"

jobs:
  abi-probe:
    name: Probe Tahoe IO80211 ABI
    runs-on: macos-latest
    timeout-minutes: 20

    steps:

      - name: Checkout stable Feixiao
        uses: actions/checkout@v4
        with:
          repository: thegwchr/Feixiao
          ref: ${{ env.FEIXIAO_REF }}
          path: Feixiao
          fetch-depth: 1
          submodules: recursive

      - name: Checkout AirportItlwm reference headers
        uses: actions/checkout@v4
        with:
          repository: OpenIntelWireless/itlwm
          ref: ${{ env.ITLWM_REF }}
          path: itlwm
          fetch-depth: 1

      - name: Validate source revisions
        shell: bash
        run: |
          set -eu

          F="$(git -C Feixiao rev-parse HEAD)"
          I="$(git -C itlwm rev-parse HEAD)"

          echo "Feixiao expected : ${FEIXIAO_REF}"
          echo "Feixiao actual   : ${F}"
          echo
          echo "itlwm expected   : ${ITLWM_REF}"
          echo "itlwm actual     : ${I}"

          [ "${F}" = "${FEIXIAO_REF}" ]
          [ "${I}" = "${ITLWM_REF}" ]

      - name: Validate legacy and V2 IO80211 headers
        shell: bash
        run: |
          set -eu

          LEGACY="Feixiao/MacKernelSDK/Headers/IOKit/80211/IO80211Controller.h"
          V2="itlwm/include/Airport/IO80211ControllerV2.h"

          test -f "${LEGACY}"
          test -f "${V2}"

          echo "============================================================"
          echo "LEGACY MACKERNELSDK HEADER"
          echo "============================================================"

          grep -n \
            'class IO80211Controller : public IOEthernetController' \
            "${LEGACY}"

          echo
          echo "============================================================"
          echo "AIRPORTITLWM V2 HEADER"
          echo "============================================================"

          grep -n \
            'class IO80211Controller : public IOEthernetController' \
            "${V2}"

          echo
          echo "V2 methods relevant to newer ABI:"
          grep -nE \
            'getFeatures|newVendorString|newModelString|setHardwareAddress|setMulticastMode|setPromiscuousMode|isCommandProhibited|createWorkQueue|getWorkQueue|getIO80211CommandGate|handleCardSpecific|getDRIVER_VERSION|getHARDWARE_VERSION|getCARD_CAPABILITIES|getPOWER|setPOWER|wasDynSARInFailSafeMode|updateAdvisoryScoresIfNeed|getAVCAdvisoryInfo|postMessage|setMulticastList' \
            "${V2}" \
            || true

      - name: Produce structural ABI comparison
        shell: bash
        run: |
          set -eu

          LEGACY="Feixiao/MacKernelSDK/Headers/IOKit/80211/IO80211Controller.h"
          V2="itlwm/include/Airport/IO80211ControllerV2.h"
          OUT="${RUNNER_TEMP}/io80211-abi-comparison.txt"

          {
            echo "RTW88 v9.0.2 Tahoe IO80211 ABI Probe"
            echo
            echo "Observed on target Tahoe system:"
            echo "  IO80211Controller runtime vtable entries : ${EXPECTED_TAHOE_IO80211_ENTRIES}"
            echo "  v9.0.1d RTW88PCIDevice entries           : ${OLD_RTW88_ENTRIES}"
            echo "  Difference                               : $((EXPECTED_TAHOE_IO80211_ENTRIES - OLD_RTW88_ENTRIES))"
            echo
            echo "Legacy MacKernelSDK virtual declarations:"
            grep -E '^[[:space:]]*virtual ' "${LEGACY}" | wc -l | tr -d ' '
            echo
            echo "AirportItlwm V2 virtual declarations:"
            grep -E '^[[:space:]]*virtual ' "${V2}" | wc -l | tr -d ' '
            echo
            echo "============================================================"
            echo "LEGACY VIRTUAL METHODS"
            echo "============================================================"
            grep -E '^[[:space:]]*virtual ' "${LEGACY}" || true
            echo
            echo "============================================================"
            echo "V2 VIRTUAL METHODS"
            echo "============================================================"
            grep -E '^[[:space:]]*virtual ' "${V2}" || true
          } > "${OUT}"

          cat "${OUT}"

      - name: List virtual methods present in V2 but absent from legacy header
        shell: bash
        run: |
          set -eu

          LEGACY="Feixiao/MacKernelSDK/Headers/IOKit/80211/IO80211Controller.h"
          V2="itlwm/include/Airport/IO80211ControllerV2.h"

          normalize() {
            sed \
              -e 's/APPLE_KEXT_OVERRIDE//g' \
              -e 's/[[:space:]]\+/ /g' \
              -e 's/^[[:space:]]*//' \
              -e 's/[[:space:]]*$//' \
              -e 's/{.*$//' \
              -e 's/= 0;//' \
              -e 's/;$//' \
              "$1" \
              | grep '^virtual ' \
              | sort -u
          }

          normalize "${LEGACY}" > "${RUNNER_TEMP}/legacy-virtual.txt"
          normalize "${V2}" > "${RUNNER_TEMP}/v2-virtual.txt"

          echo "============================================================"
          echo "V2-ONLY VIRTUAL DECLARATIONS"
          echo "============================================================"

          comm \
            -13 \
            "${RUNNER_TEMP}/legacy-virtual.txt" \
            "${RUNNER_TEMP}/v2-virtual.txt" \
            | tee "${RUNNER_TEMP}/v2-only-methods.txt"

          echo
          echo "Count:"
          wc -l "${RUNNER_TEMP}/v2-only-methods.txt"

      - name: Create local Tahoe runtime probe script
        shell: bash
        run: |
          set -eu

          OUT="${RUNNER_TEMP}/probe-tahoe-io80211.sh"

          cat > "${OUT}" <<'EOF'
          #!/bin/bash
          set -u

          echo "============================================================"
          echo "TAHOE IO80211 RUNTIME PROBE"
          echo "============================================================"
          echo

          echo "[1] macOS / Darwin"
          sw_vers
          uname -a

          echo
          echo "[2] Loaded IO80211 / Wi-Fi related kexts"
          kmutil showloaded 2>/dev/null | grep -Ei 'IO80211|Airport|WiFi|CoreWLAN' || true

          echo
          echo "[3] IO80211Family locations"
          find /System/Library/Extensions /Library/Extensions \
            -maxdepth 3 \
            -iname '*IO80211*' \
            -print 2>/dev/null || true

          echo
          echo "[4] RTW88 status"
          kmutil showloaded 2>/dev/null | grep -i rtw88 || true

          echo
          echo "[5] IORegistry Wi-Fi classes"
          ioreg -l 2>/dev/null | grep -Ei \
            'IO80211Controller|IO80211Interface|IO80211SkywalkInterface|AirPort|WiFi' \
            | head -250 || true

          echo
          echo "[6] Candidate IO80211Family binaries"
          for B in \
            /System/Library/Extensions/IO80211Family.kext/Contents/MacOS/IO80211Family \
            /Library/Extensions/IO80211Family.kext/Contents/MacOS/IO80211Family
          do
            if [ -f "${B}" ]; then
              echo
              echo "FOUND: ${B}"
              file "${B}"

              echo
              echo "IO80211Controller symbols:"
              nm -nm "${B}" 2>/dev/null \
                | grep 'IO80211Controller' \
                | head -200 \
                || true
            fi
          done

          echo
          echo "============================================================"
          echo "END"
          echo "============================================================"
          EOF

          chmod +x "${OUT}"

      - name: Create report
        shell: bash
        run: |
          set -eu

          OUTDIR="${RUNNER_TEMP}/RTW88-v9.0.2-Tahoe-ABI-Probe"
          mkdir -p "${OUTDIR}"

          cp \
            "${RUNNER_TEMP}/io80211-abi-comparison.txt" \
            "${OUTDIR}/"

          cp \
            "${RUNNER_TEMP}/legacy-virtual.txt" \
            "${OUTDIR}/"

          cp \
            "${RUNNER_TEMP}/v2-virtual.txt" \
            "${OUTDIR}/"

          cp \
            "${RUNNER_TEMP}/v2-only-methods.txt" \
            "${OUTDIR}/"

          cp \
            "${RUNNER_TEMP}/probe-tahoe-io80211.sh" \
            "${OUTDIR}/"

          cat > "${OUTDIR}/LEIA-ME.txt" <<'EOF'
          RTW88 v9.0.2 Tahoe IO80211 ABI Probe

          Esta versão NÃO gera uma Kext para instalar.

          Motivo:
          A v9.0.1d foi rejeitada pelo Tahoe com:

          Malformed vtable.
          IO80211Controller: 463 entries
          RTW88PCIDevice:    457 entries

          Portanto existe incompatibilidade de ABI.

          Este pacote compara:
          1. IO80211Controller.h legado do MacKernelSDK usado na build
          2. IO80211ControllerV2.h usado pelo AirportItlwm mais novo

          Também inclui:
          probe-tahoe-io80211.sh

          Esse script deve ser executado NO HP 256 G8 com Tahoe para coletar
          informações do IO80211 real/restaurado presente naquele sistema.

          Não instale nenhuma Kext deste pacote.

          Próxima etapa:
          usar o resultado do probe para construir uma classe compatível com
          a ABI real do IO80211Controller carregado no Tahoe.
          EOF

          cd "${OUTDIR}"
          shasum -a 256 * > SHA256SUMS.txt

      - name: Package ABI probe
        shell: bash
        run: |
          set -eu

          cd "${RUNNER_TEMP}"

          ZIP="RTW88-v9.0.2-Tahoe-ABI-Probe.zip"
          rm -f "${ZIP}"

          zip -r \
            "${ZIP}" \
            RTW88-v9.0.2-Tahoe-ABI-Probe

          ls -lh "${ZIP}"

      - name: Upload ABI probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: RTW88-v9.0.2-Tahoe-ABI-Probe
          path: ${{ runner.temp }}/RTW88-v9.0.2-Tahoe-ABI-Probe.zip
          if-no-files-found: error
          retention-days: 7
