name: Build HP256G8 RTL8821CE v8 DMA Recovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      # ============================================================
      # 1. CHECKOUT FEIXIAO
      # ============================================================

      - name: Checkout Feixiao
        uses: actions/checkout@v4
        with:
          repository: thegwchr/Feixiao
          ref: e963f43188382eced4ef2fa75d19ce4db2315c68
          submodules: recursive
          path: Feixiao
          fetch-depth: 0

      # ============================================================
      # 2. CLONE RTW88-STABLE
      # ============================================================

      - name: Clone matching rtw88-stable
        run: |
          git clone https://github.com/thegwchr/rtw88-stable.git

          cd rtw88-stable

          git checkout d029a677c49266fad86750714eb5612becd134d3

          echo
          echo "========================================"
          echo " RTW88-STABLE REVISION "
          echo "========================================"

          git rev-parse HEAD

      # ============================================================
      # 3. APPLY ALL V8 PATCHES
      # ============================================================

      - name: Apply HP256G8 v8 patches
        shell: bash
        run: |
          cat > /tmp/patch_v8.py <<'PY'

          from pathlib import Path


          # ============================================================
          # FILES
          # ============================================================

          feixiao = Path("Feixiao")

          ieee = (
              feixiao
              /
              "src/kext/RTW88IEEE80211.cpp"
          )

          pci = (
              feixiao
              /
              "src/kext/RTW88PCIDevice.cpp"
          )

          hpp = (
              feixiao
              /
              "src/kext/RTW88PCIDevice.hpp"
          )

          compat = (
              feixiao
              /
              "src/compat/rtw88_compat.c"
          )

          linux_pci = Path(
              "rtw88-stable/"
              "drivers/net/wireless/realtek/"
              "rtw88/pci.c"
          )


          for f in (
              ieee,
              pci,
              hpp,
              compat,
              linux_pci,
          ):

              if not f.exists():

                  raise SystemExit(
                      f"ERROR: required source missing: {f}"
                  )


          c = ieee.read_text()
          p = pci.read_text()
          h = hpp.read_text()
          r = compat.read_text()
          lp = linux_pci.read_text()


          print("=" * 72)
          print("HP256G8 RTL8821CE v8 DMA RECOVERY")
          print("=" * 72)


          # ============================================================
          # 1. VERIFY NATIVE TX/DMA FIXES
          # ============================================================

          if (
              "IOGatedOutputQueue::withTarget"
              not in p
          ):

              raise SystemExit(
                  "ERROR: native IOGatedOutputQueue "
                  "fix missing"
              )


          if (
              "drainPendingFree()"
              not in p
          ):

              raise SystemExit(
                  "ERROR: deferred DMA free "
                  "fix missing"
              )


          print(
              "Native TX serialization: OK"
          )

          print(
              "Deferred DMA free: OK"
          )


          # ============================================================
          # 2. REMOVE LEGACY FIXED 6 MBPS RATE
          # ============================================================

          r = r.replace(
              "rtwdev->dm_info.fix_rate = DESC_RATE6M;",
              "rtwdev->dm_info.fix_rate = 0xFF;"
          )


          print(
              "Firmware automatic rate adaptation: OK"
          )


          # ============================================================
          # 3. WPA2 M4 KEY LENGTH = 0
          # ============================================================

          old_keylen = (
              "    key[3] = 0; key[4] = 16; "
              "/* key length = 16 (AES-128) */"
          )


          new_keylen = """    if (step == 4) {

              key[3] = 0;
              key[4] = 0;

              IOLog(
                  "rtw88: HP256G8 v8 M4 key_length=0\\n"
              );

          } else {

              key[3] = 0;
              key[4] = 16;
          }"""


          if (
              "HP256G8 v8 M4 key_length=0"
              not in c
          ):

              if (
                  old_keylen not in c
              ):

                  raise SystemExit(
                      "ERROR: EAPOL key-length "
                      "assignment not found"
                  )


              c = c.replace(
                  old_keylen,
                  new_keylen,
                  1
              )


          print(
              "WPA2 M4 Key Length: OK"
          )


          # ============================================================
          # 4. WPA2 M4 NONCE = ZERO
          # ============================================================

          old_nonce = (
              "    memcpy(key + 13, _snonce, 32);       "
              "/* key[13..44] = SNonce */"
          )


          new_nonce = """    if (step == 4) {

              memset(
                  key + 13,
                  0,
                  32
              );

              IOLog(
                  "rtw88: HP256G8 v8 M4 nonce zeroed\\n"
              );

          } else {

              memcpy(
                  key + 13,
                  _snonce,
                  32
              );
          }"""


          if (
              "HP256G8 v8 M4 nonce zeroed"
              not in c
          ):

              if (
                  old_nonce not in c
              ):

                  raise SystemExit(
                      "ERROR: EAPOL nonce "
                      "assignment not found"
                  )


              c = c.replace(
                  old_nonce,
                  new_nonce,
                  1
              )


          print(
              "WPA2 M4 nonce: OK"
          )


          # ============================================================
          # 5. WPA2 M3 DIAGNOSTICS
          # ============================================================

          m3_marker = (
              "    } else if (is_m3) {"
          )


          if (
              "HP256G8 v8 received M3"
              not in c
          ):

              if (
                  m3_marker not in c
              ):

                  raise SystemExit(
                      "ERROR: M3 handler not found"
                  )


              c = c.replace(
                  m3_marker,

                  """    } else if (is_m3) {

              IOLog(
                  "rtw88: HP256G8 v8 received M3 "
                  "replay=%02x%02x%02x%02x"
                  "%02x%02x%02x%02x\\n",
                  data[9],
                  data[10],
                  data[11],
                  data[12],
                  data[13],
                  data[14],
                  data[15],
                  data[16]
              );""",

                  1
              )


          print(
              "WPA2 M3 diagnostics: OK"
          )


          # ============================================================
          # 6. WPA2:
          #
          # SEND M4 BEFORE HARDWARE PTK/GTK INSTALL
          # ============================================================

          if (
              "sending EAPOL M4 before PTK install"
              not in c
          ):

              m3_start = c.find(
                  "HP256G8 v8 received M3"
              )


              if (
                  m3_start < 0
              ):

                  raise SystemExit(
                      "ERROR: patched M3 region "
                      "not found"
                  )


              ptk_anchor = (
                  "if (!installKey("
                  "&_ptkConf, "
                  "true, "
                  "0, "
                  "WLAN_CIPHER_SUITE_CCMP,"
              )


              m4_anchor = (
                  "sendEAPOLKey("
                  "4, "
                  "_replayCtr, "
                  "false, "
                  "false, "
                  "true);"
              )


              state_anchor = (
                  "_state = "
                  "RTW88_STATE_CONNECTED;"
              )


              start = c.find(
                  ptk_anchor,
                  m3_start
              )


              if (
                  start < 0
              ):

                  raise SystemExit(
                      "ERROR: PTK install anchor "
                      "not found"
                  )


              send4 = c.find(
                  m4_anchor,
                  start
              )


              if (
                  send4 < 0
              ):

                  raise SystemExit(
                      "ERROR: EAPOL M4 anchor "
                      "not found"
                  )


              end = c.find(
                  state_anchor,
                  send4
              )


              if (
                  end < 0
              ):

                  raise SystemExit(
                      "ERROR: CONNECTED state "
                      "anchor not found"
                  )


              end += len(
                  state_anchor
              )


              old_block = c[
                  start:end
              ]


              if (
                  "installKey(&_gtkConf"
                  not in old_block
              ):

                  raise SystemExit(
                      "ERROR: WPA2 block "
                      "lacks GTK install"
                  )


              new_block = """IOLog(
              "rtw88: HP256G8 v8 "
              "sending EAPOL M4 before PTK install\\n"
          );

          sendEAPOLKey(
              4,
              _replayCtr,
              false,
              false,
              true
          );

          /*
           * HP256G8 v8 WPA2
           *
           * Submit M4 while TX is still using
           * the pre-pairwise-key state.
           */

          IOSleep(
              40
          );

          IOLog(
              "rtw88: HP256G8 v8 "
              "M4 submitted, installing PTK\\n"
          );

          if (!installKey(
                  &_ptkConf,
                  true,
                  0,
                  WLAN_CIPHER_SUITE_CCMP,
                  _ptk + 32,
                  16))
              return;

          uint32_t groupCipher =
              (
                  _targetBSS.group_cipher ==
                  WLAN_CIPHER_SUITE_TKIP
              )
              ?
              WLAN_CIPHER_SUITE_TKIP
              :
              WLAN_CIPHER_SUITE_CCMP;

          if (
              gtk_len
              &&
              !installKey(
                  &_gtkConf,
                  false,
                  gtk_idx,
                  groupCipher,
                  gtk,
                  gtk_len
              )
          )
              return;

          IOLog(
              "rtw88: HP256G8 v8 "
              "PTK/GTK installed after M4\\n"
          );

          _state =
              RTW88_STATE_CONNECTED;"""


              c = (
                  c[:start]
                  +
                  new_block
                  +
                  c[end:]
              )


          print(
              "WPA2 M4/PTK/GTK ordering: OK"
          )


          # ============================================================
          # 7. A-MPDU AFTER WPA2 SETTLE
          # ============================================================

          old_ampdu = (
              "        startTxAggregation();   "
              "/* keys are installed — "
              "negotiate uplink A-MPDU */"
          )


          if (
              "HP256G8 v8 WPA2 settle complete"
              not in c
          ):

              if (
                  old_ampdu not in c
              ):

                  raise SystemExit(
                      "ERROR: WPA2 A-MPDU "
                      "start line not found"
                  )


              c = c.replace(
                  old_ampdu,

                  """        IOSleep(
              100
          );

          IOLog(
              "rtw88: HP256G8 v8 "
              "WPA2 settle complete, "
              "starting A-MPDU\\n"
          );

          startTxAggregation();""",

                  1
              )


          print(
              "A-MPDU WPA2 settle: OK"
          )


          # ============================================================
          # 8. ENABLE VHT 80 MHZ
          # ============================================================

          disabled80 = (
              "if (false && chip80 && "
              "vhtWidth == 1 && "
              "vhtSeg0 != 0) {"
          )


          enabled80 = (
              "if (chip80 && "
              "vhtWidth == 1 && "
              "vhtSeg0 != 0) {"
          )


          if (
              disabled80 in c
          ):

              c = c.replace(
                  disabled80,
                  enabled80,
                  1
              )


          if (
              enabled80 not in c
          ):

              raise SystemExit(
                  "ERROR: VHT80 negotiation "
                  "path not found"
              )


          print(
              "VHT 80 MHz: ENABLED"
          )


          # ============================================================
          # 9. BUILD IDENTIFICATION
          # ============================================================

          chandef_log = (
              '    IOLog('
              '"rtw88: connected chandef: '
              '%u MHz '
              '(primary=%u cf1=%u)\\n",'
          )


          if (
              "HP256G8 v8 DMA Recovery active"
              not in c
          ):

              if (
                  chandef_log not in c
              ):

                  raise SystemExit(
                      "ERROR: chandef log "
                      "marker not found"
                  )


              c = c.replace(
                  chandef_log,

                  '    IOLog('
                  '"rtw88: HP256G8 v8 '
                  'DMA Recovery active\\n");\n'
                  +
                  chandef_log,

                  1
              )


          # ============================================================
          # 10. TX FLOW CONTROL
          # ============================================================

          p = p.replace(
              "static constexpr unsigned int "
              "kRTW88TxStallAvail = 128;",

              "static constexpr unsigned int "
              "kRTW88TxStallAvail = 96;"
          )


          p = p.replace(
              "static constexpr unsigned int "
              "kRTW88TxResumeAvail = 192;",

              "static constexpr unsigned int "
              "kRTW88TxResumeAvail = 160;"
          )


          if (
              "kRTW88TxStallAvail = 96;"
              not in p
          ):

              raise SystemExit(
                  "ERROR: TX stall threshold "
                  "not restored"
              )


          if (
              "kRTW88TxResumeAvail = 160;"
              not in p
          ):

              raise SystemExit(
                  "ERROR: TX resume threshold "
                  "not restored"
              )


          print(
              "TX thresholds 96/160: OK"
          )


          # ============================================================
          # 11. RX BATCHING HEADER
          # ============================================================

          if (
              "void flushRxQueue();"
              not in h
          ):

              anchor = (
                  "    void injectRxFrame(mbuf_t m);"
              )


              if (
                  anchor not in h
              ):

                  raise SystemExit(
                      "ERROR: injectRxFrame "
                      "declaration not found"
                  )


              h = h.replace(
                  anchor,

                  anchor
                  +
                  "\n"
                  "    void flushRxQueue();",

                  1
              )


          if (
              "_rxQueued"
              not in h
          ):

              anchor = (
                  "    IOEthernetInterface    "
                  "*_iface        = nullptr;"
              )


              if (
                  anchor not in h
              ):

                  raise SystemExit(
                      "ERROR: _iface member "
                      "not found"
                  )


              h = h.replace(
                  anchor,

                  anchor
                  +
                  "\n"
                  "    bool                    "
                  "_rxQueued     = false;",

                  1
              )


          # ============================================================
          # 12. RX BATCHING - INTERRUPT FLUSH
          # ============================================================

          old_irq = """void RTW88PCIDevice::handleInterrupt(IOInterruptEventSource *src, int count)
          {
              if (_ieee80211)
                  rtw88_trigger_interrupt();
          }"""


          new_irq = """void RTW88PCIDevice::handleInterrupt(IOInterruptEventSource *src, int count)
          {
              if (_ieee80211)
                  rtw88_trigger_interrupt();

              /*
               * HP256G8 v8 RX batching.
               *
               * Flush all queued RX frames
               * once per interrupt.
               */
              flushRxQueue();
          }"""


          if (
              "HP256G8 v8 RX batching."
              not in p
          ):

              if (
                  old_irq not in p
              ):

                  raise SystemExit(
                      "ERROR: handleInterrupt "
                      "block not found"
                  )


              p = p.replace(
                  old_irq,
                  new_irq,
                  1
              )


          # ============================================================
          # 13. RX QUEUE WITHOUT PER-PACKET FLUSH
          # ============================================================

          old_inject = """    /* Queue + flush, matching the proven itlwm submission path.  Submitting
               * via the input queue keeps frame delivery off whatever thread called us. */
              _iface->inputPacket(m, 0, IONetworkInterface::kInputOptionQueuePacket);
              _iface->flushInputQueue();"""


          new_inject = """    /*
               * HP256G8 v8:
               *
               * Queue now and flush once after
               * interrupt/poll processing.
               */
              _iface->inputPacket(
                  m,
                  0,
                  IONetworkInterface::kInputOptionQueuePacket
              );

              _rxQueued = true;"""


          if (
              "Queue now and flush once"
              not in p
          ):

              if (
                  old_inject not in p
              ):

                  raise SystemExit(
                      "ERROR: injectRxFrame "
                      "queue/flush block not found"
                  )


              p = p.replace(
                  old_inject,
                  new_inject,
                  1
              )


          # ============================================================
          # 14. RX BATCH FLUSH IMPLEMENTATION
          # ============================================================

          if (
              "void RTW88PCIDevice::flushRxQueue()"
              not in p
          ):

              insert_before = (
                  "/* ------------------------------------------------------------------ */\n"
                  "/*  DMA coherent allocation"
              )


              if (
                  insert_before not in p
              ):

                  raise SystemExit(
                      "ERROR: DMA allocation "
                      "section marker not found"
                  )


              flush_impl = """void RTW88PCIDevice::flushRxQueue()
          {
              if (
                  _rxQueued
                  &&
                  _iface
              ) {

                  _rxQueued = false;

                  _iface->flushInputQueue();
              }
          }


          """


              p = p.replace(
                  insert_before,

                  flush_impl
                  +
                  insert_before,

                  1
              )


          print(
              "macOS RX batching: OK"
          )


          # ============================================================
          # 15. RTW88 RX DMA COMPLETION TAG RECOVERY
          # ============================================================

          if (
              "HP256G8 v8 RX tag resync"
              not in lp
          ):

              dma_start_anchor = (
                  "static void rtw_pci_dma_check("
              )


              dma_end_anchor = (
                  "static u32 __pci_get_hw_tx_ring_rp("
              )


              dma_start = lp.find(
                  dma_start_anchor
              )


              if (
                  dma_start < 0
              ):

                  raise SystemExit(
                      "ERROR: rtw_pci_dma_check "
                      "function start not found"
                  )


              dma_end = lp.find(
                  dma_end_anchor,
                  dma_start
              )


              if (
                  dma_end < 0
              ):

                  raise SystemExit(
                      "ERROR: function after "
                      "rtw_pci_dma_check not found"
                  )


              old_dma_function = lp[
                  dma_start:dma_end
              ]


              if (
                  "pci bus timeout, check dma status"
                  not in old_dma_function
              ):

                  raise SystemExit(
                      "ERROR: selected DMA function "
                      "does not contain timeout check"
                  )


              if (
                  "rtwpci->rx_tag"
                  not in old_dma_function
              ):

                  raise SystemExit(
                      "ERROR: selected DMA function "
                      "does not contain rx_tag"
                  )


              print(
                  "Original rtw_pci_dma_check located: OK"
              )


              new_dma_function = r'''static void rtw_pci_dma_check(
                  struct rtw_dev *rtwdev,
                  struct rtw_pci_rx_ring *rx_ring,
                  u32 idx)
          {
              struct rtw_pci *rtwpci =
                  (struct rtw_pci *)rtwdev->priv;

              const struct rtw_chip_info *chip =
                  rtwdev->chip;

              struct rtw_pci_rx_buffer_desc *buf_desc;

              u32 desc_sz =
                  chip->rx_buf_desc_sz;

              u16 total_pkt_size = 0;

              u16 expected =
                  rtwpci->rx_tag;

              int i;

              static u32 mismatch_count = 0;


              buf_desc =
                  (struct rtw_pci_rx_buffer_desc *)
                  (
                      rx_ring->r.head
                      +
                      idx * desc_sz
                  );


              /*
               * HP256G8 v8 DMA RECOVERY
               *
               * Hardware can advance the RX write
               * pointer before the RX completion tag
               * becomes visible to the CPU.
               *
               * Wait for the expected descriptor tag.
               *
               * Maximum wait:
               *
               * 100 x 2 us = 200 us.
               */

              for (
                  i = 0;
                  i < 100;
                  i++
              ) {

                  total_pkt_size =
                      le16_to_cpu(
                          READ_ONCE(
                              buf_desc->total_pkt_size
                          )
                      );


                  if (
                      total_pkt_size ==
                      expected
                  ) {

                      break;
                  }


                  udelay(
                      2
                  );
              }


              /*
               * If it still does not match,
               * re-synchronise the software RX tag
               * with the tag completed by hardware.
               */

              if (
                  total_pkt_size !=
                  expected
              ) {

                  mismatch_count++;


                  /*
                   * Avoid flooding dmesg.
                   *
                   * Report first occurrence and
                   * every 256 mismatches.
                   */

                  if (
                      mismatch_count == 1
                      ||
                      (
                          mismatch_count
                          &
                          0xff
                      )
                      ==
                      0
                  ) {

                      rtw_warn(
                          rtwdev,

                          "HP256G8 v8 RX tag resync "
                          "expected=%u observed=%u "
                          "count=%u\n",

                          expected,
                          total_pkt_size,
                          mismatch_count
                      );
                  }


                  rtwpci->rx_tag =
                      total_pkt_size;
              }


              /*
               * Expected tag for next RX descriptor.
               */

              rtwpci->rx_tag =
                  (
                      rtwpci->rx_tag
                      +
                      1
                  )
                  %
                  RX_TAG_MAX;
          }


          '''


              lp = (
                  lp[:dma_start]
                  +
                  new_dma_function
                  +
                  lp[dma_end:]
              )


              print(
                  "RX DMA tag recovery patch: OK"
              )


          # ============================================================
          # 16. VERIFY DMA FUNCTION
          # ============================================================

          dma_verify_start = lp.find(
              "static void rtw_pci_dma_check("
          )


          dma_verify_end = lp.find(
              "static u32 __pci_get_hw_tx_ring_rp(",
              dma_verify_start
          )


          if (
              dma_verify_start < 0
              or
              dma_verify_end < 0
          ):

              raise SystemExit(
                  "ERROR: patched DMA function "
                  "boundaries are invalid"
              )


          dma_verify = lp[
              dma_verify_start:
              dma_verify_end
          ]


          required_dma = [

              "HP256G8 v8 DMA RECOVERY",

              "HP256G8 v8 RX tag resync",

              "READ_ONCE",

              "i < 100",

              "udelay(",

              "total_pkt_size",

              "rtwpci->rx_tag",

              "RX_TAG_MAX",
          ]


          for marker in required_dma:

              if (
                  marker not in dma_verify
              ):

                  raise SystemExit(
                      "ERROR: DMA recovery marker "
                      f"missing: {marker}"
                  )


          if (
              "pci bus timeout, check dma status"
              in dma_verify
          ):

              raise SystemExit(
                  "ERROR: old PCI DMA timeout "
                  "warning still present"
              )


          print(
              "Final RX DMA recovery validation: OK"
          )


          # ============================================================
          # 17. FINAL IEEE/WPA2 VALIDATION
          #
          # CORRECTED:
          #
          # Do not search for text spanning two
          # adjacent C++ string literals.
          # ============================================================

          required_c = [

              "HP256G8 v8 DMA Recovery active",

              "HP256G8 v8 received M3",

              "HP256G8 v8 M4 key_length=0",

              "HP256G8 v8 M4 nonce zeroed",

              "sending EAPOL M4 before PTK install",

              "M4 submitted, installing PTK",

              "PTK/GTK installed after M4",

              "WPA2 settle complete",

              "startTxAggregation();",
          ]


          for marker in required_c:

              if (
                  marker not in c
              ):

                  raise SystemExit(
                      "ERROR: missing v8 IEEE marker: "
                      f"{marker}"
                  )


          print(
              "Final IEEE/WPA2 validation: OK"
          )


          # ============================================================
          # 18. FINAL RX BATCH VALIDATION
          # ============================================================

          if (
              "HP256G8 v8 RX batching."
              not in p
          ):

              raise SystemExit(
                  "ERROR: RX interrupt batch "
                  "flush missing"
              )


          if (
              "Queue now and flush once"
              not in p
          ):

              raise SystemExit(
                  "ERROR: RX batch enqueue "
                  "missing"
              )


          if (
              "void RTW88PCIDevice::flushRxQueue()"
              not in p
          ):

              raise SystemExit(
                  "ERROR: flushRxQueue "
                  "implementation missing"
              )


          if (
              "void flushRxQueue();"
              not in h
          ):

              raise SystemExit(
                  "ERROR: flushRxQueue "
                  "header declaration missing"
              )


          if (
              "_rxQueued"
              not in h
          ):

              raise SystemExit(
                  "ERROR: _rxQueued "
                  "header member missing"
              )


          print(
              "Final RX batching validation: OK"
          )


          # ============================================================
          # 19. FINAL TX VALIDATION
          # ============================================================

          if (
              "IOGatedOutputQueue::withTarget"
              not in p
          ):

              raise SystemExit(
                  "ERROR: serialized TX path missing"
              )


          if (
              "drainPendingFree()"
              not in p
          ):

              raise SystemExit(
                  "ERROR: deferred DMA free missing"
              )


          if (
              "kRTW88TxStallAvail = 96;"
              not in p
          ):

              raise SystemExit(
                  "ERROR: TX stall threshold incorrect"
              )


          if (
              "kRTW88TxResumeAvail = 160;"
              not in p
          ):

              raise SystemExit(
                  "ERROR: TX resume threshold incorrect"
              )


          print(
              "Final TX validation: OK"
          )


          # ============================================================
          # 20. FINAL VHT80 VALIDATION
          # ============================================================

          if (
              enabled80 not in c
          ):

              raise SystemExit(
                  "ERROR: VHT80 disappeared "
                  "during patch"
              )


          print(
              "Final VHT80 validation: OK"
          )


          # ============================================================
          # 21. WRITE PATCHED SOURCES
          # ============================================================

          ieee.write_text(
              c
          )


          pci.write_text(
              p
          )


          hpp.write_text(
              h
          )


          compat.write_text(
              r
          )


          linux_pci.write_text(
              lp
          )


          print()

          print(
              "=" * 72
          )

          print(
              "WPA2 v7 fixes retained: OK"
          )

          print(
              "VHT 80 MHz enabled: OK"
          )

          print(
              "TX thresholds 96/160: OK"
          )

          print(
              "RX batching: OK"
          )

          print(
              "RX DMA tag wait/resync: OK"
          )

          print(
              "HP256G8 v8 SOURCE PATCH "
              "APPLIED SUCCESSFULLY"
          )

          print(
              "=" * 72
          )


          PY


          python3 /tmp/patch_v8.py


          echo
          echo "========================================"
          echo " VERIFY FEIXIAO V8 "
          echo "========================================"


          grep -n \
            "HP256G8 v8" \
            Feixiao/src/kext/RTW88IEEE80211.cpp


          echo
          echo "========================================"
          echo " VERIFY WPA2 M4 "
          echo "========================================"


          grep -n \
            -A 60 \
            -B 10 \
            "sending EAPOL M4 before PTK install" \
            Feixiao/src/kext/RTW88IEEE80211.cpp


          echo
          echo "========================================"
          echo " VERIFY A-MPDU "
          echo "========================================"


          grep -n \
            -A 15 \
            -B 10 \
            "WPA2 settle complete" \
            Feixiao/src/kext/RTW88IEEE80211.cpp


          echo
          echo "========================================"
          echo " VERIFY RX BATCH "
          echo "========================================"


          grep -n \
            "flushRxQueue" \
            Feixiao/src/kext/RTW88PCIDevice.cpp


          grep -n \
            "_rxQueued" \
            Feixiao/src/kext/RTW88PCIDevice.hpp


          echo
          echo "========================================"
          echo " VERIFY TX FLOW CONTROL "
          echo "========================================"


          grep -n \
            "kRTW88TxStallAvail" \
            Feixiao/src/kext/RTW88PCIDevice.cpp


          grep -n \
            "kRTW88TxResumeAvail" \
            Feixiao/src/kext/RTW88PCIDevice.cpp


          echo
          echo "========================================"
          echo " VERIFY VHT80 "
          echo "========================================"


          grep -n \
            "chip80 && vhtWidth == 1" \
            Feixiao/src/kext/RTW88IEEE80211.cpp


          echo
          echo "========================================"
          echo " VERIFY RTW88 DMA RECOVERY "
          echo "========================================"


          grep -n \
            -A 70 \
            -B 15 \
            "HP256G8 v8 RX tag resync" \
            rtw88-stable/drivers/net/wireless/realtek/rtw88/pci.c


      # ============================================================
      # 4. DOWNLOAD FIRMWARE
      # ============================================================

      - name: Download firmware
        run: |
          cd Feixiao/firmware

          for fw in \
            rtw8822b_fw.bin \
            rtw8822c_fw.bin \
            rtw8821c_fw.bin \
            rtw8821a_fw.bin \
            rtw8812a_fw.bin \
            rtw8814a_fw.bin
          do

            if [ ! -s "$fw" ]; then

              echo "Downloading $fw"

              curl \
                -L \
                --fail \
                "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtw88/$fw" \
                -o "$fw"

            fi

          done


          echo
          echo "========================================"
          echo " FIRMWARE "
          echo "========================================"

          ls -lh *.bin


      # ============================================================
      # 5. BUILD ENVIRONMENT
      # ============================================================

      - name: Show build environment
        run: |
          echo
          echo "========================================"
          echo " MACOS "
          echo "========================================"

          sw_vers


          echo
          echo "========================================"
          echo " XCODE "
          echo "========================================"

          xcodebuild -version


          echo
          echo "========================================"
          echo " CLANG "
          echo "========================================"

          clang --version


