          echo
          echo "========================================"
          echo " RTW88-STABLE REVISION "
          echo "========================================"

          git -C rtw88-stable rev-parse HEAD


      # ============================================================
      # 6. BUILD
      # ============================================================

      - name: Build HP256G8 v8
        working-directory: Feixiao
        run: |
          make clean || true

          echo
          echo "========================================"
          echo " BUILD HP256G8 RTL8821CE V8 DMA RECOVERY "
          echo "========================================"

          make all


      # ============================================================
      # 7. VERIFY BINARY
      # ============================================================

      - name: Verify binary
        run: |
          test -d \
            Feixiao/build/out/rtw88.kext

          test -f \
            Feixiao/build/out/rtw88ctl


          echo
          echo "========================================"
          echo " KEXT "
          echo "========================================"

          file \
            Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88


          echo
          echo "========================================"
          echo " RTW88CTL "
          echo "========================================"

          file \
            Feixiao/build/out/rtw88ctl


          echo
          echo "========================================"
          echo " V8 BINARY MARKERS "
          echo "========================================"

          strings \
            Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88 \
            | grep -E \
              "HP256G8 v8|RX tag resync"


          echo
          echo "========================================"
          echo " WPA2 / AMPDU MARKERS "
          echo "========================================"

          strings \
            Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88 \
            | grep -E \
              "WPA2 connected|EAPOL|ADDBA|A-MPDU|connected chandef" \
            | head -150 \
            || true


          echo
          echo "========================================"
          echo " INFO.PLIST "
          echo "========================================"

          plutil \
            -p \
            Feixiao/build/out/rtw88.kext/Contents/Info.plist \
            | head -100 \
            || true


      # ============================================================
      # 8. PACKAGE
      # ============================================================

      - name: Package
        run: |
          OUT="${{ runner.temp }}/Feixiao-HP256G8-v8-DMA-Recovery"

          rm -rf "$OUT"

          mkdir -p "$OUT"


          cp -R \
            Feixiao/build/out/rtw88.kext \
            "$OUT/"


          cp \
            Feixiao/build/out/rtw88ctl \
            "$OUT/"


          chmod +x \
            "$OUT/rtw88ctl"


          cat > "$OUT/BUILD-INFO.txt" <<'EOF'
