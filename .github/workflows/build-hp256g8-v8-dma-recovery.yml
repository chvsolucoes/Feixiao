name: Build HP256G8 RTL8821CE v8.1 Safe RX

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Feixiao
        uses: actions/checkout@v4
        with:
          repository: thegwchr/Feixiao
          ref: e963f43188382eced4ef2fa75d19ce4db2315c68
          submodules: recursive
          path: Feixiao
          fetch-depth: 0

      - name: Clone rtw88-stable
        run: |
          git clone https://github.com/thegwchr/rtw88-stable.git
          cd rtw88-stable
          git checkout d029a677c49266fad86750714eb5612becd134d3

      - name: Apply v8.1 Safe RX
        shell: bash
        run: |
          cat > /tmp/v81.py <<'PY'
          from pathlib import Path

          f = Path("Feixiao")
          ieee = f / "src/kext/RTW88IEEE80211.cpp"
          pci = f / "src/kext/RTW88PCIDevice.cpp"
          compat = f / "src/compat/rtw88_compat.c"
          lpci = Path(
              "rtw88-stable/drivers/net/wireless/realtek/rtw88/pci.c"
          )

          for x in (ieee, pci, compat, lpci):
              if not x.exists():
                  raise SystemExit(
                      f"missing: {x}"
                  )

          c = ieee.read_text()
          p = pci.read_text()
          r = compat.read_text()
          l = lpci.read_text()

          print("=" * 72)
          print("HP256G8 RTL8821CE v8.1 SAFE RX")
          print("=" * 72)

          # ============================================================
          # 1. REQUIRED BASE FIXES
          # ============================================================

          if "IOGatedOutputQueue::withTarget" not in p:
              raise SystemExit(
                  "missing gated TX"
              )

          if "drainPendingFree()" not in p:
              raise SystemExit(
                  "missing deferred DMA free"
              )

          print("Native TX serialization: OK")
          print("Deferred DMA free: OK")

          # ============================================================
          # 2. AUTOMATIC RATE ADAPTATION
          # ============================================================

          r = r.replace(
              "rtwdev->dm_info.fix_rate = DESC_RATE6M;",
              "rtwdev->dm_info.fix_rate = 0xFF;"
          )

          print("Automatic rate adaptation: OK")

          # ============================================================
          # 3. WPA2 M4 KEY LENGTH
          # ============================================================

          old = (
              "    key[3] = 0; key[4] = 16; "
              "/* key length = 16 (AES-128) */"
          )

          new = """    if (step == 4) {
              key[3] = 0;
              key[4] = 0;
              IOLog("rtw88: HP256G8 v8.1 M4 key_length=0\\n");
          } else {
              key[3] = 0;
              key[4] = 16;
          }"""

          if "HP256G8 v8.1 M4 key_length=0" not in c:
              if old not in c:
                  raise SystemExit(
                      "key length anchor missing"
                  )

              c = c.replace(
                  old,
                  new,
                  1
              )

          # ============================================================
          # 4. WPA2 M4 NONCE
          # ============================================================

          old = (
              "    memcpy(key + 13, _snonce, 32);       "
              "/* key[13..44] = SNonce */"
          )

          new = """    if (step == 4) {
              memset(key + 13, 0, 32);
              IOLog("rtw88: HP256G8 v8.1 M4 nonce zeroed\\n");
          } else {
              memcpy(key + 13, _snonce, 32);
          }"""

          if "HP256G8 v8.1 M4 nonce zeroed" not in c:
              if old not in c:
                  raise SystemExit(
                      "nonce anchor missing"
                  )

              c = c.replace(
                  old,
                  new,
                  1
              )

          # ============================================================
          # 5. M3 DIAGNOSTICS
          # ============================================================

          m3 = (
              "    } else if (is_m3) {"
          )

          if "HP256G8 v8.1 received M3" not in c:
              if m3 not in c:
                  raise SystemExit(
                      "M3 anchor missing"
                  )

              c = c.replace(
                  m3,
                  """    } else if (is_m3) {
              IOLog("rtw88: HP256G8 v8.1 received M3\\n");""",
                  1
              )

          # ============================================================
          # 6. SEND M4 BEFORE PTK/GTK
          # ============================================================

          if "sending EAPOL M4 before PTK install" not in c:

              s = c.find(
                  "HP256G8 v8.1 received M3"
              )

              a = c.find(
                  "if (!installKey(&_ptkConf, true, 0, "
                  "WLAN_CIPHER_SUITE_CCMP,",
                  s
              )

              m = c.find(
                  "sendEAPOLKey(4, _replayCtr, "
                  "false, false, true);",
                  a
              )

              e = c.find(
                  "_state = RTW88_STATE_CONNECTED;",
                  m
              )

              if min(s, a, m, e) < 0:
                  raise SystemExit(
                      "WPA2 block anchors missing"
                  )

              e += len(
                  "_state = RTW88_STATE_CONNECTED;"
              )

              block = c[a:e]

              if "installKey(&_gtkConf" not in block:
                  raise SystemExit(
                      "GTK anchor missing"
                  )

              repl = """IOLog(
              "rtw88: HP256G8 v8.1 sending EAPOL M4 before PTK install\\n"
          );

          sendEAPOLKey(
              4,
              _replayCtr,
              false,
              false,
              true
          );

          IOSleep(40);

          IOLog(
              "rtw88: HP256G8 v8.1 M4 submitted, installing PTK\\n"
          );

          if (!installKey(
                  &_ptkConf,
                  true,
                  0,
                  WLAN_CIPHER_SUITE_CCMP,
                  _ptk + 32,
                  16))
              return;

          uint32_t groupCipher =
              (_targetBSS.group_cipher ==
               WLAN_CIPHER_SUITE_TKIP) ?
              WLAN_CIPHER_SUITE_TKIP :
              WLAN_CIPHER_SUITE_CCMP;

          if (gtk_len &&
              !installKey(
                  &_gtkConf,
                  false,
                  gtk_idx,
                  groupCipher,
                  gtk,
                  gtk_len))
              return;

          IOLog(
              "rtw88: HP256G8 v8.1 PTK/GTK installed after M4\\n"
          );

          _state = RTW88_STATE_CONNECTED;"""

              c = (
                  c[:a]
                  +
                  repl
                  +
                  c[e:]
              )

          print("WPA2 M4/PTK/GTK ordering: OK")

          # ============================================================
          # 7. A-MPDU AFTER WPA2 SETTLE
          # ============================================================

          old = (
              "        startTxAggregation();   "
              "/* keys are installed — "
              "negotiate uplink A-MPDU */"
          )

          if "HP256G8 v8.1 WPA2 settle complete" not in c:
              if old not in c:
                  raise SystemExit(
                      "A-MPDU anchor missing"
                  )

              c = c.replace(
                  old,
                  """        IOSleep(100);

          IOLog(
              "rtw88: HP256G8 v8.1 WPA2 settle complete, starting A-MPDU\\n"
          );

          startTxAggregation();""",
                  1
              )

          # ============================================================
          # 8. SAFE MODE = 40 MHZ
          # ============================================================

          en80 = (
              "if (chip80 && "
              "vhtWidth == 1 && "
              "vhtSeg0 != 0) {"
          )

          dis80 = (
              "if (false && chip80 && "
              "vhtWidth == 1 && "
              "vhtSeg0 != 0) {"
          )

          if dis80 not in c:
              if en80 not in c:
                  raise SystemExit(
                      "VHT80 anchor missing"
                  )

              c = c.replace(
                  en80,
                  dis80,
                  1
              )

          print("VHT max width: 40 MHz SAFE")

          # ============================================================
          # 9. BUILD MARKER
          # ============================================================

          marker = (
              '    IOLog("rtw88: connected chandef: '
              '%u MHz (primary=%u cf1=%u)\\n",'
          )

          if "HP256G8 v8.1 Safe RX active" not in c:
              if marker not in c:
                  raise SystemExit(
                      "chandef marker missing"
                  )

              c = c.replace(
                  marker,
                  '    IOLog("rtw88: HP256G8 v8.1 Safe RX active\\n");\n'
                  +
                  marker,
                  1
              )

          # ============================================================
          # 10. TX THRESHOLDS
          # ============================================================

          p = p.replace(
              "static constexpr unsigned int "
              "kRTW88TxStallAvail = 128;",
              "static constexpr unsigned int "
              "kRTW88TxStallAvail = 96;"
          )

          p = p.replace(
              "static constexpr unsigned int "
              "kRTW88TxResumeAvail = 192;",
              "static constexpr unsigned int "
              "kRTW88TxResumeAvail = 160;"
          )

          # ============================================================
          # 11. SAFE MACOS RX MBUF PATH
          # ============================================================

          start = p.find(
              "void RTW88PCIDevice::injectRxFrame(mbuf_t m)"
          )

          end = p.find(
              "/* ------------------------------------------------------------------ */\n"
              "/*  DMA coherent allocation",
              start
          )

          if start < 0 or end < 0:
              raise SystemExit(
                  "injectRxFrame boundaries missing"
              )

          safe_inject = """void RTW88PCIDevice::injectRxFrame(mbuf_t m)
          {
              drainPendingFree();

              if (!_iface || !_enabled) {
                  freePacket(m);
                  return;
              }

              /*
               * HP256G8 v8.1 SAFE RX
               *
               * Validate the complete mbuf chain before
               * giving it to the XNU networking stack.
               */

              const size_t kMin = 14;
              const size_t kMax = 4096;
              const unsigned int kMaxSegs = 32;

              size_t plen =
                  mbuf_pkthdr_len(m);

              size_t first =
                  mbuf_len(m);

              size_t chain = 0;

              unsigned int segs = 0;

              bool bad = false;

              for (
                  mbuf_t seg = m;
                  seg != nullptr;
                  seg = mbuf_next(seg)
              ) {

                  size_t n =
                      mbuf_len(seg);

                  segs++;

                  if (
                      segs > kMaxSegs
                      ||
                      n > kMax
                      ||
                      chain > (kMax - n)
                  ) {
                      bad = true;
                      break;
                  }

                  chain += n;
              }

              if (
                  bad
                  ||
                  plen < kMin
                  ||
                  plen > kMax
                  ||
                  first < kMin
                  ||
                  first > kMax
                  ||
                  chain != plen
              ) {

                  IOLog(
                      "rtw88: HP256G8 v8.1 SAFE RX drop "
                      "plen=%zu first=%zu chain=%zu segs=%u\\n",
                      plen,
                      first,
                      chain,
                      segs
                  );

                  freePacket(m);
                  return;
              }

              _iface->inputPacket(
                  m,
                  0,
                  IONetworkInterface::kInputOptionQueuePacket
              );

              /*
               * Conservative RX path.
               *
               * No v8 RX batching.
               */
              _iface->flushInputQueue();

              IONetworkData *nd =
                  _iface->getNetworkData(
                      kIONetworkStatsKey
                  );

              if (nd) {

                  IONetworkStats *stats =
                      (IONetworkStats *)
                      nd->getBuffer();

                  if (stats)
                      stats->inputPackets++;
              }
          }


          """

          p = (
              p[:start]
              +
              safe_inject
              +
              p[end:]
          )

          print("Safe macOS mbuf validation: OK")

          # ============================================================
          # 12. SAFE DMA TAG CHECK
          #
          # NO FORCED TAG RESYNC
          # ============================================================

          ds = l.find(
              "static void rtw_pci_dma_check("
          )

          de = l.find(
              "static u32 __pci_get_hw_tx_ring_rp(",
              ds
          )

          if ds < 0 or de < 0:
              raise SystemExit(
                  "DMA check boundaries missing"
              )

          safe_dma = """static bool rtw_pci_dma_check(
                  struct rtw_dev *rtwdev,
                  struct rtw_pci_rx_ring *rx_ring,
                  u32 idx)
          {
              struct rtw_pci *rtwpci =
                  (struct rtw_pci *)rtwdev->priv;

              const struct rtw_chip_info *chip =
                  rtwdev->chip;

              struct rtw_pci_rx_buffer_desc *buf_desc;

              u32 desc_sz =
                  chip->rx_buf_desc_sz;

              u16 observed = 0;

              u16 expected =
                  rtwpci->rx_tag;

              int i;

              static u32 drop_count;

              buf_desc =
                  (struct rtw_pci_rx_buffer_desc *)
                  (
                      rx_ring->r.head
                      +
                      idx * desc_sz
                  );

              /*
               * HP256G8 v8.1 SAFE DMA
               *
               * Wait up to 200 us for the expected tag.
               *
               * Never copy an unexpected observed tag
               * into rtwpci->rx_tag.
               */

              for (
                  i = 0;
                  i < 100;
                  i++
              ) {

                  observed =
                      le16_to_cpu(
                          buf_desc->total_pkt_size
                      );

                  if (
                      observed ==
                      expected
                  ) {

                      rtwpci->rx_tag =
                          (
                              expected
                              +
                              1
                          )
                          %
                          RX_TAG_MAX;

                      return true;
                  }

                  udelay(2);
              }

              drop_count++;

              if (
                  drop_count == 1
                  ||
                  (
                      drop_count
                      &
                      0xff
                  )
                  ==
                  0
              ) {

                  rtw_warn(
                      rtwdev,
                      "HP256G8 v8.1 SAFE RX descriptor drop "
                      "expected=%u observed=%u count=%u\\n",
                      expected,
                      observed,
                      drop_count
                  );
              }

              /*
               * We deliberately discard this ring slot.
               *
               * Advance according to the slot we consumed.
               *
               * DO NOT trust observed as the new sequence.
               */

              rtwpci->rx_tag =
                  (
                      expected
                      +
                      1
                  )
                  %
                  RX_TAG_MAX;

              return false;
          }


          """

          l = (
              l[:ds]
              +
              safe_dma
              +
              l[de:]
          )

          # ============================================================
          # 13. DROP BAD DMA DESCRIPTOR BEFORE PARSE
          # ============================================================

          old = (
              "\twhile (count--) {\n"
              "\t\trtw_pci_dma_check(rtwdev, ring, cur_rp);\n"
              "\t\tskb = ring->buf[cur_rp];\n"
              "\t\tdma = *((dma_addr_t *)skb->cb);\n"
              "\t\tdma_sync_single_for_cpu(rtwdev->dev, dma, "
              "RTK_PCI_RX_BUF_SIZE,\n"
              "\t\t\t\t\tDMA_FROM_DEVICE);\n"
              "\t\trx_desc = skb->data;\n"
          )

          new = (
              "\twhile (count--) {\n"
              "\t\tskb = ring->buf[cur_rp];\n"
              "\t\tdma = *((dma_addr_t *)skb->cb);\n"
              "\n"
              "\t\tif (!rtw_pci_dma_check(rtwdev, ring, cur_rp))\n"
              "\t\t\tgoto next_rp;\n"
              "\n"
              "\t\tdma_sync_single_for_cpu(rtwdev->dev, dma, "
              "RTK_PCI_RX_BUF_SIZE,\n"
              "\t\t\t\t\tDMA_FROM_DEVICE);\n"
              "\t\trx_desc = skb->data;\n"
          )

          if old not in l:
              raise SystemExit(
                  "RX NAPI head anchor missing"
              )

          l = l.replace(
              old,
              new,
              1
          )

          # ============================================================
          # 14. CHECK RX LENGTH BEFORE COPYING
          # ============================================================

          old = (
              "\t\t/* offset from rx_desc to payload */\n"
              "\t\tpkt_offset = pkt_desc_sz + pkt_stat.drv_info_sz +\n"
              "\t\t\t     pkt_stat.shift;\n"
              "\n"
              "\t\t/* allocate a new skb for this frame,\n"
              "\t\t * discard the frame if none available\n"
              "\t\t */\n"
              "\t\tnew_len = pkt_stat.pkt_len + pkt_offset;\n"
          )

          new = (
              "\t\t/* offset from rx_desc to payload */\n"
              "\t\tpkt_offset = pkt_desc_sz + pkt_stat.drv_info_sz +\n"
              "\t\t\t     pkt_stat.shift;\n"
              "\n"
              "\t\tif (!pkt_stat.pkt_len ||\n"
              "\t\t    pkt_offset >= RTK_PCI_RX_BUF_SIZE ||\n"
              "\t\t    pkt_stat.pkt_len > "
              "RTK_PCI_RX_BUF_SIZE - pkt_offset) {\n"
              "\t\t\trtw_warn(rtwdev,\n"
              "\t\t\t\t \"HP256G8 v8.1 invalid RX length "
              "pkt=%u off=%u\\n\",\n"
              "\t\t\t\t pkt_stat.pkt_len, pkt_offset);\n"
              "\t\t\tgoto next_rp;\n"
              "\t\t}\n"
              "\n"
              "\t\t/* allocate a new skb for this frame,\n"
              "\t\t * discard the frame if none available\n"
              "\t\t */\n"
              "\t\tnew_len = pkt_stat.pkt_len + pkt_offset;\n"
          )

          if old not in l:
              raise SystemExit(
                  "RX length anchor missing"
              )

          l = l.replace(
              old,
              new,
              1
          )

          # ============================================================
          # 15. FINAL VALIDATION
          # ============================================================

          required = [
              "HP256G8 v8.1 Safe RX active",
              "HP256G8 v8.1 M4 key_length=0",
              "HP256G8 v8.1 M4 nonce zeroed",
              "sending EAPOL M4 before PTK install",
              "HP256G8 v8.1 SAFE RX drop",
              "static bool rtw_pci_dma_check(",
              "HP256G8 v8.1 SAFE RX descriptor drop",
              "HP256G8 v8.1 invalid RX length",
              "if (!rtw_pci_dma_check(rtwdev, ring, cur_rp))",
          ]

          merged = (
              c
              +
              p
              +
              l
          )

          for x in required:
              if x not in merged:
                  raise SystemExit(
                      f"validation missing: {x}"
                  )

          if "_rxQueued = true;" in p:
              raise SystemExit(
                  "unsafe RX batching still present"
              )

          if "HP256G8 v8 RX tag resync" in l:
              raise SystemExit(
                  "unsafe forced RX tag resync present"
              )

          # ============================================================
          # 16. WRITE SOURCES
          # ============================================================

          ieee.write_text(c)
          pci.write_text(p)
          compat.write_text(r)
          lpci.write_text(l)

          print()
          print("=" * 72)
          print("v8.1 SAFE RX patch applied successfully")
          print("RX batching: DISABLED")
          print("forced tag resync: DISABLED")
          print("invalid descriptor parse: BLOCKED")
          print("mbuf chain validation: ENABLED")
          print("RX length bounds: ENABLED")
          print("VHT width: 40 MHz SAFE")
          print("=" * 72)

          PY

          python3 /tmp/v81.py

          echo
          echo "========================================"
          echo " VERIFY IEEE "
          echo "========================================"

          grep -n \
            "HP256G8 v8.1" \
            Feixiao/src/kext/RTW88IEEE80211.cpp

          echo
          echo "========================================"
          echo " VERIFY MBUF GUARD "
          echo "========================================"

          grep -n \
            -A 70 \
            -B 10 \
            "HP256G8 v8.1 SAFE RX drop" \
            Feixiao/src/kext/RTW88PCIDevice.cpp

          echo
          echo "========================================"
          echo " VERIFY SAFE DMA "
          echo "========================================"

          grep -n \
            -A 80 \
            -B 10 \
            "SAFE RX descriptor drop" \
            rtw88-stable/drivers/net/wireless/realtek/rtw88/pci.c

          echo
          echo "========================================"
          echo " VERIFY RX LENGTH CHECK "
          echo "========================================"

          grep -n \
            -A 20 \
            -B 10 \
            "invalid RX length" \
            rtw88-stable/drivers/net/wireless/realtek/rtw88/pci.c

      # ============================================================
      # FIRMWARE
      # ============================================================

      - name: Download firmware
        run: |
          cd Feixiao/firmware

          for fw in \
            rtw8822b_fw.bin \
            rtw8822c_fw.bin \
            rtw8821c_fw.bin \
            rtw8821a_fw.bin \
            rtw8812a_fw.bin \
            rtw8814a_fw.bin
          do

            if [ ! -s "$fw" ]; then

              curl \
                -L \
                --fail \
                "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtw88/$fw" \
                -o "$fw"

            fi

          done

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build HP256G8 v8.1
        working-directory: Feixiao
        run: |
          make clean || true
          make all

      # ============================================================
      # VERIFY
      # ============================================================

      - name: Verify binary
        run: |
          test -d \
            Feixiao/build/out/rtw88.kext

          test -f \
            Feixiao/build/out/rtw88ctl

          file \
            Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88

          file \
            Feixiao/build/out/rtw88ctl

          echo
          echo "===== V8.1 MARKERS ====="

          strings \
            Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88 \
            | grep -E \
              "HP256G8 v8.1|SAFE RX"

      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Package
        run: |
          OUT="${{ runner.temp }}/Feixiao-HP256G8-v8.1-Safe-RX"

          rm -rf "$OUT"

          mkdir -p "$OUT"

          cp -R \
            Feixiao/build/out/rtw88.kext \
            "$OUT/"

          cp \
            Feixiao/build/out/rtw88ctl \
            "$OUT/"

          chmod +x \
            "$OUT/rtw88ctl"

          cat > "$OUT/BUILD-INFO.txt" <<'EOF'
          HP256G8 RTL8821CE v8.1 Safe RX

          SAFETY CHANGES
          =================================

          - WPA2 v7 fix retained

          - experimental RX batching removed

          - forced RX-tag rebasing removed

          - RX descriptor dropped if expected
            completion tag never appears

          - descriptor is never parsed after
            failed DMA-tag validation

          - pkt_len + pkt_offset validated before
            copying from DMA buffer

          - complete macOS mbuf chain length checked

          - per-packet flushInputQueue restored

          - VHT temporarily capped at 40 MHz

          IMPORTANT
          =================================

          Keep v7 as backup.

          Use rtw88.kext and rtw88ctl
          from this same artifact.

          EOF

          cd "${{ runner.temp }}"

          zip \
            -r \
            Feixiao_HP256G8_v8_1_Safe_RX.zip \
            Feixiao-HP256G8-v8.1-Safe-RX

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Feixiao-HP256G8-v8.1-Safe-RX
          path: ${{ runner.temp }}/Feixiao_HP256G8_v8_1_Safe_RX.zip
          retention-days: 7
