name: Build HP256G8 RTL8821CE v6 DMA Stable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      # ============================================================
      # 1. Feixiao main known pair
      # ============================================================
      - name: Checkout Feixiao e963f431
        uses: actions/checkout@v4
        with:
          repository: thegwchr/Feixiao
          ref: e963f43188382eced4ef2fa75d19ce4db2315c68
          submodules: recursive
          path: Feixiao
          fetch-depth: 0

      # ============================================================
      # 2. Use exact rtw88-stable revision matching current Feixiao
      # ============================================================
      - name: Clone matching rtw88-stable
        run: |
          git clone \
            https://github.com/thegwchr/rtw88-stable.git

          cd rtw88-stable

          git checkout \
            d029a677c49266fad86750714eb5612becd134d3

          echo "===== rtw88-stable revision ====="
          git rev-parse HEAD

      # ============================================================
      # 3. Apply HP256G8 conservative patch
      # ============================================================
      - name: Apply HP256G8 v6 patch
        working-directory: Feixiao
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          ieee = Path("src/kext/RTW88IEEE80211.cpp")
          pci  = Path("src/kext/RTW88PCIDevice.cpp")
          compat = Path("src/compat/rtw88_compat.c")
          hpp = Path("src/kext/RTW88PCIDevice.hpp")

          for f in [ieee, pci, compat, hpp]:
              if not f.exists():
                  raise SystemExit(
                      f"ERROR: required file missing: {f}"
                  )

          c = ieee.read_text()
          p = pci.read_text()
          r = compat.read_text()
          h = hpp.read_text()

          print("========================================")
          print("HP256G8 RTL8821CE v6")
          print("========================================")

          # --------------------------------------------------------
          # CHECK 1:
          # Make sure the native DMA race fix exists.
          # --------------------------------------------------------

          if "IOGatedOutputQueue::withTarget" not in p:
              raise SystemExit(
                  "ERROR: IOGatedOutputQueue DMA fix missing"
              )

          if "createOutputQueue()" not in p:
              raise SystemExit(
                  "ERROR: createOutputQueue() missing"
              )

          if "drainPendingFree()" not in p:
              raise SystemExit(
                  "ERROR: deferred DMA free support missing"
              )

          print("Native serialized TX path: OK")
          print("Deferred DMA free path: OK")

          # --------------------------------------------------------
          # CHECK 2:
          # Ensure automatic rate adaptation.
          #
          # No DESC_RATE6M fixed rate allowed.
          # --------------------------------------------------------

          occurrences = r.count(
              "rtwdev->dm_info.fix_rate = DESC_RATE6M"
          )

          if occurrences:
              r = r.replace(
                  "rtwdev->dm_info.fix_rate = DESC_RATE6M;",
                  "rtwdev->dm_info.fix_rate = 0xFF;"
              )

              print(
                  "Removed fixed 6 Mbps rate:",
                  occurrences
              )

          if "fix_rate = 0xFF" not in r:
              print(
                  "WARNING: no explicit fix_rate=0xFF found"
              )

          # --------------------------------------------------------
          # CHECK 3:
          # Preserve HT/VHT + A-MPDU.
          # --------------------------------------------------------

          required_strings = [
              "startTxAggregation",
              "ADDBA",
              "WLAN_EID_HT_CAPABILITY",
              "WLAN_EID_VHT_CAPABILITY",
          ]

          for s in required_strings:
              if s not in c:
                  raise SystemExit(
                      f"ERROR: required HT/A-MPDU code missing: {s}"
                  )

          print("HT/VHT path: OK")
          print("A-MPDU path: OK")

          # --------------------------------------------------------
          # CHANGE 1:
          # Cap VHT operation at 40 MHz.
          #
          # We keep VHT/HT MCS and A-MPDU active, but avoid 80 MHz
          # during DMA stability validation.
          # --------------------------------------------------------

          vht80_pattern = (
              r'if\s*\(\s*chip80\s*&&\s*'
              r'vhtWidth\s*==\s*1\s*&&\s*'
              r'vhtSeg0\s*!=\s*0\s*\)\s*\{'
          )

          m = re.search(
              vht80_pattern,
              c
          )

          if not m:
              raise SystemExit(
                  "ERROR: 80 MHz negotiation block not found"
              )

          c = (
              c[:m.start()] +
              "if (false && chip80 && "
              "vhtWidth == 1 && vhtSeg0 != 0) {" +
              c[m.end():]
          )

          print("80 MHz disabled for v6 stability test")

          # --------------------------------------------------------
          # CHANGE 2:
          # More conservative TX backpressure.
          #
          # Native driver:
          #  stall = 96
          #  resume = 160
          #
          # v6:
          #  stall earlier at 128
          #  resume at 192
          #
          # This keeps more descriptors free during bursts.
          # --------------------------------------------------------

          p = p.replace(
              "static constexpr unsigned int "
              "kRTW88TxStallAvail = 96;",
              "static constexpr unsigned int "
              "kRTW88TxStallAvail = 128;"
          )

          p = p.replace(
              "static constexpr unsigned int "
              "kRTW88TxResumeAvail = 160;",
              "static constexpr unsigned int "
              "kRTW88TxResumeAvail = 192;"
          )

          # --------------------------------------------------------
          # CHANGE 3:
          # Add explicit v6 identification log.
          # --------------------------------------------------------

          log_marker = (
              'IOLog("rtw88: connected chandef: '
              '%u MHz (primary=%u cf1=%u)\\n",'
          )

          if log_marker in c:
              c = c.replace(
                  log_marker,
                  'IOLog("rtw88: HP256G8 v6 DMA Stable active\\n");\n'
                  '    ' + log_marker,
                  1
              )

          # --------------------------------------------------------
          # CHANGE 4:
          # Add explicit TX serialization confirmation.
          # --------------------------------------------------------

          queue_marker = (
              "return IOGatedOutputQueue::withTarget("
              "this, getWorkLoop(), 256);"
          )

          if queue_marker in p:
              p = p.replace(
                  queue_marker,
                  'IOLog("rtw88: HP256G8 v6 '
                  'IOGated TX serialization enabled\\n");\n'
                  '    ' + queue_marker,
                  1
              )

          # --------------------------------------------------------
          # CHANGE 5:
          # Add warning before descriptor starvation.
          # --------------------------------------------------------

          stall_marker = (
              "if (rtw88_be_tx_avail() < "
              "kRTW88TxStallAvail) {"
          )

          if stall_marker in p:
              p = p.replace(
                  stall_marker,
                  'if (rtw88_be_tx_avail() < '
                  'kRTW88TxStallAvail) {\n'
                  '        IOLog("rtw88: HP256G8 v6 '
                  'TX backpressure engaged avail=%u\\n", '
                  'rtw88_be_tx_avail());',
                  1
              )

          # --------------------------------------------------------
          # SAVE
          # --------------------------------------------------------

          ieee.write_text(c)
          pci.write_text(p)
          compat.write_text(r)

          print()
          print("========================================")
          print("HP256G8 v6 PATCH APPLIED")
          print("========================================")
          PY

          echo
          echo "===== VERIFY DMA SERIALIZATION ====="

          grep -n \
            "createOutputQueue" \
            src/kext/RTW88PCIDevice.cpp

          grep -n \
            "IOGatedOutputQueue::withTarget" \
            src/kext/RTW88PCIDevice.cpp

          echo
          echo "===== VERIFY V6 ====="

          grep -n \
            "HP256G8 v6" \
            src/kext/RTW88PCIDevice.cpp

          grep -n \
            "HP256G8 v6" \
            src/kext/RTW88IEEE80211.cpp

          echo
          echo "===== VERIFY TX LIMITS ====="

          grep -n \
            "kRTW88TxStallAvail" \
            src/kext/RTW88PCIDevice.cpp

          grep -n \
            "kRTW88TxResumeAvail" \
            src/kext/RTW88PCIDevice.cpp

          echo
          echo "===== VERIFY RATE ADAPTATION ====="

          grep -n \
            "fix_rate" \
            src/compat/rtw88_compat.c \
            | head -20

      # ============================================================
      # 4. Firmware
      # ============================================================
      - name: Download firmware
        run: |
          cd Feixiao/firmware

          for fw in \
            rtw8822b_fw.bin \
            rtw8822c_fw.bin \
            rtw8821c_fw.bin \
            rtw8821a_fw.bin \
            rtw8812a_fw.bin \
            rtw8814a_fw.bin
          do
            if [ ! -s "$fw" ]; then

              echo "Downloading $fw"

              curl \
                -L \
                --fail \
                "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtw88/$fw" \
                -o "$fw"
            fi
          done

      # ============================================================
      # 5. Environment
      # ============================================================
      - name: Show build environment
        run: |
          echo "===== macOS ====="
          sw_vers

          echo
          echo "===== Xcode ====="
          xcodebuild -version

          echo
          echo "===== clang ====="
          clang --version

          echo
          echo "===== Feixiao ====="
          cd Feixiao
          git rev-parse HEAD

          echo
          echo "===== rtw88-stable ====="
          cd ../rtw88-stable
          git rev-parse HEAD

      # ============================================================
      # 6. Build
      # ============================================================
      - name: Build HP256G8 v6
        working-directory: Feixiao
        run: |
          make clean || true

          echo
          echo "========================================"
          echo " BUILDING HP256G8 RTL8821CE V6 "
          echo "========================================"

          make all

      # ============================================================
      # 7. Verify build
      # ============================================================
      - name: Verify build output
        run: |
          echo "===== OUTPUT ====="

          find \
            Feixiao/build/out \
            -maxdepth 3 \
            -print

          test \
            -d \
            Feixiao/build/out/rtw88.kext

          test \
            -f \
            Feixiao/build/out/rtw88ctl

          echo
          echo "===== MACH-O ====="

          file \
            Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88

          echo
          echo "===== V6 STRINGS ====="

          strings \
            Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88 \
            | grep "HP256G8 v6"

          echo
          echo "===== AGGREGATION STRINGS ====="

          strings \
            Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88 \
            | grep -E \
              "ADDBA|A-MPDU|WPA2 connected" \
            | head -40 \
            || true

      # ============================================================
      # 8. Package
      # ============================================================
      - name: Package HP256G8 v6
        run: |
          OUT="${{ runner.temp }}/Feixiao-HP256G8-v6-DMA-Stable"

          mkdir -p "$OUT"

          cp -R \
            Feixiao/build/out/rtw88.kext \
            "$OUT/"

          cp \
            Feixiao/build/out/rtw88ctl \
            "$OUT/"

          chmod +x \
            "$OUT/rtw88ctl"

          cat > "$OUT/BUILD-INFO.txt" <<'EOF'
          Feixiao HP 256 G8 / RTL8821CE
          =========================================
          Build: v6 DMA Stable

          Feixiao:
          e963f43188382eced4ef2fa75d19ce4db2315c68

          rtw88-stable:
          d029a677c49266fad86750714eb5612becd134d3

          Main goals:
          - fix/avoid PCI DMA TX wedge
          - preserve HT/VHT
          - preserve A-MPDU
          - preserve firmware rate adaptation
          - avoid fixed 6 Mbps 5 GHz rate
          - use native IOGatedOutputQueue serialization
          - use native deferred DMA free handling
          - maintain TX ring headroom
          - cap channel width to 40 MHz during stability test

          NOT changed:
          - PCIe ASPM
          - power-state registers
          - DMA allocation architecture
          - WPA2 implementation

          Test order:
          1. 5 GHz association
          2. ping gateway continuously
          3. 10-minute browsing/download stability
          4. speed test
          5. check dmesg for pci bus timeout

          Keep the known working v1.0.2 backup.
          EOF

          cd "${{ runner.temp }}"

          zip \
            -r \
            Feixiao_HP256G8_v6_DMA_Stable.zip \
            Feixiao-HP256G8-v6-DMA-Stable

      # ============================================================
      # 9. Upload
      # ============================================================
      - name: Upload HP256G8 v6
        uses: actions/upload-artifact@v4
        with:
          name: Feixiao-HP256G8-v6-DMA-Stable
          path: ${{ runner.temp }}/Feixiao_HP256G8_v6_DMA_Stable.zip
          retention-days: 7
