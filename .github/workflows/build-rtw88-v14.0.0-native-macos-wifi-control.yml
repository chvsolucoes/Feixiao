          SInt32 RTW88NativeController::apple80211SkywalkRequest(
              UInt requestType, int requestNumber,
              IO80211SkywalkInterface *iface, void *data, void *)
          {
              return apple80211SkywalkRequest(requestType, requestNumber, iface, data);
          }

          SInt32 RTW88NativeController::apple80211SkywalkRequest(
              UInt requestType, int requestNumber,
              IO80211SkywalkInterface *iface, void *data)
          {
              RTW88BridgeState st = {};
              if (rtw88_bridge_get_state(&st) != kIOReturnSuccess)
                  return kIOReturnNotReady;

              switch (requestNumber) {
              case APPLE80211_IOC_POWER:
                  return requestType == SIOCGA80211
                      ? getPOWER(iface, (apple80211_power_data *)data)
                      : setPOWER(iface, (apple80211_power_data *)data);

              case APPLE80211_IOC_SCAN_REQ:
              case APPLE80211_IOC_SCAN_REQ_MULTIPLE: {
                  IOLog("rtw88native: native scan request\n");
                  _scanPos = 4;
                  _scanLen = 0;
                  IOReturn ret = rtw88_bridge_scan();
                  if (ret != kIOReturnSuccess && ret != kIOReturnBusy)
                      return ret;

                  for (int i = 0; i < 30; i++) {
                      IOSleep(100);
                      RTW88BridgeState now = {};
                      if (rtw88_bridge_get_state(&now) == kIOReturnSuccess &&
                          now.state != RTW88_BRIDGE_STATE_SCANNING)
                          break;
                  }

                  _scanLen = sizeof(_scanBuf);
                  ret = rtw88_bridge_get_bss_list(_scanBuf, &_scanLen);
                  if (ret == kIOReturnSuccess) {
                      _scanPos = 4;
                      postMessage(APPLE80211_M_SCAN_CACHE_UPDATED, nullptr, 0, 0, nullptr);
                      postMessage(APPLE80211_M_SCAN_DONE, nullptr, 0, 0, nullptr);
                      IOLog("rtw88native: native scan cache ready len=%u\n", _scanLen);
                  }
                  return ret;
              }

              case APPLE80211_IOC_SCAN_RESULT: {
                  if (!data || requestType != SIOCGA80211)
                      return kIOReturnBadArgument;

                  if (_scanLen < 4 || _scanPos >= _scanLen)
                      return 5;

                  UInt32 p = _scanPos;
                  UInt8 ssidLen = _scanBuf[p++];
                  if (ssidLen > 32 || p + ssidLen + 13 > _scanLen)
                      return kIOReturnError;

                  apple80211_scan_result *sr = (apple80211_scan_result *)data;
                  memset(sr, 0, sizeof(*sr));
                  sr->version = APPLE80211_VERSION;

                  memcpy(sr->asr_ssid, _scanBuf + p, ssidLen);
                  sr->asr_ssid_len = ssidLen;
                  p += ssidLen;

                  memcpy(sr->asr_bssid, _scanBuf + p, 6);
                  p += 6;

                  SInt16 rssi = (SInt16)((_scanBuf[p] << 8) | _scanBuf[p + 1]);
                  p += 2;

                  UInt8 channel = _scanBuf[p++];
                  UInt32 cipher = 0;
                  memcpy(&cipher, _scanBuf + p, 4);
                  p += 4;

                  sr->asr_channel.version = APPLE80211_VERSION;
                  sr->asr_channel.channel = channel;
                  sr->asr_channel.flags =
                      APPLE80211_C_FLAG_ACTIVE |
                      APPLE80211_C_FLAG_20MHZ |
                      ((channel > 14) ? APPLE80211_C_FLAG_5GHZ
                                      : APPLE80211_C_FLAG_2GHZ);
                  sr->asr_noise = -95;
                  sr->asr_rssi = rssi;
                  sr->asr_snr = (SInt16)(rssi - sr->asr_noise);
                  sr->asr_beacon_int = 100;
                  sr->asr_cap = APPLE80211_CAPINFO_ESS |
                                APPLE80211_CAPINFO_SHORT_PREAMBLE |
                                APPLE80211_CAPINFO_SHORT_SLOT_TIME;
                  if (cipher != 0)
                      sr->asr_cap |= APPLE80211_CAPINFO_PRIVACY;
                  sr->asr_age = 0;
                  sr->asr_ie_len = 0;

                  _scanPos = p;
                  return kIOReturnSuccess;
              }

              case APPLE80211_IOC_AUTH_TYPE: {
                  if (!data) return kIOReturnBadArgument;
                  apple80211_authtype_data *ad = (apple80211_authtype_data *)data;
                  if (requestType == SIOCGA80211) {
                      memset(ad, 0, sizeof(*ad));
                      ad->version = APPLE80211_VERSION;
                      ad->authtype_lower = _authLower;
                      ad->authtype_upper = _authUpper;
                  } else {
                      _authLower = ad->authtype_lower;
                      _authUpper = ad->authtype_upper;
                  }
                  return kIOReturnSuccess;
              }

              case APPLE80211_IOC_STATE: {
                  if (!data) return kIOReturnBadArgument;
                  apple80211_state_data *sd = (apple80211_state_data *)data;
                  memset(sd, 0, sizeof(*sd));
                  sd->version = APPLE80211_VERSION;
                  if (st.state == RTW88_BRIDGE_STATE_CONNECTED) sd->state = 4;
                  else if (st.state == RTW88_BRIDGE_STATE_SCANNING) sd->state = 1;
                  else if (st.state == RTW88_BRIDGE_STATE_AUTHENTICATING ||
                           st.state == RTW88_BRIDGE_STATE_ASSOCIATING ||
                           st.state == RTW88_BRIDGE_STATE_HANDSHAKING) sd->state = 3;
                  else sd->state = 0;
                  return kIOReturnSuccess;
              }

              case APPLE80211_IOC_SSID: {
                  if (!data) return kIOReturnBadArgument;
                  apple80211_ssid_data *sd = (apple80211_ssid_data *)data;
                  if (requestType == SIOCGA80211) {
                      memset(sd, 0, sizeof(*sd));
                      sd->version = APPLE80211_VERSION;
                      size_t n = strnlen(st.ssid, 32);
                      memcpy(sd->ssid_bytes, st.ssid, n);
                      sd->ssid_len = (uint32_t)n;
                  } else {
                      memset(_ssid, 0, sizeof(_ssid));
                      size_t n = sd->ssid_len > 32 ? 32 : sd->ssid_len;
                      memcpy(_ssid, sd->ssid_bytes, n);
                  }
                  return kIOReturnSuccess;
              }

              case APPLE80211_IOC_BSSID: {
                  if (!data || requestType != SIOCGA80211) return kIOReturnUnsupported;
                  apple80211_bssid_data *bd = (apple80211_bssid_data *)data;
                  memset(bd, 0, sizeof(*bd));
                  bd->version = APPLE80211_VERSION;
                  memcpy(&bd->bssid, st.bssid, 6);
                  return kIOReturnSuccess;
              }

              case APPLE80211_IOC_RSSI: {
                  if (!data) return kIOReturnBadArgument;
                  apple80211_rssi_data *rd = (apple80211_rssi_data *)data;
                  int rssi = -100;
                  rtw88_bridge_get_rssi((SInt32 *)&rssi);
                  memset(rd, 0, sizeof(*rd));
                  rd->version = APPLE80211_VERSION;
                  rd->num_radios = 1;
                  rd->rssi_unit = APPLE80211_UNIT_DBM;
                  rd->rssi[0] = rssi;
                  rd->aggregate_rssi = rssi;
                  rd->rssi_ext[0] = rssi;
                  rd->aggregate_rssi_ext = rssi;
                  return kIOReturnSuccess;
              }

              case APPLE80211_IOC_CHANNEL: {
                  if (!data || requestType != SIOCGA80211) return kIOReturnUnsupported;
                  apple80211_channel_data *cd = (apple80211_channel_data *)data;
                  memset(cd, 0, sizeof(*cd));
                  cd->version = APPLE80211_VERSION;
                  cd->channel.channel = st.channel;
                  return kIOReturnSuccess;
              }

              case APPLE80211_IOC_PHY_MODE: {
                  if (!data) return kIOReturnBadArgument;
                  apple80211_phymode_data *pd = (apple80211_phymode_data *)data;
                  memset(pd, 0, sizeof(*pd));
                  pd->version = APPLE80211_VERSION;
                  pd->phy_mode = APPLE80211_MODE_11A |
                                 APPLE80211_MODE_11B |
                                 APPLE80211_MODE_11G |
                                 APPLE80211_MODE_11N |
                                 APPLE80211_MODE_11AC;
                  pd->active_phy_mode =
                      (st.channel > 14) ? APPLE80211_MODE_11AC : APPLE80211_MODE_11N;
                  return kIOReturnSuccess;
              }

              case APPLE80211_IOC_OP_MODE: {
                  if (!data) return kIOReturnBadArgument;
                  apple80211_opmode_data *od = (apple80211_opmode_data *)data;
                  memset(od, 0, sizeof(*od));
                  od->version = APPLE80211_VERSION;
                  od->op_mode = APPLE80211_M_STA;
                  return kIOReturnSuccess;
              }

              case APPLE80211_IOC_DISASSOCIATE:
                  return rtw88_bridge_disconnect();

              case APPLE80211_IOC_ASSOCIATE: {
                  if (!data || requestType != SIOCSA80211)
                      return kIOReturnBadArgument;

                  apple80211_assoc_data *ad = (apple80211_assoc_data *)data;
                  if (ad->ad_ssid_len == 0 || ad->ad_ssid_len > 32)
                      return kIOReturnBadArgument;

                  char ssid[33] = {};
                  memcpy(ssid, ad->ad_ssid, ad->ad_ssid_len);

                  _authLower = ad->ad_auth_lower;
                  _authUpper = ad->ad_auth_upper;

                  IOLog("rtw88native: native associate SSID=%s key_len=%u auth=%u/%u\n",
                        ssid, ad->ad_key.key_len, ad->ad_auth_lower, ad->ad_auth_upper);

                  if (ad->ad_key.key_len == 32)
                      return rtw88_bridge_connect_pmk(ssid, ad->ad_key.key, 32);

                  if (ad->ad_auth_upper == APPLE80211_AUTHTYPE_NONE)
                      return rtw88_bridge_connect(ssid, "");

                  return kIOReturnUnsupported;
              }

              case APPLE80211_IOC_CARD_CAPABILITIES:
                  return getCARD_CAPABILITIES(iface, (apple80211_capability_data *)data);
              case APPLE80211_IOC_DRIVER_VERSION:
                  return getDRIVER_VERSION(iface, (apple80211_version_data *)data);
              case APPLE80211_IOC_HARDWARE_VERSION:
                  return getHARDWARE_VERSION(iface, (apple80211_version_data *)data);
              case APPLE80211_IOC_COUNTRY_CODE:
                  return requestType == SIOCGA80211
                      ? getCOUNTRY_CODE(iface, (apple80211_country_code_data *)data)
                      : setCOUNTRY_CODE(iface, (apple80211_country_code_data *)data);

              case APPLE80211_IOC_P2P_LISTEN:
              case APPLE80211_IOC_P2P_SCAN:
              case APPLE80211_IOC_P2P_GO_CONF:
                  return kIOReturnUnsupported;

              default:
                  IOLog("rtw88native: unhandled request=%d type=%u\n",
                        requestNumber, requestType);
                  return kIOReturnUnsupported;
              }
          }
          EOF

          cat > native/src/kmod_info.c <<'EOF'
          #include <mach/mach_types.h>
          #include <libkern/libkern.h>
          #include <sys/types.h>
          #include <mach/kmod.h>

          kern_return_t rtw88native_start(kmod_info_t *ki, void *d) { return KERN_SUCCESS; }
          kern_return_t rtw88native_stop(kmod_info_t *ki, void *d) { return KERN_SUCCESS; }

          KMOD_EXPLICIT_DECL(com_rtw88_native, "14.0.0",
                             rtw88native_start, rtw88native_stop)
          __private_extern__ kmod_start_func_t *_realmain = rtw88native_start;
          __private_extern__ kmod_stop_func_t *_antimain = rtw88native_stop;
          __private_extern__ int _kext_apple_cc = __APPLE_CC__;
          EOF

