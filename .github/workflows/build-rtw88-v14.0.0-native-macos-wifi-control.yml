              return kIOReturnSuccess;
          }

          IOReturn RTW88NativeController::getCARD_CAPABILITIES(
              IO80211SkywalkInterface *, apple80211_capability_data *d)
          {
              if (!d) return kIOReturnBadArgument;
              memset(d, 0, sizeof(*d));
              d->version = APPLE80211_VERSION;
              d->capabilities[0] = 0xff;
              d->capabilities[1] = 0xff;
              d->capabilities[2] = 0xff;
              d->capabilities[3] = 0x2b;
              d->capabilities[5] = 0x40;
              d->capabilities[6] = 0x8c;
              return kIOReturnSuccess;
