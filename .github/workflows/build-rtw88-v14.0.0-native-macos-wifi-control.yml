name: RTW88 v14.0.0 Native macOS Wi-Fi Control

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build stable rtw88 + isolated native bridge
    runs-on: macos-26

    env:
      FEIXIAO_REF: e963f43188382eced4ef2fa75d19ce4db2315c68
      RTW88_REF: d029a677c49266fad86750714eb5612becd134d3
      ITLWM_REF: 53c51c2cdd6e4b69beb91f310d74c53422b0f8bd
      BUILD_NAME: RTW88-v14.0.0-Native-macOS-WiFi

    steps:
      - name: Checkout Feixiao stable
        uses: actions/checkout@v4
        with:
          repository: thegwchr/Feixiao
          ref: ${{ env.FEIXIAO_REF }}
          path: Feixiao
          fetch-depth: 1
          submodules: recursive

      - name: Checkout rtw88-stable
        uses: actions/checkout@v4
        with:
          repository: thegwchr/rtw88-stable
          ref: ${{ env.RTW88_REF }}
          path: rtw88-stable
          fetch-depth: 1

      - name: Checkout AirportItlwm headers
        uses: actions/checkout@v4
        with:
          repository: OpenIntelWireless/itlwm
          ref: ${{ env.ITLWM_REF }}
          path: itlwm
          fetch-depth: 1

      - name: Preflight source layout
        shell: bash
        run: |
          set -euo pipefail
          test -f Feixiao/src/kext/RTW88PCIDevice.cpp
          test -f Feixiao/src/kext/RTW88PCIDevice.hpp
          test -f Feixiao/src/kext/RTW88IEEE80211.cpp
          test -f Feixiao/src/kext/RTW88IEEE80211.hpp
          test -f Feixiao/src/kext/RTW88UserClient.hpp
          test -f Feixiao/Makefile
          test -f Feixiao/rtw88.kext/Contents/Info.plist
          test -f itlwm/include/Airport/IO80211ControllerV2.h
          echo "Source layout: OK"

      - name: Verify pinned revisions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C Feixiao rev-parse HEAD)" = "${FEIXIAO_REF}"
          test "$(git -C rtw88-stable rev-parse HEAD)" = "${RTW88_REF}"
          test "$(git -C itlwm rev-parse HEAD)" = "${ITLWM_REF}"

      - name: Preserve stable driver architecture
        shell: bash
        run: |
          set -euo pipefail
          cd Feixiao

          H="src/kext/RTW88PCIDevice.hpp"
          P="rtw88.kext/Contents/Info.plist"

          grep -F 'class RTW88PCIDevice : public IOEthernetController' "${H}" >/dev/null
          test "$(/usr/libexec/PlistBuddy -c 'Print :IOKitPersonalities:RTL8821CE:IOClass' "${P}")" = "RTW88PCIDevice"
          test "$(/usr/libexec/PlistBuddy -c 'Print :IOKitPersonalities:RTL8821CE:IOProviderClass' "${P}")" = "IOPCIDevice"
          test "$(/usr/libexec/PlistBuddy -c 'Print :IOKitPersonalities:RTL8821CE:IOPCIMatch' "${P}")" = "0xC82110EC"

          echo "Stable architecture preserved: PCI -> RTW88PCIDevice : IOEthernetController"

      - name: Set stable package version
        shell: bash
        run: |
          set -euo pipefail
          cd Feixiao
          P="rtw88.kext/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 8.5.3" "${P}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 8.5.3" "${P}"
          plutil -lint "${P}"

      - name: Download and validate Realtek firmware
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p Feixiao/firmware
          BASE="https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtw88"

          for fw in \
            rtw8822b_fw.bin \
            rtw8822c_fw.bin \
            rtw8821c_fw.bin \
            rtw8821a_fw.bin \
            rtw8812a_fw.bin \
            rtw8814a_fw.bin
          do
            echo "Downloading ${fw}..."
            curl -L --fail --retry 3 --retry-delay 2 \
              "${BASE}/${fw}" \
              -o "Feixiao/firmware/${fw}"

            test -s "Feixiao/firmware/${fw}"
            SIZE="$(stat -f%z "Feixiao/firmware/${fw}")"
            echo "${fw}: ${SIZE} bytes"

            if [ "${SIZE}" -lt 4096 ]; then
              echo "FATAL: ${fw} is unexpectedly small"
              exit 40
            fi
          done

          echo "RTL8821CE firmware SHA256:"
          shasum -a 256 Feixiao/firmware/rtw8821c_fw.bin

          rm -f Feixiao/src/compat/fw_blobs.c
          echo "Firmware validation: OK"

      - name: Add startup-stage diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cd Feixiao

          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/kext/RTW88PCIDevice.cpp")
          s = p.read_text()

          reps = [
              (
                  '    if (!super::start(provider)) return false;',
                  '    IOLog("rtw88: v13.0 START stage=super\\n");\n'
                  '    if (!super::start(provider)) {\n'
                  '        IOLog("rtw88: v13.0 FAIL stage=super\\n");\n'
                  '        return false;\n'
                  '    }\n'
                  '    IOLog("rtw88: v13.0 OK stage=super\\n");'
              ),
              (
                  '    _pciDev = OSDynamicCast(IOPCIDevice, provider);',
                  '    IOLog("rtw88: v13.0 START stage=pci-cast\\n");\n'
                  '    _pciDev = OSDynamicCast(IOPCIDevice, provider);'
              ),
              (
                  '    _mmioMap = _pciDev->mapDeviceMemoryWithRegister(kIOPCIConfigBaseAddress2);',
                  '    IOLog("rtw88: v13.0 START stage=bar2\\n");\n'
                  '    _mmioMap = _pciDev->mapDeviceMemoryWithRegister(kIOPCIConfigBaseAddress2);'
              ),
              (
                  '    rtw88_compat_init();',
                  '    IOLog("rtw88: v13.0 START stage=compat-init\\n");\n'
                  '    rtw88_compat_init();\n'
                  '    IOLog("rtw88: v13.0 OK stage=compat-init\\n");'
              ),
              (
                  '    if (!setupInterrupt()) {',
                  '    IOLog("rtw88: v13.0 START stage=interrupt\\n");\n'
                  '    if (!setupInterrupt()) {'
              ),
              (
                  '    rtw88_find_fw_dir();',
                  '    IOLog("rtw88: v13.0 START stage=firmware-dir\\n");\n'
                  '    rtw88_find_fw_dir();\n'
                  '    IOLog("rtw88: v13.0 OK stage=firmware-dir\\n");'
              ),
              (
                  '    _ieee80211 = RTW88IEEE80211::create(this, _compatPciDev);',
                  '    IOLog("rtw88: v13.0 START stage=ieee-create\\n");\n'
                  '    _ieee80211 = RTW88IEEE80211::create(this, _compatPciDev);'
              ),
              (
                  '    IOReturn probeRet = _ieee80211->start();',
                  '    IOLog("rtw88: v13.0 START stage=ieee-probe\\n");\n'
                  '    IOReturn probeRet = _ieee80211->start();'
              ),
              (
                  '    if (!attachDevice()) return false;',
                  '    IOLog("rtw88: v13.0 OK stage=ieee-probe\\n");\n'
                  '    IOLog("rtw88: v13.0 START stage=attach-interface\\n");\n'
                  '    if (!attachDevice()) {\n'
                  '        IOLog("rtw88: v13.0 FAIL stage=attach-interface\\n");\n'
                  '        return false;\n'
                  '    }\n'
                  '    IOLog("rtw88: v13.0 OK stage=attach-interface\\n");'
              ),
              (
                  '    IOLog("rtw88: device started successfully\\n");',
                  '    IOLog("rtw88: v13.0 READY RTL8821CE backend service\\n");\n'
                  '    IOLog("rtw88: device started successfully\\n");'
              ),
          ]

          for old, new in reps:
              if old not in s:
                  raise SystemExit(f"FATAL: startup anchor not found: {old[:80]}")
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          grep -n "rtw88: v13.0" src/kext/RTW88PCIDevice.cpp

      - name: Add stable C API export to backend
        shell: bash
        run: |
          set -euo pipefail
          cd Feixiao

          cat > src/kext/RTW88BridgeAPI.hpp <<'EOF'
          #pragma once
          #include <IOKit/IOTypes.h>

          #ifdef __cplusplus
          extern "C" {
          #endif

          struct RTW88BridgeState {
              UInt32 state;
              UInt8 bssid[6];
              char ssid[33];
              SInt32 rssi;
              UInt32 channel;
              UInt8 mac[6];
              UInt8 powered;
          };

          IOReturn rtw88_bridge_power_on(void);
          IOReturn rtw88_bridge_power_off(void);
          IOReturn rtw88_bridge_scan(void);
          IOReturn rtw88_bridge_disconnect(void);
          IOReturn rtw88_bridge_connect(const char *ssid, const char *password);
          IOReturn rtw88_bridge_connect_pmk(const char *ssid, const UInt8 *pmk, UInt32 pmk_len);
          IOReturn rtw88_bridge_get_state(struct RTW88BridgeState *out);
          IOReturn rtw88_bridge_get_rssi(SInt32 *out);
          IOReturn rtw88_bridge_get_bss_list(UInt8 *buf, UInt32 *len);

          #ifdef __cplusplus
          }
          #endif
          EOF

          cat > src/kext/RTW88BridgeAPI.cpp <<'EOF'
          #include "RTW88BridgeAPI.hpp"
          #include "RTW88PCIDevice.hpp"
          #include "RTW88IEEE80211.hpp"
          #include "RTW88UserClient.hpp"
          #include <libkern/libkern.h>
          #include <libkern/OSAtomic.h>

          extern "C" RTW88PCIDevice *rtw88_get_current_pci_device(void);

          static RTW88PCIDevice *bridgeDev()
          {
              return rtw88_get_current_pci_device();
          }

          extern "C" IOReturn rtw88_bridge_power_on(void)
          {
              RTW88PCIDevice *d = bridgeDev();
              if (!d || !d->get80211()) return kIOReturnNotReady;
              return d->get80211()->cmdPowerOn();
          }

          extern "C" IOReturn rtw88_bridge_power_off(void)
          {
              RTW88PCIDevice *d = bridgeDev();
              if (!d || !d->get80211()) return kIOReturnNotReady;
              d->get80211()->cmdDisconnect();
              return d->get80211()->cmdPowerOff();
          }

          extern "C" IOReturn rtw88_bridge_scan(void)
          {
              RTW88PCIDevice *d = bridgeDev();
              if (!d || !d->get80211()) return kIOReturnNotReady;
              return d->get80211()->cmdScan();
          }

          extern "C" IOReturn rtw88_bridge_disconnect(void)
          {
              RTW88PCIDevice *d = bridgeDev();
              if (!d || !d->get80211()) return kIOReturnNotReady;
              return d->get80211()->cmdDisconnect();
          }

          extern "C" IOReturn rtw88_bridge_connect(const char *ssid, const char *password)
          {
              RTW88PCIDevice *d = bridgeDev();
              if (!d || !d->get80211() || !ssid) return kIOReturnNotReady;
              return d->get80211()->cmdConnect(ssid, password ? password : "");
          }

          extern "C" IOReturn rtw88_bridge_connect_pmk(const char *ssid, const UInt8 *pmk, UInt32 pmk_len)
          {
              RTW88PCIDevice *d = bridgeDev();
              if (!d || !d->get80211() || !ssid || !pmk || pmk_len != 32)
                  return kIOReturnBadArgument;
              return d->get80211()->cmdConnectPMK(ssid, pmk);
          }

          extern "C" IOReturn rtw88_bridge_get_bss_list(UInt8 *buf, UInt32 *len)
          {
              RTW88PCIDevice *d = bridgeDev();
              if (!d || !d->get80211()) return kIOReturnNotReady;
              return d->get80211()->cmdGetBSSList(buf, len);
          }

          extern "C" IOReturn rtw88_bridge_get_state(struct RTW88BridgeState *out)
          {
              if (!out) return kIOReturnBadArgument;
              RTW88PCIDevice *d = bridgeDev();
              if (!d || !d->get80211()) return kIOReturnNotReady;

              RTW88StateResult st = {};
              IOReturn ret = d->get80211()->cmdGetState(&st);
              if (ret != kIOReturnSuccess) return ret;

              memset(out, 0, sizeof(*out));
              out->state = st.state;
              memcpy(out->bssid, st.bssid, sizeof(out->bssid));
              strlcpy(out->ssid, st.ssid, sizeof(out->ssid));
              out->rssi = st.rssi;
              out->channel = st.channel;
              memcpy(out->mac, st.mac_addr, sizeof(out->mac));
              out->powered = st.powered;
              return kIOReturnSuccess;
          }

          extern "C" IOReturn rtw88_bridge_get_rssi(SInt32 *out)
          {
              if (!out) return kIOReturnBadArgument;
              RTW88PCIDevice *d = bridgeDev();
              if (!d || !d->get80211()) return kIOReturnNotReady;
              int rssi = -100;
              IOReturn ret = d->get80211()->cmdGetRSSI(&rssi);
              *out = rssi;
              return ret;
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/kext/RTW88PCIDevice.cpp")
          s = p.read_text()
          anchor = "static RTW88PCIDevice *g_pci_dev_instance = nullptr;"
          if anchor not in s:
              raise SystemExit("FATAL: g_pci_dev_instance anchor not found")
          addition = '''
          extern "C" RTW88PCIDevice *rtw88_get_current_pci_device(void)
          {
              return g_pci_dev_instance;
          }
          '''
          if "rtw88_get_current_pci_device" not in s:
              s = s.replace(anchor, anchor + "\n" + addition, 1)
          p.write_text(s)

          m = Path("Makefile")
          t = m.read_text()
          anchor2 = "    $(KEXT_SRC)/RTW88PCIDevice.cpp \\\n"
          if anchor2 not in t:
              raise SystemExit("FATAL: Makefile source anchor not found")
          if "$(KEXT_SRC)/RTW88BridgeAPI.cpp" not in t:
              t = t.replace(anchor2, anchor2 + "    $(KEXT_SRC)/RTW88BridgeAPI.cpp \\\n", 1)
          m.write_text(t)
          PY

          grep -F 'RTW88BridgeAPI.cpp' Makefile >/dev/null
          grep -F 'rtw88_get_current_pci_device' src/kext/RTW88PCIDevice.cpp >/dev/null

          python3 - <<'PY'
          from pathlib import Path

          hp = Path("src/kext/RTW88IEEE80211.hpp")
          h = hp.read_text()

          old = "    IOReturn  cmdConnect(const char *ssid, const char *password);"
          new = old + "\n    IOReturn  cmdConnectPMK(const char *ssid, const uint8_t pmk[32]);"
          if "cmdConnectPMK" not in h:
              if old not in h:
                  raise SystemExit("FATAL: cmdConnect declaration anchor missing")
              h = h.replace(old, new, 1)

          member_anchor = "    char                _password[64] = {};"
          if "_nativePmkValid" not in h:
              if member_anchor not in h:
                  raise SystemExit("FATAL: password member anchor missing")
              h = h.replace(
                  member_anchor,
                  member_anchor + "\n    bool                _nativePmkValid = false;",
                  1
              )
          hp.write_text(h)

          cp = Path("src/kext/RTW88IEEE80211.cpp")
          c = cp.read_text()

          normal_anchor = '    strlcpy(_password, password ? password : "", sizeof(_password));'
          if normal_anchor not in c:
              raise SystemExit("FATAL: cmdConnect password anchor missing")
          connect_start = c.find("IOReturn RTW88IEEE80211::cmdConnect")
          connect_end = c.find("void RTW88IEEE80211::connectTCFn")
          segment = c[connect_start:connect_end]
          if "_nativePmkValid = false;" not in segment:
              c = c.replace(normal_anchor, normal_anchor + "\n    _nativePmkValid = false;", 1)

          insert_before = "void RTW88IEEE80211::connectTCFn(thread_call_param_t self, thread_call_param_t)"
          if "IOReturn RTW88IEEE80211::cmdConnectPMK" not in c:
              if insert_before not in c:
                  raise SystemExit("FATAL: connectTCFn anchor missing")
              fn = r'''
          IOReturn RTW88IEEE80211::cmdConnectPMK(const char *ssid, const uint8_t pmk[32])
          {
              if (_state == RTW88_STATE_SCANNING && !abortActiveScan(true))
                  return kIOReturnBusy;
              if (_state != RTW88_STATE_IDLE) return kIOReturnBusy;
              if (!ssid || !pmk) return kIOReturnBadArgument;

              clearKeys();
              releaseSta();

              IOLockLock(_bssLock);
              RTW88BSS *target = nullptr;
              for (RTW88BSS *b = _bssList; b; b = b->next) {
                  if (strlen(b->ssid) == strlen(ssid) &&
                      memcmp(b->ssid, ssid, strlen(ssid)) == 0) {
                      target = b;
                      break;
                  }
              }
              if (!target) {
                  IOLockUnlock(_bssLock);
                  return kIOReturnNotFound;
              }

              memcpy(&_targetBSS, target, sizeof(_targetBSS));
              IOLockUnlock(_bssLock);

              memset(_password, 0, sizeof(_password));
              memcpy(_pmk, pmk, 32);
              _nativePmkValid = true;
              _wpa2 = (_targetBSS.cipher == WLAN_CIPHER_SUITE_CCMP);
              _state = RTW88_STATE_AUTHENTICATING;

              IOLog("rtw88: native macOS PMK association for SSID %s\n", _targetBSS.ssid);

              if (_connectTC)
                  thread_call_enter(_connectTC);
              return kIOReturnSuccess;
          }

          '''
              c = c.replace(insert_before, fn + insert_before, 1)

          derive = '''        /* Derive PMK from passphrase now */
                  derivePMK((uint8_t *)_password, (uint8_t *)_targetBSS.ssid,
                            _targetBSS.ssid_len, _pmk);'''
          repl = '''        if (_nativePmkValid) {
                      IOLog("rtw88: using PMK supplied by macOS native Wi-Fi stack\\n");
                  } else {
                      derivePMK((uint8_t *)_password, (uint8_t *)_targetBSS.ssid,
                                _targetBSS.ssid_len, _pmk);
                  }'''
          if derive not in c:
              raise SystemExit("FATAL: PMK derivation anchor missing")
          c = c.replace(derive, repl, 1)

          cp.write_text(c)
          PY

          grep -F 'cmdConnectPMK' src/kext/RTW88IEEE80211.hpp >/dev/null
          grep -F 'using PMK supplied by macOS' src/kext/RTW88IEEE80211.cpp >/dev/null

      - name: Build working rtw88 backend
        shell: bash
        run: |
          set -euo pipefail
          cd Feixiao
          make clean
          make -j1 all

          test -f build/out/rtw88.kext/Contents/MacOS/rtw88
          test -f build/out/rtw88ctl
          test -f src/compat/fw_blobs.c

          grep -F 'rtw8821c_fw.bin' src/compat/fw_blobs.c >/dev/null

          if [ "$(wc -c < src/compat/fw_blobs.c)" -lt 10000 ]; then
            echo "FATAL: fw_blobs.c is too small; firmware was not embedded"
            exit 41
          fi

          echo "Embedded firmware blob size:"
          wc -c src/compat/fw_blobs.c

          P="build/out/rtw88.kext/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${P}")" = "8.5.3"
          test "$(/usr/libexec/PlistBuddy -c 'Print :IOKitPersonalities:RTL8821CE:IOClass' "${P}")" = "RTW88PCIDevice"

          echo "Stable rtw88.kext built."

      - name: Create isolated native bridge source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native/src native/rtw88native.kext/Contents/MacOS

          cat > native/src/RTW88BridgeAPI.hpp <<'EOF'
          #pragma once
          #include <IOKit/IOTypes.h>

          enum RTW88BridgeStateCode : UInt32 {
              RTW88_BRIDGE_STATE_IDLE = 0,
              RTW88_BRIDGE_STATE_SCANNING = 1,
              RTW88_BRIDGE_STATE_AUTHENTICATING = 2,
              RTW88_BRIDGE_STATE_ASSOCIATING = 3,
              RTW88_BRIDGE_STATE_HANDSHAKING = 4,
              RTW88_BRIDGE_STATE_CONNECTED = 5,
              RTW88_BRIDGE_STATE_DISCONNECTING = 6
          };

          struct RTW88BridgeState {
              UInt32 state;
              UInt8 bssid[6];
              char ssid[33];
              SInt32 rssi;
              UInt32 channel;
              UInt8 mac[6];
              UInt8 powered;
          };

          extern "C" IOReturn rtw88_bridge_power_on(void);
          extern "C" IOReturn rtw88_bridge_power_off(void);
          extern "C" IOReturn rtw88_bridge_scan(void);
          extern "C" IOReturn rtw88_bridge_disconnect(void);
          extern "C" IOReturn rtw88_bridge_connect(const char *, const char *);
          extern "C" IOReturn rtw88_bridge_connect_pmk(const char *, const UInt8 *, UInt32);
          extern "C" IOReturn rtw88_bridge_get_state(struct RTW88BridgeState *);
          extern "C" IOReturn rtw88_bridge_get_rssi(SInt32 *);
          extern "C" IOReturn rtw88_bridge_get_bss_list(UInt8 *, UInt32 *);
          EOF

          cat > native/src/RTW88NativeController.hpp <<'EOF'
          #pragma once

          #include "Apple80211.h"
          #include "RTW88BridgeAPI.hpp"

          class RTW88NativeController : public IO80211Controller {
              OSDeclareDefaultStructors(RTW88NativeController)

          public:
              bool init(OSDictionary *dict = nullptr) override;
              bool start(IOService *provider) override;
              void stop(IOService *provider) override;
              void free() override;

              bool isCommandProhibited(int) override;
              SInt32 handleCardSpecific(IO80211SkywalkInterface *, unsigned long, void *, bool) override;
              SInt32 enableFeature(IO80211FeatureCode, void *) override;

              IOReturn getDRIVER_VERSION(IO80211SkywalkInterface *, apple80211_version_data *) override;
              IOReturn getHARDWARE_VERSION(IO80211SkywalkInterface *, apple80211_version_data *) override;
              IOReturn getCARD_CAPABILITIES(IO80211SkywalkInterface *, apple80211_capability_data *) override;
              IOReturn getPOWER(IO80211SkywalkInterface *, apple80211_power_data *) override;
              IOReturn setPOWER(IO80211SkywalkInterface *, apple80211_power_data *) override;
              IOReturn getCOUNTRY_CODE(IO80211SkywalkInterface *, apple80211_country_code_data *) override;
              IOReturn setCOUNTRY_CODE(IO80211SkywalkInterface *, apple80211_country_code_data *) override;
              IOReturn setGET_DEBUG_INFO(IO80211SkywalkInterface *, apple80211_debug_command *) override;

              void postMessage(UInt, void *, unsigned long, UInt, void *) override;
              bool createWorkQueue() override;
              IO80211WorkQueue *getWorkQueue() override;

              UInt32 getFeatures() const override;
              bool requiresExplicitMBufRelease() override;
              bool flowIdSupported() override;
              SInt32 monitorModeSetEnabled(bool, UInt) override;
              IOReturn requestQueueSizeAndTimeout(unsigned short *, unsigned short *) override;
              bool getLogPipes(CCPipe **, CCPipe **, CCPipe **) override;
              void *getFaultReporterFromDriver() override;

              SInt32 apple80211SkywalkRequest(UInt requestType, int requestNumber,
                                              IO80211SkywalkInterface *iface,
                                              void *data) override;
              SInt32 apple80211SkywalkRequest(UInt requestType, int requestNumber,
                                              IO80211SkywalkInterface *iface,
                                              void *data, void *extra) override;

              bool useAppleRSNSupplicant(IO80211VirtualInterface *) override;
              IOReturn enable(IO80211SkywalkInterface *) override;
              IOReturn disable(IO80211SkywalkInterface *) override;

          private:
              IO80211WorkQueue *_wq = nullptr;
              bool _power = true;
              char _ssid[33] = {};
              UInt32 _authLower = APPLE80211_AUTHTYPE_OPEN;
              UInt32 _authUpper = APPLE80211_AUTHTYPE_NONE;
              UInt8 _scanBuf[4096] = {};
              UInt32 _scanLen = 0;
              UInt32 _scanPos = 4;
          };
          EOF

          cat > native/src/RTW88NativeController.cpp <<'EOF'
          #include "RTW88NativeController.hpp"
          #include <IOKit/IOLib.h>
          #include <libkern/libkern.h>

          #define super IO80211Controller
          OSDefineMetaClassAndStructors(RTW88NativeController, IO80211Controller)

          bool RTW88NativeController::init(OSDictionary *dict)
          {
              return super::init(dict);
          }

          bool RTW88NativeController::start(IOService *provider)
          {
              IOLog("rtw88native: start provider=%p\n", provider);

              if (!provider || strcmp(provider->getMetaClass()->getClassName(), "RTW88PCIDevice") != 0) {
                  IOLog("rtw88native: provider is not RTW88PCIDevice\n");
                  return false;
              }

              RTW88BridgeState st = {};
              if (rtw88_bridge_get_state(&st) != kIOReturnSuccess) {
                  IOLog("rtw88native: backend C API not ready\n");
                  return false;
              }

              _wq = IO80211WorkQueue::workQueue();
              if (!_wq) {
                  IOLog("rtw88native: workqueue creation failed\n");
                  return false;
              }

              UInt8 builtIn = 0;
              OSData *data = OSData::withBytes(&builtIn, sizeof(builtIn));
              if (data) {
                  setProperty("built-in", data);
                  data->release();
              }
              setProperty("DriverKitDriver", kOSBooleanFalse);

              IOLog("rtw88native: calling IO80211Controller::start\n");
              bool ok = super::start(provider);
              IOLog("rtw88native: IO80211Controller::start returned %d\n", ok ? 1 : 0);

              if (!ok) {
                  _wq->release();
                  _wq = nullptr;
                  return false;
              }

              registerService();
              IOLog("rtw88native: native controller ready\n");
              return true;
          }

          void RTW88NativeController::stop(IOService *provider)
          {
              IOLog("rtw88native: stop\n");
              if (_wq) { _wq->release(); _wq = nullptr; }
              super::stop(provider);
          }

