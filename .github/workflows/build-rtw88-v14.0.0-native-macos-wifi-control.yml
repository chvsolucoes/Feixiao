              if (!d) return kIOReturnBadArgument;
              memset(d, 0, sizeof(*d));
              d->version = APPLE80211_VERSION;
              d->num_radios = 1;
              d->power_state[0] = _power ? APPLE80211_POWER_ON : APPLE80211_POWER_OFF;
              return kIOReturnSuccess;
