              return kIOReturnSuccess;
          }

          IOReturn RTW88NativeController::getHARDWARE_VERSION(
              IO80211SkywalkInterface *, apple80211_version_data *d)
          {
              if (!d) return kIOReturnBadArgument;
              memset(d, 0, sizeof(*d));
              d->version = APPLE80211_VERSION;
