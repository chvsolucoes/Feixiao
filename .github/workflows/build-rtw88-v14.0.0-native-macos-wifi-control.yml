      - name: Build isolated native bridge
        shell: bash
        run: |
          set -euo pipefail

          SDK="$(xcrun --show-sdk-path)"
          MKSDK="$PWD/Feixiao/MacKernelSDK"

          CXXFLAGS=(
            -fno-exceptions -fno-rtti -fno-stack-protector -mkernel
            -arch x86_64 -mmacosx-version-min=11.0
            -isysroot "$SDK"
            -I"$MKSDK/Headers"
            -I"$SDK/System/Library/Frameworks/Kernel.framework/Headers"
            -I"$PWD/itlwm/include/Airport"
            -I"$PWD/itlwm/include"
            -I"$PWD/Feixiao/src/compat"
            -I"$PWD/Feixiao/src/compat/linux"
            -fapple-kext -std=c++17
            -DKERNEL -DIO80211FAMILY_V2=1 -D__IO80211_TARGET=__MAC_11_0
            -Wno-deprecated-declarations
            -Wno-nullability-completeness
          )

          CFLAGS=(
            -fno-stack-protector -mkernel
            -arch x86_64 -mmacosx-version-min=11.0
            -isysroot "$SDK"
            -I"$MKSDK/Headers"
            -I"$SDK/System/Library/Frameworks/Kernel.framework/Headers"
          )

          mkdir -p native/build

          xcrun clang++ "${CXXFLAGS[@]}" \
            -c native/src/RTW88NativeController.cpp \
            -o native/build/RTW88NativeController.o

          xcrun clang "${CFLAGS[@]}" \
            -c native/src/kmod_info.c \
            -o native/build/kmod_info.o

          xcrun clang++ \
            -arch x86_64 \
            -static -nostdlib -Xlinker -kext \
            "$MKSDK/Library/x86_64/libkmod.a" \
            "$MKSDK/Library/universal/libkmodc++.a" \
            -F"$SDK/System/Library/Frameworks" \
            -o native/rtw88native.kext/Contents/MacOS/rtw88native \
            native/build/RTW88NativeController.o \
            native/build/kmod_info.o

          test -f native/rtw88native.kext/Contents/MacOS/rtw88native
          file native/rtw88native.kext/Contents/MacOS/rtw88native
          nm native/rtw88native.kext/Contents/MacOS/rtw88native | c++filt | \
            grep -F 'RTW88NativeController::start(' >/dev/null

          echo "===== C API imports ====="
          nm -u native/rtw88native.kext/Contents/MacOS/rtw88native | \
            grep 'rtw88_bridge_' | sort -u

          if grep -E 'RTW88_STATE_(CONNECTED|SCANNING|AUTHENTICATING|ASSOCIATING|HANDSHAKING)' \
             native/src/RTW88NativeController.cpp; then
            echo "FATAL: native bridge references private backend RTW88_STATE_* names"
            exit 83
          fi

          grep -F 'RTW88_BRIDGE_STATE_CONNECTED' native/src/RTW88BridgeAPI.hpp >/dev/null
          grep -F 'APPLE80211_IOC_SCAN_RESULT' native/src/RTW88NativeController.cpp >/dev/null
          grep -F 'apple80211_assoc_data' native/src/RTW88NativeController.cpp >/dev/null
          grep -F 'rtw88_bridge_connect_pmk' native/src/RTW88NativeController.cpp >/dev/null

          if nm -u native/rtw88native.kext/Contents/MacOS/rtw88native | c++filt | \
             grep -E 'RTW88PCIDevice::|RTW88IEEE80211::'; then
            echo "FATAL: native bridge still imports backend C++ symbols"
            exit 81
          fi

      - name: Verify stable driver was not converted
        shell: bash
        run: |
          set -euo pipefail
          cd Feixiao

          grep -F 'class RTW88PCIDevice : public IOEthernetController' \
            src/kext/RTW88PCIDevice.hpp >/dev/null

          BIN="build/out/rtw88.kext/Contents/MacOS/rtw88"
          nm "${BIN}" | c++filt | grep -F 'RTW88PCIDevice::start(' >/dev/null

          if nm "${BIN}" | c++filt | grep -F 'RTW88PCIWrapper::' >/dev/null; then
            echo "FATAL: wrapper leaked into stable driver"
            exit 1
          fi

          for sym in \
            rtw88_bridge_power_on \
            rtw88_bridge_power_off \
            rtw88_bridge_scan \
            rtw88_bridge_disconnect \
            rtw88_bridge_connect \
            rtw88_bridge_connect_pmk \
            rtw88_bridge_get_state \
            rtw88_bridge_get_rssi \
            rtw88_bridge_get_bss_list
          do
            nm "${BIN}" | grep -E "[[:space:]]_${sym}$" >/dev/null || {
              echo "FATAL: missing backend C API export ${sym}"
              exit 82
            }
          done

          echo "Stable driver remains independent and exports the bridge C API."

          echo "===== backend exported bridge symbols ====="
          nm "${BIN}" | grep -E '_rtw88_bridge_(power_on|power_off|scan|disconnect|connect|connect_pmk|get_state|get_rssi|get_bss_list)$' | sort

          echo "===== backend class still IOEthernetController ====="
          grep -F 'class RTW88PCIDevice : public IOEthernetController' src/kext/RTW88PCIDevice.hpp

      - name: Validate native bridge for OpenCore injection
        shell: bash
        run: |
          set -euo pipefail

          P="native/rtw88native.kext/Contents/Info.plist"
          B="native/rtw88native.kext/Contents/MacOS/rtw88native"

          plutil -lint "${P}"

          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${P}")" = "com.rtw88.native"
          test "$(/usr/libexec/PlistBuddy -c 'Print :IOKitPersonalities:RTW88NativeController:IOProviderClass' "${P}")" = "RTW88PCIDevice"

          if /usr/libexec/PlistBuddy -c 'Print :OSBundleRequired' "${P}" >/dev/null 2>&1; then
            echo "FATAL: native bridge must not use OSBundleRequired in this build"
            exit 61
          fi

          if /usr/libexec/PlistBuddy -c 'Print :IOKitPersonalities:RTW88NativeController:IOResourceMatch' "${P}" >/dev/null 2>&1; then
            echo "FATAL: native bridge must not be gated by IOResourceMatch"
            exit 62
          fi

          echo "Undefined symbols in native bridge:"
          nm -u "${B}" | c++filt | sed -n '1,220p'

          echo
          echo "Backend dependency:"
          /usr/libexec/PlistBuddy -c 'Print :OSBundleLibraries:com.rtw88.driver' "${P}"

          echo
          echo "Native bridge OpenCore injection validation: OK"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package

          cp -R Feixiao/build/out/rtw88.kext package/
          cp -R native/rtw88native.kext package/
          cp Feixiao/build/out/rtw88ctl package/

          cat > package/LEIA-ME.txt <<'EOF'
          RTW88 v14.0.0 — NATIVE macOS WIFI CONTROL

          CORREÇÕES
          ---------
          - APPLE80211_IOC_SCAN_RESULT implementado.
          - Cache de BSS do Feixiao convertido para apple80211_scan_result.
          - SCAN_CACHE_UPDATED e SCAN_DONE enviados ao macOS.
          - APPLE80211_IOC_AUTH_TYPE implementado.
          - APPLE80211_IOC_ASSOCIATE agora lê apple80211_assoc_data.
          - WPA2 usa o PMK de 32 bytes entregue pelo macOS.
          - O caminho antigo rtw88ctl + senha continua preservado.

          OPENCORE
          --------
          EFI/OC/Kexts:
            1. rtw88.kext
            2. rtw88native.kext

          Faça OC Snapshot e mantenha essa ordem.

          OBJETIVO
          --------
          Controlar pelo próprio macOS:
          - ligar/desligar Wi-Fi;
          - listar redes 2.4/5 GHz;
          - selecionar rede;
          - informar credencial pelo sistema;
          - conectar/desconectar.

          TESTE
          -----
          kmutil showloaded | grep -Ei 'rtw88|IO80211'
          ioreg -p IOService -l -w0 | grep -E 'RTW88PCIDevice|RTW88NativeController'

          LIMITES
          -------
          AirDrop/AWDL não implementado.
          Bluetooth Realtek USB é separado.
          EOF

          shasum -a 256 \
            package/rtw88.kext/Contents/MacOS/rtw88 \
            package/rtw88native.kext/Contents/MacOS/rtw88native \
            package/rtw88ctl > package/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}
          path: package
          if-no-files-found: error
