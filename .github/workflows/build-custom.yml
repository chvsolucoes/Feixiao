name: Build Feixiao v1.0.2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Feixiao v1.0.2
        uses: actions/checkout@v4
        with:
          repository: thegwchr/Feixiao
          ref: v1.0.2
          submodules: recursive
          path: Feixiao

      - name: Clone rtw88-stable
        run: |
          git clone --depth 1 https://github.com/thegwchr/rtw88-stable.git

      - name: Download firmware
        run: |
          cd Feixiao/firmware
          for fw in rtw8822b_fw.bin rtw8822c_fw.bin rtw8821c_fw.bin \
                    rtw8821a_fw.bin rtw8812a_fw.bin rtw8814a_fw.bin; do
            if [ ! -s "$fw" ]; then
              curl -sLO "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtw88/$fw"
            fi
          done

      - name: Build
        working-directory: Feixiao
        run: |
          make all

      - name: Package
        run: |
          cd Feixiao/build/out
          zip -r "${{ runner.temp }}/Feixiao_v1.0.2_HP256G8.zip" rtw88.kext rtw88ctl

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Feixiao-v1.0.2-HP256G8
          path: ${{ runner.temp }}/Feixiao_v1.0.2_HP256G8.zip
