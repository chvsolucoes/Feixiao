name: Build HP256G8 RTL8821CE v8.6.1 Performance Unlock

"on":
  workflow_dispatch:

permissions:
  contents: read

env:
  FEIXIAO_REF: e963f43188382eced4ef2fa75d19ce4db2315c68
  RTW88_REF: d029a677c49266fad86750714eb5612becd134d3
  BUILD_NAME: Feixiao-HP256G8-v8.6.1-Performance-Unlock

jobs:

  build:

    name: Build HP256G8 v8.6.1
    runs-on: macos-latest
    timeout-minutes: 30

    steps:

      # ================================================================
      # 01
      # CHECKOUT FEIXIAO
      # ================================================================

      - name: Checkout Feixiao
        uses: actions/checkout@v4
        with:
          repository: thegwchr/Feixiao
          ref: ${{ env.FEIXIAO_REF }}
          path: Feixiao
          fetch-depth: 1
          submodules: recursive


      # ================================================================
      # 02
      # VALIDATE MACKERNELSDK
      # ================================================================

      - name: Validate MacKernelSDK
        shell: bash
        run: |
          set -eu

          echo
          echo "============================================================"
          echo "MACKERNELSDK"
          echo "============================================================"

          test -d Feixiao/MacKernelSDK
          test -d Feixiao/MacKernelSDK/Headers

          SDK_COMMIT="$(git -C Feixiao/MacKernelSDK rev-parse HEAD)"

          echo "MacKernelSDK:"
          echo "${SDK_COMMIT}"

          HEADER_COUNT="$(
            find Feixiao/MacKernelSDK/Headers \
              -type f \
              | wc -l \
              | tr -d ' '
          )"

          echo "Headers: ${HEADER_COUNT}"

          if [ "${HEADER_COUNT}" -lt 100 ]; then
            echo "ERROR: MacKernelSDK incomplete"
            exit 1
          fi

          echo "MacKernelSDK: OK"


      # ================================================================
      # 03
      # CLONE RTW88-STABLE
      # ================================================================

      - name: Clone matching rtw88-stable
        shell: bash
        run: |
          set -eu

          git clone \
            https://github.com/thegwchr/rtw88-stable.git \
            rtw88-stable

          git \
            -C rtw88-stable \
            checkout \
            "${RTW88_REF}"

          echo
          echo "============================================================"
          echo "SOURCE COMMITS"
          echo "============================================================"

          echo "Feixiao:"
          git -C Feixiao rev-parse HEAD

          echo
          echo "rtw88-stable:"
          git -C rtw88-stable rev-parse HEAD


      # ================================================================
      # 04
      # VALIDATE EXACT REVISIONS
      # ================================================================

      - name: Validate exact revisions
        shell: bash
        run: |
          set -eu

          FEIXIAO_ACTUAL="$(git -C Feixiao rev-parse HEAD)"
          RTW88_ACTUAL="$(git -C rtw88-stable rev-parse HEAD)"

          if [ "${FEIXIAO_ACTUAL}" != "${FEIXIAO_REF}" ]; then
            echo "ERROR: wrong Feixiao commit"
            exit 1
          fi

          if [ "${RTW88_ACTUAL}" != "${RTW88_REF}" ]; then
            echo "ERROR: wrong rtw88-stable commit"
            exit 1
          fi

          echo "Exact revisions: OK"


      # ================================================================
      # 05
      # VALIDATE SOURCE FILES
      # ================================================================

      - name: Validate source files
        shell: bash
        run: |
          set -eu

          REQUIRED="
          Feixiao/Makefile
          Feixiao/src/kext/RTW88IEEE80211.cpp
          Feixiao/src/kext/RTW88IEEE80211.hpp
          Feixiao/src/kext/RTW88PCIDevice.cpp
          Feixiao/src/kext/RTW88PCIDevice.hpp
          Feixiao/src/compat/rtw88_compat.c
          Feixiao/src/compat/rtw88_compat.h
          rtw88-stable/drivers/net/wireless/realtek/rtw88/main.c
          rtw88-stable/drivers/net/wireless/realtek/rtw88/pci.c
          "

          for FILE in ${REQUIRED}
          do
            if [ ! -f "${FILE}" ]; then
              echo "ERROR: missing ${FILE}"
              exit 1
            fi

            echo "[OK] ${FILE}"
          done


      # ================================================================
      # 06
      # VALIDATE STABLE FOUNDATION
      # ================================================================

      - name: Validate v8.5.3 performance foundation
        shell: bash
        run: |
          set -eu

          IEEE="Feixiao/src/kext/RTW88IEEE80211.cpp"
          PCIDEV="Feixiao/src/kext/RTW88PCIDevice.cpp"
          COMPAT="Feixiao/src/compat/rtw88_compat.c"
          MAIN="rtw88-stable/drivers/net/wireless/realtek/rtw88/main.c"

          echo
          echo "============================================================"
          echo "5 GHZ / VHT"
          echo "============================================================"

          grep -q "_connChanWidth = 20" "${IEEE}"
          grep -q "_connChanWidth = 40" "${IEEE}"
          grep -q "_connChanWidth = 80" "${IEEE}"
          grep -q "NL80211_CHAN_WIDTH_80" "${IEEE}"

          grep -q \
            "chip80 && vhtWidth == 1 && vhtSeg0 != 0" \
            "${IEEE}"

          echo "20 MHz: OK"
          echo "40 MHz: OK"
          echo "80 MHz: OK"

          echo
          echo "============================================================"
          echo "HT CAPABILITY"
          echo "============================================================"

          grep -q \
            'if (_connChanWidth < 40)' \
            "${IEEE}"

          grep -q \
            'IEEE80211_HT_CAP_SUP_WIDTH_20_40' \
            "${IEEE}"

          echo "HT40 capability: OK"

          echo
          echo "============================================================"
          echo "STA BANDWIDTH"
          echo "============================================================"

          grep -q \
            '(_connChanWidth == 80) ? IEEE80211_STA_RX_BW_80' \
            "${IEEE}"

          grep -q \
            'IEEE80211_STA_RX_BW_40' \
            "${IEEE}"

          echo "STA 80 MHz bandwidth path: OK"

          echo
          echo "============================================================"
          echo "A-MPDU"
          echo "============================================================"

          grep -q "startTxAggregation" "${IEEE}"
          grep -q "sendAddbaRequest" "${IEEE}"
          grep -q "rxReorderInput" "${IEEE}"

          echo "TX A-MPDU: OK"
          echo "RX reorder: OK"

          echo
          echo "============================================================"
          echo "WATCHDOG SAFE MODE"
          echo "============================================================"

          grep -q \
            'bool rtw88_disable_watchdog_work = true;' \
            "${COMPAT}"

          grep -q \
            'if (rtw88_disable_watchdog_work)' \
            "${MAIN}"

          grep -q \
            'rtw_hci_dynamic_rx_agg' \
            "${MAIN}"

          echo "Stable watchdog bypass: OK"

          echo
          echo "============================================================"
          echo "TX FLOW CONTROL"
          echo "============================================================"

          grep -q \
            'kRTW88TxStallAvail = 96;' \
            "${PCIDEV}"

          grep -q \
            'kRTW88TxResumeAvail = 160;' \
            "${PCIDEV}"

          echo "Original TX thresholds 96/160: OK"


      # ================================================================
      # 07
      # V8.6.1 SAFE RX PERFORMANCE PATCH
      #
      # NO HAND-WRITTEN GIT PATCH
      # NO @@ HUNK COUNTS
      # NO PYTHON
      #
      # ================================================================

      - name: Apply v8.6.1 safe dynamic RX aggregation
        shell: bash
        run: |
          set -eu

          FILE="rtw88-stable/drivers/net/wireless/realtek/rtw88/main.c"

          echo
          echo "============================================================"
          echo "V8.6.1 SAFE RX AGGREGATION"
          echo "============================================================"

          BEFORE_COUNT="$(
            grep -c \
              'if (rtw88_disable_watchdog_work)' \
              "${FILE}" \
              || true
          )"

          echo "Original watchdog branch count: ${BEFORE_COUNT}"

          if [ "${BEFORE_COUNT}" -ne 1 ]; then
            echo "ERROR: watchdog branch not uniquely found"
            exit 1
          fi

          ORIGINAL_BLOCK_COUNT="$(
            perl -0777 -ne '
              while (
                /\tif \(rtw88_disable_watchdog_work\)\n\t\tgoto unlock;/g
              ) {
                $count++;
              }
              END {
                print $count || 0;
              }
            ' "${FILE}"
          )"

          echo "Exact original block count: ${ORIGINAL_BLOCK_COUNT}"

          if [ "${ORIGINAL_BLOCK_COUNT}" -ne 1 ]; then
            echo "ERROR: exact watchdog block not found"
            exit 1
          fi

          perl -0pi -e '
            s{
              \tif[ ]\(rtw88_disable_watchdog_work\)\n
              \t\tgoto[ ]unlock;
            }{
              \tif (rtw88_disable_watchdog_work) {\n
              \t\trtw_hci_dynamic_rx_agg(rtwdev, true);\n
              \t\tgoto unlock;\n
              \t}
            }x
          ' "${FILE}"

          grep -q \
            'rtw_hci_dynamic_rx_agg(rtwdev, true);' \
            "${FILE}"

          AFTER_EXACT="$(
            perl -0777 -ne '
              while (
                /\tif \(rtw88_disable_watchdog_work\) \{\n\t\trtw_hci_dynamic_rx_agg\(rtwdev, true\);\n\t\tgoto unlock;\n\t\}/g
              ) {
                $count++;
              }
              END {
                print $count || 0;
              }
            ' "${FILE}"
          )"

          echo "Patched block count: ${AFTER_EXACT}"

          if [ "${AFTER_EXACT}" -ne 1 ]; then
            echo "ERROR: RX aggregation patch validation failed"
            exit 1
          fi

          echo
          echo "Patched watchdog block:"
          echo

          grep -n \
            -A 8 \
            -B 4 \
            'if (rtw88_disable_watchdog_work)' \
            "${FILE}"

          echo
          echo "Safe RX aggregation patch: OK"


      # ================================================================
      # 08
      # TX BACKPRESSURE PERFORMANCE TUNING
      # ================================================================

      - name: Tune v8.6.1 TX backpressure
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/src/kext/RTW88PCIDevice.cpp"

          echo
          echo "============================================================"
          echo "V8.6.1 TX BACKPRESSURE"
          echo "============================================================"

          OLD_STALL="$(
            grep -c \
              'kRTW88TxStallAvail = 96;' \
              "${FILE}" \
              || true
          )"

          OLD_RESUME="$(
            grep -c \
              'kRTW88TxResumeAvail = 160;' \
              "${FILE}" \
              || true
          )"

          if [ "${OLD_STALL}" -ne 1 ]; then
            echo "ERROR: original stall threshold not found exactly once"
            exit 1
          fi

          if [ "${OLD_RESUME}" -ne 1 ]; then
            echo "ERROR: original resume threshold not found exactly once"
            exit 1
          fi

          sed -i '' \
            's/kRTW88TxStallAvail = 96;/kRTW88TxStallAvail = 64;/' \
            "${FILE}"

          sed -i '' \
            's/kRTW88TxResumeAvail = 160;/kRTW88TxResumeAvail = 128;/' \
            "${FILE}"

          NEW_STALL="$(
            grep -c \
              'kRTW88TxStallAvail = 64;' \
              "${FILE}" \
              || true
          )"

          NEW_RESUME="$(
            grep -c \
              'kRTW88TxResumeAvail = 128;' \
              "${FILE}" \
              || true
          )"

          if [ "${NEW_STALL}" -ne 1 ]; then
            echo "ERROR: v8.6.1 stall threshold validation failed"
            exit 1
          fi

          if [ "${NEW_RESUME}" -ne 1 ]; then
            echo "ERROR: v8.6.1 resume threshold validation failed"
            exit 1
          fi

          grep -n \
            'kRTW88Tx.*Avail' \
            "${FILE}"

          echo
          echo "TX stall : 64"
          echo "TX resume: 128"
          echo "TX tuning: OK"


      # ================================================================
      # 09
      # PRESERVE STABLE RF WATCHDOG BYPASS
      # ================================================================

      - name: Preserve stable RF watchdog bypass
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/src/compat/rtw88_compat.c"

          grep -q \
            'bool rtw88_disable_watchdog_work = true;' \
            "${FILE}"

          if grep -q \
            'bool rtw88_disable_watchdog_work = false;' \
            "${FILE}"
          then
            echo "ERROR: full RF watchdog was accidentally enabled"
            exit 1
          fi

          echo
          echo "============================================================"
          echo "RF WATCHDOG"
          echo "============================================================"

          echo "Full RF watchdog: DISABLED"
          echo "Dynamic RX aggregation: separately enabled"
          echo "Stable v8.5.3 RF behavior preserved."


      # ================================================================
      # 10
      # VALIDATE 80 MHZ CHANNEL PATH
      # ================================================================

      - name: Validate VHT 80 MHz channel path
        shell: bash
        run: |
          set -eu

          IEEE="Feixiao/src/kext/RTW88IEEE80211.cpp"
          MAIN="rtw88-stable/drivers/net/wireless/realtek/rtw88/main.c"

          echo
          echo "============================================================"
          echo "80 MHZ DATA PATH"
          echo "============================================================"

          grep -q \
            '_connChanWidth = 80;' \
            "${IEEE}"

          grep -q \
            'NL80211_CHAN_WIDTH_80' \
            "${IEEE}"

          grep -q \
            'IEEE80211_STA_RX_BW_80' \
            "${IEEE}"

          grep -q \
            'case IEEE80211_STA_RX_BW_80:' \
            "${MAIN}"

          grep -q \
            'bw_mode = RTW_CHANNEL_WIDTH_80;' \
            "${MAIN}"

          echo "Connected chandef 80 MHz: OK"
          echo "STA bandwidth 80 MHz: OK"
          echo "Rate-control 80 MHz path: OK"


      # ================================================================
      # 11
      # VALIDATE VHT RATE ADAPTATION
      # ================================================================

      - name: Validate VHT firmware rate adaptation
        shell: bash
        run: |
          set -eu

          MAIN="rtw88-stable/drivers/net/wireless/realtek/rtw88/main.c"

          echo
          echo "============================================================"
          echo "VHT RATE ADAPTATION"
          echo "============================================================"

          grep -q \
            'RA_MASK_VHT_RATES_1SS' \
            "${MAIN}"

          grep -q \
            'RTW_RATEID_ARFR1_AC_1SS' \
            "${MAIN}"

          grep -q \
            'get_vht_ra_mask' \
            "${MAIN}"

          grep -q \
            'rtw_fw_send_ra_info' \
            "${MAIN}"

          echo "VHT 1SS mask: OK"
          echo "AC 1SS rate ID: OK"
          echo "VHT RA generator: OK"
          echo "Firmware RA update: OK"


      # ================================================================
      # 12
      # VALIDATE A-MPDU
      # ================================================================

      - name: Validate A-MPDU performance path
        shell: bash
        run: |
          set -eu

          IEEE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          echo
          echo "============================================================"
          echo "A-MPDU"
          echo "============================================================"

          grep -q \
            'startTxAggregation' \
            "${IEEE}"

          grep -q \
            'sendAddbaRequest' \
            "${IEEE}"

          grep -q \
            'sendAddbaResponse' \
            "${IEEE}"

          grep -q \
            'rxReorderInput' \
            "${IEEE}"

          echo "TX A-MPDU: OK"
          echo "ADDBA request: OK"
          echo "ADDBA response: OK"
          echo "RX reorder: OK"


      # ================================================================
      # 13
      # VALIDATE PCI / DMA STABILITY CODE REMAINS UNCHANGED
      # ================================================================

      - name: Validate stable PCI DMA path
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/src/kext/RTW88PCIDevice.cpp"

          echo
          echo "============================================================"
          echo "PCI / DMA"
          echo "============================================================"

          grep -q \
            '_pciDev->setBusMasterEnable(true)' \
            "${FILE}"

          grep -q \
            '_pciDev->setMemoryEnable(true)' \
            "${FILE}"

          grep -q \
            'compat_dma_map' \
            "${FILE}"

          grep -q \
            'compat_dma_unmap' \
            "${FILE}"

          grep -q \
            'compat_dma_sync_cpu' \
            "${FILE}"

          grep -q \
            'syncBounceForCpu' \
            "${FILE}"

          echo "PCI Bus Master: OK"
          echo "PCI Memory: OK"
          echo "Bounce DMA map: OK"
          echo "DMA sync: OK"
          echo
          echo "DMA implementation intentionally unchanged."


      # ================================================================
      # 14
      # VALIDATE MACOS SAFE MBUF PATH
      # ================================================================

      - name: Validate safe macOS RX mbuf path
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/src/kext/RTW88PCIDevice.cpp"

          echo
          echo "============================================================"
          echo "SAFE MBUF"
          echo "============================================================"

          grep -q \
            'mbuf_pkthdr_len' \
            "${FILE}"

          grep -q \
            'mbuf_len' \
            "${FILE}"

          grep -q \
            'dropping bogus mbuf' \
            "${FILE}"

          grep -q \
            'kInputOptionQueuePacket' \
            "${FILE}"

          echo "pkthdr validation: OK"
          echo "m_len validation: OK"
          echo "invalid mbuf drop: OK"
          echo "queued RX injection: OK"


      # ================================================================
      # 15
      # VALIDATE FINAL SOURCE MODIFICATIONS
      # ================================================================

      - name: Validate all v8.6.1 source changes
        shell: bash
        run: |
          set -eu

          MAIN="rtw88-stable/drivers/net/wireless/realtek/rtw88/main.c"
          PCI="Feixiao/src/kext/RTW88PCIDevice.cpp"
          COMPAT="Feixiao/src/compat/rtw88_compat.c"

          echo
          echo "============================================================"
          echo "FINAL SOURCE VALIDATION"
          echo "============================================================"

          grep -q \
            'if (rtw88_disable_watchdog_work) {' \
            "${MAIN}"

          grep -q \
            'rtw_hci_dynamic_rx_agg(rtwdev, true);' \
            "${MAIN}"

          grep -q \
            'kRTW88TxStallAvail = 64;' \
            "${PCI}"

          grep -q \
            'kRTW88TxResumeAvail = 128;' \
            "${PCI}"

          grep -q \
            'bool rtw88_disable_watchdog_work = true;' \
            "${COMPAT}"

          echo "[OK] Safe watchdog branch"
          echo "[OK] Dynamic RX aggregation"
          echo "[OK] TX stall 64"
          echo "[OK] TX resume 128"
          echo "[OK] RF watchdog remains bypassed"

          echo
          echo "v8.6.1 source validation: PASSED"


      # ================================================================
      # 16
      # SHOW MODIFIED SOURCE
      # ================================================================

      - name: Show v8.6.1 source changes
        shell: bash
        run: |
          set -eu

          echo
          echo "============================================================"
          echo "FEIXIAO DIFF"
          echo "============================================================"

          git \
            -C Feixiao \
            diff \
            -- \
            src/kext/RTW88PCIDevice.cpp

          echo
          echo "============================================================"
          echo "RTW88-STABLE DIFF"
          echo "============================================================"

          git \
            -C rtw88-stable \
            diff \
            -- \
            drivers/net/wireless/realtek/rtw88/main.c


      # ================================================================
      # 17
      # DOWNLOAD REALTEK FIRMWARE
      # ================================================================

      - name: Download Realtek firmware
        shell: bash
        run: |
          set -eu

          cd Feixiao/firmware

          FIRMWARE_FILES="
          rtw8822b_fw.bin
          rtw8822c_fw.bin
          rtw8821c_fw.bin
          rtw8821a_fw.bin
          rtw8812a_fw.bin
          rtw8814a_fw.bin
          "

          for FW in ${FIRMWARE_FILES}
          do

            if [ ! -s "${FW}" ]; then

              echo "Downloading ${FW}"

              curl \
                --location \
                --fail \
                --retry 3 \
                --retry-delay 2 \
                "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtw88/${FW}" \
                --output "${FW}"

            fi

            if [ ! -s "${FW}" ]; then
              echo "ERROR: firmware missing: ${FW}"
              exit 1
            fi

            echo "[OK] ${FW}"
            ls -lh "${FW}"

          done


      # ================================================================
      # 18
      # VALIDATE RTL8821C FIRMWARE
      # ================================================================

      - name: Validate RTL8821C firmware
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/firmware/rtw8821c_fw.bin"

          test -s "${FILE}"

          SIZE="$(stat -f "%z" "${FILE}")"

          echo "RTL8821C firmware size: ${SIZE} bytes"

          if [ "${SIZE}" -lt 50000 ]; then
            echo "ERROR: suspicious RTL8821C firmware size"
            exit 1
          fi

          echo "RTL8821C firmware: OK"


      # ================================================================
      # 19
      # SHOW BUILD ENVIRONMENT
      # ================================================================

      - name: Show build environment
        shell: bash
        run: |
          set -eu

          echo
          echo "============================================================"
          echo "MACOS"
          echo "============================================================"

          sw_vers

          echo
          echo "============================================================"
          echo "XCODE"
          echo "============================================================"

          xcodebuild -version

          echo
          echo "============================================================"
          echo "CLANG"
          echo "============================================================"

          clang --version

          echo
          echo "============================================================"
          echo "SDK"
          echo "============================================================"

          xcrun --sdk macosx --show-sdk-path

          echo
          echo "============================================================"
          echo "MACKERNELSDK"
          echo "============================================================"

          git \
            -C Feixiao/MacKernelSDK \
            rev-parse \
            HEAD


      # ================================================================
      # 20
      # CLEAN BUILD
      # ================================================================

      - name: Clean previous build
        shell: bash
        working-directory: Feixiao
        run: |
          set -eu

          make clean || true
          rm -rf build/out || true

          echo "Clean build directory: OK"


      # ================================================================
      # 21
      # BUILD
      # ================================================================

      - name: Build HP256G8 v8.6.1
        shell: bash
        working-directory: Feixiao
        run: |
          set -eu

          echo
          echo "============================================================"
          echo "HP 256 G8"
          echo "REALTEK RTL8821CE"
          echo "V8.6.1 PERFORMANCE UNLOCK"
          echo "============================================================"
          echo
          echo "5 GHz            : enabled"
          echo "HT 40 MHz        : enabled"
          echo "VHT 80 MHz       : enabled"
          echo "VHT 1SS          : enabled"
          echo "Firmware RA      : enabled"
          echo "TX A-MPDU        : enabled"
          echo "RX A-MPDU        : enabled"
          echo "Dynamic RX agg   : enabled"
          echo "TX stall/resume  : 64 / 128"
          echo "RF watchdog      : safe bypass"
          echo "DMA path         : unchanged"
          echo

          make all


      # ================================================================
      # 22
      # VALIDATE GENERATED FIRMWARE SOURCE
      # ================================================================

      - name: Validate generated firmware source
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/src/compat/fw_blobs.c"

          if [ ! -s "${FILE}" ]; then
            echo "ERROR: fw_blobs.c missing"
            exit 1
          fi

          SIZE="$(stat -f "%z" "${FILE}")"

          echo "fw_blobs.c size: ${SIZE} bytes"

          if [ "${SIZE}" -lt 10000 ]; then
            echo "ERROR: fw_blobs.c suspiciously small"
            exit 1
          fi

          echo "Embedded firmware source: OK"


      # ================================================================
      # 23
      # VERIFY BUILD OUTPUT
      # ================================================================

      - name: Verify v8.6.1 build output
        shell: bash
        run: |
          set -eu

          KEXT="Feixiao/build/out/rtw88.kext"
          CTL="Feixiao/build/out/rtw88ctl"

          if [ ! -d "${KEXT}" ]; then
            echo "ERROR: rtw88.kext missing"
            exit 1
          fi

          if [ ! -f "${KEXT}/Contents/Info.plist" ]; then
            echo "ERROR: Info.plist missing"
            exit 1
          fi

          if [ ! -f "${KEXT}/Contents/MacOS/rtw88" ]; then
            echo "ERROR: kext executable missing"
            exit 1
          fi

          if [ ! -f "${CTL}" ]; then
            echo "ERROR: rtw88ctl missing"
            exit 1
          fi

          echo "rtw88.kext: OK"
          echo "rtw88ctl: OK"


      # ================================================================
      # 24
      # VALIDATE INFO.PLIST
      # ================================================================

      - name: Validate Info.plist
        shell: bash
        run: |
          set -eu

          PLIST="Feixiao/build/out/rtw88.kext/Contents/Info.plist"

          plutil \
            -lint \
            "${PLIST}"

          echo
          echo "Bundle ID:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "${PLIST}"


      # ================================================================
      # 25
      # VALIDATE MACH-O
      # ================================================================

      - name: Validate Mach-O binaries
        shell: bash
        run: |
          set -eu

          BIN="Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88"
          CTL="Feixiao/build/out/rtw88ctl"

          echo
          echo "============================================================"
          echo "KEXT"
          echo "============================================================"

          file "${BIN}"

          dwarfdump \
            --uuid \
            "${BIN}"

          echo
          echo "============================================================"
          echo "RTW88CTL"
          echo "============================================================"

          file "${CTL}"


      # ================================================================
      # 26
      # VALIDATE BINARY SIZE
      # ================================================================

      - name: Validate kext binary size
        shell: bash
        run: |
          set -eu

          BIN="Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88"

          SIZE="$(stat -f "%z" "${BIN}")"

          echo "rtw88 binary size: ${SIZE} bytes"

          if [ "${SIZE}" -lt 500000 ]; then
            echo "ERROR: unexpectedly small kext binary"
            exit 1
          fi

          echo "Kext binary size: OK"


      # ================================================================
      # 27
      # PREPARE ARTIFACT
      # ================================================================

      - name: Prepare v8.6.1 artifact
        shell: bash
        run: |
          set -eu

          OUT="${RUNNER_TEMP}/${BUILD_NAME}"

          rm -rf "${OUT}"
          mkdir -p "${OUT}"

          cp -R \
            Feixiao/build/out/rtw88.kext \
            "${OUT}/"

          cp \
            Feixiao/build/out/rtw88ctl \
            "${OUT}/"

          chmod +x \
            "${OUT}/rtw88ctl"

          cp \
            Feixiao/src/compat/fw_blobs.c \
            "${OUT}/fw_blobs.c.build-proof"


      # ================================================================
      # 28
      # BUILD INFORMATION
      # ================================================================

      - name: Create v8.6.1 build information
        shell: bash
        run: |
          set -eu

          OUT="${RUNNER_TEMP}/${BUILD_NAME}"

          FEIXIAO_HASH="$(git -C Feixiao rev-parse HEAD)"
          RTW88_HASH="$(git -C rtw88-stable rev-parse HEAD)"
          MACKERNEL_HASH="$(git -C Feixiao/MacKernelSDK rev-parse HEAD)"

          KEXT_UUID="$(
            dwarfdump \
              --uuid \
              Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88 \
              | awk '{print $2}' \
              | head -1
          )"

          cat > "${OUT}/BUILD-INFO.txt" <<EOF
          ============================================================
          HP 256 G8
          REALTEK RTL8821CE
          FEIXIAO V8.6.1 PERFORMANCE UNLOCK
          ============================================================


          HARDWARE
          ============================================================

          Realtek RTL8821CE

          PCI:
          10EC:C821

          Radio:
          1T1R / 1SS


          FEIXIAO
          ============================================================

          ${FEIXIAO_HASH}


          RTW88-STABLE
          ============================================================

          ${RTW88_HASH}


          MACKERNELSDK
          ============================================================

          ${MACKERNEL_HASH}


          KEXT UUID
          ============================================================

          ${KEXT_UUID}


          RADIO
          ============================================================

          2.4 GHz:
          enabled

          5 GHz:
          enabled

          HT 20 MHz:
          enabled

          HT 40 MHz:
          enabled

          VHT 80 MHz:
          enabled


          RATE ADAPTATION
          ============================================================

          VHT 1SS:
          enabled

          Firmware RA:
          enabled

          AC 1SS rate ID:
          enabled


          AGGREGATION
          ============================================================

          TX A-MPDU:
          enabled

          RX A-MPDU reorder:
          enabled

          Dynamic HCI RX aggregation:
          ENABLED IN SAFE WATCHDOG BRANCH


          TX FLOW CONTROL
          ============================================================

          Stable v8.5.3:

          stall:
          96

          resume:
          160


          v8.6.1:

          stall:
          64

          resume:
          128


          RF WATCHDOG
          ============================================================

          Full dynamic RF watchdog remains bypassed.

          This intentionally avoids re-enabling the complete:

          PHY dynamic mechanism
          coexistence polling
          DPK / power tracking paths

          while allowing dynamic HCI RX aggregation.


          DMA
          ============================================================

          Existing bounce DMA implementation preserved.

          No experimental DMA rewrite in v8.6.1.

          No removal of mbuf validation.


          PERFORMANCE GOAL
          ============================================================

          Target:

          >100 Mbps download

          >100 Mbps upload

          under favorable conditions:

          5 GHz
          VHT 80 MHz
          good RSSI
          compatible AP
          clean channel


          IMPORTANT
          ============================================================

          This is an experimental macOS port.

          Performance above 100 Mbps is a target,
          not a guarantee.

          The RTL8821CE is 1x1.

          A 1 Gbps Internet connection does not imply
          1 Gbps usable Wi-Fi throughput with this adapter.

          Always install rtw88.kext and use rtw88ctl
          from THIS SAME artifact.

          Keep v8.5.3 available as fallback.
          EOF


      # ================================================================
      # 29
      # SHA256
      # ================================================================

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -eu

          OUT="${RUNNER_TEMP}/${BUILD_NAME}"

          cd "${OUT}"

          shasum \
            -a 256 \
            rtw88ctl \
            > SHA256SUMS.txt

          find \
            rtw88.kext \
            -type f \
            -exec shasum -a 256 {} \; \
            >> SHA256SUMS.txt

          echo
          cat SHA256SUMS.txt


      # ================================================================
      # 30
      # PACKAGE
      # ================================================================

      - name: Package HP256G8 v8.6.1
        shell: bash
        run: |
          set -eu

          cd "${RUNNER_TEMP}"

          ZIP="Feixiao_HP256G8_v8_6_1_Performance_Unlock.zip"

          rm -f "${ZIP}"

          zip \
            -r \
            "${ZIP}" \
            "${BUILD_NAME}"

          echo
          echo "============================================================"
          echo "V8.6.1 PACKAGE"
          echo "============================================================"

          ls -lh "${ZIP}"


      # ================================================================
      # 31
      # UPLOAD
      # ================================================================

      - name: Upload HP256G8 v8.6.1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Feixiao-HP256G8-v8.6.1-Performance-Unlock
          path: ${{ runner.temp }}/Feixiao_HP256G8_v8_6_1_Performance_Unlock.zip
          if-no-files-found: error
          retention-days: 7
