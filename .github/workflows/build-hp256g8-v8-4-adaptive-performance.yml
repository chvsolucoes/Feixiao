safe_inject = r'''void RTW88PCIDevice::injectRxFrame(mbuf_t m)
{
    /*
     * Release deferred DMA objects on the
     * normal serialized path.
     */

    drainPendingFree();


    /*
     * Never inject while the macOS network
     * interface is unavailable.
     */

    if (
        !_iface
        ||
        !_enabled
    ) {

        freePacket(
            m
        );

        return;
    }


    /*
     * ================================================================
     * HP256G8 v8.4 SAFE MBUF
     * ================================================================
     *
     * The previous kernel panic was:
     *
     * m_sum16:
     * mbuf real length ~1464
     * requested checksum length ~44037
     *
     * Therefore this function must NEVER
     * deliver a structurally inconsistent
     * mbuf chain to XNU.
     */

    const size_t kMinFrame =
        14;


    /*
     * Keep a conservative upper bound.
     *
     * Standard Ethernet MTU traffic is well
     * below this value.
     */

    const size_t kMaxFrame =
        4096;


    /*
     * A normal packet should not arrive as
     * an excessive mbuf chain.
     */

    const unsigned int kMaxSegments =
        32;


    size_t packetLength =
        mbuf_pkthdr_len(
            m
        );


    size_t firstLength =
        mbuf_len(
            m
        );


    size_t chainLength =
        0;


    unsigned int segments =
        0;


    bool malformed =
        false;


    /*
     * Sum the REAL amount of data available
     * across all mbufs.
     */

    for (
        mbuf_t segment = m;
        segment != nullptr;
        segment = mbuf_next(segment)
    ) {

        size_t length =
            mbuf_len(
                segment
            );


        segments++;


        /*
         * Impossible / suspicious segmentation.
         */

        if (
            segments >
            kMaxSegments
        ) {

            malformed =
                true;

            break;
        }


        /*
         * One segment is already too large.
         */

        if (
            length >
            kMaxFrame
        ) {

            malformed =
                true;

            break;
        }


        /*
         * Prevent overflow and prevent total
         * chain size from exceeding our bound.
         */

        if (
            chainLength >
            (
                kMaxFrame
                -
                length
            )
        ) {

            malformed =
                true;

            break;
        }


        chainLength +=
            length;
    }


    /*
     * ================================================================
     * FINAL MBUF VALIDATION
     * ================================================================
     */

    if (
        malformed
        ||
        packetLength <
            kMinFrame
        ||
        packetLength >
            kMaxFrame
        ||
        firstLength <
            kMinFrame
        ||
        firstLength >
            kMaxFrame
        ||
        chainLength !=
            packetLength
    ) {

        IOLog(
            "rtw88: HP256G8 v8.4 SAFE MBUF drop "
            "pkthdr=%zu first=%zu chain=%zu segs=%u\n",

            packetLength,

            firstLength,

            chainLength,

            segments
        );


        freePacket(
            m
        );


        return;
    }


    /*
     * ================================================================
     * CONSERVATIVE XNU INPUT
     * ================================================================
     *
     * Do NOT restore the experimental v8 RX
     * batching.
     *
     * The stable v8.2 behavior delivered each
     * validated packet and immediately flushed
     * the network input queue.
     */

    _iface->inputPacket(

        m,

        0,

        IONetworkInterface::
        kInputOptionQueuePacket
    );


    _iface->flushInputQueue();


    /*
     * Update standard network statistics.
     */

    IONetworkData *nd =
        _iface->getNetworkData(
            kIONetworkStatsKey
        );


    if (nd) {

        IONetworkStats *stats =
            (
                IONetworkStats *
            )
            nd->getBuffer();


        if (stats) {

            stats->inputPackets++;
        }
    }
}


'''


