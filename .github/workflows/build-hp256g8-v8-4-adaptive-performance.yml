    "UInt32 RTW88IEEE80211::outputPacket(mbuf_t m)"
)


if output_start < 0:

    raise SystemExit(
        "ERROR: outputPacket not found"
    )


output_end = c.find(

    "/* ------------------------------------------------------------------ */\n"
    "/*  RX path:",

    output_start
)


if output_end < 0:

    raise SystemExit(
        "ERROR: RX section after outputPacket not found"
    )


current_output = c[
    output_start:output_end
]


if (
    "HP256G8 v8.4 performance watchdog"
    not in current_output
):

    opening_brace = c.find(
        "{",
        output_start
    )


    if opening_brace < 0:

        raise SystemExit(
            "ERROR: outputPacket opening brace not found"
        )


    watchdog_code = r'''

    /*
     * HP256G8 v8.4 performance watchdog
     *
     * This watchdog is deliberately simple:
     *
     * - it only runs while CONNECTED
     * - it only runs at 80 MHz
     * - it does not manipulate the PCI/DMA path
     * - it merely requests a safe reconnect
     *
     * Trigger 1:
     * RSSI becomes invalid (0 or positive).
     *
     * Trigger 2:
     * TX keeps occurring while the number of
     * received frames does not move.
     */

    if (
        _state ==
            RTW88_STATE_CONNECTED
        &&
        _connChanWidth ==
            80
        &&
        !_force40MHz
    ) {

        uint32_t currentRx =
            _rxFrameCount;


        if (
            currentRx !=
            _perfLastRxFrameCount
        ) {

            /*
             * RX still alive.
             */

            _perfLastRxFrameCount =
                currentRx;


            _perfTxWithoutRx =
                0;

        } else {

            /*
             * TX is occurring but no RX frame
             * has been observed since the
             * previous TX call.
             */

            if (
