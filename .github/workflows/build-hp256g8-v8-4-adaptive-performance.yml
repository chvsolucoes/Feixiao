def require(
    text,
    marker,
    description,
):

    if marker not in text:

        raise SystemExit(
            "ERROR: "
            +
            description
            +
            " missing: "
            +
            repr(marker)
        )


def replace_once(
    text,
    old,
    new,
    description,
):

    if old not in text:

        raise SystemExit(
            "ERROR: "
            +
            description
            +
            " anchor missing"
        )

    return text.replace(
        old,
        new,
        1
    )


def print_ok(
    message
):

    print(
