safe_dma_function = r'''static bool rtw_pci_dma_check(
        struct rtw_dev *rtwdev,
        struct rtw_pci_rx_ring *rx_ring,
        u32 idx)
{
    struct rtw_pci *rtwpci =
        (
            struct rtw_pci *
        )
        rtwdev->priv;


    const struct rtw_chip_info *chip =
        rtwdev->chip;


    struct rtw_pci_rx_buffer_desc *buf_desc;


    u32 desc_sz =
        chip->rx_buf_desc_sz;


    /*
     * Software completion sequence.
     */

    u16 expected =
        rtwpci->rx_tag;


    /*
     * Hardware value.
     */

    u16 observed =
        0;


    int i;


    /*
     * Diagnostics only.
     */

    static u32 mismatch_count =
        0;


    static u32 recovery_count =
        0;


    /*
     * Locate RX buffer descriptor.
     */

    buf_desc =
        (
            struct rtw_pci_rx_buffer_desc *
        )
        (
            rx_ring->r.head
            +
            idx * desc_sz
        );


    /*
     * ================================================================
     * HP256G8 v8.4 SAFE RESYNC
     * ================================================================
     *
     * The hardware and software RX completion
     * tags can briefly be out of phase.
     *
     * Wait up to:
     *
     * 100 loops x 2 us = 200 us
     *
     * for the expected value.
     */

    for (
        i = 0;
        i < 100;
        i++
    ) {

        observed =
            le16_to_cpu(
                buf_desc->total_pkt_size
            );


        if (
            observed ==
            expected
        ) {

            /*
             * Good descriptor.
             *
             * Advance normal software sequence
             * and ALLOW caller to process it.
             */

            rtwpci->rx_tag =
                (
                    expected
                    +
                    1
                )
                %
                RX_TAG_MAX;


            return true;
        }


        udelay(
            2
        );
    }


    /*
     * ================================================================
     * MISMATCH REMAINS
     * ================================================================
     *
     * CRITICAL SAFETY RULE:
     *
     * This CURRENT descriptor MUST NOT be
     * parsed.
     *
     * The caller sees false and skips:
     *
     * dma_sync_single_for_cpu
     * rx-desc parsing
     * skb construction
     * mbuf injection
     */

    mismatch_count++;


    u16 delta =
        0;


    /*
     * Calculate circular sequence distance.
     */

    if (
        expected >=
        observed
    ) {

        delta =
            expected
            -
            observed;

    } else {

        delta =
            (
                expected
                +
                RX_TAG_MAX
            )
            -
            observed;
    }


    /*
     * ================================================================
     * BOUNDED SAFE RESYNC
     * ================================================================
     *
     * User logs on this specific RTL8821CE
     * showed a stable difference:
     *
     * expected - observed = 7
     *
     * Therefore a small coherent distance can
     * be accepted as a sequence-alignment hint
     * ONLY FOR THE NEXT DESCRIPTOR.
     */

    if (
        delta >
        0
        &&
        delta <=
        32
    ) {

        /*
         * Re-align expected tag for NEXT slot.
         *
         * The CURRENT descriptor remains
         * rejected because this function still
         * returns false.
         */

        rtwpci->rx_tag =
            (
                observed
                +
                1
            )
            %
            RX_TAG_MAX;


        recovery_count++;


        /*
         * Avoid flooding dmesg.
         */

        if (
            recovery_count ==
            1
            ||
            (
                recovery_count
                &
                0xff
            )
            ==
            0
        ) {

            rtw_warn(
                rtwdev,

                "HP256G8 v8.4 SAFE RESYNC "
                "drop current descriptor "
                "expected=%u observed=%u "
                "delta=%u next=%u count=%u\n",

                expected,

                observed,

                delta,

                rtwpci->rx_tag,

                recovery_count
            );
        }

    } else {

        /*
         * ============================================================
         * SUSPICIOUS / LARGE MISMATCH
         * ============================================================
         *
         * Do NOT trust observed as an alignment
         * source.
         *
         * Advance conservatively using software
         * sequence only.
         */

        rtwpci->rx_tag =
            (
                expected
                +
                1
            )
            %
            RX_TAG_MAX;


        if (
            mismatch_count ==
            1
            ||
            (
                mismatch_count
                &
                0xff
            )
            ==
            0
        ) {

            rtw_warn(
                rtwdev,

                "HP256G8 v8.4 SAFE RX reject "
                "expected=%u observed=%u "
                "delta=%u count=%u\n",

                expected,

                observed,

                delta,

                mismatch_count
            );
        }
    }


    /*
     * Caller MUST discard current slot.
     */

    return false;
}


'''


