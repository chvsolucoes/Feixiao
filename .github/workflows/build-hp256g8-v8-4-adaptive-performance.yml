name: Build HP256G8 RTL8821CE v8.4 Adaptive Performance

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:

      # ============================================================
      # 1. CHECKOUT FEIXIAO
      # ============================================================

      - name: Checkout Feixiao
        uses: actions/checkout@v4
        with:
          repository: thegwchr/Feixiao
          ref: e963f43188382eced4ef2fa75d19ce4db2315c68
          submodules: recursive
          path: Feixiao
          fetch-depth: 0


      # ============================================================
      # 2. CLONE RTW88-STABLE
      # ============================================================

      - name: Clone matching rtw88-stable
        run: |
          git clone \
            https://github.com/thegwchr/rtw88-stable.git

          cd rtw88-stable

          git checkout \
            d029a677c49266fad86750714eb5612becd134d3

          git rev-parse HEAD


      # ============================================================
      # 3. APPLY V8.4
      # ============================================================

      - name: Apply HP256G8 v8.4 Adaptive Performance
        shell: bash
        run: |

          cat > /tmp/patch_v84.py <<'PY'

          from pathlib import Path


          feixiao = Path("Feixiao")

          ieee = (
              feixiao
              /
              "src/kext/RTW88IEEE80211.cpp"
          )

          hpp = (
              feixiao
              /
              "src/kext/RTW88IEEE80211.hpp"
          )

          pci = (
              feixiao
              /
              "src/kext/RTW88PCIDevice.cpp"
          )

          compat = (
              feixiao
              /
              "src/compat/rtw88_compat.c"
          )

          linux_pci = Path(
              "rtw88-stable/"
              "drivers/net/wireless/realtek/"
              "rtw88/pci.c"
          )


          for source in (
              ieee,
              hpp,
              pci,
              compat,
              linux_pci,
          ):

              if not source.exists():

                  raise SystemExit(
                      f"ERROR: required source missing: {source}"
                  )


          c = ieee.read_text()
          h = hpp.read_text()
          p = pci.read_text()
          r = compat.read_text()
          lp = linux_pci.read_text()


          print("=" * 72)
          print("HP256G8 RTL8821CE v8.4 ADAPTIVE PERFORMANCE")
          print("=" * 72)


          # ============================================================
          # 1. VERIFY BASE DMA/TX FIXES
          # ============================================================

          if (
              "IOGatedOutputQueue::withTarget"
              not in p
          ):

              raise SystemExit(
                  "ERROR: serialized TX path missing"
              )


          if (
              "drainPendingFree()"
              not in p
          ):

              raise SystemExit(
                  "ERROR: deferred DMA free missing"
              )


          print("Native TX serialization: OK")
          print("Deferred DMA free: OK")


          # ============================================================
          # 2. AUTOMATIC RATE CONTROL
          # ============================================================

          r = r.replace(
              "rtwdev->dm_info.fix_rate = DESC_RATE6M;",
              "rtwdev->dm_info.fix_rate = 0xFF;"
          )


          print(
              "Firmware automatic rate adaptation: OK"
          )


          # ============================================================
          # 3. WPA2 M4 KEY LENGTH
          # ============================================================

          old_keylen = (
              "    key[3] = 0; key[4] = 16; "
              "/* key length = 16 (AES-128) */"
          )


          new_keylen = """    if (step == 4) {

              key[3] = 0;
              key[4] = 0;

              IOLog(
                  "rtw88: HP256G8 v8.4 M4 key_length=0\\n"
              );

          } else {

              key[3] = 0;
              key[4] = 16;
          }"""


          if (
              "HP256G8 v8.4 M4 key_length=0"
              not in c
          ):

              if (
                  old_keylen not in c
              ):

                  raise SystemExit(
                      "ERROR: WPA2 key-length anchor missing"
                  )


              c = c.replace(
                  old_keylen,
                  new_keylen,
                  1
              )


          print(
              "WPA2 M4 Key Length: OK"
          )


          # ============================================================
          # 4. WPA2 M4 NONCE
          # ============================================================

          old_nonce = (
              "    memcpy(key + 13, _snonce, 32);       "
              "/* key[13..44] = SNonce */"
          )


          new_nonce = """    if (step == 4) {

              memset(
                  key + 13,
                  0,
                  32
              );

              IOLog(
                  "rtw88: HP256G8 v8.4 M4 nonce zeroed\\n"
              );

          } else {

              memcpy(
                  key + 13,
                  _snonce,
                  32
              );
          }"""


          if (
              "HP256G8 v8.4 M4 nonce zeroed"
              not in c
          ):

              if (
                  old_nonce not in c
              ):

                  raise SystemExit(
                      "ERROR: WPA2 nonce anchor missing"
                  )


              c = c.replace(
                  old_nonce,
                  new_nonce,
                  1
              )


          print(
              "WPA2 M4 nonce: OK"
          )


          # ============================================================
          # 5. WPA2 M3 DIAGNOSTICS
          # ============================================================

          m3_anchor = (
              "    } else if (is_m3) {"
          )


          if (
              "HP256G8 v8.4 received M3"
              not in c
          ):

              if (
                  m3_anchor not in c
              ):

                  raise SystemExit(
                      "ERROR: M3 handler missing"
                  )


              c = c.replace(
                  m3_anchor,

                  """    } else if (is_m3) {

              IOLog(
                  "rtw88: HP256G8 v8.4 received M3 "
                  "replay=%02x%02x%02x%02x"
                  "%02x%02x%02x%02x\\n",
                  data[9],
                  data[10],
                  data[11],
                  data[12],
                  data[13],
                  data[14],
                  data[15],
                  data[16]
              );""",

                  1
              )


          print(
              "WPA2 M3 diagnostics: OK"
          )


          # ============================================================
          # 6. SEND M4 BEFORE PTK/GTK
          # ============================================================

          if (
              "sending EAPOL M4 before PTK install"
              not in c
          ):

              m3_start = c.find(
                  "HP256G8 v8.4 received M3"
              )


              ptk_anchor = (
                  "if (!installKey("
                  "&_ptkConf, "
                  "true, "
                  "0, "
                  "WLAN_CIPHER_SUITE_CCMP,"
              )


              m4_anchor = (
                  "sendEAPOLKey("
                  "4, "
                  "_replayCtr, "
                  "false, "
                  "false, "
                  "true);"
              )


              state_anchor = (
                  "_state = "
                  "RTW88_STATE_CONNECTED;"
              )


              start = c.find(
                  ptk_anchor,
                  m3_start
              )


              if (
                  start < 0
              ):

                  raise SystemExit(
                      "ERROR: PTK anchor missing"
                  )


              send4 = c.find(
                  m4_anchor,
                  start
              )


              if (
                  send4 < 0
              ):

                  raise SystemExit(
                      "ERROR: M4 anchor missing"
                  )


              end = c.find(
                  state_anchor,
                  send4
              )


              if (
                  end < 0
              ):

                  raise SystemExit(
                      "ERROR: connected-state anchor missing"
                  )


              end += len(
                  state_anchor
              )


              old_block = c[
                  start:end
              ]


              if (
                  "installKey(&_gtkConf"
                  not in old_block
              ):

                  raise SystemExit(
                      "ERROR: GTK installation missing"
                  )


              new_block = """IOLog(
              "rtw88: HP256G8 v8.4 sending EAPOL M4 before PTK install\\n"
          );

          sendEAPOLKey(
              4,
              _replayCtr,
              false,
              false,
              true
          );

          IOSleep(
              40
          );

          IOLog(
              "rtw88: HP256G8 v8.4 M4 submitted, installing PTK\\n"
          );

          if (!installKey(
                  &_ptkConf,
                  true,
                  0,
                  WLAN_CIPHER_SUITE_CCMP,
                  _ptk + 32,
                  16))
              return;

          uint32_t groupCipher =
              (
                  _targetBSS.group_cipher ==
                  WLAN_CIPHER_SUITE_TKIP
              )
              ?
              WLAN_CIPHER_SUITE_TKIP
              :
              WLAN_CIPHER_SUITE_CCMP;

          if (
              gtk_len
              &&
              !installKey(
                  &_gtkConf,
                  false,
                  gtk_idx,
                  groupCipher,
                  gtk,
                  gtk_len
              )
          )
              return;

          IOLog(
              "rtw88: HP256G8 v8.4 PTK/GTK installed after M4\\n"
          );

          _perfLastRxFrameCount =
              _rxFrameCount;

          _perfTxWithoutRx =
              0;

          _perfFallbackPending =
              false;

          _state =
              RTW88_STATE_CONNECTED;"""


              c = (
                  c[:start]
                  +
                  new_block
                  +
                  c[end:]
              )


          print(
              "WPA2 M4/PTK/GTK ordering: OK"
          )


          # ============================================================
          # 7. A-MPDU AFTER WPA2
          # ============================================================

          old_ampdu = (
              "        startTxAggregation();   "
              "/* keys are installed — "
              "negotiate uplink A-MPDU */"
          )


          if (
              "HP256G8 v8.4 WPA2 settle complete"
              not in c
          ):

              if (
                  old_ampdu not in c
              ):

                  raise SystemExit(
                      "ERROR: A-MPDU start anchor missing"
                  )


              c = c.replace(
                  old_ampdu,

                  """        IOSleep(
              100
          );

          IOLog(
              "rtw88: HP256G8 v8.4 WPA2 settle complete, starting A-MPDU\\n"
          );

          startTxAggregation();""",

                  1
              )


          print(
              "A-MPDU WPA2 settle: OK"
          )


          # ============================================================
          # 8. HEADER:
          #    ADAPTIVE PERFORMANCE METHODS
          # ============================================================

          method_anchor = (
              "    void      setConnectedChandef("
              "struct ieee80211_channel *chan);"
          )


          if (
              "fallbackTo40MHz"
              not in h
          ):

              if (
                  method_anchor not in h
              ):

                  raise SystemExit(
                      "ERROR: setConnectedChandef header anchor missing"
                  )


              h = h.replace(
                  method_anchor,

                  method_anchor
                  +
                  "\n"
                  "    void      fallbackTo40MHz();"
                  "\n"
                  "    void      schedulePerformanceFallback();"
                  "\n"
                  "    static void performanceTCFn("
                  "thread_call_param_t self, "
                  "thread_call_param_t);",

                  1
              )


          # ============================================================
          # 9. HEADER:
          #    PERFORMANCE THREAD CALL
          # ============================================================

          tc_anchor = (
              "    thread_call_t _connectTC = nullptr;"
          )


          if (
              "_performanceTC"
              not in h
          ):

              if (
                  tc_anchor not in h
              ):

                  raise SystemExit(
                      "ERROR: connectTC member anchor missing"
                  )


              h = h.replace(
                  tc_anchor,

                  tc_anchor
                  +
                  "\n"
                  "    thread_call_t _performanceTC = nullptr;",

                  1
              )


          # ============================================================
          # 10. HEADER:
          #     ADAPTIVE STATE
          # ============================================================

          width_anchor = (
              "    uint8_t  _connChanWidth = 20;  "
              "/* negotiated operating width: "
              "20/40/80 MHz */"
          )


          if (
              "_force40MHz"
              not in h
          ):

              if (
                  width_anchor not in h
              ):

                  raise SystemExit(
                      "ERROR: channel-width member anchor missing"
                  )


              h = h.replace(
                  width_anchor,

                  width_anchor
                  +
                  "\n"
                  "    bool     _force40MHz = false;"
                  "\n"
                  "    volatile bool _perfFallbackPending = false;"
                  "\n"
                  "    uint32_t _perfLastRxFrameCount = 0;"
                  "\n"
                  "    uint32_t _perfTxWithoutRx = 0;",

                  1
              )


          print(
              "Adaptive state/header: OK"
          )


          # ============================================================
          # 11. ALLOCATE PERFORMANCE THREAD
          # ============================================================

          alloc_anchor = """    _manualScanTC = thread_call_allocate((thread_call_func_t)RTW88IEEE80211::manualScanTCFn,
                                          (thread_call_param_t)this);"""


          if (
              "RTW88IEEE80211::performanceTCFn"
              not in c
          ):

              if (
                  alloc_anchor not in c
              ):

                  raise SystemExit(
                      "ERROR: thread allocation anchor missing"
                  )


              c = c.replace(
                  alloc_anchor,

                  alloc_anchor
                  +
                  """

    _performanceTC = thread_call_allocate(
        (thread_call_func_t)RTW88IEEE80211::performanceTCFn,
        (thread_call_param_t)this
    );

    if (!_performanceTC)
        return false;""",

                  1
              )


          # ============================================================
          # 12. FREE PERFORMANCE THREAD
          # ============================================================

          free_anchor = """    if (_connectTC) { thread_call_cancel(_connectTC); thread_call_free(_connectTC); _connectTC = nullptr; }"""


          if (
              "thread_call_free(_performanceTC)"
              not in c
          ):

              if (
                  free_anchor not in c
              ):

                  raise SystemExit(
                      "ERROR: connect thread cleanup anchor missing"
                  )


              c = c.replace(
                  free_anchor,

                  free_anchor
                  +
                  """
    if (_performanceTC) {
        thread_call_cancel(_performanceTC);
        thread_call_free(_performanceTC);
        _performanceTC = nullptr;
    }""",

                  1
              )


          print(
              "Adaptive thread lifecycle: OK"
          )


          # ============================================================
          # 13. SETCONNECTEDCHANDEF:
          #
          #     TRY 80 MHz ONLY WHILE NOT IN SAFE FALLBACK
          # ============================================================

          original80 = (
              "if (chip80 && "
              "vhtWidth == 1 && "
              "vhtSeg0 != 0) {"
          )


          adaptive80 = (
              "if (!_force40MHz && chip80 && "
              "vhtWidth == 1 && "
              "vhtSeg0 != 0) {"
          )


          disabled80 = (
              "if (false && chip80 && "
              "vhtWidth == 1 && "
              "vhtSeg0 != 0) {"
          )


          if (
              adaptive80 not in c
          ):

              if (
                  disabled80 in c
              ):

                  c = c.replace(
                      disabled80,
                      adaptive80,
                      1
                  )

              elif (
                  original80 in c
              ):

                  c = c.replace(
                      original80,
                      adaptive80,
                      1
                  )

              else:

                  raise SystemExit(
                      "ERROR: VHT80 block missing"
                  )


          print(
              "Adaptive VHT 80 MHz selection: OK"
          )


          # ============================================================
          # 14. BUILD IDENTIFICATION
          # ============================================================

          chandef_log = (
              '    IOLog('
              '"rtw88: connected chandef: '
              '%u MHz '
              '(primary=%u cf1=%u)\\n",'
          )


          if (
              "HP256G8 v8.4 Adaptive Performance active"
              not in c
          ):

              if (
                  chandef_log not in c
              ):

                  raise SystemExit(
                      "ERROR: chandef log anchor missing"
                  )


              c = c.replace(
                  chandef_log,

                  '    IOLog('
                  '"rtw88: HP256G8 v8.4 '
                  'Adaptive Performance active '
                  'safe40=%u\\n", '
                  '_force40MHz ? 1 : 0);'
                  '\n'
                  +
                  chandef_log,

                  1
              )


          # ============================================================
          # 15. ADAPTIVE FALLBACK IMPLEMENTATION
          # ============================================================

          interrupt_anchor = """/* ------------------------------------------------------------------ */
/*  TX path: Ethernet → 802.11 data frame                              */
/* ------------------------------------------------------------------ */"""


          if (
              "void RTW88IEEE80211::fallbackTo40MHz()"
              not in c
          ):

              if (
                  interrupt_anchor not in c
              ):

                  raise SystemExit(
                      "ERROR: TX section anchor missing"
                  )


              fallback_impl = r'''
void RTW88IEEE80211::performanceTCFn(
    thread_call_param_t self,
    thread_call_param_t)
{
    RTW88IEEE80211 *obj =
        (RTW88IEEE80211 *)self;

    if (obj)
        obj->fallbackTo40MHz();
}


void RTW88IEEE80211::schedulePerformanceFallback()
{
    if (_force40MHz)
        return;

    if (_perfFallbackPending)
        return;

    if (_connChanWidth != 80)
        return;

    _perfFallbackPending =
        true;

    IOLog(
        "rtw88: HP256G8 v8.4 scheduling 80->40 MHz fallback "
        "rssi=%d txNoRx=%u rxFrames=%u\n",
        _rssi,
        _perfTxWithoutRx,
        _rxFrameCount
    );

    if (_performanceTC)
        thread_call_enter(
            _performanceTC
        );
    else
        _perfFallbackPending = false;
}


void RTW88IEEE80211::fallbackTo40MHz()
{
    if (
        _state != RTW88_STATE_CONNECTED
        ||
        !_hw
        ||
        !_vif
    ) {

        _perfFallbackPending =
            false;

        return;
    }


    if (
        _connChanWidth != 80
    ) {

        _perfFallbackPending =
            false;

        return;
    }


    /*
     * Sticky safe mode for the remainder
     * of this powered session.
     *
     * A reboot/power cycle allows a fresh
     * 80 MHz trial.
     */

    _force40MHz =
        true;


    struct ieee80211_channel *chan =
        nullptr;


    for (
        int b = 0;
        b < NL80211_NUM_BANDS && !chan;
        b++
    ) {

        struct ieee80211_supported_band *band =
            (_hw->wiphy)
            ?
            _hw->wiphy->bands[b]
            :
            nullptr;


        if (!band)
            continue;


        for (
            int j = 0;
            j < band->n_channels;
            j++
        ) {

            if (
                band->channels[j].hw_value ==
                _targetBSS.channel
            ) {

                chan =
                    &band->channels[j];

                chan->band =
                    band->band;

                break;
            }
        }
    }


    if (!chan) {

        IOLog(
            "rtw88: HP256G8 v8.4 fallback failed: "
            "channel %u unavailable\n",
            _targetBSS.channel
        );

        _perfFallbackPending =
            false;

        return;
    }


    IOLog(
        "rtw88: HP256G8 v8.4 FALLBACK "
        "80 -> 40 MHz BEGIN\n"
    );


    /*
     * setConnectedChandef() now sees
     * _force40MHz=true and therefore
     * cannot select 80 MHz.
     */

    setConnectedChandef(
        chan
    );


    /*
     * Reapply the selected channel/BSSID
     * using the same helper used when
     * returning from a connected scan.
     */

    rtw88_restore_connected_hw(
        _hw,
        _vif,
        _targetBSS.bssid
    );


    struct ieee80211_bss_conf *bss =
        &_vif->bss_conf;


    bss->bssid =
        bss->bssid_buf;


    memcpy(
        bss->bssid_buf,
        _targetBSS.bssid,
        ETH_ALEN
    );


    bss->assoc =
        true;

    bss->aid =
        _assocAID;


    _vif->cfg.assoc =
        true;

    _vif->cfg.aid =
        _assocAID;


    _perfLastRxFrameCount =
        _rxFrameCount;

    _perfTxWithoutRx =
        0;

    _perfFallbackPending =
        false;


    IOLog(
        "rtw88: HP256G8 v8.4 FALLBACK complete "
        "width=%u MHz\n",
        _connChanWidth
    );
}


'''

              c = c.replace(
                  interrupt_anchor,

                  fallback_impl
                  +
                  interrupt_anchor,

                  1
              )


          print(
              "Runtime 80->40 fallback: OK"
          )


          # ============================================================
          # 16. OUTPUTPACKET WATCHDOG
          #
          # Detect:
          #
          # - RSSI becomes zero/invalid
          # - TX continues while RX frame count
          #   remains frozen for 128 TX packets
          # ============================================================

          output_start = c.find(
              "UInt32 RTW88IEEE80211::outputPacket(mbuf_t m)"
          )


          output_end = c.find(
              "/* ------------------------------------------------------------------ */\n"
              "/*  RX path: sk_buff from driver",
              output_start
          )


          if (
              output_start < 0
              or
              output_end < 0
          ):

              raise SystemExit(
                  "ERROR: outputPacket boundaries missing"
              )


          output_impl = r'''UInt32 RTW88IEEE80211::outputPacket(mbuf_t m)
{
    bool connected =
        (_state == RTW88_STATE_CONNECTED)
        ||
        (
            _state == RTW88_STATE_SCANNING
            &&
            _scanReturnState == RTW88_STATE_CONNECTED
            &&
            (
                _manualScanChannelCount == 0
                ||
                _manualScanOnHomeChannel
            )
        );


    if (
        !connected
        ||
        !_rtwdev
        ||
        !_hw
        ||
        !_vif
        ||
        !_sta
    ) {

        mbuf_freem(m);

        return kIOReturnOutputDropped;
    }


    /*
     * HP256G8 v8.4 ADAPTIVE PERFORMANCE
     *
     * 80 MHz is allowed while RX remains
     * healthy.
     *
     * If TX keeps progressing without any
     * corresponding RX progress, or RSSI
     * becomes invalid (0 dBm), schedule a
     * safe asynchronous fallback to 40 MHz.
     */

    if (
        _connChanWidth == 80
        &&
        !_force40MHz
    ) {

        uint32_t currentRx =
            _rxFrameCount;


        if (
            currentRx !=
            _perfLastRxFrameCount
        ) {

            _perfLastRxFrameCount =
                currentRx;

            _perfTxWithoutRx =
                0;

        } else {

            if (
                _perfTxWithoutRx <
                0xfffffff0U
            ) {

                _perfTxWithoutRx++;
            }
        }


        bool badRssi =
            (
                _rssi >= 0
            );


        bool rxStalled =
            (
                _perfTxWithoutRx >=
                128
            );


        if (
            badRssi
            ||
            rxStalled
        ) {

            schedulePerformanceFallback();
        }
    }


    return
        txDataFrame(m)
        ?
        kIOReturnOutputSuccess
        :
        kIOReturnOutputDropped;
}


'''


          c = (
              c[:output_start]
              +
              output_impl
              +
              c[output_end:]
          )


          print(
              "80 MHz RX-stall watchdog: OK"
          )


          # ============================================================
          # 17. DEAUTH WHILE 80 MHz:
          #
          # NEXT CONNECTION THIS BOOT USES 40 MHz
          # ============================================================

          deauth_anchor = """            clearKeys();
            _txBaActive = false;"""


          if (
              "deauth/disassoc while 80 MHz"
              not in c
          ):

              if (
                  deauth_anchor not in c
              ):

                  raise SystemExit(
                      "ERROR: deauth cleanup anchor missing"
                  )


              c = c.replace(
                  deauth_anchor,

                  """            if (
                _connChanWidth == 80
            ) {

                _force40MHz =
                    true;

                IOLog(
                    "rtw88: HP256G8 v8.4 "
                    "deauth/disassoc while 80 MHz; "
                    "next connection forced to 40 MHz\\n"
                );
            }

            clearKeys();
            _txBaActive = false;""",

                  1
              )


          print(
              "80 MHz deauth sticky fallback: OK"
          )


          # ============================================================
          # 18. RESET ADAPTIVE MODE ON DRIVER START
          # ============================================================

          start_state_anchor = """    _state = RTW88_STATE_IDLE;
    _scanReturnState = RTW88_STATE_IDLE;
    RTW88_STAGE("IEEE80211::start complete — SUCCESS");"""


          if (
              "fresh adaptive 80 MHz trial"
              not in c
          ):

              if (
                  start_state_anchor not in c
              ):

                  raise SystemExit(
                      "ERROR: start state anchor missing"
                  )


              c = c.replace(
                  start_state_anchor,

                  """    _force40MHz = false;
    _perfFallbackPending = false;
    _perfTxWithoutRx = 0;
    _perfLastRxFrameCount = 0;

    IOLog(
        "rtw88: HP256G8 v8.4 fresh adaptive 80 MHz trial enabled\\n"
    );

    _state = RTW88_STATE_IDLE;
    _scanReturnState = RTW88_STATE_IDLE;
    RTW88_STAGE("IEEE80211::start complete — SUCCESS");""",

                  1
              )


          # ============================================================
          # 19. TX THRESHOLDS
