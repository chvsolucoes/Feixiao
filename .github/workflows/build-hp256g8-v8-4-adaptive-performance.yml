    const size_t kMinFrame =
        14;

    const size_t kMaxFrame =
        4096;

    const unsigned int kMaxSegments =
        32;


    size_t packetLength =
        mbuf_pkthdr_len(m);

    size_t firstLength =
        mbuf_len(m);

    size_t chainLength =
        0;

    unsigned int segments =
        0;

    bool malformed =
        false;


    for (
        mbuf_t segment = m;
        segment != nullptr;
        segment = mbuf_next(segment)
    ) {

        size_t length =
            mbuf_len(segment);


        segments++;


        if (
            segments > kMaxSegments
            ||
            length > kMaxFrame
            ||
            chainLength >
            (
                kMaxFrame
                -
                length
            )
        ) {

            malformed =
                true;

            break;
        }


        chainLength +=
            length;
    }


    if (
        malformed
        ||
        packetLength < kMinFrame
        ||
        packetLength > kMaxFrame
        ||
        firstLength < kMinFrame
        ||
        firstLength > kMaxFrame
        ||
        chainLength != packetLength
    ) {

        IOLog(
            "rtw88: HP256G8 v8.4 SAFE MBUF drop "
            "pkthdr=%zu first=%zu chain=%zu segs=%u\n",
            packetLength,
            firstLength,
            chainLength,
            segments
        );


        freePacket(m);

        return;
    }


    /*
     * Keep the stable v8.2 per-frame flush.
     *
     * No experimental batching.
     */

    _iface->inputPacket(
        m,
        0,
        IONetworkInterface::kInputOptionQueuePacket
    );


    _iface->flushInputQueue();


    IONetworkData *nd =
        _iface->getNetworkData(
            kIONetworkStatsKey
        );


    if (nd) {

        IONetworkStats *stats =
            (IONetworkStats *)
            nd->getBuffer();


        if (stats) {

            stats->inputPackets++;
        }
    }
}


