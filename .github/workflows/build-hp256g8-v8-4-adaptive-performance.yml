        ) {

            IOLog(
                "rtw88: HP256G8 v8.4 watchdog trigger "
                "invalidRSSI=%u rxStalled=%u "
                "rssi=%d txNoRx=%u rxFrames=%u\n",

                invalidRssi ? 1 : 0,

                rxStalled ? 1 : 0,

                _rssi,

                _perfTxWithoutRx,

                _rxFrameCount
            );


            scheduleFallback40MHz();
        }
    }

