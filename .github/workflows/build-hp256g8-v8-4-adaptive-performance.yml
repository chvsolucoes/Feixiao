fallback_implementation = r'''
/* ================================================================== */
/* HP256G8 v8.4 Adaptive Performance                                  */
/* ================================================================== */

void RTW88IEEE80211::fallbackTCFn(
    thread_call_param_t self,
    thread_call_param_t)
{
    RTW88IEEE80211 *obj =
        (RTW88IEEE80211 *)
        self;


    if (!obj)
        return;


    obj->runFallback40MHz();
}


/* ------------------------------------------------------------------ */

void RTW88IEEE80211::scheduleFallback40MHz()
{
    /*
     * Never queue more than one fallback.
     */

    if (_fallbackPending)
        return;


    /*
     * Already in Safe mode.
     */

    if (_force40MHz)
        return;


    /*
     * Only necessary for a live 80 MHz association.
     */

    if (
        _state !=
        RTW88_STATE_CONNECTED
    )
        return;


    if (
        _connChanWidth !=
        80
    )
        return;


    _fallbackPending =
        true;


    IOLog(
        "rtw88: HP256G8 v8.4 "
        "scheduling 80->40 reconnect "
        "rssi=%d txNoRx=%u rxFrames=%u\n",

        _rssi,

        _perfTxWithoutRx,

        _rxFrameCount
    );


    if (_fallbackTC) {

        thread_call_enter(
            _fallbackTC
        );

    } else {

        /*
         * Never leave the flag locked if the
         * thread call cannot be dispatched.
         */

        _fallbackPending =
            false;
    }
}


/* ------------------------------------------------------------------ */

void RTW88IEEE80211::runFallback40MHz()
{
    /*
     * This function intentionally does NOT
     * retune an already-associated 80 MHz
     * connection in-place.
     *
     * The v8.3 test showed that changing /
     * keeping 80 MHz while the radio state
     * had become unstable could leave:
     *
     * RSSI = 0
     * data path broken
     * state still connected
     *
     * v8.4 therefore performs a clean
     * association rebuild through the normal
     * Feixiao authentication path.
     */


    if (
        _state !=
        RTW88_STATE_CONNECTED
    ) {

        _fallbackPending =
            false;

        return;
    }


    if (
        _connChanWidth !=
        80
    ) {

        _fallbackPending =
            false;

        return;
    }


    if (
        !_powered
        ||
        !_hw
        ||
        !_vif
    ) {

        _fallbackPending =
            false;

        return;
    }


    IOLog(
        "rtw88: HP256G8 v8.4 "
        "FALLBACK 80 -> 40 MHz reconnect BEGIN\n"
    );


    /*
     * Sticky Safe mode until driver restart.
     */

    _force40MHz =
        true;


    /*
     * Preserve the requested target BSS and
     * WPA password.
     *
     * doDisconnect() is only used to clear
     * association, STA and key state.
     */

    doDisconnect();


    /*
     * Let the Realtek firmware / hardware
     * settle before re-authenticating.
     */

    IOSleep(
        150
    );


    if (
        !_powered
        ||
        !_hw
        ||
        !_vif
    ) {

        _fallbackPending =
            false;

        return;
    }


    /*
     * Make the following authentication use
     * the exact same normal connection path.
     *
     * setConnectedChandef() will see
     * _force40MHz=true and therefore the
     * VHT80 branch is skipped.
     */

    _state =
        RTW88_STATE_AUTHENTICATING;


    _perfLastRxFrameCount =
        _rxFrameCount;


    _perfTxWithoutRx =
        0;


    _fallbackPending =
        false;


    IOLog(
        "rtw88: HP256G8 v8.4 "
        "reconnecting in Safe 40 MHz mode\n"
    );


    /*
     * Prefer the normal asynchronous connect
     * worker already used by Feixiao.
     */

    if (_connectTC) {

        thread_call_enter(
            _connectTC
        );

    } else {

        /*
         * Defensive fallback.
         */

        doAuthenticate();
    }
}


/* ================================================================== */

'''


