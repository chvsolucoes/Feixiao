name: Build HP256G8 RTL8821CE v8.4 Adaptive Performance

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      # ============================================================
      # CHECKOUT FEIXIAO
      # ============================================================

      - name: Checkout Feixiao
        uses: actions/checkout@v4
        with:
          repository: thegwchr/Feixiao
          ref: e963f43188382eced4ef2fa75d19ce4db2315c68
          submodules: recursive
          path: Feixiao
          fetch-depth: 0

      # ============================================================
      # CLONE RTW88-STABLE
      # ============================================================

      - name: Clone matching rtw88-stable
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            https://github.com/thegwchr/rtw88-stable.git \
            rtw88-stable

          cd rtw88-stable

          git checkout \
            d029a677c49266fad86750714eb5612becd134d3

          git rev-parse HEAD

      # ============================================================
      # V8.4 PATCH COMPLETO
      # ============================================================

      - name: Apply HP256G8 v8.4 Adaptive Performance patch
        shell: bash
        run: |
          set -euxo pipefail

          cat > /tmp/patch_v84.py <<'PY'
          #!/usr/bin/env python3

          # ======================================================================
          #
          # HP 256 G8
          # REALTEK RTL8821CE
          #
          # FEIXIAO V8.4
          # ADAPTIVE PERFORMANCE + SAFE RX
          #
          # ======================================================================

          from pathlib import Path
          import sys


          # ======================================================================
          # ARGUMENTOS
          # ======================================================================

          if len(sys.argv) != 3:

              raise SystemExit(
                  "usage: "
                  "patch_hp256g8_v84.py "
                  "<Feixiao-directory> "
                  "<rtw88-stable-directory>"
              )


          FEIXIAO_ROOT = Path(
              sys.argv[1]
          ).resolve()


          RTW88_ROOT = Path(
              sys.argv[2]
          ).resolve()


          # ======================================================================
          # ARQUIVOS
          # ======================================================================

          IEEE_CPP = (
              FEIXIAO_ROOT
              /
              "src/kext/RTW88IEEE80211.cpp"
          )


          IEEE_HPP = (
              FEIXIAO_ROOT
              /
              "src/kext/RTW88IEEE80211.hpp"
          )


          PCI_CPP = (
              FEIXIAO_ROOT
              /
              "src/kext/RTW88PCIDevice.cpp"
          )


          COMPAT_C = (
              FEIXIAO_ROOT
              /
              "src/compat/rtw88_compat.c"
          )


          LINUX_PCI = (
              RTW88_ROOT
              /
              "drivers/net/wireless/realtek/rtw88/pci.c"
          )


          # ======================================================================
          # VALIDAR ARQUIVOS
          # ======================================================================

          SOURCES = (

              IEEE_CPP,

              IEEE_HPP,

              PCI_CPP,

              COMPAT_C,

              LINUX_PCI,

          )


          for source in SOURCES:

              if not source.exists():

                  raise SystemExit(
                      f"ERROR: source not found: {source}"
                  )


          # ======================================================================
          # CARREGAR
          # ======================================================================

          c = IEEE_CPP.read_text()

          h = IEEE_HPP.read_text()

          p = PCI_CPP.read_text()

          r = COMPAT_C.read_text()

          lp = LINUX_PCI.read_text()


          print()

          print(
              "=" * 78
          )

          print(
              "HP256G8 RTL8821CE V8.4 ADAPTIVE PERFORMANCE"
          )

          print(
              "=" * 78
          )

          print()


          # ======================================================================
          # FUNÇÕES AUXILIARES
          # ======================================================================

          def require(
              text,
              marker,
              description,
          ):

              if marker not in text:

                  raise SystemExit(
                      "ERROR: "
                      +
                      description
                      +
                      " missing: "
                      +
                      repr(marker)
                  )


          def replace_once(
              text,
              old,
              new,
              description,
          ):

              if old not in text:

                  raise SystemExit(
                      "ERROR: "
                      +
                      description
                      +
                      " anchor missing"
                  )

              return text.replace(
                  old,
                  new,
                  1
              )


          def print_ok(
              message
          ):

              print(
                  f"[OK] {message}"
              )


          # ======================================================================
          #
          # 1. BASE TX SERIALIZATION
          #
          # ======================================================================

          require(
              p,

              "IOGatedOutputQueue::withTarget",

              "IOGatedOutputQueue"
          )


          print_ok(
              "Native TX serialization present"
          )


          # ======================================================================
          #
          # 2. DEFERRED DMA FREE
          #
          # ======================================================================

          require(
              p,

              "drainPendingFree()",

              "deferred DMA free"
          )


          print_ok(
              "Deferred DMA free present"
          )


          # ======================================================================
          #
          # 3. AUTOMATIC RATE CONTROL
          #
          # ======================================================================

          legacy_rate = (
              "rtwdev->dm_info.fix_rate = DESC_RATE6M;"
          )


          automatic_rate = (
              "rtwdev->dm_info.fix_rate = 0xFF;"
          )


          if legacy_rate in r:

              r = r.replace(

                  legacy_rate,

                  automatic_rate,

                  1
              )


          require(
              r,

              automatic_rate,

              "automatic rate setting"
          )


          print_ok(
              "Firmware automatic rate selection enabled"
          )


          # ======================================================================
          #
          # 4. WPA2 M4 KEY LENGTH = ZERO
          #
          # ======================================================================

          old_key_length = (
              "    key[3] = 0; key[4] = 16; "
              "/* key length = 16 (AES-128) */"
          )


          new_key_length = """    if (step == 4) {

              /*
               * WPA2 Message 4
               */

              key[3] = 0;

              key[4] = 0;


              IOLog(
                  "rtw88: HP256G8 v8.4 M4 key_length=0\\n"
              );

          } else {

              key[3] = 0;

              key[4] = 16;
          }"""


          if (
              "HP256G8 v8.4 M4 key_length=0"
              not in c
          ):

              c = replace_once(

                  c,

                  old_key_length,

                  new_key_length,

                  "WPA2 M4 Key Length"
              )


          print_ok(
              "WPA2 M4 Key Length = 0"
          )


          # ======================================================================
          #
          # 5. WPA2 M4 NONCE
          #
          # ======================================================================

          old_nonce = (
              "    memcpy(key + 13, _snonce, 32);       "
              "/* key[13..44] = SNonce */"
          )


          new_nonce = """    if (step == 4) {

              memset(
                  key + 13,
                  0,
                  32
              );


              IOLog(
                  "rtw88: HP256G8 v8.4 M4 nonce zeroed\\n"
              );

          } else {

              memcpy(
                  key + 13,
                  _snonce,
                  32
              );
          }"""


          if (
              "HP256G8 v8.4 M4 nonce zeroed"
              not in c
          ):

              c = replace_once(

                  c,

                  old_nonce,

                  new_nonce,

                  "WPA2 M4 nonce"
              )


          print_ok(
              "WPA2 M4 nonce zero"
          )


          # ======================================================================
          #
          # 6. WPA2 M3 DIAGNOSTIC
          #
          # ======================================================================

          m3_anchor = (
              "    } else if (is_m3) {"
          )


          m3_replacement = """    } else if (is_m3) {

              IOLog(
                  "rtw88: HP256G8 v8.4 received M3 "
                  "replay=%02x%02x%02x%02x"
                  "%02x%02x%02x%02x\\n",
                  data[9],
                  data[10],
                  data[11],
                  data[12],
                  data[13],
                  data[14],
                  data[15],
                  data[16]
              );"""


          if (
              "HP256G8 v8.4 received M3"
              not in c
          ):

              c = replace_once(

                  c,

                  m3_anchor,

                  m3_replacement,

                  "WPA2 M3 handler"
              )


          print_ok(
              "WPA2 M3 diagnostics"
          )


          # ======================================================================
          #
          # 7. SEND M4 BEFORE PTK / GTK
          #
          # ======================================================================

          if (
              "HP256G8 v8.4 sending EAPOL M4"
              not in c
          ):

              m3_position = c.find(
                  "HP256G8 v8.4 received M3"
              )


              if m3_position < 0:

                  raise SystemExit(
                      "ERROR: patched M3 not found"
                  )


              ptk_anchor = (
                  "if (!installKey("
                  "&_ptkConf, "
                  "true, "
                  "0, "
                  "WLAN_CIPHER_SUITE_CCMP,"
              )


              m4_anchor = (
                  "sendEAPOLKey("
                  "4, "
                  "_replayCtr, "
                  "false, "
                  "false, "
                  "true);"
              )


              state_anchor = (
                  "_state = "
                  "RTW88_STATE_CONNECTED;"
              )


              start = c.find(

                  ptk_anchor,

                  m3_position
              )


              if start < 0:

                  raise SystemExit(
                      "ERROR: PTK install anchor missing"
                  )


              old_m4_position = c.find(

                  m4_anchor,

                  start
              )


              if old_m4_position < 0:

                  raise SystemExit(
                      "ERROR: original M4 send missing"
                  )


              end = c.find(

                  state_anchor,

                  old_m4_position
              )


              if end < 0:

                  raise SystemExit(
                      "ERROR: CONNECTED state missing"
                  )


              end += len(
                  state_anchor
              )


              old_wpa_block = c[
                  start:end
              ]


              if (
                  "installKey(&_gtkConf"
                  not in old_wpa_block
              ):

                  raise SystemExit(
                      "ERROR: selected WPA block does not contain GTK"
                  )


              new_wpa_block = """IOLog(
                      "rtw88: HP256G8 v8.4 "
                      "sending EAPOL M4 before PTK install\\n"
                  );


                  sendEAPOLKey(
                      4,
                      _replayCtr,
                      false,
                      false,
                      true
                  );


                  IOSleep(
                      40
                  );


                  IOLog(
                      "rtw88: HP256G8 v8.4 "
                      "M4 submitted, installing PTK\\n"
                  );


                  if (!installKey(
                          &_ptkConf,
                          true,
                          0,
                          WLAN_CIPHER_SUITE_CCMP,
                          _ptk + 32,
                          16))
                      return;


                  uint32_t groupCipher =
                      (
                          _targetBSS.group_cipher ==
                          WLAN_CIPHER_SUITE_TKIP
                      )
                      ?
                      WLAN_CIPHER_SUITE_TKIP
                      :
                      WLAN_CIPHER_SUITE_CCMP;


                  if (
                      gtk_len
                      &&
                      !installKey(
                          &_gtkConf,
                          false,
                          gtk_idx,
                          groupCipher,
                          gtk,
                          gtk_len
                      )
                  )
                      return;


                  IOLog(
                      "rtw88: HP256G8 v8.4 "
                      "PTK/GTK installed after M4\\n"
                  );


                  _perfLastRxFrameCount =
                      _rxFrameCount;


                  _perfTxWithoutRx =
                      0;


                  _fallbackPending =
                      false;


                  _state =
                      RTW88_STATE_CONNECTED;"""


              c = (

                  c[:start]

                  +

                  new_wpa_block

                  +

                  c[end:]
              )


          print_ok(
              "M4 sent before PTK/GTK installation"
          )


          # ======================================================================
          #
          # 8. A-MPDU SETTLE
          #
          # ======================================================================

          old_ampdu = (
              "        startTxAggregation();   "
              "/* keys are installed — "
              "negotiate uplink A-MPDU */"
          )


          new_ampdu = """        IOSleep(
              100
          );


          IOLog(
              "rtw88: HP256G8 v8.4 "
              "WPA2 settle complete, starting A-MPDU\\n"
          );


          startTxAggregation();"""


          if (
              "HP256G8 v8.4 WPA2 settle complete"
              not in c
          ):

              c = replace_once(

                  c,

                  old_ampdu,

                  new_ampdu,

                  "A-MPDU start"
              )


          print_ok(
              "A-MPDU starts after WPA2 settle"
          )


          # ======================================================================
          #
          # 9. HEADER: ADAPTIVE METHODS
          #
          # ======================================================================

          method_anchor = (
              "    void      setConnectedChandef("
              "struct ieee80211_channel *chan);"
          )


          method_patch = (
              method_anchor
              +
              "\n"
              "    void      scheduleFallback40MHz();"
              +
              "\n"
              "    void      runFallback40MHz();"
              +
              "\n"
              "    static void fallbackTCFn("
              "thread_call_param_t self, "
              "thread_call_param_t);"
          )


          if (
              "scheduleFallback40MHz"
              not in h
          ):

              h = replace_once(

                  h,

                  method_anchor,

                  method_patch,

                  "setConnectedChandef declaration"
              )


          print_ok(
              "Adaptive fallback method declarations"
          )


          # ======================================================================
          #
          # 10. HEADER: FALLBACK THREAD CALL
          #
          # ======================================================================

          thread_anchor = (
              "    thread_call_t _connectTC = nullptr;"
          )


          thread_patch = (
              thread_anchor
              +
              "\n"
              "    thread_call_t _fallbackTC = nullptr;"
          )


          if (
              "_fallbackTC"
              not in h
          ):

              h = replace_once(

                  h,

                  thread_anchor,

                  thread_patch,

                  "_connectTC member"
              )


          print_ok(
              "Fallback thread-call state"
          )


          # ======================================================================
          #
          # 11. HEADER: ADAPTIVE PERFORMANCE STATE
          #
          # ======================================================================

          width_anchor = (
              "    uint8_t  _connChanWidth = 20;  "
              "/* negotiated operating width: "
              "20/40/80 MHz */"
          )


          width_patch = (
              width_anchor
              +
              "\n"
              "    bool     _force40MHz = false;"
              +
              "\n"
              "    volatile bool _fallbackPending = false;"
              +
              "\n"
              "    uint32_t _perfLastRxFrameCount = 0;"
              +
              "\n"
              "    uint32_t _perfTxWithoutRx = 0;"
          )


          if (
              "_force40MHz"
              not in h
          ):

              h = replace_once(

                  h,

                  width_anchor,

                  width_patch,

                  "_connChanWidth member"
              )


          print_ok(
              "Adaptive performance state"
          )


          # ======================================================================
          #
          # 12. ALLOCATE FALLBACK THREAD
          #
          # ======================================================================

          allocate_anchor = """    _manualScanTC = thread_call_allocate((thread_call_func_t)RTW88IEEE80211::manualScanTCFn,
                                                    (thread_call_param_t)this);"""


          allocate_patch = allocate_anchor + """

              _fallbackTC =
                  thread_call_allocate(
                      (thread_call_func_t)
                      RTW88IEEE80211::fallbackTCFn,

                      (thread_call_param_t)
                      this
                  );


              if (!_fallbackTC) {

                  IOLog(
                      "rtw88: HP256G8 v8.4 "
                      "failed to allocate fallback thread-call\\n"
                  );

                  return false;
              }"""


          if (
              "_fallbackTC ="
              not in c
          ):

              c = replace_once(

                  c,

                  allocate_anchor,

                  allocate_patch,

                  "manualScanTC allocation"
              )


          print_ok(
              "Fallback thread allocated"
          )


          # ======================================================================
          #
          # 13. FREE FALLBACK THREAD
          #
          # ======================================================================

          free_anchor = (
              "    if (_connectTC) { "
              "thread_call_cancel(_connectTC); "
              "thread_call_free(_connectTC); "
              "_connectTC = nullptr; }"
          )


          free_patch = """    if (_fallbackTC) {

              thread_call_cancel(
                  _fallbackTC
              );

              thread_call_free(
                  _fallbackTC
              );

              _fallbackTC =
                  nullptr;
          }


          """ + free_anchor


          if (
              "thread_call_free(_fallbackTC)"
              not in c
          ):

              c = replace_once(

                  c,

                  free_anchor,

                  free_patch,

                  "connect thread cleanup"
              )


          print_ok(
              "Fallback worker cleanup"
          )


          # ======================================================================
          #
          # 14. START RESET
          #
          # ======================================================================

          start_anchor = """    _state = RTW88_STATE_IDLE;
              _scanReturnState = RTW88_STATE_IDLE;
              RTW88_STAGE("IEEE80211::start complete — SUCCESS");"""


          start_patch = """    _force40MHz =
              false;


              _fallbackPending =
                  false;


              _perfLastRxFrameCount =
                  0;


              _perfTxWithoutRx =
                  0;


              IOLog(
                  "rtw88: HP256G8 v8.4 "
                  "fresh 80 MHz trial enabled\\n"
              );


              _state =
                  RTW88_STATE_IDLE;


              _scanReturnState =
                  RTW88_STATE_IDLE;


              RTW88_STAGE(
                  "IEEE80211::start complete — SUCCESS"
              );"""


          if (
              "fresh 80 MHz trial enabled"
              not in c
          ):

              c = replace_once(

                  c,

                  start_anchor,

                  start_patch,

                  "IEEE80211 start-state block"
              )


          print_ok(
              "Fresh adaptive state on driver start"
          )


          # ======================================================================
          #
          # 15. VHT 80 MHZ ADAPTIVE
          #
          # ======================================================================

          vht80_normal = (
              "if (chip80 && "
              "vhtWidth == 1 && "
              "vhtSeg0 != 0) {"
          )


          vht80_disabled = (
              "if (false && chip80 && "
              "vhtWidth == 1 && "
              "vhtSeg0 != 0) {"
          )


          vht80_adaptive = (
              "if (!_force40MHz && "
              "chip80 && "
              "vhtWidth == 1 && "
              "vhtSeg0 != 0) {"
          )


          if (
              vht80_adaptive
              not in c
          ):

              if (
                  vht80_disabled
                  in c
              ):

                  c = c.replace(

                      vht80_disabled,

                      vht80_adaptive,

                      1
                  )

              elif (
                  vht80_normal
                  in c
              ):

                  c = c.replace(

                      vht80_normal,

                      vht80_adaptive,

                      1
                  )

              else:

                  raise SystemExit(
                      "ERROR: VHT80 condition not found"
                  )


          print_ok(
              "Adaptive VHT80 selection"
          )


          # ======================================================================
          #
          # 16. BUILD IDENTIFICATION
          #
          # ======================================================================

          chandef_anchor = (
              '    IOLog("rtw88: connected chandef: '
              '%u MHz (primary=%u cf1=%u)\\n",'
          )


          chandef_patch = (
              '    IOLog('
              '"rtw88: HP256G8 v8.4 '
              'Adaptive Performance active '
              'safe40=%u\\n", '
              '_force40MHz ? 1 : 0);'
              '\n'
              +
              chandef_anchor
          )


          if (
              "HP256G8 v8.4 Adaptive Performance active"
              not in c
          ):

              c = replace_once(

                  c,

                  chandef_anchor,

                  chandef_patch,

                  "connected chandef log"
              )


          print_ok(
              "v8.4 runtime identification"
          )


          # ======================================================================
          #
          # 17. FALLBACK WORKER
          #
          # ======================================================================

          tx_section_anchor = """/* ------------------------------------------------------------------ */
          /*  TX path: Ethernet → 802.11 data frame                              */
          /* ------------------------------------------------------------------ */"""


          fallback_implementation = r'''
          /* ================================================================== */
          /* HP256G8 v8.4 Adaptive Performance                                  */
          /* ================================================================== */

          void RTW88IEEE80211::fallbackTCFn(
              thread_call_param_t self,
              thread_call_param_t)
          {
              RTW88IEEE80211 *obj =
                  (RTW88IEEE80211 *)
                  self;


              if (!obj)
                  return;


              obj->runFallback40MHz();
          }


          void RTW88IEEE80211::scheduleFallback40MHz()
          {
              if (_fallbackPending)
                  return;


              if (_force40MHz)
                  return;


              if (
                  _state !=
                  RTW88_STATE_CONNECTED
              )
                  return;


              if (
                  _connChanWidth !=
                  80
              )
                  return;


              _fallbackPending =
                  true;


              IOLog(
                  "rtw88: HP256G8 v8.4 "
                  "scheduling 80->40 reconnect "
                  "rssi=%d txNoRx=%u rxFrames=%u\n",

                  _rssi,

                  _perfTxWithoutRx,

                  _rxFrameCount
              );


              if (_fallbackTC) {

                  thread_call_enter(
                      _fallbackTC
                  );

              } else {

                  _fallbackPending =
                      false;
              }
          }


          void RTW88IEEE80211::runFallback40MHz()
          {
              if (
                  _state !=
                  RTW88_STATE_CONNECTED
              ) {

                  _fallbackPending =
                      false;

                  return;
              }


              if (
                  _connChanWidth !=
                  80
              ) {

                  _fallbackPending =
                      false;

                  return;
              }


              if (
                  !_powered
                  ||
                  !_hw
                  ||
                  !_vif
              ) {

                  _fallbackPending =
                      false;

                  return;
              }


              IOLog(
                  "rtw88: HP256G8 v8.4 "
                  "FALLBACK 80 -> 40 MHz reconnect BEGIN\n"
              );


              _force40MHz =
                  true;


              doDisconnect();


              IOSleep(
                  150
              );


              if (
                  !_powered
                  ||
                  !_hw
                  ||
                  !_vif
              ) {

                  _fallbackPending =
                      false;

                  return;
              }


              _state =
                  RTW88_STATE_AUTHENTICATING;


              _perfLastRxFrameCount =
                  _rxFrameCount;


              _perfTxWithoutRx =
                  0;


              _fallbackPending =
                  false;


              IOLog(
                  "rtw88: HP256G8 v8.4 "
                  "reconnecting in Safe 40 MHz mode\n"
              );


              if (_connectTC) {

                  thread_call_enter(
                      _connectTC
                  );

              } else {

                  doAuthenticate();
              }
          }


          '''


          if (
              "void RTW88IEEE80211::runFallback40MHz()"
              not in c
          ):

              c = replace_once(

                  c,

                  tx_section_anchor,

                  fallback_implementation
                  +
                  tx_section_anchor,

                  "TX section"
              )


          print_ok(
              "Adaptive fallback worker implementation"
          )


          # ======================================================================
          #
          # 18. PERFORMANCE WATCHDOG
          #
          # ======================================================================

          output_start = c.find(
              "UInt32 RTW88IEEE80211::outputPacket(mbuf_t m)"
          )


          if output_start < 0:

              raise SystemExit(
                  "ERROR: outputPacket not found"
              )


          output_end = c.find(

              "/* ------------------------------------------------------------------ */\n"
              "/*  RX path:",

              output_start
          )


          if output_end < 0:

              raise SystemExit(
                  "ERROR: RX section after outputPacket not found"
              )


          current_output = c[
              output_start:output_end
          ]


          if (
              "HP256G8 v8.4 performance watchdog"
              not in current_output
          ):

              opening_brace = c.find(
                  "{",
                  output_start
              )


              if opening_brace < 0:

                  raise SystemExit(
                      "ERROR: outputPacket opening brace not found"
                  )


              watchdog_code = r'''

              /*
               * HP256G8 v8.4 performance watchdog
               */

              if (
                  _state ==
                      RTW88_STATE_CONNECTED
                  &&
                  _connChanWidth ==
                      80
                  &&
                  !_force40MHz
              ) {

                  uint32_t currentRx =
                      _rxFrameCount;


                  if (
                      currentRx !=
                      _perfLastRxFrameCount
                  ) {

                      _perfLastRxFrameCount =
                          currentRx;


                      _perfTxWithoutRx =
                          0;

                  } else {

                      if (
                          _perfTxWithoutRx <
                          0xfffffff0U
                      ) {

                          _perfTxWithoutRx++;
                      }
                  }


                  bool invalidRssi =
                      (
                          _rssi >=
                          0
                      );


                  bool rxStalled =
                      (
                          _perfTxWithoutRx >=
                          256
                      );


                  if (
                      invalidRssi
                      ||
                      rxStalled
                  ) {

                      IOLog(
                          "rtw88: HP256G8 v8.4 watchdog trigger "
                          "invalidRSSI=%u rxStalled=%u "
