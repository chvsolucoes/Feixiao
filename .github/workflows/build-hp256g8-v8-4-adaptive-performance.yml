          safe_dma_function = r'''static bool rtw_pci_dma_check(
                  struct rtw_dev *rtwdev,
                  struct rtw_pci_rx_ring *rx_ring,
                  u32 idx)
          {
              struct rtw_pci *rtwpci =
                  (
                      struct rtw_pci *
                  )
                  rtwdev->priv;


              const struct rtw_chip_info *chip =
                  rtwdev->chip;


              struct rtw_pci_rx_buffer_desc *buf_desc;


              u32 desc_sz =
                  chip->rx_buf_desc_sz;


              u16 expected =
                  rtwpci->rx_tag;


              u16 observed =
                  0;


              int i;


              static u32 mismatch_count =
                  0;


              static u32 recovery_count =
                  0;


              buf_desc =
                  (
                      struct rtw_pci_rx_buffer_desc *
                  )
                  (
                      rx_ring->r.head
                      +
                      idx * desc_sz
                  );


              /*
               * HP256G8 v8.4 SAFE RESYNC
               *
               * 100 x 2 us = 200 us.
               */

              for (
                  i = 0;
                  i < 100;
                  i++
              ) {

                  observed =
                      le16_to_cpu(
                          buf_desc->total_pkt_size
                      );


                  if (
                      observed ==
                      expected
                  ) {

                      rtwpci->rx_tag =
                          (
                              expected
                              +
                              1
                          )
                          %
                          RX_TAG_MAX;


                      return true;
                  }


                  udelay(
                      2
                  );
              }


              mismatch_count++;


              u16 delta =
                  0;


              if (
                  expected >=
                  observed
              ) {

                  delta =
                      expected
                      -
                      observed;

              } else {

                  delta =
                      (
                          expected
                          +
                          RX_TAG_MAX
                      )
                      -
                      observed;
              }


              if (
                  delta >
                  0
                  &&
                  delta <=
                  32
              ) {

                  rtwpci->rx_tag =
                      (
                          observed
                          +
                          1
                      )
                      %
                      RX_TAG_MAX;


                  recovery_count++;


                  if (
                      recovery_count ==
                      1
                      ||
                      (
                          recovery_count
                          &
                          0xff
                      )
                      ==
                      0
                  ) {

                      rtw_warn(
                          rtwdev,

                          "HP256G8 v8.4 SAFE RESYNC "
                          "drop current descriptor "
                          "expected=%u observed=%u "
                          "delta=%u next=%u count=%u\n",

                          expected,

                          observed,

                          delta,

                          rtwpci->rx_tag,

                          recovery_count
                      );
                  }

              } else {

                  rtwpci->rx_tag =
                      (
                          expected
                          +
                          1
                      )
                      %
                      RX_TAG_MAX;


                  if (
                      mismatch_count ==
                      1
                      ||
                      (
                          mismatch_count
                          &
                          0xff
                      )
                      ==
                      0
                  ) {

                      rtw_warn(
                          rtwdev,

                          "HP256G8 v8.4 SAFE RX reject "
                          "expected=%u observed=%u "
                          "delta=%u count=%u\n",

                          expected,

                          observed,

                          delta,

                          mismatch_count
                      );
                  }
              }


              return false;
          }


          '''


