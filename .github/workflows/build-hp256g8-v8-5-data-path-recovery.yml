          echo
          echo "Safe macOS mbuf: OK"


      # ================================================================
      # 14 - SAFE DMA DESCRIPTOR CHECK
      # ================================================================

      - name: Apply Safe DMA descriptor recovery
        shell: bash
        run: |
          set -eux

          FILE="rtw88-stable/drivers/net/wireless/realtek/rtw88/pci.c"


          START="$(
            awk '
            index($0, "static bool rtw_pci_dma_check(") > 0 ||
            index($0, "static void rtw_pci_dma_check(") > 0 {
                print NR
                exit
            }
            ' "$FILE"
          )"


          END="$(
            awk '
            index($0, "static u32 __pci_get_hw_tx_ring_rp") > 0 {
                print NR
                exit
            }
            ' "$FILE"
          )"


          test -n "$START"
          test -n "$END"


          if [ "$END" -le "$START" ]; then
            echo "ERROR: invalid DMA check boundaries"
            exit 1
          fi


          cat > /tmp/v851_safe_dma.c <<'C'

          static bool rtw_pci_dma_check(
                  struct rtw_dev *rtwdev,
                  struct rtw_pci_rx_ring *rx_ring,
                  u32 idx)
          {
              struct rtw_pci *rtwpci =
                  (struct rtw_pci *)rtwdev->priv;


              const struct rtw_chip_info *chip =
                  rtwdev->chip;


              struct rtw_pci_rx_buffer_desc *buf_desc;


              u32 desc_sz =
                  chip->rx_buf_desc_sz;


              u16 expected =
                  rtwpci->rx_tag;


              u16 observed =
                  0;


              int i;


              static u32 mismatch_count =
                  0;


              static u32 recovery_count =
                  0;


              buf_desc =
                  (struct rtw_pci_rx_buffer_desc *)
                  (
                      rx_ring->r.head +
                      idx * desc_sz
                  );


              /*
               * HP256G8 v8.5.1 SAFE RESYNC
               *
               * Maximum descriptor wait:
               *
               * 100 x 2 us = 200 us
               */

              for (
                  i = 0;
                  i < 100;
                  i++
              ) {

                  observed =
                      le16_to_cpu(
                          buf_desc->total_pkt_size
                      );


                  if (observed == expected) {

                      rtwpci->rx_tag =
                          (
                              expected +
                              1
                          )
                          %
                          RX_TAG_MAX;


                      return true;
                  }


                  udelay(
                      2
                  );
              }


              mismatch_count++;


              u16 delta =
                  0;


              if (expected >= observed) {

                  delta =
                      expected -
                      observed;

              } else {

                  delta =
                      (
                          expected +
                          RX_TAG_MAX
                      )
                      -
                      observed;
              }


              /*
               * Never parse the bad current descriptor.
               *
               * A small coherent mismatch can only
               * realign the NEXT descriptor tag.
               */

              if (delta > 0 && delta <= 32) {

                  rtwpci->rx_tag =
                      (
                          observed +
                          1
                      )
                      %
                      RX_TAG_MAX;


                  recovery_count++;


                  if (
                      recovery_count == 1 ||
                      (recovery_count & 0xff) == 0
                  ) {

                      rtw_warn(
                          rtwdev,
                          "HP256G8 v8.5.1 SAFE RESYNC "
                          "drop current descriptor "
                          "expected=%u observed=%u "
                          "delta=%u next=%u count=%u\n",
                          expected,
                          observed,
                          delta,
                          rtwpci->rx_tag,
                          recovery_count
                      );
                  }

              } else {

                  rtwpci->rx_tag =
                      (
                          expected +
                          1
                      )
                      %
                      RX_TAG_MAX;


                  if (
                      mismatch_count == 1 ||
                      (mismatch_count & 0xff) == 0
                  ) {

                      rtw_warn(
                          rtwdev,
                          "HP256G8 v8.5.1 SAFE RX reject "
                          "expected=%u observed=%u "
                          "delta=%u count=%u\n",
                          expected,
                          observed,
                          delta,
                          mismatch_count
                      );
                  }
              }


              return false;
          }


          C


          BEFORE="$((START - 1))"


          head -n "$BEFORE" \
            "$FILE" \
            > /tmp/pci.v851.c


          cat \
            /tmp/v851_safe_dma.c \
            >> /tmp/pci.v851.c


          tail -n +"$END" \
            "$FILE" \
            >> /tmp/pci.v851.c


          mv \
            /tmp/pci.v851.c \
            "$FILE"


          grep -q \
            "HP256G8 v8.5.1 SAFE RESYNC" \
            "$FILE"

          grep -q \
            "HP256G8 v8.5.1 SAFE RX reject" \
            "$FILE"


          echo
          echo "Safe DMA descriptor recovery: OK"


      # ================================================================
      # 15 - REJECT BAD CURRENT RX DESCRIPTOR
      #
      # PREVIOUS AWK ALSO HAD MULTILINE IF.
      # NOW FIXED.
      # ================================================================

      - name: Reject bad current RX descriptor
        shell: bash
        run: |
          set -eux

          FILE="rtw88-stable/drivers/net/wireless/realtek/rtw88/pci.c"


          awk '
          BEGIN {
              done = 0
          }

          {
              if (index($0, "rtw_pci_dma_check(rtwdev, ring, cur_rp);") > 0 && done == 0) {

                  print "\t\tif (!rtw_pci_dma_check(rtwdev, ring, cur_rp))"
                  print "\t\t\tgoto next_rp;"

                  done = 1
                  next
              }

              print $0
          }

          END {
              if (done != 1)
                  exit 111
          }
          ' "$FILE" > /tmp/pci.guard.v851.c


          if [ $? -ne 0 ]; then
            echo "ERROR: current-RX descriptor guard insertion failed"
            exit 1
          fi


          mv \
            /tmp/pci.guard.v851.c \
            "$FILE"


          grep -q \
            "if (!rtw_pci_dma_check(rtwdev, ring, cur_rp))" \
            "$FILE"


          echo
          echo "Current bad RX descriptor guard: OK"


      # ================================================================
      # 16 - RX DMA FRAME LENGTH VALIDATION
      #
      # PREVIOUS AWK ALSO HAD MULTILINE IF.
      # NOW FIXED.
      # ================================================================

      - name: Validate RX DMA frame length
        shell: bash
        run: |
          set -eux

          FILE="rtw88-stable/drivers/net/wireless/realtek/rtw88/pci.c"


          awk '
          BEGIN {
              waiting = 0
              done = 0
          }

          {
              print $0


              if (index($0, "pkt_offset = pkt_desc_sz + pkt_stat.drv_info_sz +") > 0 && done == 0) {

                  waiting = 1
                  next
              }


              if (waiting == 1) {

                  print ""
                  print "\t\tif (!pkt_stat.pkt_len ||"
                  print "\t\t    pkt_offset >= RTK_PCI_RX_BUF_SIZE ||"
                  print "\t\t    pkt_stat.pkt_len > RTK_PCI_RX_BUF_SIZE - pkt_offset) {"
                  print ""
                  print "\t\t\trtw_warn("
                  print "\t\t\t\trtwdev,"
                  print "\t\t\t\t\"HP256G8 v8.5.1 invalid RX length \""
                  print "\t\t\t\t\"pkt=%u off=%u\\n\","
                  print "\t\t\t\tpkt_stat.pkt_len,"
                  print "\t\t\t\tpkt_offset"
                  print "\t\t\t);"
                  print ""
                  print "\t\t\tgoto next_rp;"
                  print "\t\t}"
                  print ""

                  waiting = 0
                  done = 1
              }
          }

          END {
              if (done != 1)
                  exit 121
          }
          ' "$FILE" > /tmp/pci.length.v851.c


          if [ $? -ne 0 ]; then
            echo "ERROR: RX DMA length validation insertion failed"
            exit 1
          fi


          mv \
            /tmp/pci.length.v851.c \
            "$FILE"


          grep -q \
            "HP256G8 v8.5.1 invalid RX length" \
            "$FILE"


          echo
          echo "RX DMA frame-length validation: OK"


