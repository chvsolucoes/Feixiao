          echo "================================================"

          grep -q "HP256G8 v8.5 SAFE MBUF" "$PCI"

          grep -q "HP256G8 v8.5 SAFE RESYNC" "$LPCI"
          grep -q "HP256G8 v8.5 SAFE RX reject" "$LPCI"
