name: Build HP256G8 RTL8821CE v8.5.1 Syntax Safe

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build HP256G8 v8.5.1
    runs-on: macos-latest

    steps:

      # ================================================================
      # 01 - CHECKOUT FEIXIAO
      # ================================================================

      - name: Checkout Feixiao
        uses: actions/checkout@v4
        with:
          repository: thegwchr/Feixiao
          ref: e963f43188382eced4ef2fa75d19ce4db2315c68
          submodules: recursive
          path: Feixiao
          fetch-depth: 0


      # ================================================================
      # 02 - CLONE RTW88-STABLE
      # ================================================================

      - name: Clone matching rtw88-stable
        shell: bash
        run: |
          set -eux

          git clone \
            https://github.com/thegwchr/rtw88-stable.git \
            rtw88-stable

          git -C rtw88-stable checkout \
            d029a677c49266fad86750714eb5612becd134d3

          echo
          echo "================================================"
          echo "FEIXIAO COMMIT"
          echo "================================================"

          git -C Feixiao rev-parse HEAD

          echo
          echo "================================================"
          echo "RTW88-STABLE COMMIT"
          echo "================================================"

          git -C rtw88-stable rev-parse HEAD


      # ================================================================
      # 03 - VALIDATE SOURCE TREE
      # ================================================================

      - name: Validate source tree
        shell: bash
        run: |
          set -eux

          test -f Feixiao/src/kext/RTW88IEEE80211.cpp
          test -f Feixiao/src/kext/RTW88IEEE80211.hpp
          test -f Feixiao/src/kext/RTW88PCIDevice.cpp
          test -f Feixiao/src/compat/rtw88_compat.c

          test -f \
            rtw88-stable/drivers/net/wireless/realtek/rtw88/pci.c

          echo
          echo "Source tree: OK"


      # ================================================================
      # 04 - AUTOMATIC RATE CONTROL
      # ================================================================

      - name: Enable automatic firmware rate control
        shell: bash
        run: |
          set -eux

          FILE="Feixiao/src/compat/rtw88_compat.c"

          sed -i '' \
            's/rtwdev->dm_info.fix_rate = DESC_RATE6M;/rtwdev->dm_info.fix_rate = 0xFF;/' \
            "$FILE"

          grep -n \
            "fix_rate = 0xFF" \
            "$FILE"

          echo
          echo "Automatic firmware rate control: OK"


      # ================================================================
      # 05 - WPA2 M3 / M4
      # ================================================================

      - name: Apply WPA2 M3 M4 fixes
        shell: bash
        run: |
          set -eux

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          cp \
            "$FILE" \
            /tmp/RTW88IEEE80211.wpa2.original.cpp


          # ------------------------------------------------------------
          # PASS 1:
          #
          # M4 Key Length
          # M4 Nonce
          # M3 diagnostics
          # ------------------------------------------------------------

          awk '
          BEGIN {
              m4len = 0
              m4nonce = 0
              m3diag = 0
          }

          {
              if (index($0, "key[3] = 0; key[4] = 16;") > 0 && m4len == 0) {

                  print "    if (step == 4) {"
                  print "        key[3] = 0;"
                  print "        key[4] = 0;"
                  print ""
                  print "        IOLog("
                  print "            \"rtw88: HP256G8 v8.5.1 M4 key_length=0\\n\""
                  print "        );"
                  print ""
                  print "    } else {"
                  print "        key[3] = 0;"
                  print "        key[4] = 16;"
                  print "    }"

                  m4len = 1
                  next
              }


              if (index($0, "memcpy(key + 13, _snonce, 32);") > 0 && m4nonce == 0) {

                  print "    if (step == 4) {"
                  print "        memset(key + 13, 0, 32);"
                  print ""
                  print "        IOLog("
                  print "            \"rtw88: HP256G8 v8.5.1 M4 nonce zeroed\\n\""
                  print "        );"
                  print ""
                  print "    } else {"
                  print "        memcpy(key + 13, _snonce, 32);"
                  print "    }"

                  m4nonce = 1
                  next
              }


              print $0


              if (index($0, "else if (is_m3) {") > 0 && m3diag == 0) {

                  print ""
                  print "        IOLog("
                  print "            \"rtw88: HP256G8 v8.5.1 received M3\\n\""
                  print "        );"
                  print ""

                  m3diag = 1
              }
          }

          END {
              if (m4len != 1)
                  exit 41

              if (m4nonce != 1)
                  exit 42

              if (m3diag != 1)
                  exit 43
          }
          ' "$FILE" > /tmp/RTW88IEEE80211.wpa2.pass1.cpp

          if [ $? -ne 0 ]; then
            echo "ERROR: WPA2 structural patch failed"
            exit 1
          fi

          mv \
            /tmp/RTW88IEEE80211.wpa2.pass1.cpp \
            "$FILE"


          # ------------------------------------------------------------
          # PASS 2:
          #
          # Delay before A-MPDU
          # ------------------------------------------------------------

          awk '
          BEGIN {
              done = 0
          }

          {
              if (index($0, "startTxAggregation();") > 0 &&
                  index($0, "keys are installed") > 0 &&
                  done == 0) {

                  print "        IOSleep(100);"
                  print ""
                  print "        IOLog("
                  print "            \"rtw88: HP256G8 v8.5.1 WPA2 settle complete, starting A-MPDU\\n\""
                  print "        );"
                  print ""
                  print "        startTxAggregation();"

                  done = 1
                  next
              }

              print $0
          }

          END {
              if (done != 1)
                  exit 44
          }
          ' "$FILE" > /tmp/RTW88IEEE80211.wpa2.final.cpp

          if [ $? -ne 0 ]; then
            echo "ERROR: A-MPDU settle patch failed"
            exit 1
          fi

          mv \
            /tmp/RTW88IEEE80211.wpa2.final.cpp \
            "$FILE"


          # ------------------------------------------------------------
          # VALIDATE
          # ------------------------------------------------------------

          grep -q \
            "HP256G8 v8.5.1 M4 key_length=0" \
            "$FILE"

          grep -q \
            "HP256G8 v8.5.1 M4 nonce zeroed" \
            "$FILE"

          grep -q \
            "HP256G8 v8.5.1 received M3" \
            "$FILE"

          grep -q \
            "HP256G8 v8.5.1 WPA2 settle complete" \
            "$FILE"

          grep -q "sendEAPOLKey" "$FILE"
          grep -q "_ptkConf" "$FILE"
          grep -q "_gtkConf" "$FILE"
          grep -q "installKey" "$FILE"

          echo
          echo "================================================"
          echo "WPA2 PATCH: OK"
          echo "================================================"


      # ================================================================
      # 06 - HEADER STATE / METHODS
      # ================================================================

      - name: Add v8.5.1 header declarations
        shell: bash
        run: |
          set -eux

          FILE="Feixiao/src/kext/RTW88IEEE80211.hpp"

          cp \
            "$FILE" \
            /tmp/RTW88IEEE80211.hpp.original


          awk '
          BEGIN {
              methods = 0
              threadmember = 0
              state = 0
          }

          {
              print $0


              if (index($0, "void      setConnectedChandef(struct ieee80211_channel *chan);") > 0 &&
                  methods == 0) {

                  print "    void      scheduleDataPathRecovery();"
                  print "    void      runDataPathRecovery();"
                  print ""
                  print "    static void dataPathRecoveryTCFn("
                  print "        thread_call_param_t self,"
                  print "        thread_call_param_t"
                  print "    );"

                  methods = 1
              }


              if (index($0, "thread_call_t _connectTC = nullptr;") > 0 &&
                  threadmember == 0) {

                  print ""
                  print "    thread_call_t _dataPathRecoveryTC = nullptr;"

                  threadmember = 1
              }


              if (index($0, "uint8_t  _connChanWidth = 20;") > 0 &&
                  state == 0) {

                  print ""
                  print "    /* HP256G8 v8.5.1 Data Path Recovery */"
                  print ""
                  print "    bool _force40MHz = false;"
                  print ""
                  print "    volatile bool _fallbackPending = false;"
                  print ""
                  print "    uint32_t _perfLastRxFrameCount = 0;"
                  print ""
                  print "    uint32_t _perfTxWithoutRx = 0;"
                  print ""
                  print "    volatile uint32_t _usefulRxCount = 0;"
                  print ""
                  print "    uint32_t _dataPathRecoveryCount = 0;"

                  state = 1
              }
          }

          END {
              if (methods != 1)
                  exit 51

              if (threadmember != 1)
                  exit 52

              if (state != 1)
                  exit 53
          }
          ' "$FILE" > /tmp/RTW88IEEE80211.hpp.v851

          if [ $? -ne 0 ]; then
            echo "ERROR: header patch failed"
            exit 1
          fi


          mv \
            /tmp/RTW88IEEE80211.hpp.v851 \
            "$FILE"


          grep -q \
            "scheduleDataPathRecovery" \
            "$FILE"

          grep -q \
            "runDataPathRecovery" \
            "$FILE"

          grep -q \
            "_dataPathRecoveryTC" \
            "$FILE"

          grep -q \
            "_force40MHz" \
            "$FILE"

          grep -q \
            "_fallbackPending" \
            "$FILE"

          grep -q \
            "_perfLastRxFrameCount" \
            "$FILE"

          grep -q \
            "_perfTxWithoutRx" \
            "$FILE"

          grep -q \
            "_usefulRxCount" \
            "$FILE"

          grep -q \
            "_dataPathRecoveryCount" \
            "$FILE"

          echo
          echo "Header v8.5.1: OK"


      # ================================================================
      # 07 - ADAPTIVE VHT 80 MHZ
      # ================================================================

      - name: Enable adaptive VHT 80 MHz
        shell: bash
        run: |
          set -eux

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          cp \
            "$FILE" \
            /tmp/RTW88IEEE80211.vht.original.cpp


          awk '
          BEGIN {
              condition = 0
              marker = 0
          }

          {
              if (index($0, "if (chip80 && vhtWidth == 1 && vhtSeg0 != 0) {") > 0 &&
                  condition == 0) {

                  print "    if (!_force40MHz && chip80 && vhtWidth == 1 && vhtSeg0 != 0) {"

                  condition = 1
                  next
              }


              if (index($0, "IOLog(\"rtw88: connected chandef:") > 0 &&
                  marker == 0) {

                  print "    IOLog("
                  print "        \"rtw88: HP256G8 v8.5.1 Data-Path Recovery active \""
                  print "        \"safe40=%u usefulRx=%u\\n\","
                  print "        _force40MHz ? 1 : 0,"
                  print "        _usefulRxCount"
                  print "    );"
                  print ""

                  marker = 1
              }


              print $0
          }

          END {
              if (condition != 1)
                  exit 61

              if (marker != 1)
                  exit 62
          }
          ' "$FILE" > /tmp/RTW88IEEE80211.vht.v851.cpp

          if [ $? -ne 0 ]; then
            echo "ERROR: adaptive VHT patch failed"
            exit 1
          fi


          mv \
            /tmp/RTW88IEEE80211.vht.v851.cpp \
            "$FILE"


          grep -q \
            "if (!_force40MHz && chip80 && vhtWidth == 1 && vhtSeg0 != 0)" \
            "$FILE"

          grep -q \
            "HP256G8 v8.5.1 Data-Path Recovery active" \
            "$FILE"


          echo
          echo "================================================"
          echo "ADAPTIVE VHT: OK"
          echo "================================================"


      # ================================================================
      # 08 - USEFUL ETHERNET RX COUNTER
      # ================================================================

      - name: Add useful Ethernet RX counter
        shell: bash
        run: |
          set -eux

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"


          awk '
          BEGIN {
              done = 0
          }

          {
              print $0


              if (index($0, "_parent->injectRxFrame(m);") > 0 &&
                  done == 0) {

                  print ""
                  print "    /* HP256G8 v8.5.1 useful Ethernet RX */"
                  print ""
                  print "    if (ethertype == 0x0800 ||"
                  print "        ethertype == 0x0806 ||"
                  print "        ethertype == 0x86DD) {"
                  print ""
                  print "        _usefulRxCount++;"
                  print "    }"

                  done = 1
              }
          }

          END {
              if (done != 1)
                  exit 71
          }
          ' "$FILE" > /tmp/RTW88IEEE80211.usefulrx.v851.cpp

          if [ $? -ne 0 ]; then
            echo "ERROR: useful RX patch failed"
            exit 1
          fi


          mv \
            /tmp/RTW88IEEE80211.usefulrx.v851.cpp \
            "$FILE"


          grep -q \
            "HP256G8 v8.5.1 useful Ethernet RX" \
            "$FILE"

          echo
          echo "Useful Ethernet RX counter: OK"


      # ================================================================
      # 09 - DATA PATH RECOVERY FUNCTIONS
      # ================================================================

      - name: Add Data Path Recovery functions
        shell: bash
        run: |
          set -eux

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"


          cat > /tmp/v851_recovery.cpp <<'CPP'

          /* ================================================================== */
          /* HP256G8 v8.5.1 Data Path Recovery                                  */
          /* ================================================================== */

          void RTW88IEEE80211::dataPathRecoveryTCFn(
              thread_call_param_t self,
              thread_call_param_t)
          {
              RTW88IEEE80211 *obj =
                  (RTW88IEEE80211 *)self;

              if (!obj)
                  return;

              obj->runDataPathRecovery();
          }


          void RTW88IEEE80211::scheduleDataPathRecovery()
          {
              if (_fallbackPending)
                  return;

              if (_state != RTW88_STATE_CONNECTED)
                  return;

              if (!_dataPathRecoveryTC)
                  return;


              _fallbackPending =
                  true;


              IOLog(
                  "rtw88: HP256G8 v8.5.1 scheduling DATA PATH recovery "
                  "width=%u rssi=%d txNoUsefulRx=%u usefulRx=%u rawRx=%u\n",
                  _connChanWidth,
                  _rssi,
                  _perfTxWithoutRx,
                  _usefulRxCount,
                  _rxFrameCount
              );


              thread_call_enter(
                  _dataPathRecoveryTC
              );
          }


          void RTW88IEEE80211::runDataPathRecovery()
          {
              if (
                  _state != RTW88_STATE_CONNECTED ||
                  !_powered ||
                  !_hw ||
                  !_vif
              ) {

                  _fallbackPending =
                      false;

                  return;
              }


              uint8_t failedWidth =
                  _connChanWidth;


              _dataPathRecoveryCount++;


              IOLog(
                  "rtw88: HP256G8 v8.5.1 DATA PATH RECOVERY BEGIN "
                  "attempt=%u width=%u rssi=%d usefulRx=%u rawRx=%u\n",
                  _dataPathRecoveryCount,
                  failedWidth,
                  _rssi,
                  _usefulRxCount,
                  _rxFrameCount
              );


              /*
               * If the data path failed at 80 MHz,
               * do not immediately return to 80 MHz.
               */

              if (failedWidth == 80) {

                  _force40MHz =
                      true;


                  IOLog(
                      "rtw88: HP256G8 v8.5.1 "
                      "80 MHz marked unstable; Safe 40 MHz armed\n"
                  );
              }


              /*
               * Normal disconnect performs:
               *
               * key cleanup
               * STA cleanup
               * TX BA cleanup
               * RX BA reorder cleanup
               */

              doDisconnect();


              /*
               * Give firmware / PCI / DMA some time
               * before starting another association.
               */

              IOSleep(
                  250
              );


              if (
                  !_powered ||
                  !_hw ||
                  !_vif
              ) {

                  _fallbackPending =
                      false;

                  return;
              }


              _perfTxWithoutRx =
                  0;


              _perfLastRxFrameCount =
                  _usefulRxCount;


              _fallbackPending =
                  false;


              _state =
                  RTW88_STATE_AUTHENTICATING;


              IOLog(
                  "rtw88: HP256G8 v8.5.1 reconnecting after "
                  "DATA PATH recovery safe40=%u\n",
                  _force40MHz ? 1 : 0
              );


              if (_connectTC) {

                  thread_call_enter(
                      _connectTC
                  );

              } else {

                  doAuthenticate();
              }
          }


          CPP


          awk '
          BEGIN {
              inserted = 0
          }

          {
              if (index($0, "TX path: Ethernet") > 0 &&
                  inserted == 0) {

                  while ((getline line < "/tmp/v851_recovery.cpp") > 0)
                      print line

                  close("/tmp/v851_recovery.cpp")

                  inserted = 1
              }

              print $0
          }

          END {
              if (inserted != 1)
                  exit 81
          }
          ' "$FILE" > /tmp/RTW88IEEE80211.recovery.v851.cpp


          if [ $? -ne 0 ]; then
            echo "ERROR: recovery-function insertion failed"
            exit 1
          fi


          mv \
            /tmp/RTW88IEEE80211.recovery.v851.cpp \
            "$FILE"


          grep -q \
            "HP256G8 v8.5.1 scheduling DATA PATH recovery" \
            "$FILE"

          grep -q \
            "HP256G8 v8.5.1 DATA PATH RECOVERY BEGIN" \
            "$FILE"

          grep -q \
            "HP256G8 v8.5.1 reconnecting after DATA PATH recovery" \
            "$FILE"


          echo
          echo "Data Path Recovery functions: OK"


      # ================================================================
      # 10 - WORKER LIFECYCLE
      #
      # THIS IS THE STEP THAT FAILED BEFORE.
      #
      # NO MULTILINE AWK IF.
      # NO COMPLEX REGEX.
      # NO PIPELINE.
      # ================================================================

      - name: Add Data Path Recovery worker lifecycle
        shell: bash
        run: |
          set -eux

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          cp \
            "$FILE" \
            /tmp/RTW88IEEE80211.worker.original.cpp


          # ------------------------------------------------------------
          # ALLOCATION
          # ------------------------------------------------------------

          awk '
          BEGIN {
              waiting = 0
              allocated = 0
          }

          {
              print $0


              if (index($0, "_connectTC = thread_call_allocate") > 0 && allocated == 0) {
                  waiting = 1
                  next
              }


              if (waiting == 1 && index($0, "(thread_call_param_t)this);") > 0) {

                  print ""
                  print "    _dataPathRecoveryTC = thread_call_allocate("
                  print "        (thread_call_func_t)RTW88IEEE80211::dataPathRecoveryTCFn,"
                  print "        (thread_call_param_t)this"
                  print "    );"
                  print ""
                  print "    if (!_dataPathRecoveryTC)"
                  print "        return false;"
                  print ""

                  waiting = 0
                  allocated = 1
              }
          }

          END {
              if (allocated != 1)
                  exit 91
          }
          ' "$FILE" > /tmp/RTW88IEEE80211.worker.alloc.cpp


          if [ $? -ne 0 ]; then
            echo "ERROR: recovery-worker allocation insertion failed"
            exit 1
          fi


          mv \
            /tmp/RTW88IEEE80211.worker.alloc.cpp \
            "$FILE"


          # ------------------------------------------------------------
          # CLEANUP
          # ------------------------------------------------------------

          awk '
          BEGIN {
              freed = 0
          }

          {
              if (index($0, "if (_connectTC) { thread_call_cancel(_connectTC); thread_call_free(_connectTC); _connectTC = nullptr; }") > 0 && freed == 0) {

                  print "    if (_dataPathRecoveryTC) {"
                  print "        thread_call_cancel(_dataPathRecoveryTC);"
                  print "        thread_call_free(_dataPathRecoveryTC);"
                  print "        _dataPathRecoveryTC = nullptr;"
                  print "    }"
                  print ""
                  print $0

                  freed = 1
                  next
              }

              print $0
          }

          END {
              if (freed != 1)
                  exit 92
          }
          ' "$FILE" > /tmp/RTW88IEEE80211.worker.final.cpp


          if [ $? -ne 0 ]; then
            echo "ERROR: recovery-worker cleanup insertion failed"
            exit 1
          fi


          mv \
            /tmp/RTW88IEEE80211.worker.final.cpp \
            "$FILE"


          # ------------------------------------------------------------
          # VALIDATION
          # ------------------------------------------------------------

          grep -q \
            "_dataPathRecoveryTC = thread_call_allocate" \
            "$FILE"

          grep -q \
            "thread_call_cancel(_dataPathRecoveryTC)" \
            "$FILE"

          grep -q \
            "thread_call_free(_dataPathRecoveryTC)" \
            "$FILE"


          echo
          echo "================================================"
          echo "RECOVERY WORKER LIFECYCLE: OK"
          echo "================================================"


      # ================================================================
      # 11 - DATA PATH WATCHDOG
      # ================================================================

      - name: Install useful RX Data Path watchdog
        shell: bash
        run: |
          set -eux

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"


          cat > /tmp/v851_watchdog.cpp <<'CPP'

              /*
               * ==============================================================
               * HP256G8 v8.5.1 DATA PATH WATCHDOG
               * ==============================================================
               *
               * _rxFrameCount includes raw 802.11 frames.
               *
               * _usefulRxCount only counts Ethernet packets
               * delivered to macOS.
               */

              if (_state == RTW88_STATE_CONNECTED && !_fallbackPending) {

                  uint32_t currentUsefulRx =
                      _usefulRxCount;


                  if (currentUsefulRx != _perfLastRxFrameCount) {

                      _perfLastRxFrameCount =
                          currentUsefulRx;

                      _perfTxWithoutRx =
                          0;

                  } else {

                      if (_perfTxWithoutRx < 0xfffffff0U)
                          _perfTxWithoutRx++;
                  }


                  bool invalidRssi =
                      (_rssi >= 0);


                  bool usefulRxStalled =
                      (_perfTxWithoutRx >= 128);


                  if (invalidRssi || usefulRxStalled) {

                      IOLog(
                          "rtw88: HP256G8 v8.5.1 DATA PATH STALL "
                          "width=%u rssi=%d "
                          "txNoUsefulRx=%u usefulRx=%u rawRx=%u\n",
                          _connChanWidth,
                          _rssi,
                          _perfTxWithoutRx,
                          _usefulRxCount,
                          _rxFrameCount
                      );


                      scheduleDataPathRecovery();
                  }
              }


          CPP


          awk '
          BEGIN {
              waiting = 0
              inserted = 0
          }

          {
              print $0


              if (index($0, "UInt32 RTW88IEEE80211::outputPacket(mbuf_t m)") > 0) {
                  waiting = 1
                  next
              }


              if (waiting == 1 && $0 == "{") {

                  while ((getline line < "/tmp/v851_watchdog.cpp") > 0)
                      print line

                  close("/tmp/v851_watchdog.cpp")

                  waiting = 0
                  inserted = 1
              }
          }

          END {
              if (inserted != 1)
                  exit 101
          }
          ' "$FILE" > /tmp/RTW88IEEE80211.watchdog.v851.cpp


          if [ $? -ne 0 ]; then
            echo "ERROR: watchdog insertion failed"
            exit 1
          fi


          mv \
            /tmp/RTW88IEEE80211.watchdog.v851.cpp \
            "$FILE"


          grep -q \
            "HP256G8 v8.5.1 DATA PATH WATCHDOG" \
            "$FILE"

          grep -q \
            "HP256G8 v8.5.1 DATA PATH STALL" \
            "$FILE"


          echo
          echo "Data Path watchdog: OK"


      # ================================================================
      # 12 - TX FLOW CONTROL
      # ================================================================

      - name: Set HP256G8 TX thresholds
        shell: bash
        run: |
          set -eux

          FILE="Feixiao/src/kext/RTW88PCIDevice.cpp"


          sed -i '' \
            's/kRTW88TxStallAvail = 128/kRTW88TxStallAvail = 96/g' \
            "$FILE"


          sed -i '' \
            's/kRTW88TxResumeAvail = 192/kRTW88TxResumeAvail = 160/g' \
            "$FILE"


          grep -nE \
            "kRTW88TxStallAvail|kRTW88TxResumeAvail" \
            "$FILE"


          echo
          echo "TX thresholds: OK"


      # ================================================================
      # 13 - SAFE MACOS MBUF
      # ================================================================

      - name: Apply Safe macOS mbuf validation
        shell: bash
        run: |
          set -eux

          FILE="Feixiao/src/kext/RTW88PCIDevice.cpp"


          START="$(
            awk '
            index($0, "void RTW88PCIDevice::injectRxFrame(mbuf_t m)") > 0 {
                print NR
                exit
            }
            ' "$FILE"
          )"


          END="$(
            awk '
            index($0, "DMA coherent allocation") > 0 {
                print NR
                exit
            }
            ' "$FILE"
          )"


          test -n "$START"
          test -n "$END"


          if [ "$END" -le "$START" ]; then
            echo "ERROR: invalid injectRxFrame boundaries"
            exit 1
          fi


          cat > /tmp/v851_safe_mbuf.cpp <<'CPP'

          void RTW88PCIDevice::injectRxFrame(mbuf_t m)
          {
              drainPendingFree();


              if (!_iface || !_enabled) {

                  freePacket(m);
                  return;
              }


              const size_t kMinFrame =
                  14;


              const size_t kMaxFrame =
                  4096;


              const unsigned int kMaxSegments =
                  32;


              size_t packetLength =
                  mbuf_pkthdr_len(m);


              size_t firstLength =
                  mbuf_len(m);


              size_t chainLength =
                  0;


              unsigned int segments =
                  0;


              bool malformed =
                  false;


              for (
                  mbuf_t segment = m;
                  segment != nullptr;
                  segment = mbuf_next(segment)
              ) {

                  size_t length =
                      mbuf_len(segment);


                  segments++;


                  if (
                      segments > kMaxSegments ||
                      length > kMaxFrame ||
                      chainLength > kMaxFrame - length
                  ) {

                      malformed =
                          true;

                      break;
                  }


                  chainLength +=
                      length;
              }


              if (
                  malformed ||
                  packetLength < kMinFrame ||
                  packetLength > kMaxFrame ||
                  firstLength < kMinFrame ||
                  firstLength > kMaxFrame ||
                  chainLength != packetLength
              ) {

                  IOLog(
                      "rtw88: HP256G8 v8.5.1 SAFE MBUF drop "
                      "pkthdr=%zu first=%zu chain=%zu segs=%u\n",
                      packetLength,
                      firstLength,
                      chainLength,
                      segments
                  );


                  freePacket(m);

                  return;
              }


              _iface->inputPacket(
                  m,
                  0,
                  IONetworkInterface::kInputOptionQueuePacket
              );


              _iface->flushInputQueue();


              IONetworkData *nd =
                  _iface->getNetworkData(
                      kIONetworkStatsKey
                  );


              if (nd) {

                  IONetworkStats *stats =
                      (IONetworkStats *)
                      nd->getBuffer();


                  if (stats)
                      stats->inputPackets++;
              }
          }


          CPP


          BEFORE="$((START - 1))"


          head -n "$BEFORE" \
            "$FILE" \
            > /tmp/RTW88PCIDevice.v851.cpp


          cat \
            /tmp/v851_safe_mbuf.cpp \
            >> /tmp/RTW88PCIDevice.v851.cpp


          tail -n +"$END" \
            "$FILE" \
            >> /tmp/RTW88PCIDevice.v851.cpp


          mv \
