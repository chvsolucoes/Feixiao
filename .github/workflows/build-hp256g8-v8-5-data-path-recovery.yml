name: Build HP256G8 RTL8821CE v8.5 Data Path Recovery

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build HP256G8 v8.5
    runs-on: macos-latest

    steps:

      # ================================================================
      # 1. CHECKOUT FEIXIAO
      # ================================================================

      - name: Checkout Feixiao
        uses: actions/checkout@v4
        with:
          repository: thegwchr/Feixiao
          ref: e963f43188382eced4ef2fa75d19ce4db2315c68
          submodules: recursive
          path: Feixiao
          fetch-depth: 0


      # ================================================================
      # 2. CLONE RTW88-STABLE
      # ================================================================

      - name: Clone matching rtw88-stable
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            https://github.com/thegwchr/rtw88-stable.git \
            rtw88-stable

          git -C rtw88-stable checkout \
            d029a677c49266fad86750714eb5612becd134d3

          echo
          echo "================================================"
          echo "FEIXIAO"
          echo "================================================"

          git -C Feixiao rev-parse HEAD

          echo
          echo "================================================"
          echo "RTW88-STABLE"
          echo "================================================"

          git -C rtw88-stable rev-parse HEAD


      # ================================================================
      # 3. VALIDATE SOURCE TREE
      # ================================================================

      - name: Validate source tree
        shell: bash
        run: |
          set -euxo pipefail

          test -f Feixiao/src/kext/RTW88IEEE80211.cpp
          test -f Feixiao/src/kext/RTW88IEEE80211.hpp
          test -f Feixiao/src/kext/RTW88PCIDevice.cpp
          test -f Feixiao/src/compat/rtw88_compat.c

          test -f \
            rtw88-stable/drivers/net/wireless/realtek/rtw88/pci.c

          echo
          echo "Source tree: OK"


      # ================================================================
      # 4. AUTOMATIC RATE CONTROL
      # ================================================================

      - name: Enable automatic firmware rate control
        shell: bash
        run: |
          set -euxo pipefail

          FILE="Feixiao/src/compat/rtw88_compat.c"

          if grep -q \
            "rtwdev->dm_info.fix_rate = DESC_RATE6M;" \
            "$FILE"
          then
            sed -i '' \
              's/rtwdev->dm_info.fix_rate = DESC_RATE6M;/rtwdev->dm_info.fix_rate = 0xFF;/' \
              "$FILE"
          fi

          grep -n \
            "fix_rate = 0xFF" \
            "$FILE"

          echo
          echo "Automatic rate control: OK"


      # ================================================================
      # 5. WPA2 M4 KEY LENGTH
      # ================================================================

      - name: Fix WPA2 M4 Key Length
        shell: bash
        run: |
          set -euxo pipefail

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          if grep -q \
            "HP256G8 v8.5 M4 key_length=0" \
            "$FILE"
          then
            echo "M4 Key Length fix already present."
            exit 0
          fi

          LINE="$(
            grep -n \
              "key\[3\] = 0; key\[4\] = 16;" \
              "$FILE" \
              | head -1 \
              | cut -d: -f1
          )"

          test -n "$LINE"

          cp \
            "$FILE" \
            /tmp/RTW88IEEE80211.before-keylength.cpp

          awk -v target="$LINE" '
          NR == target {
              print "    if (step == 4) {"
              print ""
              print "        key[3] = 0;"
              print "        key[4] = 0;"
              print ""
              print "        IOLog("
              print "            \"rtw88: HP256G8 v8.5 M4 key_length=0\\n\""
              print "        );"
              print ""
              print "    } else {"
              print ""
              print "        key[3] = 0;"
              print "        key[4] = 16;"
              print "    }"
              next
          }

          {
              print
          }
          ' "$FILE" > /tmp/RTW88IEEE80211.keylength.cpp

          mv \
            /tmp/RTW88IEEE80211.keylength.cpp \
            "$FILE"

          COUNT="$(
            grep -c \
              "HP256G8 v8.5 M4 key_length=0" \
              "$FILE"
          )"

          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: M4 Key Length patch invalid"

            cp \
              /tmp/RTW88IEEE80211.before-keylength.cpp \
              "$FILE"

            exit 1
          fi

          grep -n \
            -A 15 \
            -B 4 \
            "HP256G8 v8.5 M4 key_length=0" \
            "$FILE"

          echo
          echo "WPA2 M4 Key Length: OK"


      # ================================================================
      # 6. WPA2 M4 NONCE
      # ================================================================

      - name: Fix WPA2 M4 nonce
        shell: bash
        run: |
          set -euxo pipefail

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          if grep -q \
            "HP256G8 v8.5 M4 nonce zeroed" \
            "$FILE"
          then
            echo "M4 nonce fix already present."
            exit 0
          fi

          LINE="$(
            grep -n \
              "memcpy(key + 13, _snonce, 32);" \
              "$FILE" \
              | head -1 \
              | cut -d: -f1
          )"

          test -n "$LINE"

          cp \
            "$FILE" \
            /tmp/RTW88IEEE80211.before-nonce.cpp

          awk -v target="$LINE" '
          NR == target {
              print "    if (step == 4) {"
              print ""
              print "        memset("
              print "            key + 13,"
              print "            0,"
              print "            32"
              print "        );"
              print ""
              print "        IOLog("
              print "            \"rtw88: HP256G8 v8.5 M4 nonce zeroed\\n\""
              print "        );"
              print ""
              print "    } else {"
              print ""
              print "        memcpy("
              print "            key + 13,"
              print "            _snonce,"
              print "            32"
              print "        );"
              print "    }"
              next
          }

          {
              print
          }
          ' "$FILE" > /tmp/RTW88IEEE80211.nonce.cpp

          mv \
            /tmp/RTW88IEEE80211.nonce.cpp \
            "$FILE"

          grep -n \
            -A 18 \
            -B 4 \
            "HP256G8 v8.5 M4 nonce zeroed" \
            "$FILE"

          echo
          echo "WPA2 M4 nonce: OK"


      # ================================================================
      # 7. WPA2 M3 DIAGNOSTICS
      # MACOS AWK COMPATIBLE
      # ================================================================

      - name: Add WPA2 M3 diagnostics
        shell: bash
        run: |
          set -euxo pipefail

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          if grep -q \
            "HP256G8 v8.5 received M3" \
            "$FILE"
          then
            echo "M3 diagnostic already present."
            exit 0
          fi

          cp \
            "$FILE" \
            /tmp/RTW88IEEE80211.before-m3.cpp

          awk '
          {
              print $0

              if ($0 ~ /else if[[:space:]]*\([[:space:]]*is_m3[[:space:]]*\)[[:space:]]*\{/ && inserted == 0) {
                  print ""
                  print "        IOLog("
                  print "            \"rtw88: HP256G8 v8.5 received M3\\n\""
                  print "        );"
                  print ""

                  inserted = 1
              }
          }

          END {
              if (inserted != 1) {
                  exit 42
              }
          }
          ' "$FILE" > /tmp/RTW88IEEE80211.after-m3.cpp || {
              STATUS=$?

              if [ "$STATUS" -eq 42 ]; then
                  echo "ERROR: M3 anchor not found"
              else
                  echo "ERROR: awk failed with status $STATUS"
              fi

              cp \
                /tmp/RTW88IEEE80211.before-m3.cpp \
                "$FILE"

              exit 1
          }

          mv \
            /tmp/RTW88IEEE80211.after-m3.cpp \
            "$FILE"

          COUNT="$(
            grep -c \
              "HP256G8 v8.5 received M3" \
              "$FILE"
          )"

          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: expected exactly one M3 diagnostic, found $COUNT"

            cp \
              /tmp/RTW88IEEE80211.before-m3.cpp \
              "$FILE"

            exit 1
          fi

          echo
          echo "================================================"
          echo "WPA2 M3 DIAGNOSTIC"
          echo "================================================"

          grep -n \
            -A 8 \
            -B 3 \
            "HP256G8 v8.5 received M3" \
            "$FILE"

          echo
          echo "WPA2 M3 diagnostic: OK"


      # ================================================================
      # 8. VALIDATE WPA2 ROUTINES
      # ================================================================

      - name: Validate WPA2 PTK GTK routines
        shell: bash
        run: |
          set -euxo pipefail

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          grep -q "sendEAPOLKey" "$FILE"
          grep -q "_ptkConf" "$FILE"
          grep -q "_gtkConf" "$FILE"
          grep -q "installKey" "$FILE"

          echo
          echo "WPA2/PTK/GTK source routines: OK"


      # ================================================================
      # 9. A-MPDU WPA2 SETTLE
      # ================================================================

      - name: Add WPA2 A-MPDU settle delay
        shell: bash
        run: |
          set -euxo pipefail

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          if grep -q \
            "HP256G8 v8.5 WPA2 settle complete" \
            "$FILE"
          then
            echo "A-MPDU settle already present."
            exit 0
          fi

          LINE="$(
            grep -n \
              "startTxAggregation();" \
              "$FILE" \
              | tail -1 \
              | cut -d: -f1
          )"

          test -n "$LINE"

          awk -v target="$LINE" '
          NR == target {
              print "        IOSleep(100);"
              print ""
              print "        IOLog("
              print "            \"rtw88: HP256G8 v8.5 WPA2 settle complete, starting A-MPDU\\n\""
              print "        );"
              print ""
          }

          {
              print
          }
          ' "$FILE" > /tmp/RTW88IEEE80211.ampdu.cpp

          mv \
            /tmp/RTW88IEEE80211.ampdu.cpp \
            "$FILE"

          grep -n \
            -A 10 \
            -B 4 \
            "HP256G8 v8.5 WPA2 settle complete" \
            "$FILE"


      # ================================================================
      # 10. HEADER STATE VARIABLES
      # ================================================================

      - name: Add v8.5 state variables
        shell: bash
        run: |
          set -euxo pipefail

          FILE="Feixiao/src/kext/RTW88IEEE80211.hpp"

          if grep -q \
            "_usefulRxCount" \
            "$FILE"
          then
            echo "v8.5 state variables already present."
            exit 0
          fi

          LINE="$(
            grep -n \
              "_connChanWidth" \
              "$FILE" \
              | head -1 \
              | cut -d: -f1
          )"

          test -n "$LINE"

          awk -v target="$LINE" '
          {
              print

              if (NR == target) {
                  print "    bool _force40MHz = false;"
                  print ""
                  print "    volatile bool _fallbackPending = false;"
                  print ""
                  print "    uint32_t _perfLastRxFrameCount = 0;"
                  print ""
                  print "    uint32_t _perfTxWithoutRx = 0;"
                  print ""
                  print "    volatile uint32_t _usefulRxCount = 0;"
                  print ""
                  print "    uint32_t _dataPathRecoveryCount = 0;"
              }
          }
          ' "$FILE" > /tmp/RTW88IEEE80211.hpp.new

          mv \
            /tmp/RTW88IEEE80211.hpp.new \
            "$FILE"

          grep -nE \
            "connChanWidth|force40MHz|fallbackPending|perfLastRx|perfTx|usefulRx|dataPathRecovery" \
            "$FILE"


      # ================================================================
      # 11. HEADER RECOVERY METHODS
      # ================================================================

      - name: Add v8.5 recovery declarations
        shell: bash
        run: |
          set -euxo pipefail

          FILE="Feixiao/src/kext/RTW88IEEE80211.hpp"

          if grep -q \
            "scheduleDataPathRecovery" \
            "$FILE"
          then
            echo "Recovery declarations already present."
            exit 0
          fi

          LINE="$(
            grep -n \
              "setConnectedChandef" \
              "$FILE" \
              | head -1 \
              | cut -d: -f1
          )"

          test -n "$LINE"

          awk -v target="$LINE" '
          {
              print

              if (NR == target) {
                  print "    void scheduleDataPathRecovery();"
                  print ""
                  print "    void runDataPathRecovery();"
                  print ""
                  print "    static void dataPathRecoveryTCFn("
                  print "        thread_call_param_t self,"
                  print "        thread_call_param_t"
                  print "    );"
              }
          }
          ' "$FILE" > /tmp/RTW88IEEE80211.methods.hpp

          mv \
            /tmp/RTW88IEEE80211.methods.hpp \
            "$FILE"

          grep -nE \
            "scheduleDataPathRecovery|runDataPathRecovery|dataPathRecoveryTCFn" \
            "$FILE"


      # ================================================================
      # 12. HEADER RECOVERY THREAD
      # ================================================================

      - name: Add Data Path Recovery thread call member
        shell: bash
        run: |
          set -euxo pipefail

          FILE="Feixiao/src/kext/RTW88IEEE80211.hpp"

          if grep -q \
            "_dataPathRecoveryTC" \
            "$FILE"
          then
            echo "Recovery thread member already present."
            exit 0
          fi

          LINE="$(
            grep -n \
              "_connectTC" \
              "$FILE" \
              | head -1 \
              | cut -d: -f1
          )"

          test -n "$LINE"

          awk -v target="$LINE" '
          {
              print

              if (NR == target) {
                  print "    thread_call_t _dataPathRecoveryTC = nullptr;"
              }
          }
          ' "$FILE" > /tmp/RTW88IEEE80211.thread.hpp

          mv \
            /tmp/RTW88IEEE80211.thread.hpp \
            "$FILE"

          grep -n \
            "_dataPathRecoveryTC" \
            "$FILE"


      # ================================================================
      # 13. ADAPTIVE VHT 80 MHZ
      #
      # CORRIGIDO:
      # SEM PERL.
      # AWK COMPATÍVEL COM MACOS.
      # ================================================================

      - name: Enable adaptive VHT 80 MHz
        shell: bash
        run: |
          set -euxo pipefail

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          if grep -q \
            "!_force40MHz &&" \
            "$FILE"
          then
            echo "Adaptive VHT 80 MHz already present."
            exit 0
          fi

          cp \
            "$FILE" \
            /tmp/RTW88IEEE80211.before-vht80.cpp

          SINGLE_LINE="$(
            grep -n \
              "if (chip80 && vhtWidth == 1 && vhtSeg0 != 0)" \
              "$FILE" \
              | head -1 \
              | cut -d: -f1 \
              || true
          )"

          if [ -n "$SINGLE_LINE" ]; then

            awk -v target="$SINGLE_LINE" '
            NR == target {
                print "    if (!_force40MHz && chip80 && vhtWidth == 1 && vhtSeg0 != 0) {"
                next
            }

            {
                print
            }
            ' "$FILE" > /tmp/RTW88IEEE80211.vht80.cpp

          else

            CHIP_LINE="$(
              grep -n \
                "chip80 &&" \
                "$FILE" \
                | head -1 \
                | cut -d: -f1 \
                || true
            )"

            if [ -z "$CHIP_LINE" ]; then
              echo "ERROR: chip80 VHT condition not found"
              exit 1
            fi

            START_LINE="$((CHIP_LINE - 1))"

            echo
            echo "================================================"
            echo "ORIGINAL VHT CONDITION"
            echo "================================================"

            sed -n \
              "$((START_LINE - 2)),$((CHIP_LINE + 8))p" \
              "$FILE"

            awk -v start="$START_LINE" '
            BEGIN {
                replacing = 0
                replaced = 0
            }

            {
                if (NR == start) {
                    print "    if ("
                    print "        !_force40MHz &&"
                    print "        chip80 &&"
                    print "        vhtWidth == 1 &&"
                    print "        vhtSeg0 != 0"
                    print "    ) {"

                    replacing = 1
                    replaced = 1
                    next
                }

                if (replacing == 1) {

                    if ($0 ~ /^[[:space:]]*\)[[:space:]]*\{[[:space:]]*$/) {
                        replacing = 0
                    }

                    next
                }

                print
            }

            END {
                if (replaced != 1) {
                    exit 42
                }
            }
            ' "$FILE" > /tmp/RTW88IEEE80211.vht80.cpp || {
                STATUS=$?

                echo "ERROR: adaptive VHT patch failed with status $STATUS"

                cp \
                  /tmp/RTW88IEEE80211.before-vht80.cpp \
                  "$FILE"

                exit 1
            }

          fi

          mv \
            /tmp/RTW88IEEE80211.vht80.cpp \
            "$FILE"

          COUNT="$(
            grep -c \
              "!_force40MHz &&" \
              "$FILE"
          )"

          if [ "$COUNT" -lt 1 ]; then
            echo "ERROR: Adaptive VHT 80 MHz patch was not applied"

            cp \
              /tmp/RTW88IEEE80211.before-vht80.cpp \
              "$FILE"

            exit 1
          fi

          echo
          echo "================================================"
          echo "ADAPTIVE VHT 80 MHZ"
          echo "================================================"

          grep -n \
            -A 8 \
            -B 4 \
            "!_force40MHz &&" \
            "$FILE"

          echo
          echo "Adaptive VHT 80 MHz: OK"


      # ================================================================
      # 14. RUNTIME IDENTIFICATION
      # ================================================================

      - name: Add v8.5 runtime identification
        shell: bash
        run: |
          set -euxo pipefail

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          if grep -q \
            "HP256G8 v8.5 Data-Path Recovery active" \
            "$FILE"
          then
            echo "Runtime identification already present."
            exit 0
          fi

          LINE="$(
            grep -n \
              "connected chandef:" \
              "$FILE" \
              | head -1 \
              | cut -d: -f1
          )"

          test -n "$LINE"

          awk -v target="$LINE" '
          NR == target {
              print "    IOLog("
              print "        \"rtw88: HP256G8 v8.5 Data-Path Recovery active \""
              print "        \"safe40=%u usefulRx=%u\\n\","
              print "        _force40MHz ? 1 : 0,"
              print "        _usefulRxCount"
              print "    );"
              print ""
          }

          {
              print
          }
          ' "$FILE" > /tmp/RTW88IEEE80211.identity.cpp

          mv \
            /tmp/RTW88IEEE80211.identity.cpp \
            "$FILE"

          grep -n \
            "HP256G8 v8.5 Data-Path Recovery active" \
            "$FILE"


      # ================================================================
      # 15. USEFUL ETHERNET RX COUNTER
      # ================================================================

      - name: Count useful Ethernet RX
        shell: bash
        run: |
          set -euxo pipefail

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          if grep -q \
            "HP256G8 v8.5 useful Ethernet RX" \
            "$FILE"
          then
            echo "Useful RX counter already present."
            exit 0
          fi

          LINE="$(
            grep -n \
              "RTW88IEEE80211::deliverEthernet" \
              "$FILE" \
              | head -1 \
              | cut -d: -f1
          )"

          test -n "$LINE"

          BRACE="$(
            tail -n +"$LINE" "$FILE" \
              | grep -n "^{" \
              | head -1 \
              | cut -d: -f1
          )"

          test -n "$BRACE"

          INSERT="$((LINE + BRACE - 1))"

          awk -v target="$INSERT" '
          {
              print

              if (NR == target) {
                  print ""
                  print "    /*"
                  print "     * HP256G8 v8.5 useful Ethernet RX"
                  print "     *"
                  print "     * Count actual IPv4 / ARP / IPv6 data only."
                  print "     */"
                  print ""
                  print "    if ("
                  print "        ethertype == 0x0800 ||"
                  print "        ethertype == 0x0806 ||"
                  print "        ethertype == 0x86DD"
                  print "    ) {"
                  print "        _usefulRxCount++;"
                  print "    }"
                  print ""
              }
          }
          ' "$FILE" > /tmp/RTW88IEEE80211.usefulrx.cpp

          mv \
            /tmp/RTW88IEEE80211.usefulrx.cpp \
            "$FILE"

          grep -n \
            -A 25 \
            -B 5 \
            "HP256G8 v8.5 useful Ethernet RX" \
            "$FILE"


      # ================================================================
      # 16. DATA PATH RECOVERY FUNCTIONS
      # ================================================================

      - name: Add Data Path Recovery worker
        shell: bash
        run: |
          set -euxo pipefail

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          if grep -q \
            "void RTW88IEEE80211::runDataPathRecovery()" \
            "$FILE"
          then
            echo "Data Path Recovery already present."
            exit 0
          fi

          cat > /tmp/v85_recovery.cpp <<'CPP'

          /* ================================================================== */
          /* HP256G8 v8.5 Data-Path Recovery                                    */
          /* ================================================================== */

          void RTW88IEEE80211::dataPathRecoveryTCFn(
              thread_call_param_t self,
              thread_call_param_t)
          {
              RTW88IEEE80211 *obj =
                  (RTW88IEEE80211 *)self;

              if (!obj)
                  return;

              obj->runDataPathRecovery();
          }


          void RTW88IEEE80211::scheduleDataPathRecovery()
          {
              if (_fallbackPending)
                  return;

              if (_state != RTW88_STATE_CONNECTED)
                  return;

              _fallbackPending =
                  true;

              IOLog(
                  "rtw88: HP256G8 v8.5 scheduling DATA PATH recovery "
                  "width=%u rssi=%d txNoUsefulRx=%u usefulRx=%u rawRx=%u\n",
                  _connChanWidth,
                  _rssi,
                  _perfTxWithoutRx,
                  _usefulRxCount,
                  _rxFrameCount
              );

              if (_dataPathRecoveryTC) {

                  thread_call_enter(
                      _dataPathRecoveryTC
                  );

              } else {

                  _fallbackPending =
                      false;
              }
          }


          void RTW88IEEE80211::runDataPathRecovery()
          {
              if (
                  _state != RTW88_STATE_CONNECTED ||
                  !_powered ||
                  !_hw ||
                  !_vif
              ) {

                  _fallbackPending =
                      false;

                  return;
              }


              uint8_t failedWidth =
                  _connChanWidth;


              _dataPathRecoveryCount++;


              IOLog(
                  "rtw88: HP256G8 v8.5 DATA PATH RECOVERY BEGIN "
                  "attempt=%u width=%u rssi=%d usefulRx=%u rawRx=%u\n",
                  _dataPathRecoveryCount,
                  failedWidth,
                  _rssi,
                  _usefulRxCount,
                  _rxFrameCount
              );


              if (
                  failedWidth ==
                  80
              ) {

                  _force40MHz =
                      true;

                  IOLog(
                      "rtw88: HP256G8 v8.5 80 MHz marked unstable; "
                      "Safe 40 MHz armed\n"
                  );
              }


              doDisconnect();


              IOSleep(
                  250
              );


              if (
                  !_powered ||
                  !_hw ||
                  !_vif
              ) {

                  _fallbackPending =
                      false;

                  return;
              }


              _perfTxWithoutRx =
                  0;


              _perfLastRxFrameCount =
                  _usefulRxCount;


              _fallbackPending =
                  false;


              _state =
                  RTW88_STATE_AUTHENTICATING;


              IOLog(
                  "rtw88: HP256G8 v8.5 reconnecting after DATA PATH "
                  "recovery safe40=%u\n",
                  _force40MHz ? 1 : 0
              );


              if (_connectTC) {

                  thread_call_enter(
                      _connectTC
                  );

              } else {

                  doAuthenticate();
              }
          }


          CPP

          LINE="$(
            grep -n \
              "TX path: Ethernet" \
              "$FILE" \
              | head -1 \
              | cut -d: -f1
          )"

          test -n "$LINE"

          INSERT="$((LINE - 1))"

          head -n "$INSERT" \
            "$FILE" \
            > /tmp/RTW88IEEE80211.recovery.cpp

          cat \
            /tmp/v85_recovery.cpp \
            >> /tmp/RTW88IEEE80211.recovery.cpp

          tail -n +"$LINE" \
            "$FILE" \
            >> /tmp/RTW88IEEE80211.recovery.cpp

          mv \
            /tmp/RTW88IEEE80211.recovery.cpp \
            "$FILE"

          grep -n \
            -A 100 \
            -B 5 \
            "DATA PATH RECOVERY BEGIN" \
            "$FILE"


      # ================================================================
      # 17. ALLOCATE RECOVERY THREAD
      # ================================================================

      - name: Allocate Data Path Recovery worker
        shell: bash
        run: |
          set -euxo pipefail

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          ALLOC_COUNT="$(
            grep -c \
              "_dataPathRecoveryTC =" \
              "$FILE" \
              || true
          )"

          if [ "$ALLOC_COUNT" -ge 1 ]; then
            echo "Recovery worker allocation already present."
            exit 0
          fi

          LINE="$(
            grep -n \
              "_connectTC = thread_call_allocate" \
