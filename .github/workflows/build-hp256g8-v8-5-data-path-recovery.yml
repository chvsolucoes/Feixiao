                  print "    /*"
                  print "     * ================================================================"
                  print "     * HP256G8 v8.5 DATA PATH WATCHDOG"
                  print "     * ================================================================"
                  print "     *"
                  print "     * Raw 802.11 RX does not prove IPv4/ARP is alive."
                  print "     * Monitor useful Ethernet RX instead."
                  print "     */"
                  print ""
                  print "    if ("
                  print "        _state == RTW88_STATE_CONNECTED &&"
                  print "        !_fallbackPending"
                  print "    ) {"
                  print ""
                  print "        uint32_t currentUsefulRx ="
                  print "            _usefulRxCount;"
                  print ""
                  print "        if ("
                  print "            currentUsefulRx !="
                  print "            _perfLastRxFrameCount"
                  print "        ) {"
                  print ""
                  print "            _perfLastRxFrameCount ="
                  print "                currentUsefulRx;"
                  print ""
                  print "            _perfTxWithoutRx ="
                  print "                0;"
                  print ""
                  print "        } else {"
                  print ""
                  print "            if ("
                  print "                _perfTxWithoutRx <"
                  print "                0xfffffff0U"
                  print "            ) {"
                  print ""
                  print "                _perfTxWithoutRx++;"
                  print "            }"
                  print "        }"
                  print ""
                  print "        bool invalidRssi ="
                  print "            (_rssi >= 0);"
                  print ""
                  print "        bool usefulRxStalled ="
                  print "            (_perfTxWithoutRx >= 128);"
                  print ""
                  print "        if ("
                  print "            invalidRssi ||"
                  print "            usefulRxStalled"
                  print "        ) {"
                  print ""
                  print "            IOLog("
                  print "                \"rtw88: HP256G8 v8.5 DATA PATH STALL \""
                  print "                \"width=%u rssi=%d \""
                  print "                \"txNoUsefulRx=%u usefulRx=%u rawRx=%u\\n\","
