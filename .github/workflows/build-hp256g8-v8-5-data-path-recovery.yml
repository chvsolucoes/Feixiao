name: Build HP256G8 RTL8821CE v8.5 Data Path Recovery

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build HP256G8 v8.5
    runs-on: macos-latest

    steps:

      # ================================================================
      # 01 - CHECKOUT FEIXIAO
      # ================================================================

      - name: Checkout Feixiao
        uses: actions/checkout@v4
        with:
          repository: thegwchr/Feixiao
          ref: e963f43188382eced4ef2fa75d19ce4db2315c68
          submodules: recursive
          path: Feixiao
          fetch-depth: 0


      # ================================================================
      # 02 - CLONE RTW88-STABLE
      # ================================================================

      - name: Clone matching rtw88-stable
        shell: bash
        run: |
          set -eux

          git clone \
            https://github.com/thegwchr/rtw88-stable.git \
            rtw88-stable

          git -C rtw88-stable checkout \
            d029a677c49266fad86750714eb5612becd134d3

          echo
          echo "================================================"
          echo "FEIXIAO COMMIT"
          echo "================================================"
          git -C Feixiao rev-parse HEAD

          echo
          echo "================================================"
          echo "RTW88-STABLE COMMIT"
          echo "================================================"
          git -C rtw88-stable rev-parse HEAD


      # ================================================================
      # 03 - VALIDATE SOURCES
      # ================================================================

      - name: Validate source tree
        shell: bash
        run: |
          set -eux

          test -f Feixiao/src/kext/RTW88IEEE80211.cpp
          test -f Feixiao/src/kext/RTW88IEEE80211.hpp
          test -f Feixiao/src/kext/RTW88PCIDevice.cpp
          test -f Feixiao/src/compat/rtw88_compat.c

          test -f \
            rtw88-stable/drivers/net/wireless/realtek/rtw88/pci.c

          echo "Source tree OK"


      # ================================================================
      # 04 - AUTOMATIC RATE CONTROL
      # ================================================================

      - name: Enable automatic firmware rate control
        shell: bash
        run: |
          set -eux

          FILE="Feixiao/src/compat/rtw88_compat.c"

          sed -i '' \
            's/rtwdev->dm_info.fix_rate = DESC_RATE6M;/rtwdev->dm_info.fix_rate = 0xFF;/' \
            "$FILE"

          grep -n \
            "fix_rate = 0xFF" \
            "$FILE"

          echo "Automatic rate control OK"


      # ================================================================
      # 05 - WPA2 FIXES
      # ================================================================

      - name: Apply WPA2 M3 M4 fixes
        shell: bash
        run: |
          set -eux

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          cp "$FILE" /tmp/ieee-wpa2-before.cpp

          awk '
          BEGIN {
              m4len = 0
              m4nonce = 0
              m3diag = 0
              settle = 0
          }

          {
              # --------------------------------------------------------
              # M4 Key Length
              # --------------------------------------------------------

              if ($0 ~ /key\[3\] = 0; key\[4\] = 16;/ && m4len == 0) {

                  print "    if (step == 4) {"
                  print "        key[3] = 0;"
                  print "        key[4] = 0;"
                  print ""
                  print "        IOLog("
                  print "            \"rtw88: HP256G8 v8.5 M4 key_length=0\\n\""
                  print "        );"
                  print "    } else {"
                  print "        key[3] = 0;"
                  print "        key[4] = 16;"
                  print "    }"

                  m4len = 1
                  next
              }


              # --------------------------------------------------------
              # M4 Nonce
              # --------------------------------------------------------

              if ($0 ~ /memcpy\(key \+ 13, _snonce, 32\);/ && m4nonce == 0) {

                  print "    if (step == 4) {"
                  print "        memset(key + 13, 0, 32);"
                  print ""
                  print "        IOLog("
                  print "            \"rtw88: HP256G8 v8.5 M4 nonce zeroed\\n\""
                  print "        );"
                  print "    } else {"
                  print "        memcpy(key + 13, _snonce, 32);"
                  print "    }"

                  m4nonce = 1
                  next
              }


              print $0


              # --------------------------------------------------------
              # M3 Diagnostic
              # --------------------------------------------------------

              if ($0 ~ /else if \(is_m3\) \{/ && m3diag == 0) {

                  print ""
                  print "        IOLog("
                  print "            \"rtw88: HP256G8 v8.5 received M3\\n\""
                  print "        );"
                  print ""

                  m3diag = 1
              }


              # --------------------------------------------------------
              # Delay before A-MPDU
              # --------------------------------------------------------

              if ($0 ~ /startTxAggregation\(\);.*keys are installed/ && settle == 0) {

                  # The original call was already printed.
                  # We replace it in a second pass below.

                  settle = 1
              }
          }

          END {
              if (m4len != 1)
                  exit 41

              if (m4nonce != 1)
                  exit 42

              if (m3diag != 1)
                  exit 43
          }
          ' "$FILE" > /tmp/ieee-wpa2-pass1.cpp

          STATUS=$?

          if [ "$STATUS" -ne 0 ]; then
            echo "ERROR: WPA2 structural patch failed status=$STATUS"
            exit 1
          fi

          mv /tmp/ieee-wpa2-pass1.cpp "$FILE"


          # ------------------------------------------------------------
          # Replace A-MPDU start call with settle delay + call.
          # Exact original line from pinned Feixiao source.
          # ------------------------------------------------------------

          awk '
          BEGIN {
              done = 0
          }

          {
              if ($0 ~ /startTxAggregation\(\);.*keys are installed/ && done == 0) {

                  print "        IOSleep(100);"
                  print ""
                  print "        IOLog("
                  print "            \"rtw88: HP256G8 v8.5 WPA2 settle complete, starting A-MPDU\\n\""
                  print "        );"
                  print ""
                  print "        startTxAggregation();"

                  done = 1
                  next
              }

              print
          }

          END {
              if (done != 1)
                  exit 44
          }
          ' "$FILE" > /tmp/ieee-wpa2-final.cpp

          STATUS=$?

          if [ "$STATUS" -ne 0 ]; then
            echo "ERROR: WPA2 A-MPDU settle patch failed"
            exit 1
          fi

          mv /tmp/ieee-wpa2-final.cpp "$FILE"


          # ------------------------------------------------------------
          # Validation
          # ------------------------------------------------------------

          grep -q \
            "HP256G8 v8.5 M4 key_length=0" \
            "$FILE"

          grep -q \
            "HP256G8 v8.5 M4 nonce zeroed" \
            "$FILE"

          grep -q \
            "HP256G8 v8.5 received M3" \
            "$FILE"

          grep -q \
            "HP256G8 v8.5 WPA2 settle complete" \
            "$FILE"

          grep -q "sendEAPOLKey" "$FILE"
          grep -q "_ptkConf" "$FILE"
          grep -q "_gtkConf" "$FILE"
          grep -q "installKey" "$FILE"

          echo
          echo "================================================"
          echo "WPA2 PATCH OK"
          echo "================================================"


      # ================================================================
      # 06 - ADD V8.5 HEADER STATE
      # ================================================================

      - name: Add v8.5 header declarations
        shell: bash
        run: |
          set -eux

          FILE="Feixiao/src/kext/RTW88IEEE80211.hpp"

          cp "$FILE" /tmp/ieee-hpp-before.hpp

          awk '
          BEGIN {
              methods = 0
              threadmember = 0
              state = 0
          }

          {
              print $0


              # --------------------------------------------------------
              # Recovery method declarations
              # --------------------------------------------------------

              if ($0 ~ /void      setConnectedChandef\(struct ieee80211_channel \*chan\);/ && methods == 0) {

                  print "    void      scheduleDataPathRecovery();"
                  print "    void      runDataPathRecovery();"
                  print "    static void dataPathRecoveryTCFn("
                  print "        thread_call_param_t self,"
                  print "        thread_call_param_t"
                  print "    );"

                  methods = 1
              }


              # --------------------------------------------------------
              # Recovery thread call member
              # --------------------------------------------------------

              if ($0 ~ /thread_call_t _connectTC = nullptr;/ && threadmember == 0) {

                  print "    thread_call_t _dataPathRecoveryTC = nullptr;"

                  threadmember = 1
              }


              # --------------------------------------------------------
              # Performance / recovery state
              # --------------------------------------------------------

              if ($0 ~ /uint8_t  _connChanWidth = 20;/ && state == 0) {

                  print ""
                  print "    /* HP256G8 v8.5 Data-Path Recovery state */"
                  print "    bool              _force40MHz = false;"
                  print "    volatile bool     _fallbackPending = false;"
                  print "    uint32_t          _perfLastRxFrameCount = 0;"
                  print "    uint32_t          _perfTxWithoutRx = 0;"
                  print "    volatile uint32_t _usefulRxCount = 0;"
                  print "    uint32_t          _dataPathRecoveryCount = 0;"

                  state = 1
              }
          }

          END {
              if (methods != 1)
                  exit 51

              if (threadmember != 1)
                  exit 52

              if (state != 1)
                  exit 53
          }
          ' "$FILE" > /tmp/ieee-hpp-v85.hpp

          STATUS=$?

          if [ "$STATUS" -ne 0 ]; then
            echo "ERROR: header patch failed status=$STATUS"
            exit 1
          fi

          mv /tmp/ieee-hpp-v85.hpp "$FILE"


          grep -q \
            "scheduleDataPathRecovery" \
            "$FILE"

          grep -q \
            "runDataPathRecovery" \
            "$FILE"

          grep -q \
            "_dataPathRecoveryTC" \
            "$FILE"

          grep -q \
            "_force40MHz" \
            "$FILE"

          grep -q \
            "_usefulRxCount" \
            "$FILE"

          grep -q \
            "_dataPathRecoveryCount" \
            "$FILE"

          echo "Header v8.5 OK"


      # ================================================================
      # 07 - ADAPTIVE VHT 80 MHZ
      # ================================================================

      - name: Enable adaptive VHT 80 MHz
        shell: bash
        run: |
          set -eux

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          cp "$FILE" /tmp/ieee-vht-before.cpp

          awk '
          BEGIN {
              condition = 0
              logmarker = 0
          }

          {
              # Exact VHT 80 MHz condition from pinned Feixiao source.

              if ($0 ~ /if \(chip80 && vhtWidth == 1 && vhtSeg0 != 0\) \{/ && condition == 0) {

                  print "    if (!_force40MHz && chip80 && vhtWidth == 1 && vhtSeg0 != 0) {"

                  condition = 1
                  next
              }


              # Insert runtime identity immediately before connected chandef log.

              if ($0 ~ /IOLog\("rtw88: connected chandef:/ && logmarker == 0) {

                  print "    IOLog("
                  print "        \"rtw88: HP256G8 v8.5 Data-Path Recovery active \""
                  print "        \"safe40=%u usefulRx=%u\\n\","
                  print "        _force40MHz ? 1 : 0,"
                  print "        _usefulRxCount"
                  print "    );"
                  print ""

                  logmarker = 1
              }


              print
          }

          END {
              if (condition != 1)
                  exit 61

              if (logmarker != 1)
                  exit 62
          }
          ' "$FILE" > /tmp/ieee-vht-v85.cpp

          STATUS=$?

          if [ "$STATUS" -ne 0 ]; then
            echo "ERROR: VHT 80 MHz patch failed status=$STATUS"
            exit 1
          fi

          mv /tmp/ieee-vht-v85.cpp "$FILE"


          grep -q \
            "if (!_force40MHz && chip80 && vhtWidth == 1 && vhtSeg0 != 0)" \
            "$FILE"

          grep -q \
            "HP256G8 v8.5 Data-Path Recovery active" \
            "$FILE"

          echo
          echo "================================================"
          echo "ADAPTIVE VHT 80 MHZ OK"
          echo "================================================"


      # ================================================================
      # 08 - USEFUL ETHERNET RX COUNTER
      # ================================================================

      - name: Add useful Ethernet RX counter
        shell: bash
        run: |
          set -eux

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          cp "$FILE" /tmp/ieee-usefulrx-before.cpp

          awk '
          BEGIN {
              done = 0
          }

          {
              print $0

              if ($0 ~ /_parent->injectRxFrame\(m\);/ && done == 0) {

                  print ""
                  print "    /* HP256G8 v8.5 useful Ethernet RX */"
                  print "    if ("
                  print "        ethertype == 0x0800 ||"
                  print "        ethertype == 0x0806 ||"
                  print "        ethertype == 0x86DD"
                  print "    ) {"
                  print "        _usefulRxCount++;"
                  print "    }"

                  done = 1
              }
          }

          END {
              if (done != 1)
                  exit 71
          }
          ' "$FILE" > /tmp/ieee-usefulrx-v85.cpp

          STATUS=$?

          if [ "$STATUS" -ne 0 ]; then
            echo "ERROR: useful RX patch failed"
            exit 1
          fi

          mv /tmp/ieee-usefulrx-v85.cpp "$FILE"

          grep -q \
            "HP256G8 v8.5 useful Ethernet RX" \
            "$FILE"

          echo "Useful Ethernet RX counter OK"


      # ================================================================
      # 09 - DATA PATH RECOVERY FUNCTIONS
      # ================================================================

      - name: Add Data Path Recovery functions
        shell: bash
        run: |
          set -eux

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          cat > /tmp/v85_recovery.cpp <<'CPP'

          /* ================================================================== */
          /* HP256G8 v8.5 Data-Path Recovery                                    */
          /* ================================================================== */

          void RTW88IEEE80211::dataPathRecoveryTCFn(
              thread_call_param_t self,
              thread_call_param_t)
          {
              RTW88IEEE80211 *obj =
                  (RTW88IEEE80211 *)self;

              if (!obj)
                  return;

              obj->runDataPathRecovery();
          }


          void RTW88IEEE80211::scheduleDataPathRecovery()
          {
              if (_fallbackPending)
                  return;

              if (_state != RTW88_STATE_CONNECTED)
                  return;

              _fallbackPending =
                  true;

              IOLog(
                  "rtw88: HP256G8 v8.5 scheduling DATA PATH recovery "
                  "width=%u rssi=%d txNoUsefulRx=%u usefulRx=%u rawRx=%u\n",
                  _connChanWidth,
                  _rssi,
                  _perfTxWithoutRx,
                  _usefulRxCount,
                  _rxFrameCount
              );


              if (_dataPathRecoveryTC) {

                  thread_call_enter(
                      _dataPathRecoveryTC
                  );

              } else {

                  _fallbackPending =
                      false;
              }
          }


          void RTW88IEEE80211::runDataPathRecovery()
          {
              if (
                  _state != RTW88_STATE_CONNECTED ||
                  !_powered ||
                  !_hw ||
                  !_vif
              ) {

                  _fallbackPending =
                      false;

                  return;
              }


              uint8_t failedWidth =
                  _connChanWidth;


              _dataPathRecoveryCount++;


              IOLog(
                  "rtw88: HP256G8 v8.5 DATA PATH RECOVERY BEGIN "
                  "attempt=%u width=%u rssi=%d usefulRx=%u rawRx=%u\n",
                  _dataPathRecoveryCount,
                  failedWidth,
                  _rssi,
                  _usefulRxCount,
                  _rxFrameCount
              );


              /*
               * If 80 MHz was active when the data path died,
               * keep subsequent reconnect attempts at <=40 MHz.
               */

              if (
                  failedWidth ==
                  80
              ) {

                  _force40MHz =
                      true;

                  IOLog(
                      "rtw88: HP256G8 v8.5 80 MHz marked unstable; "
                      "Safe 40 MHz armed\n"
                  );
              }


              /*
               * Normal Feixiao disconnect path clears:
               *
               * PTK / GTK
               * STA
               * TX BA
               * RX BA / reorder
               */

              doDisconnect();


              /*
               * Allow PCI/DMA/firmware state to settle.
               */

              IOSleep(
                  250
              );


              if (
                  !_powered ||
                  !_hw ||
                  !_vif
              ) {

                  _fallbackPending =
                      false;

                  return;
              }


              _perfTxWithoutRx =
                  0;


              _perfLastRxFrameCount =
                  _usefulRxCount;


              _fallbackPending =
                  false;


              _state =
                  RTW88_STATE_AUTHENTICATING;


              IOLog(
                  "rtw88: HP256G8 v8.5 reconnecting after DATA PATH "
                  "recovery safe40=%u\n",
                  _force40MHz ? 1 : 0
              );


              if (_connectTC) {

                  thread_call_enter(
                      _connectTC
                  );

              } else {

                  doAuthenticate();
              }
          }


          CPP


          # Insert immediately before TX path section.
          awk '
          BEGIN {
              inserted = 0
          }

          /TX path: Ethernet/ && inserted == 0 {

              while ((getline line < "/tmp/v85_recovery.cpp") > 0)
                  print line

              close("/tmp/v85_recovery.cpp")

              inserted = 1
          }

          {
              print
          }

          END {
              if (inserted != 1)
                  exit 81
          }
          ' "$FILE" > /tmp/ieee-recovery-v85.cpp

          STATUS=$?

          if [ "$STATUS" -ne 0 ]; then
            echo "ERROR: recovery function insertion failed"
            exit 1
          fi

          mv /tmp/ieee-recovery-v85.cpp "$FILE"


          grep -q \
            "HP256G8 v8.5 DATA PATH RECOVERY BEGIN" \
            "$FILE"

          grep -q \
            "HP256G8 v8.5 scheduling DATA PATH recovery" \
            "$FILE"

          grep -q \
            "HP256G8 v8.5 reconnecting after DATA PATH" \
            "$FILE"

          echo "Data Path Recovery functions OK"


      # ================================================================
      # 10 - ALLOCATE / FREE RECOVERY WORKER
      #
      # IMPORTANT:
      # Exact init/free locations. No tail|grep|head.
      # ================================================================

      - name: Add Data Path Recovery worker lifecycle
        shell: bash
        run: |
          set -eux

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          cp "$FILE" /tmp/ieee-worker-before.cpp


          # ------------------------------------------------------------
          # Allocation
          # ------------------------------------------------------------

          awk '
          BEGIN {
              waiting_connect_end = 0
              allocated = 0
          }

          {
              print $0

              if ($0 ~ /_connectTC = thread_call_allocate/ && allocated == 0) {
                  waiting_connect_end = 1
                  next
              }

              if (
                  waiting_connect_end == 1 &&
                  $0 ~ /\(thread_call_param_t\)this\);/
              ) {

                  print ""
                  print "    _dataPathRecoveryTC ="
                  print "        thread_call_allocate("
                  print "            (thread_call_func_t)"
                  print "            RTW88IEEE80211::dataPathRecoveryTCFn,"
                  print "            (thread_call_param_t)this"
                  print "        );"
                  print ""
                  print "    if (!_dataPathRecoveryTC)"
                  print "        return false;"

                  waiting_connect_end = 0
                  allocated = 1
              }
          }

          END {
              if (allocated != 1)
                  exit 91
          }
          ' "$FILE" > /tmp/ieee-worker-alloc.cpp

          STATUS=$?

          if [ "$STATUS" -ne 0 ]; then
            echo "ERROR: recovery worker allocation insertion failed"
            exit 1
          fi

          mv /tmp/ieee-worker-alloc.cpp "$FILE"


          # ------------------------------------------------------------
          # Cleanup
          #
          # Exact one-line _connectTC cleanup inside free().
          # ------------------------------------------------------------

          awk '
          BEGIN {
              freed = 0
          }

          {
              if (
                  $0 ~ /if \(_connectTC\) \{ thread_call_cancel\(_connectTC\); thread_call_free\(_connectTC\); _connectTC = nullptr; \}/ &&
                  freed == 0
              ) {

                  print "    if (_dataPathRecoveryTC) {"
                  print "        thread_call_cancel(_dataPathRecoveryTC);"
                  print "        thread_call_free(_dataPathRecoveryTC);"
                  print "        _dataPathRecoveryTC = nullptr;"
                  print "    }"
                  print $0

                  freed = 1
                  next
              }

              print
          }

          END {
              if (freed != 1)
                  exit 92
          }
          ' "$FILE" > /tmp/ieee-worker-final.cpp

          STATUS=$?

          if [ "$STATUS" -ne 0 ]; then
            echo "ERROR: recovery worker cleanup insertion failed"
            exit 1
          fi

          mv /tmp/ieee-worker-final.cpp "$FILE"


          grep -q \
            "_dataPathRecoveryTC =" \
            "$FILE"

          grep -q \
            "thread_call_free(_dataPathRecoveryTC)" \
            "$FILE"

          echo
          echo "================================================"
          echo "RECOVERY WORKER LIFECYCLE OK"
          echo "================================================"


      # ================================================================
      # 11 - DATA PATH WATCHDOG
      # ================================================================

      - name: Install useful RX Data Path watchdog
        shell: bash
        run: |
          set -eux

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          cat > /tmp/v85_watchdog.cpp <<'CPP'

              /*
               * ==============================================================
               * HP256G8 v8.5 DATA PATH WATCHDOG
               * ==============================================================
               *
               * _rxFrameCount includes management traffic.
               *
               * _usefulRxCount counts actual IPv4 / ARP / IPv6
               * Ethernet traffic delivered to macOS.
               */

              if (
                  _state == RTW88_STATE_CONNECTED &&
                  !_fallbackPending
              ) {

                  uint32_t currentUsefulRx =
                      _usefulRxCount;


                  if (
                      currentUsefulRx !=
                      _perfLastRxFrameCount
                  ) {

                      _perfLastRxFrameCount =
                          currentUsefulRx;

                      _perfTxWithoutRx =
                          0;

                  } else {

                      if (
                          _perfTxWithoutRx <
                          0xfffffff0U
                      ) {

                          _perfTxWithoutRx++;
                      }
                  }


                  bool invalidRssi =
                      (
                          _rssi >=
                          0
                      );


                  bool usefulRxStalled =
                      (
                          _perfTxWithoutRx >=
                          128
                      );


                  if (
                      invalidRssi ||
                      usefulRxStalled
                  ) {

                      IOLog(
                          "rtw88: HP256G8 v8.5 DATA PATH STALL "
                          "width=%u rssi=%d "
                          "txNoUsefulRx=%u usefulRx=%u rawRx=%u\n",
                          _connChanWidth,
                          _rssi,
                          _perfTxWithoutRx,
                          _usefulRxCount,
                          _rxFrameCount
                      );


                      scheduleDataPathRecovery();
                  }
              }


          CPP


          awk '
          BEGIN {
              waiting = 0
              inserted = 0
          }

          {
              print $0

              if ($0 ~ /^UInt32 RTW88IEEE80211::outputPacket\(mbuf_t m\)$/) {
                  waiting = 1
                  next
              }

              if (waiting == 1 && $0 ~ /^\{$/ && inserted == 0) {

                  while ((getline line < "/tmp/v85_watchdog.cpp") > 0)
                      print line

                  close("/tmp/v85_watchdog.cpp")

                  waiting = 0
                  inserted = 1
              }
          }

          END {
              if (inserted != 1)
                  exit 101
          }
          ' "$FILE" > /tmp/ieee-watchdog-v85.cpp

          STATUS=$?

          if [ "$STATUS" -ne 0 ]; then
            echo "ERROR: watchdog insertion failed"
            exit 1
          fi

          mv /tmp/ieee-watchdog-v85.cpp "$FILE"


          grep -q \
            "HP256G8 v8.5 DATA PATH WATCHDOG" \
            "$FILE"

          grep -q \
            "HP256G8 v8.5 DATA PATH STALL" \
            "$FILE"

          echo "Data Path watchdog OK"


      # ================================================================
      # 12 - TX FLOW CONTROL
      # ================================================================

      - name: Set HP256G8 TX thresholds
        shell: bash
        run: |
          set -eux

          FILE="Feixiao/src/kext/RTW88PCIDevice.cpp"

          sed -i '' \
            's/kRTW88TxStallAvail = 128/kRTW88TxStallAvail = 96/g' \
            "$FILE"

          sed -i '' \
            's/kRTW88TxResumeAvail = 192/kRTW88TxResumeAvail = 160/g' \
            "$FILE"

          grep -nE \
            "kRTW88TxStallAvail|kRTW88TxResumeAvail" \
            "$FILE"


      # ================================================================
      # 13 - SAFE MACOS MBUF
      # ================================================================

      - name: Apply Safe macOS mbuf validation
        shell: bash
        run: |
          set -eux

          FILE="Feixiao/src/kext/RTW88PCIDevice.cpp"

          START="$(
            awk '
              /^void RTW88PCIDevice::injectRxFrame\(mbuf_t m\)$/ {
                  print NR
                  exit
              }
            ' "$FILE"
          )"

          END="$(
            awk '
              /DMA coherent allocation/ {
                  print NR
                  exit
              }
            ' "$FILE"
          )"

          test -n "$START"
          test -n "$END"

          if [ "$END" -le "$START" ]; then
            echo "ERROR: invalid injectRxFrame boundaries"
            exit 1
          fi


          cat > /tmp/v85_safe_mbuf.cpp <<'CPP'
          void RTW88PCIDevice::injectRxFrame(mbuf_t m)
          {
              drainPendingFree();


              if (
                  !_iface ||
                  !_enabled
              ) {

                  freePacket(m);
                  return;
              }


              const size_t kMinFrame =
                  14;

              const size_t kMaxFrame =
                  4096;

              const unsigned int kMaxSegments =
                  32;


              size_t packetLength =
                  mbuf_pkthdr_len(m);

              size_t firstLength =
                  mbuf_len(m);

              size_t chainLength =
                  0;

              unsigned int segments =
                  0;

              bool malformed =
                  false;


              for (
                  mbuf_t segment = m;
                  segment != nullptr;
                  segment = mbuf_next(segment)
              ) {

                  size_t length =
                      mbuf_len(segment);


                  segments++;


                  if (
                      segments > kMaxSegments ||
                      length > kMaxFrame ||
                      chainLength > kMaxFrame - length
                  ) {

                      malformed =
                          true;

                      break;
                  }


                  chainLength +=
                      length;
              }


              if (
                  malformed ||
                  packetLength < kMinFrame ||
                  packetLength > kMaxFrame ||
                  firstLength < kMinFrame ||
                  firstLength > kMaxFrame ||
                  chainLength != packetLength
              ) {

                  IOLog(
                      "rtw88: HP256G8 v8.5 SAFE MBUF drop "
                      "pkthdr=%zu first=%zu chain=%zu segs=%u\n",
                      packetLength,
                      firstLength,
                      chainLength,
                      segments
                  );


                  freePacket(m);

                  return;
              }


              _iface->inputPacket(
                  m,
                  0,
                  IONetworkInterface::kInputOptionQueuePacket
              );


              _iface->flushInputQueue();


              IONetworkData *nd =
                  _iface->getNetworkData(
                      kIONetworkStatsKey
                  );


              if (nd) {

                  IONetworkStats *stats =
                      (IONetworkStats *)
                      nd->getBuffer();


                  if (stats)
                      stats->inputPackets++;
              }
          }


          CPP


          BEFORE="$((START - 1))"

          head -n "$BEFORE" \
            "$FILE" \
            > /tmp/pci-device-v85.cpp

          cat \
            /tmp/v85_safe_mbuf.cpp \
            >> /tmp/pci-device-v85.cpp

          tail -n +"$END" \
            "$FILE" \
            >> /tmp/pci-device-v85.cpp

          mv \
            /tmp/pci-device-v85.cpp \
            "$FILE"


          grep -q \
            "HP256G8 v8.5 SAFE MBUF" \
            "$FILE"

          echo "Safe macOS mbuf OK"


      # ================================================================
      # 14 - SAFE DMA CHECK
      # ================================================================

      - name: Apply Safe DMA descriptor recovery
        shell: bash
        run: |
          set -eux

          FILE="rtw88-stable/drivers/net/wireless/realtek/rtw88/pci.c"

          START="$(
            awk '
              /^static (void|bool) rtw_pci_dma_check\(/ {
                  print NR
                  exit
              }
            ' "$FILE"
          )"

          END="$(
            awk '
              /^static u32 __pci_get_hw_tx_ring_rp/ {
                  print NR
                  exit
              }
            ' "$FILE"
          )"

          test -n "$START"
          test -n "$END"

          if [ "$END" -le "$START" ]; then
            echo "ERROR: invalid DMA-check boundaries"
            exit 1
          fi


          cat > /tmp/v85_safe_dma.c <<'C'
          static bool rtw_pci_dma_check(
                  struct rtw_dev *rtwdev,
                  struct rtw_pci_rx_ring *rx_ring,
                  u32 idx)
          {
              struct rtw_pci *rtwpci =
                  (struct rtw_pci *)rtwdev->priv;

              const struct rtw_chip_info *chip =
                  rtwdev->chip;

              struct rtw_pci_rx_buffer_desc *buf_desc;

              u32 desc_sz =
                  chip->rx_buf_desc_sz;

              u16 expected =
                  rtwpci->rx_tag;

              u16 observed =
                  0;

              int i;

              static u32 mismatch_count =
                  0;

              static u32 recovery_count =
                  0;


              buf_desc =
                  (struct rtw_pci_rx_buffer_desc *)
                  (
                      rx_ring->r.head +
                      idx * desc_sz
                  );


              /*
               * HP256G8 v8.5 SAFE RESYNC
               *
               * Maximum wait:
               * 100 * 2us = 200us
               */

              for (
                  i = 0;
                  i < 100;
                  i++
              ) {

                  observed =
                      le16_to_cpu(
                          buf_desc->total_pkt_size
                      );


                  if (
                      observed ==
                      expected
                  ) {

                      rtwpci->rx_tag =
                          (
                              expected +
                              1
                          )
                          %
                          RX_TAG_MAX;


                      return true;
                  }


                  udelay(2);
              }


              mismatch_count++;


              u16 delta =
                  0;


              if (
                  expected >=
                  observed
              ) {

                  delta =
                      expected -
                      observed;

              } else {

                  delta =
                      (
                          expected +
                          RX_TAG_MAX
                      )
                      -
                      observed;
              }


              /*
               * Never parse the current mismatched descriptor.
               *
               * A small coherent delta may only realign the NEXT tag.
               */

              if (
                  delta > 0 &&
                  delta <= 32
              ) {

                  rtwpci->rx_tag =
                      (
                          observed +
                          1
                      )
                      %
                      RX_TAG_MAX;


                  recovery_count++;


                  if (
                      recovery_count == 1 ||
                      (
                          recovery_count &
                          0xff
                      ) == 0
                  ) {

                      rtw_warn(
                          rtwdev,
                          "HP256G8 v8.5 SAFE RESYNC "
                          "drop current descriptor "
                          "expected=%u observed=%u "
                          "delta=%u next=%u count=%u\n",
                          expected,
                          observed,
                          delta,
                          rtwpci->rx_tag,
                          recovery_count
                      );
                  }

              } else {

                  rtwpci->rx_tag =
                      (
                          expected +
                          1
                      )
                      %
                      RX_TAG_MAX;


                  if (
                      mismatch_count == 1 ||
                      (
                          mismatch_count &
                          0xff
                      ) == 0
                  ) {

                      rtw_warn(
                          rtwdev,
                          "HP256G8 v8.5 SAFE RX reject "
                          "expected=%u observed=%u "
                          "delta=%u count=%u\n",
                          expected,
                          observed,
                          delta,
                          mismatch_count
                      );
                  }
              }


              return false;
          }


          C


          BEFORE="$((START - 1))"

          head -n "$BEFORE" \
            "$FILE" \
            > /tmp/linux-pci-v85.c

          cat \
            /tmp/v85_safe_dma.c \
            >> /tmp/linux-pci-v85.c

          tail -n +"$END" \
            "$FILE" \
            >> /tmp/linux-pci-v85.c

          mv \
            /tmp/linux-pci-v85.c \
            "$FILE"


          grep -q \
            "HP256G8 v8.5 SAFE RESYNC" \
            "$FILE"

          grep -q \
            "HP256G8 v8.5 SAFE RX reject" \
            "$FILE"

          echo "Safe DMA function OK"


      # ================================================================
      # 15 - REJECT BAD DESCRIPTOR
      # ================================================================

      - name: Reject bad current RX descriptor
        shell: bash
        run: |
          set -eux

          FILE="rtw88-stable/drivers/net/wireless/realtek/rtw88/pci.c"

          awk '
          BEGIN {
              done = 0
          }

          {
              if (
                  $0 ~ /rtw_pci_dma_check\(rtwdev, ring, cur_rp\);/ &&
                  done == 0
              ) {

                  print "\t\tif (!rtw_pci_dma_check(rtwdev, ring, cur_rp))"
                  print "\t\t\tgoto next_rp;"

                  done = 1
                  next
              }

              print
          }

          END {
              if (done != 1)
                  exit 111
          }
          ' "$FILE" > /tmp/linux-pci-guard.c

          STATUS=$?

          if [ "$STATUS" -ne 0 ]; then
            echo "ERROR: RX descriptor guard insertion failed"
            exit 1
          fi

          mv \
            /tmp/linux-pci-guard.c \
            "$FILE"


          grep -q \
            "if (!rtw_pci_dma_check(rtwdev, ring, cur_rp))" \
            "$FILE"

          echo "Bad descriptor guard OK"


      # ================================================================
      # 16 - RX DMA LENGTH VALIDATION
      # ================================================================

      - name: Validate RX DMA frame length
        shell: bash
        run: |
          set -eux

          FILE="rtw88-stable/drivers/net/wireless/realtek/rtw88/pci.c"

          awk '
          BEGIN {
              waiting = 0
              done = 0
          }

          {
              print $0


              if (
                  $0 ~ /pkt_offset = pkt_desc_sz \+ pkt_stat.drv_info_sz \+/ &&
                  done == 0
              ) {

                  waiting = 1
                  next
              }


              if (
                  waiting == 1
              ) {

                  print ""
                  print "\t\tif ("
                  print "\t\t    !pkt_stat.pkt_len ||"
                  print "\t\t    pkt_offset >= RTK_PCI_RX_BUF_SIZE ||"
                  print "\t\t    pkt_stat.pkt_len >"
                  print "\t\t        RTK_PCI_RX_BUF_SIZE - pkt_offset"
                  print "\t\t) {"
                  print ""
                  print "\t\t\trtw_warn("
                  print "\t\t\t\trtwdev,"
                  print "\t\t\t\t\"HP256G8 v8.5 invalid RX length \""
                  print "\t\t\t\t\"pkt=%u off=%u\\n\","
                  print "\t\t\t\tpkt_stat.pkt_len,"
                  print "\t\t\t\tpkt_offset"
                  print "\t\t\t);"
                  print ""
                  print "\t\t\tgoto next_rp;"
                  print "\t\t}"
                  print ""

                  waiting = 0
                  done = 1
              }
          }

          END {
              if (done != 1)
                  exit 121
          }
          ' "$FILE" > /tmp/linux-pci-length.c

          STATUS=$?

          if [ "$STATUS" -ne 0 ]; then
            echo "ERROR: RX length validation insertion failed"
            exit 1
          fi

          mv \
            /tmp/linux-pci-length.c \
            "$FILE"


          grep -q \
            "HP256G8 v8.5 invalid RX length" \
            "$FILE"

          echo "RX length validation OK"


      # ================================================================
      # 17 - FINAL SOURCE VALIDATION
      # ================================================================

      - name: Validate all v8.5 source changes
        shell: bash
        run: |
          set -eux

          IEEE="Feixiao/src/kext/RTW88IEEE80211.cpp"
          HPP="Feixiao/src/kext/RTW88IEEE80211.hpp"
