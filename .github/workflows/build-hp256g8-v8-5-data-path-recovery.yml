      # ================================================================
      # 22. SAFE MBUF
      # ================================================================

      - name: Apply Safe macOS mbuf validation
        shell: bash
        run: |
          set -euxo pipefail

          FILE="Feixiao/src/kext/RTW88PCIDevice.cpp"

          START="$(
            grep -n \
              "^void RTW88PCIDevice::injectRxFrame(mbuf_t m)" \
              "$FILE" \
              | head -1 \
              | cut -d: -f1
          )"

          END="$(
            grep -n \
              "DMA coherent allocation" \
              "$FILE" \
              | head -1 \
              | cut -d: -f1
          )"

          test -n "$START"
          test -n "$END"

          cat > /tmp/safe_mbuf.cpp <<'CPP'
          void RTW88PCIDevice::injectRxFrame(mbuf_t m)
          {
              drainPendingFree();


              if (
                  !_iface ||
                  !_enabled
              ) {
                  freePacket(
                      m
                  );

                  return;
              }


              const size_t kMinFrame =
                  14;

              const size_t kMaxFrame =
                  4096;

              const unsigned int kMaxSegments =
                  32;


              size_t packetLength =
                  mbuf_pkthdr_len(
                      m
                  );

              size_t firstLength =
                  mbuf_len(
                      m
                  );

              size_t chainLength =
                  0;

              unsigned int segments =
                  0;

              bool malformed =
                  false;


              for (
                  mbuf_t segment = m;
                  segment != nullptr;
                  segment = mbuf_next(segment)
              ) {

                  size_t length =
                      mbuf_len(
                          segment
                      );

                  segments++;


                  if (
                      segments > kMaxSegments ||
                      length > kMaxFrame ||
                      chainLength > kMaxFrame - length
                  ) {

                      malformed =
                          true;

                      break;
                  }


                  chainLength +=
                      length;
              }


              if (
                  malformed ||
                  packetLength < kMinFrame ||
                  packetLength > kMaxFrame ||
                  firstLength < kMinFrame ||
                  firstLength > kMaxFrame ||
                  chainLength != packetLength
              ) {

                  IOLog(
                      "rtw88: HP256G8 v8.5 SAFE MBUF drop "
                      "pkthdr=%zu first=%zu chain=%zu segs=%u\n",
                      packetLength,
                      firstLength,
                      chainLength,
                      segments
                  );


                  freePacket(
                      m
                  );

                  return;
              }


              _iface->inputPacket(
                  m,
                  0,
                  IONetworkInterface::kInputOptionQueuePacket
              );


              _iface->flushInputQueue();


              IONetworkData *nd =
                  _iface->getNetworkData(
                      kIONetworkStatsKey
                  );


              if (nd) {

                  IONetworkStats *stats =
                      (IONetworkStats *)
                      nd->getBuffer();


                  if (stats) {
                      stats->inputPackets++;
                  }
              }
          }


          CPP

          BEFORE="$((START - 1))"

          head -n "$BEFORE" \
            "$FILE" \
            > /tmp/RTW88PCIDevice.safe.cpp

          cat \
            /tmp/safe_mbuf.cpp \
            >> /tmp/RTW88PCIDevice.safe.cpp

          tail -n +"$END" \
            "$FILE" \
            >> /tmp/RTW88PCIDevice.safe.cpp

          mv \
            /tmp/RTW88PCIDevice.safe.cpp \
            "$FILE"

          grep -n \
            "HP256G8 v8.5 SAFE MBUF" \
            "$FILE"


      # ================================================================
      # 23. SAFE DMA
      # ================================================================

      - name: Apply Safe DMA descriptor recovery
        shell: bash
        run: |
          set -euxo pipefail

          FILE="rtw88-stable/drivers/net/wireless/realtek/rtw88/pci.c"

          START="$(
            grep -nE \
              "^static (void|bool) rtw_pci_dma_check\\(" \
              "$FILE" \
              | head -1 \
              | cut -d: -f1
          )"

          END="$(
            grep -n \
              "^static u32 __pci_get_hw_tx_ring_rp" \
              "$FILE" \
              | head -1 \
              | cut -d: -f1
          )"

          test -n "$START"
          test -n "$END"

          cat > /tmp/safe_dma.c <<'C'
          static bool rtw_pci_dma_check(
                  struct rtw_dev *rtwdev,
                  struct rtw_pci_rx_ring *rx_ring,
                  u32 idx)
          {
              struct rtw_pci *rtwpci =
                  (struct rtw_pci *)rtwdev->priv;

              const struct rtw_chip_info *chip =
                  rtwdev->chip;

              struct rtw_pci_rx_buffer_desc *buf_desc;

              u32 desc_sz =
                  chip->rx_buf_desc_sz;

              u16 expected =
                  rtwpci->rx_tag;

              u16 observed =
                  0;

              int i;

              static u32 mismatch_count =
                  0;

              static u32 recovery_count =
                  0;


              buf_desc =
                  (struct rtw_pci_rx_buffer_desc *)
                  (
                      rx_ring->r.head +
                      idx * desc_sz
                  );


              /*
               * HP256G8 v8.5 SAFE RESYNC
               *
               * 100 x 2 us = 200 us maximum.
               */

              for (
                  i = 0;
                  i < 100;
                  i++
              ) {

                  observed =
                      le16_to_cpu(
                          buf_desc->total_pkt_size
                      );


                  if (
                      observed ==
                      expected
                  ) {

                      rtwpci->rx_tag =
                          (
                              expected +
                              1
                          )
                          %
                          RX_TAG_MAX;


                      return true;
                  }


                  udelay(
                      2
                  );
              }


              mismatch_count++;


              u16 delta =
                  0;


              if (
                  expected >=
                  observed
              ) {

                  delta =
                      expected -
                      observed;

              } else {

                  delta =
                      (
                          expected +
                          RX_TAG_MAX
                      )
                      -
                      observed;
              }


              /*
               * Current bad descriptor is always rejected.
               *
               * Small coherent mismatch can realign NEXT tag only.
               */

              if (
                  delta > 0 &&
                  delta <= 32
              ) {

                  rtwpci->rx_tag =
                      (
                          observed +
                          1
                      )
                      %
                      RX_TAG_MAX;


                  recovery_count++;


                  if (
                      recovery_count == 1 ||
                      (
                          recovery_count &
                          0xff
                      ) == 0
                  ) {

                      rtw_warn(
                          rtwdev,
                          "HP256G8 v8.5 SAFE RESYNC "
                          "drop current descriptor "
                          "expected=%u observed=%u "
                          "delta=%u next=%u count=%u\n",
                          expected,
                          observed,
                          delta,
                          rtwpci->rx_tag,
                          recovery_count
                      );
                  }

              } else {

                  rtwpci->rx_tag =
                      (
                          expected +
                          1
                      )
                      %
                      RX_TAG_MAX;


                  if (
                      mismatch_count == 1 ||
                      (
                          mismatch_count &
                          0xff
                      ) == 0
                  ) {

                      rtw_warn(
                          rtwdev,
                          "HP256G8 v8.5 SAFE RX reject "
                          "expected=%u observed=%u "
                          "delta=%u count=%u\n",
                          expected,
                          observed,
                          delta,
                          mismatch_count
                      );
                  }
              }


              return false;
          }


          C

          BEFORE="$((START - 1))"

          head -n "$BEFORE" \
            "$FILE" \
            > /tmp/pci.safe.c

          cat \
            /tmp/safe_dma.c \
            >> /tmp/pci.safe.c

          tail -n +"$END" \
            "$FILE" \
            >> /tmp/pci.safe.c

          mv \
            /tmp/pci.safe.c \
            "$FILE"

          grep -n \
            -A 90 \
            "HP256G8 v8.5 SAFE RESYNC" \
            "$FILE"


      # ================================================================
      # 24. REJECT INVALID CURRENT RX DESCRIPTOR
      # ================================================================

      - name: Reject bad RX descriptor before parsing
        shell: bash
        run: |
          set -euxo pipefail

          FILE="rtw88-stable/drivers/net/wireless/realtek/rtw88/pci.c"

          if grep -q \
            "if (!rtw_pci_dma_check(rtwdev, ring, cur_rp))" \
            "$FILE"
          then
            echo "Descriptor guard already present."
            exit 0
          fi

          LINE="$(
            grep -n \
              "rtw_pci_dma_check(rtwdev, ring, cur_rp);" \
              "$FILE" \
              | head -1 \
              | cut -d: -f1
          )"

          test -n "$LINE"

          awk -v target="$LINE" '
          NR == target {
              print "\t\tif (!rtw_pci_dma_check(rtwdev, ring, cur_rp))"
              print "\t\t\tgoto next_rp;"
              next
          }

          {
              print
          }
          ' "$FILE" > /tmp/pci.guard.c

          mv \
            /tmp/pci.guard.c \
            "$FILE"

          grep -n \
            -A 8 \
            -B 5 \
            "if (!rtw_pci_dma_check" \
            "$FILE"


