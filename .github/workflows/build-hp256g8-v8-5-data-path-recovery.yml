name: Build HP256G8 RTL8821CE v8.5 Data Path Recovery

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build HP256G8 v8.5
    runs-on: macos-latest

    steps:

      # ================================================================
      # 1. CHECKOUT FEIXIAO
      # ================================================================

      - name: Checkout Feixiao
        uses: actions/checkout@v4
        with:
          repository: thegwchr/Feixiao
          ref: e963f43188382eced4ef2fa75d19ce4db2315c68
          submodules: recursive
          path: Feixiao
          fetch-depth: 0


      # ================================================================
      # 2. RTW88-STABLE
      # ================================================================

      - name: Clone matching rtw88-stable
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            https://github.com/thegwchr/rtw88-stable.git \
            rtw88-stable

          git -C rtw88-stable checkout \
            d029a677c49266fad86750714eb5612becd134d3

          echo
          echo "================================================"
          echo "FEIXIAO"
          echo "================================================"

          git -C Feixiao rev-parse HEAD

          echo
          echo "================================================"
          echo "RTW88-STABLE"
          echo "================================================"

          git -C rtw88-stable rev-parse HEAD


      # ================================================================
      # 3. CHECAR ARQUIVOS
      # ================================================================

      - name: Validate source tree
        shell: bash
        run: |
          set -euxo pipefail

          test -f Feixiao/src/kext/RTW88IEEE80211.cpp
          test -f Feixiao/src/kext/RTW88IEEE80211.hpp
          test -f Feixiao/src/kext/RTW88PCIDevice.cpp
          test -f Feixiao/src/compat/rtw88_compat.c

          test -f \
            rtw88-stable/drivers/net/wireless/realtek/rtw88/pci.c

          echo "Source tree: OK"


      # ================================================================
      # 4. RATE CONTROL
      # ================================================================

      - name: Enable automatic firmware rate control
        shell: bash
        run: |
          set -euxo pipefail

          FILE="Feixiao/src/compat/rtw88_compat.c"

          perl -0pi -e '
            s/rtwdev->dm_info\.fix_rate\s*=\s*DESC_RATE6M\s*;/
              rtwdev->dm_info.fix_rate = 0xFF;
            /gx
          ' "$FILE"

          grep -n \
            "fix_rate = 0xFF" \
            "$FILE"

          echo "Automatic rate control: OK"


      # ================================================================
      # 5. WPA2 M4 KEY LENGTH
      # ================================================================

      - name: Fix WPA2 M4 Key Length
        shell: bash
        run: |
          set -euxo pipefail

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          perl -0pi -e '
            s{
              \s*key\[3\]\s*=\s*0\s*;
              \s*key\[4\]\s*=\s*16\s*;
              \s*/\*\s*key\s+length\s*=\s*16\s*\(AES-128\)\s*\*/
            }{
              if (step == 4) {
                  key[3] = 0;
                  key[4] = 0;

                  IOLog(
                      "rtw88: HP256G8 v8.5 M4 key_length=0\\n"
                  );
              } else {
                  key[3] = 0;
                  key[4] = 16;
              }
            }gxs
          ' "$FILE"

          grep -n \
            "HP256G8 v8.5 M4 key_length=0" \
            "$FILE"

          echo "WPA2 M4 Key Length: OK"


      # ================================================================
      # 6. WPA2 M4 NONCE
      # ================================================================

      - name: Fix WPA2 M4 nonce
        shell: bash
        run: |
          set -euxo pipefail

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          perl -0pi -e '
            s{
              memcpy\s*\(
                \s*key\s*\+\s*13\s*,
                \s*_snonce\s*,
                \s*32\s*
              \)\s*;
              \s*/\*\s*key\[13\.\.44\]\s*=\s*SNonce\s*\*/
            }{
              if (step == 4) {
                  memset(
                      key + 13,
                      0,
                      32
                  );

                  IOLog(
                      "rtw88: HP256G8 v8.5 M4 nonce zeroed\\n"
                  );
              } else {
                  memcpy(
                      key + 13,
                      _snonce,
                      32
                  );
              }
            }gxs
          ' "$FILE"

          grep -n \
            "HP256G8 v8.5 M4 nonce zeroed" \
            "$FILE"

          echo "WPA2 M4 nonce: OK"


      # ================================================================
      # 7. M3 DIAGNOSTIC
      # ================================================================

      - name: Add WPA2 M3 diagnostics
        shell: bash
        run: |
          set -euxo pipefail

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          if ! grep -q \
            "HP256G8 v8.5 received M3" \
            "$FILE"
          then

            perl -0pi -e '
              s{
                \}\s*else\s+if\s*\(\s*is_m3\s*\)\s*\{
              }{
                } else if (is_m3) {

                    IOLog(
                        "rtw88: HP256G8 v8.5 received M3\\n"
                    );
              }x
            ' "$FILE"

          fi

          grep -n \
            "HP256G8 v8.5 received M3" \
            "$FILE"


      # ================================================================
      # 8. WPA2 M4/PTK/GTK
      # ================================================================

      - name: Preserve WPA2 M4 before PTK ordering
        shell: bash
        run: |
          set -euxo pipefail

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          grep -n \
            "sendEAPOLKey" \
            "$FILE"

          grep -n \
            "installKey" \
            "$FILE"

          echo
          echo "WPA2 source anchors found."

          # A v8.5 mantém a correção de M4/PTK das versões anteriores.
          # A validação abaixo impede gerar uma build sem as rotinas.
          grep -q "sendEAPOLKey" "$FILE"
          grep -q "_ptkConf" "$FILE"
          grep -q "_gtkConf" "$FILE"


      # ================================================================
      # 9. A-MPDU SETTLE
      # ================================================================

      - name: Add WPA2 A-MPDU settle delay
        shell: bash
        run: |
          set -euxo pipefail

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          if ! grep -q \
            "HP256G8 v8.5 WPA2 settle complete" \
            "$FILE"
          then

            perl -0pi -e '
              s{
                startTxAggregation\s*\(\s*\)\s*;
                \s*/\*
                  \s*keys\s+are\s+installed
                  .*?
                \*/
              }{
                IOSleep(100);

                IOLog(
                    "rtw88: HP256G8 v8.5 WPA2 settle complete, starting A-MPDU\\n"
                );

                startTxAggregation();
              }gxs
            ' "$FILE"

          fi

          grep -n \
            "HP256G8 v8.5 WPA2 settle complete" \
            "$FILE"


      # ================================================================
      # 10. HEADER - ADAPTIVE/DATA PATH STATE
      # ================================================================

      - name: Add v8.5 state variables
        shell: bash
        run: |
          set -euxo pipefail

          FILE="Feixiao/src/kext/RTW88IEEE80211.hpp"

          if ! grep -q \
            "_usefulRxCount" \
            "$FILE"
          then

            perl -0pi -e '
              s{
                (
                  uint8_t\s+_connChanWidth\s*=\s*20\s*;
                  [^\n]*
                )
              }{
                $1

                    bool _force40MHz = false;

                    volatile bool _fallbackPending = false;

                    uint32_t _perfLastRxFrameCount = 0;

                    uint32_t _perfTxWithoutRx = 0;

                    volatile uint32_t _usefulRxCount = 0;

                    uint32_t _dataPathRecoveryCount = 0;
              }x
            ' "$FILE"

          fi

          grep -nE \
            "connChanWidth|force40MHz|fallbackPending|usefulRx|dataPathRecovery" \
            "$FILE"


      # ================================================================
      # 11. HEADER - RECOVERY METHODS
      # ================================================================

      - name: Add v8.5 recovery declarations
        shell: bash
        run: |
          set -euxo pipefail

          FILE="Feixiao/src/kext/RTW88IEEE80211.hpp"

          if ! grep -q \
            "scheduleDataPathRecovery" \
            "$FILE"
          then

            perl -0pi -e '
              s{
                (
                  void\s+setConnectedChandef\s*
                  \(
                    struct\s+ieee80211_channel\s*\*chan
                  \)\s*;
                )
              }{
                $1

                    void scheduleDataPathRecovery();

                    void runDataPathRecovery();

                    static void dataPathRecoveryTCFn(
                        thread_call_param_t self,
                        thread_call_param_t
                    );
              }x
            ' "$FILE"

          fi

          grep -nE \
            "scheduleDataPathRecovery|runDataPathRecovery|dataPathRecoveryTCFn" \
            "$FILE"


      # ================================================================
      # 12. HEADER - THREAD CALL
      # ================================================================

      - name: Add data path recovery thread call
        shell: bash
        run: |
          set -euxo pipefail

          FILE="Feixiao/src/kext/RTW88IEEE80211.hpp"

          if ! grep -q \
            "_dataPathRecoveryTC" \
            "$FILE"
          then

            perl -0pi -e '
              s{
                (
                  thread_call_t\s+_connectTC\s*=\s*nullptr\s*;
                )
              }{
                $1

                    thread_call_t _dataPathRecoveryTC = nullptr;
              }x
            ' "$FILE"

          fi

          grep -n \
            "_dataPathRecoveryTC" \
            "$FILE"


      # ================================================================
      # 13. VHT 80 MHZ ADAPTIVE
      # ================================================================

      - name: Enable adaptive VHT 80 MHz
        shell: bash
        run: |
          set -euxo pipefail

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          perl -0pi -e '
            s{
              if\s*\(
                \s*chip80
                \s*&&
                \s*vhtWidth\s*==\s*1
                \s*&&
                \s*vhtSeg0\s*!=\s*0
                \s*
              \)
            }{
              if (
                  !_force40MHz &&
                  chip80 &&
                  vhtWidth == 1 &&
                  vhtSeg0 != 0
              )
            }gx
          ' "$FILE"

          grep -n \
            "_force40MHz" \
            "$FILE" \
            | head -20


      # ================================================================
      # 14. BUILD ID
      # ================================================================

      - name: Add v8.5 runtime identification
        shell: bash
        run: |
          set -euxo pipefail

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          if ! grep -q \
            "HP256G8 v8.5 Data-Path Recovery active" \
            "$FILE"
          then

            perl -0pi -e '
              s{
                (
                  IOLog\s*\(
                    "rtw88:\s*connected\s+chandef:
                )
              }{
                IOLog(
                    "rtw88: HP256G8 v8.5 Data-Path Recovery active "
                    "safe40=%u usefulRx=%u\\n",
                    _force40MHz ? 1 : 0,
                    _usefulRxCount
                );

                $1
              }x
            ' "$FILE"

          fi

          grep -n \
            "HP256G8 v8.5 Data-Path Recovery active" \
            "$FILE"


      # ================================================================
      # 15. USEFUL ETHERNET RX COUNTER
      # ================================================================

      - name: Count useful IPv4 ARP IPv6 RX
        shell: bash
        run: |
          set -euxo pipefail

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          if ! grep -q \
            "HP256G8 v8.5 useful Ethernet RX" \
            "$FILE"
          then

            perl -0pi -e '
              s{
                (
                  void\s+RTW88IEEE80211::deliverEthernet
                  \s*\(
                    const\s+uint8_t\s*\*da\s*,
                    \s*const\s+uint8_t\s*\*sa\s*,
                    .*?
                  \)
                  \s*\{
                )
              }{
                $1

                    /*
                     * HP256G8 v8.5 useful Ethernet RX
                     *
                     * Count only actual network data delivered by the
                     * 802.11 -> Ethernet path.
                     */

                    if (
                        ethertype == 0x0800 ||
                        ethertype == 0x0806 ||
                        ethertype == 0x86DD
                    ) {
                        _usefulRxCount++;
                    }

              }xs
            ' "$FILE"

          fi

          grep -n \
            -A 25 \
            -B 5 \
            "HP256G8 v8.5 useful Ethernet RX" \
            "$FILE"


      # ================================================================
      # 16. DATA-PATH RECOVERY FUNCTIONS
      # ================================================================

      - name: Add Data Path Recovery worker
        shell: bash
        run: |
          set -euxo pipefail

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          if grep -q \
            "void RTW88IEEE80211::runDataPathRecovery()" \
            "$FILE"
          then
            echo "Data Path Recovery already present."
            exit 0
          fi

          cat > /tmp/v85_recovery.cpp <<'CPP'

          /* ================================================================== */
          /* HP256G8 v8.5 Data-Path Recovery                                    */
          /* ================================================================== */

          void RTW88IEEE80211::dataPathRecoveryTCFn(
              thread_call_param_t self,
              thread_call_param_t)
          {
              RTW88IEEE80211 *obj =
                  (RTW88IEEE80211 *)self;

              if (!obj)
                  return;

              obj->runDataPathRecovery();
          }


          void RTW88IEEE80211::scheduleDataPathRecovery()
          {
              if (_fallbackPending)
                  return;

              if (_state != RTW88_STATE_CONNECTED)
                  return;

              _fallbackPending =
                  true;

              IOLog(
                  "rtw88: HP256G8 v8.5 scheduling DATA PATH recovery "
                  "width=%u rssi=%d txNoUsefulRx=%u usefulRx=%u rawRx=%u\n",
                  _connChanWidth,
                  _rssi,
                  _perfTxWithoutRx,
                  _usefulRxCount,
                  _rxFrameCount
              );

              if (_dataPathRecoveryTC) {
                  thread_call_enter(
                      _dataPathRecoveryTC
                  );
              } else {
                  _fallbackPending =
                      false;
              }
          }


          void RTW88IEEE80211::runDataPathRecovery()
          {
              if (
                  _state != RTW88_STATE_CONNECTED ||
                  !_powered ||
                  !_hw ||
                  !_vif
              ) {
                  _fallbackPending =
                      false;

                  return;
              }


              uint8_t failedWidth =
                  _connChanWidth;


              _dataPathRecoveryCount++;


              IOLog(
                  "rtw88: HP256G8 v8.5 DATA PATH RECOVERY BEGIN "
                  "attempt=%u width=%u rssi=%d usefulRx=%u rawRx=%u\n",
                  _dataPathRecoveryCount,
                  failedWidth,
                  _rssi,
                  _usefulRxCount,
                  _rxFrameCount
              );


              /*
               * An 80 MHz failure permanently selects 40 MHz until
               * the driver is restarted.
               */

              if (
                  failedWidth ==
                  80
              ) {
                  _force40MHz =
                      true;

                  IOLog(
                      "rtw88: HP256G8 v8.5 80 MHz marked unstable; "
                      "Safe 40 MHz armed\n"
                  );
              }


              /*
               * Clean association teardown.
               *
               * Existing Feixiao disconnect/releaseSta path also tears
               * down RX BA/reorder sessions and clears keys.
               */

              doDisconnect();


              IOSleep(
                  250
              );


              if (
                  !_powered ||
                  !_hw ||
                  !_vif
              ) {
                  _fallbackPending =
                      false;

                  return;
              }


              _perfTxWithoutRx =
                  0;


              _perfLastRxFrameCount =
                  _usefulRxCount;


              _fallbackPending =
                  false;


              _state =
                  RTW88_STATE_AUTHENTICATING;


              IOLog(
                  "rtw88: HP256G8 v8.5 reconnecting after DATA PATH "
                  "recovery safe40=%u\n",
                  _force40MHz ? 1 : 0
              );


              if (_connectTC) {
                  thread_call_enter(
                      _connectTC
                  );
              } else {
                  doAuthenticate();
              }
          }


          CPP

          # Insere imediatamente antes do início da seção TX.

          LINE="$(
            grep -n \
              "TX path: Ethernet" \
              "$FILE" \
              | head -1 \
              | cut -d: -f1
          )"

          test -n "$LINE"

          INSERT="$((LINE - 1))"

          head -n "$INSERT" "$FILE" > /tmp/ieee.new

          cat /tmp/v85_recovery.cpp >> /tmp/ieee.new

          tail -n +"$LINE" "$FILE" >> /tmp/ieee.new

          mv /tmp/ieee.new "$FILE"

          grep -n \
            "DATA PATH RECOVERY BEGIN" \
            "$FILE"


      # ================================================================
      # 17. ALLOCATE WORKER
      # ================================================================

      - name: Allocate Data Path Recovery worker
        shell: bash
        run: |
          set -euxo pipefail

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          if grep -q \
            "thread_call_allocate.*dataPathRecoveryTCFn" \
            "$FILE"
          then
            echo "Recovery thread allocation already present."
            exit 0
          fi

          perl -0pi -e '
            s{
              (
                _connectTC\s*=\s*thread_call_allocate
                \s*\(
                  .*?
                \)\s*;
              )
            }{
              $1

                  _dataPathRecoveryTC =
                      thread_call_allocate(
                          (thread_call_func_t)
                          RTW88IEEE80211::dataPathRecoveryTCFn,
                          (thread_call_param_t)this
                      );

                  if (!_dataPathRecoveryTC) {
                      IOLog(
                          "rtw88: HP256G8 v8.5 failed to allocate "
                          "Data Path Recovery worker\\n"
                      );

                      return false;
                  }
            }xs
          ' "$FILE"

          grep -n \
            -A 12 \
            "_dataPathRecoveryTC =" \
            "$FILE"


      # ================================================================
      # 18. FREE WORKER
      # ================================================================

      - name: Free Data Path Recovery worker
        shell: bash
        run: |
          set -euxo pipefail

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          if grep -q \
            "thread_call_free(_dataPathRecoveryTC)" \
            "$FILE"
          then
            exit 0
          fi

          perl -0pi -e '
            s{
              (
                if\s*\(\s*_connectTC\s*\)
                \s*\{
              )
            }{
                if (_dataPathRecoveryTC) {
                    thread_call_cancel(
                        _dataPathRecoveryTC
                    );

                    thread_call_free(
                        _dataPathRecoveryTC
                    );

                    _dataPathRecoveryTC =
                        nullptr;
                }

                $1
            }x
          ' "$FILE"

          grep -n \
            -A 15 \
            "thread_call_free(_dataPathRecoveryTC)" \
            "$FILE"


      # ================================================================
      # 19. DATA-PATH WATCHDOG
      # ================================================================

      - name: Install useful RX Data Path watchdog
        shell: bash
        run: |
          set -euxo pipefail

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          if grep -q \
            "HP256G8 v8.5 DATA PATH WATCHDOG" \
            "$FILE"
          then
            exit 0
          fi

          perl -0pi -e '
            s{
              (
                UInt32\s+
                RTW88IEEE80211::outputPacket
                \s*\(\s*mbuf_t\s+m\s*\)
                \s*\{
              )
            }{
              $1

                  /*
                   * HP256G8 v8.5 DATA PATH WATCHDOG
                   *
                   * Raw Wi-Fi RX is NOT used here.
                   *
                   * Only IPv4 / ARP / IPv6 packets that reached
                   * deliverEthernet() count as proof of a live path.
                   */

                  if (
                      _state == RTW88_STATE_CONNECTED &&
                      !_fallbackPending
                  ) {

                      uint32_t currentUsefulRx =
                          _usefulRxCount;


                      if (
                          currentUsefulRx !=
                          _perfLastRxFrameCount
                      ) {

                          _perfLastRxFrameCount =
                              currentUsefulRx;

                          _perfTxWithoutRx =
                              0;

                      } else {

                          if (
                              _perfTxWithoutRx <
                              0xfffffff0U
                          ) {
                              _perfTxWithoutRx++;
                          }
                      }


                      bool invalidRssi =
                          (
                              _rssi >= 0
                          );


                      bool usefulRxStalled =
                          (
                              _perfTxWithoutRx >= 128
                          );


                      if (
                          invalidRssi ||
                          usefulRxStalled
                      ) {

                          IOLog(
                              "rtw88: HP256G8 v8.5 DATA PATH STALL "
                              "width=%u rssi=%d "
                              "txNoUsefulRx=%u usefulRx=%u rawRx=%u\\n",
                              _connChanWidth,
                              _rssi,
                              _perfTxWithoutRx,
                              _usefulRxCount,
                              _rxFrameCount
                          );


                          scheduleDataPathRecovery();
                      }
                  }

            }xs
          ' "$FILE"

          grep -n \
            -A 100 \
            "HP256G8 v8.5 DATA PATH WATCHDOG" \
            "$FILE"


      # ================================================================
      # 20. DRIVER START RESET
      # ================================================================

      - name: Reset Data Path counters on driver start
        shell: bash
        run: |
          set -euxo pipefail

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          if grep -q \
            "HP256G8 v8.5 data-path counters reset" \
            "$FILE"
          then
            exit 0
          fi

          perl -0pi -e '
            s{
              (
                _state\s*=\s*RTW88_STATE_IDLE\s*;
                \s*
                _scanReturnState\s*=\s*RTW88_STATE_IDLE\s*;
              )
            }{
                _force40MHz = false;

                _fallbackPending = false;

                _usefulRxCount = 0;

                _perfLastRxFrameCount = 0;

                _perfTxWithoutRx = 0;

                _dataPathRecoveryCount = 0;

                IOLog(
                    "rtw88: HP256G8 v8.5 data-path counters reset\\n"
                );

                $1
            }x
          ' "$FILE"

          grep -n \
            -A 20 \
            "HP256G8 v8.5 data-path counters reset" \
            "$FILE"


      # ================================================================
      # 21. TX FLOW CONTROL
      # ================================================================

      - name: Set HP256G8 TX thresholds
        shell: bash
        run: |
          set -euxo pipefail

          FILE="Feixiao/src/kext/RTW88PCIDevice.cpp"

          sed -i '' \
            's/kRTW88TxStallAvail = 128/kRTW88TxStallAvail = 96/g' \
            "$FILE"

          sed -i '' \
            's/kRTW88TxResumeAvail = 192/kRTW88TxResumeAvail = 160/g' \
            "$FILE"

          grep -nE \
            "kRTW88TxStallAvail|kRTW88TxResumeAvail" \
            "$FILE"


      # ================================================================
      # 22. SAFE MBUF
      # ================================================================

      - name: Apply Safe macOS mbuf validation
        shell: bash
        run: |
          set -euxo pipefail

          FILE="Feixiao/src/kext/RTW88PCIDevice.cpp"

          START="$(
            grep -n \
              "^void RTW88PCIDevice::injectRxFrame(mbuf_t m)" \
              "$FILE" \
              | head -1 \
              | cut -d: -f1
          )"

          END="$(
            grep -n \
              "DMA coherent allocation" \
              "$FILE" \
              | head -1 \
              | cut -d: -f1
          )"

          test -n "$START"
          test -n "$END"

          cat > /tmp/safe_mbuf.cpp <<'CPP'
          void RTW88PCIDevice::injectRxFrame(mbuf_t m)
          {
              drainPendingFree();

              if (
                  !_iface ||
                  !_enabled
              ) {
                  freePacket(m);
                  return;
              }


              const size_t kMinFrame =
                  14;

              const size_t kMaxFrame =
                  4096;

              const unsigned int kMaxSegments =
                  32;


              size_t packetLength =
                  mbuf_pkthdr_len(m);

              size_t firstLength =
                  mbuf_len(m);

              size_t chainLength =
                  0;

              unsigned int segments =
                  0;

              bool malformed =
                  false;


              for (
                  mbuf_t segment = m;
                  segment != nullptr;
                  segment = mbuf_next(segment)
              ) {
                  size_t length =
                      mbuf_len(segment);

                  segments++;


                  if (
                      segments > kMaxSegments ||
                      length > kMaxFrame ||
                      chainLength > kMaxFrame - length
                  ) {
                      malformed =
                          true;

                      break;
                  }


                  chainLength +=
                      length;
              }


              if (
                  malformed ||
                  packetLength < kMinFrame ||
                  packetLength > kMaxFrame ||
                  firstLength < kMinFrame ||
                  firstLength > kMaxFrame ||
                  chainLength != packetLength
              ) {
                  IOLog(
                      "rtw88: HP256G8 v8.5 SAFE MBUF drop "
                      "pkthdr=%zu first=%zu chain=%zu segs=%u\n",
                      packetLength,
                      firstLength,
                      chainLength,
                      segments
                  );

                  freePacket(m);

                  return;
              }


              _iface->inputPacket(
                  m,
                  0,
                  IONetworkInterface::kInputOptionQueuePacket
              );


              _iface->flushInputQueue();


              IONetworkData *nd =
                  _iface->getNetworkData(
                      kIONetworkStatsKey
                  );


              if (nd) {
                  IONetworkStats *stats =
                      (IONetworkStats *)
                      nd->getBuffer();

                  if (stats)
                      stats->inputPackets++;
              }
          }


          CPP

          BEFORE="$((START - 1))"

          head -n "$BEFORE" "$FILE" \
            > /tmp/pci.new

          cat /tmp/safe_mbuf.cpp \
            >> /tmp/pci.new

          tail -n +"$END" "$FILE" \
            >> /tmp/pci.new

          mv \
            /tmp/pci.new \
            "$FILE"

          grep -n \
            "HP256G8 v8.5 SAFE MBUF" \
            "$FILE"


      # ================================================================
      # 23. SAFE RX DMA TAG CHECK
      # ================================================================

      - name: Apply Safe DMA descriptor recovery
        shell: bash
        run: |
          set -euxo pipefail

          FILE="rtw88-stable/drivers/net/wireless/realtek/rtw88/pci.c"

          START="$(
            grep -nE \
              "^static (void|bool) rtw_pci_dma_check\\(" \
              "$FILE" \
              | head -1 \
              | cut -d: -f1
          )"

          END="$(
            grep -n \
              "^static u32 __pci_get_hw_tx_ring_rp" \
              "$FILE" \
              | head -1 \
              | cut -d: -f1
          )"

          test -n "$START"
          test -n "$END"

          cat > /tmp/safe_dma.c <<'C'
          static bool rtw_pci_dma_check(
                  struct rtw_dev *rtwdev,
                  struct rtw_pci_rx_ring *rx_ring,
                  u32 idx)
          {
              struct rtw_pci *rtwpci =
                  (struct rtw_pci *)rtwdev->priv;

              const struct rtw_chip_info *chip =
                  rtwdev->chip;

              struct rtw_pci_rx_buffer_desc *buf_desc;

              u32 desc_sz =
                  chip->rx_buf_desc_sz;

              u16 expected =
                  rtwpci->rx_tag;

              u16 observed =
                  0;

              int i;

              static u32 mismatch_count =
                  0;

              static u32 recovery_count =
                  0;


              buf_desc =
                  (struct rtw_pci_rx_buffer_desc *)
                  (
                      rx_ring->r.head +
                      idx * desc_sz
                  );


              /*
               * HP256G8 v8.5 SAFE RESYNC
               *
               * Wait a maximum of 200 us.
               */

              for (
                  i = 0;
                  i < 100;
                  i++
              ) {
                  observed =
                      le16_to_cpu(
                          buf_desc->total_pkt_size
                      );


                  if (
                      observed ==
                      expected
                  ) {
                      rtwpci->rx_tag =
                          (
                              expected +
                              1
                          )
                          %
                          RX_TAG_MAX;

                      return true;
                  }


                  udelay(
                      2
                  );
              }


              mismatch_count++;


              u16 delta;


              if (
                  expected >=
                  observed
              ) {
                  delta =
                      expected -
                      observed;
              } else {
                  delta =
                      (
                          expected +
                          RX_TAG_MAX
                      )
                      -
                      observed;
              }


              /*
               * CURRENT descriptor is always rejected.
               *
               * Small coherent delta can only realign the NEXT tag.
               */

              if (
                  delta > 0 &&
                  delta <= 32
              ) {
                  rtwpci->rx_tag =
                      (
                          observed +
                          1
                      )
                      %
                      RX_TAG_MAX;


                  recovery_count++;


                  if (
                      recovery_count == 1 ||
                      (
                          recovery_count &
                          0xff
                      ) == 0
                  ) {
                      rtw_warn(
                          rtwdev,
                          "HP256G8 v8.5 SAFE RESYNC "
                          "drop current descriptor "
                          "expected=%u observed=%u "
                          "delta=%u next=%u count=%u\n",
                          expected,
                          observed,
                          delta,
                          rtwpci->rx_tag,
                          recovery_count
                      );
                  }
              } else {
                  rtwpci->rx_tag =
                      (
                          expected +
                          1
                      )
                      %
                      RX_TAG_MAX;


                  if (
                      mismatch_count == 1 ||
                      (
                          mismatch_count &
                          0xff
                      ) == 0
                  ) {
                      rtw_warn(
                          rtwdev,
                          "HP256G8 v8.5 SAFE RX reject "
                          "expected=%u observed=%u "
                          "delta=%u count=%u\n",
                          expected,
                          observed,
                          delta,
                          mismatch_count
                      );
                  }
              }


              return false;
          }


          C

          BEFORE="$((START - 1))"

          head -n "$BEFORE" "$FILE" \
            > /tmp/linux_pci.new

          cat /tmp/safe_dma.c \
            >> /tmp/linux_pci.new

          tail -n +"$END" "$FILE" \
            >> /tmp/linux_pci.new

          mv \
            /tmp/linux_pci.new \
            "$FILE"

          grep -n \
            "HP256G8 v8.5 SAFE RESYNC" \
            "$FILE"


      # ================================================================
      # 24. BLOCK INVALID CURRENT DESCRIPTOR
      # ================================================================

      - name: Reject bad RX descriptor before parsing
        shell: bash
        run: |
          set -euxo pipefail

          FILE="rtw88-stable/drivers/net/wireless/realtek/rtw88/pci.c"

          if ! grep -q \
            "if (!rtw_pci_dma_check(rtwdev, ring, cur_rp))" \
            "$FILE"
          then

            perl -0pi -e '
              s{
                rtw_pci_dma_check
                \(
                  rtwdev,
                  \s*ring,
                  \s*cur_rp
                \)
                \s*;
              }{
                if (!rtw_pci_dma_check(rtwdev, ring, cur_rp))
                    goto next_rp;
              }x
            ' "$FILE"

          fi

          grep -n \
            -A 8 \
            -B 5 \
            "if (!rtw_pci_dma_check" \
            "$FILE"


      # ================================================================
      # 25. RX LENGTH VALIDATION
      # ================================================================

      - name: Validate RX DMA frame length
        shell: bash
        run: |
          set -euxo pipefail

          FILE="rtw88-stable/drivers/net/wireless/realtek/rtw88/pci.c"

          if ! grep -q \
            "HP256G8 v8.5 invalid RX length" \
            "$FILE"
          then

            perl -0pi -e '
              s{
                (
                  pkt_offset\s*=
                  \s*pkt_desc_sz
                  \s*\+
                  \s*pkt_stat\.drv_info_sz
                  \s*\+
                  \s*pkt_stat\.shift
                  \s*;
                )
              }{
                $1

                    if (
                        !pkt_stat.pkt_len ||
                        pkt_offset >= RTK_PCI_RX_BUF_SIZE ||
                        pkt_stat.pkt_len >
                            RTK_PCI_RX_BUF_SIZE - pkt_offset
                    ) {
                        rtw_warn(
                            rtwdev,
                            "HP256G8 v8.5 invalid RX length "
                            "pkt=%u off=%u\\n",
                            pkt_stat.pkt_len,
                            pkt_offset
                        );

                        goto next_rp;
                    }
              }x
            ' "$FILE"

          fi

          grep -n \
            -A 20 \
            -B 8 \
            "HP256G8 v8.5 invalid RX length" \
            "$FILE"


      # ================================================================
      # 26. VALIDATION
      # ================================================================

      - name: Validate all v8.5 source changes
        shell: bash
        run: |
          set -euxo pipefail

          IEEE="Feixiao/src/kext/RTW88IEEE80211.cpp"
          HPP="Feixiao/src/kext/RTW88IEEE80211.hpp"
          PCI="Feixiao/src/kext/RTW88PCIDevice.cpp"
          LPCI="rtw88-stable/drivers/net/wireless/realtek/rtw88/pci.c"

          grep -q \
            "HP256G8 v8.5 Data-Path Recovery active" \
            "$IEEE"

          grep -q \
            "HP256G8 v8.5 useful Ethernet RX" \
            "$IEEE"

          grep -q \
            "HP256G8 v8.5 DATA PATH WATCHDOG" \
            "$IEEE"

          grep -q \
            "HP256G8 v8.5 DATA PATH STALL" \
            "$IEEE"

          grep -q \
            "HP256G8 v8.5 DATA PATH RECOVERY BEGIN" \
            "$IEEE"

          grep -q \
            "scheduleDataPathRecovery" \
            "$IEEE"

          grep -q \
            "runDataPathRecovery" \
            "$IEEE"

          grep -q \
            "_usefulRxCount" \
            "$HPP"

          grep -q \
            "_dataPathRecoveryTC" \
            "$HPP"

          grep -q \
            "HP256G8 v8.5 SAFE MBUF" \
            "$PCI"

          grep -q \
            "HP256G8 v8.5 SAFE RESYNC" \
            "$LPCI"

          grep -q \
            "HP256G8 v8.5 invalid RX length" \
            "$LPCI"

          grep -q \
            "delta <= 32" \
            "$LPCI"

          grep -q \
            "if (!rtw_pci_dma_check(rtwdev, ring, cur_rp))" \
            "$LPCI"

          if grep -q \
            "_rxQueued = true;" \
            "$PCI"
          then
            echo "ERROR: unsafe RX batching detected"
            exit 1
          fi

          echo
          echo "================================================"
          echo "HP256G8 V8.5 SOURCE VALIDATION: OK"
          echo "================================================"


      # ================================================================
      # 27. DOWNLOAD FIRMWARE
      # ================================================================

      - name: Download firmware
        shell: bash
        run: |
          set -euxo pipefail

          cd Feixiao/firmware

          for fw in \
            rtw8822b_fw.bin \
            rtw8822c_fw.bin \
            rtw8821c_fw.bin \
            rtw8821a_fw.bin \
            rtw8812a_fw.bin \
            rtw8814a_fw.bin
          do
            if [ ! -s "$fw" ]; then

              curl \
                -L \
                --fail \
                "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtw88/$fw" \
                -o "$fw"

            fi
          done

          ls -lh *.bin


      # ================================================================
      # 28. BUILD ENVIRONMENT
      # ================================================================

      - name: Show build environment
        shell: bash
        run: |
          set -euxo pipefail

          sw_vers

          xcodebuild \
            -version

          clang \
            --version


      # ================================================================
      # 29. BUILD
      # ================================================================

      - name: Build HP256G8 v8.5
        shell: bash
        working-directory: Feixiao
        run: |
          set -euxo pipefail

          make clean || true

          echo
          echo "================================================"
          echo "HP256G8 RTL8821CE V8.5 DATA PATH RECOVERY"
          echo "================================================"

          make all


      # ================================================================
      # 30. VERIFY BINARY
      # ================================================================

      - name: Verify HP256G8 v8.5 binary
        shell: bash
        run: |
          set -euxo pipefail

          test -d \
            Feixiao/build/out/rtw88.kext

          test -f \
            Feixiao/build/out/rtw88ctl

          BIN="Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88"

          file "$BIN"

          file \
            Feixiao/build/out/rtw88ctl

          echo
          echo "================================================"
          echo "V8.5 BINARY MARKERS"
          echo "================================================"

          strings "$BIN" \
            | grep \
              "HP256G8 v8.5 Data-Path Recovery active"

          strings "$BIN" \
            | grep \
              "HP256G8 v8.5 DATA PATH STALL"

          strings "$BIN" \
            | grep \
              "HP256G8 v8.5 DATA PATH RECOVERY BEGIN"

          strings "$BIN" \
            | grep \
              "HP256G8 v8.5 reconnecting after DATA PATH"

          strings "$BIN" \
            | grep \
              "HP256G8 v8.5 SAFE MBUF"

          strings "$BIN" \
            | grep \
              "HP256G8 v8.5 SAFE RESYNC"

          echo
          echo "Binary markers: OK"


      # ================================================================
      # 31. PACKAGE
      # ================================================================

      - name: Package HP256G8 v8.5
        shell: bash
        run: |
          set -euxo pipefail

          OUT="$RUNNER_TEMP/Feixiao-HP256G8-v8.5-Data-Path-Recovery"

          rm -rf "$OUT"

          mkdir -p "$OUT"

          cp -R \
            Feixiao/build/out/rtw88.kext \
            "$OUT/"

          cp \
            Feixiao/build/out/rtw88ctl \
            "$OUT/"

          chmod +x \
            "$OUT/rtw88ctl"

          cat > "$OUT/BUILD-INFO.txt" <<'EOF'
          ============================================================
          HP 256 G8
          REALTEK RTL8821CE
          FEIXIAO V8.5 DATA-PATH RECOVERY
          ============================================================

          CHIP
          ============================================================

          RTL8821CE
          PCI 10EC:C821


          V8.5 OBJECTIVE
          ============================================================

          Fix false-connected condition:

          Wi-Fi association = connected
          RSSI = valid
          but
          ARP / IPv4 / gateway traffic = dead


          USEFUL RX
          ============================================================

          Raw Wi-Fi RX is no longer considered proof
          that the network data path is alive.

          Useful RX includes only Ethernet:

          IPv4
          ARP
          IPv6


          WATCHDOG
          ============================================================

          TX activity without useful Ethernet RX:

          threshold = 128

          triggers:

          DATA PATH RECOVERY


          RECOVERY
          ============================================================

          detect stall
                |
                v
          recovery thread
                |
                v
          doDisconnect()
                |
                v
          teardown association / BA / keys
                |
                v
          wait 250 ms
                |
                v
          reconnect
                |
                v
          WPA2
                |
                v
          A-MPDU


          80 MHZ
          ============================================================

          80 MHz remains enabled as the initial
          performance attempt.

          If a data-path failure occurs while at
          80 MHz:

          Safe 40 MHz is armed for subsequent
          reconnection.


          SAFETY
          ============================================================

          Safe MBUF validation

          Safe RX descriptor validation

          Bad CURRENT descriptor rejected

          bounded RX tag resync

          RX DMA length bounds

          no RX batching


          TARGET
          ============================================================

          Target remains above 100 Mbps when the
          RTL8821CE can operate stably at 80 MHz.

          This is a development target and is not
          a guaranteed throughput result.


          BACKUP
          ============================================================

          Keep v8.2 available as a stable fallback.

          Always use rtw88.kext and rtw88ctl from
          the SAME artifact.
          EOF

          cd "$RUNNER_TEMP"

          zip \
            -r \
            Feixiao_HP256G8_v8_5_Data_Path_Recovery.zip \
            Feixiao-HP256G8-v8.5-Data-Path-Recovery


      # ================================================================
      # 32. UPLOAD
      # ================================================================

      - name: Upload HP256G8 v8.5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Feixiao-HP256G8-v8.5-Data-Path-Recovery
          path: ${{ runner.temp }}/Feixiao_HP256G8_v8_5_Data_Path_Recovery.zip
          retention-days: 7
