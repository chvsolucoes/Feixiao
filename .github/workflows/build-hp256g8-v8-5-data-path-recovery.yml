          echo "================================================"

          grep -q "HP256G8 v8.5 M4 key_length=0" "$IEEE"
          grep -q "HP256G8 v8.5 M4 nonce zeroed" "$IEEE"
          grep -q "HP256G8 v8.5 received M3" "$IEEE"
          grep -q "HP256G8 v8.5 WPA2 settle complete" "$IEEE"


          echo
          echo "================================================"
          echo "VHT"
          echo "================================================"

          grep -q \
            "if (!_force40MHz && chip80 && vhtWidth == 1 && vhtSeg0 != 0)" \
            "$IEEE"

          grep -q \
            "HP256G8 v8.5 Data-Path Recovery active" \
            "$IEEE"


          echo
          echo "================================================"
          echo "DATA PATH"
          echo "================================================"

          grep -q "HP256G8 v8.5 useful Ethernet RX" "$IEEE"
          grep -q "HP256G8 v8.5 DATA PATH WATCHDOG" "$IEEE"
          grep -q "HP256G8 v8.5 DATA PATH STALL" "$IEEE"
          grep -q "HP256G8 v8.5 scheduling DATA PATH recovery" "$IEEE"
          grep -q "HP256G8 v8.5 DATA PATH RECOVERY BEGIN" "$IEEE"
          grep -q "HP256G8 v8.5 reconnecting after DATA PATH" "$IEEE"


          echo
          echo "================================================"
          echo "THREAD LIFECYCLE"
          echo "================================================"

          grep -q "_dataPathRecoveryTC =" "$IEEE"
          grep -q "thread_call_free(_dataPathRecoveryTC)" "$IEEE"


          echo
          echo "================================================"
          echo "HEADER"
          echo "================================================"

          grep -q "_force40MHz" "$HPP"
          grep -q "_fallbackPending" "$HPP"
          grep -q "_perfLastRxFrameCount" "$HPP"
          grep -q "_perfTxWithoutRx" "$HPP"
          grep -q "_usefulRxCount" "$HPP"
