name: RTW88 v9.0.3c Tahoe V2 ABI Candidate Probe

"on":
  workflow_dispatch:

permissions:
  contents: read

env:
  FEIXIAO_REF: e963f43188382eced4ef2fa75d19ce4db2315c68
  ITLWM_REF: 53c51c2cdd6e4b69beb91f310d74c53422b0f8bd
  BUILD_NAME: RTW88-v9.0.3c-Tahoe-V2-ABI-Candidate

jobs:
  build:
    name: Build no-match IO80211ControllerV2 probe
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Feixiao for MacKernelSDK
        uses: actions/checkout@v4
        with:
          repository: thegwchr/Feixiao
          ref: ${{ env.FEIXIAO_REF }}
          path: Feixiao
          fetch-depth: 1
          submodules: recursive

      - name: Checkout AirportItlwm V2 headers
        uses: actions/checkout@v4
        with:
          repository: OpenIntelWireless/itlwm
          ref: ${{ env.ITLWM_REF }}
          path: itlwm
          fetch-depth: 1

      - name: Validate exact revisions
        shell: bash
        run: |
          set -eu
          F="$(git -C Feixiao rev-parse HEAD)"
          I="$(git -C itlwm rev-parse HEAD)"
          echo "Feixiao expected: ${FEIXIAO_REF}"
          echo "Feixiao actual  : ${F}"
          echo
          echo "itlwm expected  : ${ITLWM_REF}"
          echo "itlwm actual    : ${I}"
          [ "${F}" = "${FEIXIAO_REF}" ]
          [ "${I}" = "${ITLWM_REF}" ]

      - name: Validate V2 header
        shell: bash
        run: |
          set -eu
          H="itlwm/include/Airport/IO80211ControllerV2.h"
          test -f "${H}"
          grep -q 'class IO80211Controller : public IOEthernetController' "${H}"

          test -f itlwm/include/Airport/Apple80211.h
          test -f itlwm/include/Airport/debug.h
          grep -q '#include "debug.h"' itlwm/include/Airport/Apple80211.h
          grep -q '#include "IO80211ControllerV2.h"' itlwm/include/Airport/Apple80211.h

          for M in isCommandProhibited handleCardSpecific getDRIVER_VERSION getHARDWARE_VERSION getCARD_CAPABILITIES getPOWER setPOWER getCOUNTRY_CODE setCOUNTRY_CODE setGET_DEBUG_INFO
          do
            grep -q "${M}" "${H}"
            echo "[OK] ${M}"
          done

      - name: Create standalone ABI probe source
        shell: bash
        run: |
          set -eu
          mkdir -p probe/src probe/RTW88TahoeABIProbe.kext/Contents/MacOS

          cat > probe/src/RTW88TahoeABICandidate.hpp <<'EOF'
          #pragma once
          #ifndef IO80211FAMILY_V2
          #define IO80211FAMILY_V2 1
          #endif
          #include "Apple80211.h"

          class RTW88TahoeABICandidate : public IO80211Controller
          {
              OSDeclareDefaultStructors(RTW88TahoeABICandidate)

          public:
              bool isCommandProhibited(int) override;
              SInt32 handleCardSpecific(IO80211SkywalkInterface *, unsigned long, void *, bool) override;
              SInt32 enableFeature(IO80211FeatureCode, void *) override;
              IOReturn getDRIVER_VERSION(IO80211SkywalkInterface *, apple80211_version_data *) override;
              IOReturn getHARDWARE_VERSION(IO80211SkywalkInterface *, apple80211_version_data *) override;
              IOReturn getCARD_CAPABILITIES(IO80211SkywalkInterface *, apple80211_capability_data *) override;
              IOReturn getPOWER(IO80211SkywalkInterface *, apple80211_power_data *) override;
              IOReturn setPOWER(IO80211SkywalkInterface *, apple80211_power_data *) override;
              IOReturn getCOUNTRY_CODE(IO80211SkywalkInterface *, apple80211_country_code_data *) override;
              IOReturn setCOUNTRY_CODE(IO80211SkywalkInterface *, apple80211_country_code_data *) override;
              IOReturn setGET_DEBUG_INFO(IO80211SkywalkInterface *, apple80211_debug_command *) override;
          };
          EOF

          cat > probe/src/RTW88TahoeABICandidate.cpp <<'EOF'
          #include "RTW88TahoeABICandidate.hpp"
          #include <IOKit/IOLib.h>

          #define super IO80211Controller

          OSDefineMetaClassAndStructors(
              RTW88TahoeABICandidate,
              IO80211Controller
          )

          bool RTW88TahoeABICandidate::isCommandProhibited(int)
          {
              return false;
          }

          SInt32 RTW88TahoeABICandidate::handleCardSpecific(
              IO80211SkywalkInterface *,
              unsigned long,
              void *,
              bool
          )
          {
              return kIOReturnUnsupported;
          }

          SInt32 RTW88TahoeABICandidate::enableFeature(IO80211FeatureCode, void *)
          {
              return kIOReturnSuccess;
          }

          IOReturn RTW88TahoeABICandidate::getDRIVER_VERSION(
              IO80211SkywalkInterface *,
              apple80211_version_data *
          )
          {
              return kIOReturnUnsupported;
          }

          IOReturn RTW88TahoeABICandidate::getHARDWARE_VERSION(
              IO80211SkywalkInterface *,
              apple80211_version_data *
          )
          {
              return kIOReturnUnsupported;
          }

          IOReturn RTW88TahoeABICandidate::getCARD_CAPABILITIES(
              IO80211SkywalkInterface *,
              apple80211_capability_data *
          )
          {
              return kIOReturnUnsupported;
          }

          IOReturn RTW88TahoeABICandidate::getPOWER(
              IO80211SkywalkInterface *,
              apple80211_power_data *
          )
          {
              return kIOReturnUnsupported;
          }

          IOReturn RTW88TahoeABICandidate::setPOWER(
              IO80211SkywalkInterface *,
              apple80211_power_data *
          )
          {
              return kIOReturnUnsupported;
          }

          IOReturn RTW88TahoeABICandidate::getCOUNTRY_CODE(
              IO80211SkywalkInterface *,
              apple80211_country_code_data *
          )
          {
              return kIOReturnUnsupported;
          }

          IOReturn RTW88TahoeABICandidate::setCOUNTRY_CODE(
              IO80211SkywalkInterface *,
              apple80211_country_code_data *
          )
          {
              return kIOReturnUnsupported;
          }

          IOReturn RTW88TahoeABICandidate::setGET_DEBUG_INFO(
              IO80211SkywalkInterface *,
              apple80211_debug_command *
          )
          {
              return kIOReturnUnsupported;
          }
          EOF

          cat > probe/src/kmod_info.c <<'EOF'
          #include <mach/mach_types.h>
          #include <mach/kmod.h>

          extern kern_return_t _start(kmod_info_t *, void *);
          extern kern_return_t _stop(kmod_info_t *, void *);

          KMOD_EXPLICIT_DECL(
              com.rtw88.tahoe.abi.probe,
              "9.0.3c",
              _start,
              _stop
          )

          static kern_return_t probe_start(kmod_info_t *ki, void *data)
          {
              (void)ki;
              (void)data;
              return KERN_SUCCESS;
          }

          static kern_return_t probe_stop(kmod_info_t *ki, void *data)
          {
              (void)ki;
              (void)data;
              return KERN_SUCCESS;
          }

          kmod_start_func_t *_realmain = probe_start;
          kmod_stop_func_t  *_antimain = probe_stop;
          EOF

      - name: Create no-match Info.plist
        shell: bash
        run: |
          set -eu

          cat > probe/RTW88TahoeABIProbe.kext/Contents/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>English</string>
              <key>CFBundleExecutable</key>
              <string>RTW88TahoeABIProbe</string>
              <key>CFBundleIdentifier</key>
              <string>com.rtw88.tahoe.abi.probe</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>RTW88 Tahoe ABI Probe</string>
              <key>CFBundlePackageType</key>
              <string>KEXT</string>
              <key>CFBundleShortVersionString</key>
              <string>9.0.3c</string>
              <key>CFBundleVersion</key>
              <string>9.0.3c</string>
              <key>OSBundleCompatibleVersion</key>
              <string>9.0.3c</string>
              <key>OSBundleLibraries</key>
              <dict>
                  <key>com.apple.iokit.IO80211Family</key>
                  <string>1.0.0</string>
                  <key>com.apple.iokit.IOPCIFamily</key>
                  <string>1.0.0</string>
                  <key>com.apple.iokit.IONetworkingFamily</key>
                  <string>1.0.0</string>
                  <key>com.apple.kpi.bsd</key>
                  <string>8.0.0</string>
                  <key>com.apple.kpi.iokit</key>
                  <string>8.0.0</string>
                  <key>com.apple.kpi.libkern</key>
                  <string>8.0.0</string>
                  <key>com.apple.kpi.mach</key>
                  <string>8.0.0</string>
              </dict>
          </dict>
          </plist>
          EOF

          plutil -lint probe/RTW88TahoeABIProbe.kext/Contents/Info.plist

          echo
          echo "IMPORTANT:"
          echo "This plist intentionally contains NO IOKitPersonalities."
          echo "The probe cannot match the RTL8821CE hardware."

      - name: Verify compiler is really using IO80211 V2
        shell: bash
        run: |
          set -eu

          PROJ="${GITHUB_WORKSPACE}"
          SDK="$(xcrun --show-sdk-path)"
          MKSDK="${PROJ}/Feixiao/MacKernelSDK"
          AIRPORT="${PROJ}/itlwm/include/Airport"

          xcrun clang++ \
            -dM -E \
            -x c++ /dev/null \
            -arch x86_64 \
            -mmacosx-version-min=11.0 \
            -isysroot "${SDK}" \
            -I"${PROJ}/probe/src" \
            -I"${AIRPORT}" \
            -I"${PROJ}/itlwm/include" \
            -I"${MKSDK}/Headers" \
            -I"${SDK}/System/Library/Frameworks/Kernel.framework/Headers" \
            -DKERNEL \
            -D__IO80211_TARGET=__MAC_11_0 \
            -DIO80211FAMILY_V2=1 \
            > "${RUNNER_TEMP}/v903c-macros.txt"

          grep -q '^#define IO80211FAMILY_V2 1$' "${RUNNER_TEMP}/v903c-macros.txt"

          echo "IO80211FAMILY_V2 is active: OK"

          echo
          echo "Apple80211.h V2 branch:"
          grep -n -A8 -B2 'IO80211FAMILY_V2' itlwm/include/Airport/Apple80211.h

      - name: Verify candidate class is concrete
        shell: bash
        run: |
          set -eu

          PROJ="${GITHUB_WORKSPACE}"
          SDK="$(xcrun --show-sdk-path)"
          MKSDK="${PROJ}/Feixiao/MacKernelSDK"
          AIRPORT="${PROJ}/itlwm/include/Airport"

          cat > /tmp/v903-concrete.cpp <<'EOF'
          #include "RTW88TahoeABICandidate.hpp"

          static_assert(
              !__is_abstract(RTW88TahoeABICandidate),
              "V2 ABI candidate is still abstract"
          );
          EOF

          xcrun clang++             -fsyntax-only             /tmp/v903-concrete.cpp             -fno-exceptions             -fno-rtti             -fno-stack-protector             -mkernel             -arch x86_64             -mmacosx-version-min=11.0             -isysroot "${SDK}"             -I"${PROJ}/probe/src"             -I"${AIRPORT}"             -I"${PROJ}/itlwm/include"             -I"${MKSDK}/Headers"             -I"${SDK}/System/Library/Frameworks/Kernel.framework/Headers"             -fapple-kext             -std=c++17             -DKERNEL             -D__IO80211_TARGET=__MAC_11_0             -DIO80211FAMILY_V2=1             -Wno-deprecated-declarations             -Wno-nullability-completeness

          echo "RTW88TahoeABICandidate is concrete: OK"

      - name: Compile standalone V2 ABI probe
        shell: bash
        run: |
          set -eu

          PROJ="${GITHUB_WORKSPACE}"
          SDK="$(xcrun --show-sdk-path)"
          MKSDK="${PROJ}/Feixiao/MacKernelSDK"
          AIRPORT="${PROJ}/itlwm/include/Airport"

          mkdir -p probe/build

          xcrun clang++             -c probe/src/RTW88TahoeABICandidate.cpp             -o probe/build/RTW88TahoeABICandidate.o             -fno-exceptions             -fno-rtti             -fno-stack-protector             -mkernel             -arch x86_64             -mmacosx-version-min=11.0             -isysroot "${SDK}"             -I"${PROJ}/probe/src"             -I"${AIRPORT}"             -I"${PROJ}/itlwm/include"             -I"${MKSDK}/Headers"             -I"${SDK}/System/Library/Frameworks/Kernel.framework/Headers"             -fapple-kext             -std=c++17             -DKERNEL             -D__IO80211_TARGET=__MAC_11_0             -DIO80211FAMILY_V2=1             -Wno-deprecated-declarations             -Wno-nullability-completeness

          xcrun clang             -c probe/src/kmod_info.c             -o probe/build/kmod_info.o             -fno-stack-protector             -mkernel             -arch x86_64             -mmacosx-version-min=11.0             -isysroot "${SDK}"             -I"${MKSDK}/Headers"             -I"${SDK}/System/Library/Frameworks/Kernel.framework/Headers"

          echo
          echo "Objects:"
          file probe/build/*.o

      - name: Link standalone no-match probe kext
        shell: bash
        run: |
          set -eu

          SDK="$(xcrun --show-sdk-path)"
          MKSDK="${GITHUB_WORKSPACE}/Feixiao/MacKernelSDK"
          BIN="probe/RTW88TahoeABIProbe.kext/Contents/MacOS/RTW88TahoeABIProbe"

          xcrun clang++             -arch x86_64             -static             -nostdlib             -Xlinker -kext             "${MKSDK}/Library/x86_64/libkmod.a"             "${MKSDK}/Library/universal/libkmodc++.a"             -F"${SDK}/System/Library/Frameworks"             -o "${BIN}"             probe/build/kmod_info.o             probe/build/RTW88TahoeABICandidate.o

          test -s "${BIN}"
          file "${BIN}"
          dwarfdump --uuid "${BIN}"

      - name: Validate probe contains no hardware personality
        shell: bash
        run: |
          set -eu

          PLIST="probe/RTW88TahoeABIProbe.kext/Contents/Info.plist"

          if /usr/libexec/PlistBuddy -c "Print :IOKitPersonalities" "${PLIST}" >/dev/null 2>&1
          then
            echo "ERROR: probe unexpectedly has IOKitPersonalities"
            exit 1
          fi

          if grep -q 'C82110EC' "${PLIST}"; then
            echo "ERROR: RTL8821CE PCI ID present in probe"
            exit 1
          fi

          echo "No hardware personality: OK"

      - name: Create local validation script
        shell: bash
        run: |
          set -eu

          cat > probe/test-v903c-on-tahoe.sh <<'EOF'
          #!/bin/bash
          set -u

          KEXT="${1:-./RTW88TahoeABIProbe.kext}"

          echo "============================================================"
          echo "RTW88 v9.0.3c TAHOE V2 ABI VALIDATION"
          echo "============================================================"
          echo
          echo "THIS PROBE HAS NO HARDWARE PERSONALITY."
          echo "IT MUST NOT ATTACH TO THE RTL8821CE."
          echo

          if [ ! -d "${KEXT}" ]; then
              echo "Kext not found: ${KEXT}"
              exit 2
          fi

          echo "[1] Ownership / permissions"
          sudo chown -R 0:0 "${KEXT}"
          sudo find "${KEXT}" -type d -exec chmod 755 {} \;
          sudo find "${KEXT}" -type f -exec chmod 644 {} \;
          sudo chmod 755 "${KEXT}/Contents/MacOS/RTW88TahoeABIProbe"

          echo
          echo "[2] Validation"
          sudo kmutil load -p "${KEXT}"
          RC=$?

          echo
          echo "kmutil return code: ${RC}"

          if [ "${RC}" -eq 0 ]; then
              echo
              echo "V2 ABI CANDIDATE PASSED KERNEL VTABLE VALIDATION."
              kmutil showloaded 2>/dev/null                 | grep -Ei 'rtw88.tahoe.abi.probe|IO80211'                 || true
          else
              echo
              echo "V2 ABI candidate did NOT pass validation."
              echo "Send the complete kmutil error."
          fi

          exit "${RC}"
          EOF

          chmod +x probe/test-v903c-on-tahoe.sh

      - name: Create README
        shell: bash
        run: |
          set -eu

          cat > probe/LEIA-ME-v9.0.3c.txt <<'EOF'
          RTW88 v9.0.3c Tahoe V2 ABI Candidate Probe

          NAO COLOQUE ESTA KEXT NA EFI.

          Esta Kext nao possui IOKitPersonalities nem o PCI ID da RTL8821CE.
          Ela serve somente para o kmutil validar se a vtable gerada com
          IO80211ControllerV2 e aceita pelo IO80211Controller do Tahoe.

          A v9.0.1d falhou com:
          IO80211Controller = 463 entries
          RTW88PCIDevice    = 457 entries

          Teste:
          ./test-v903c-on-tahoe.sh ./RTW88TahoeABIProbe.kext

          Se houver "Malformed vtable", envie o erro completo.
          Se carregar, NAO coloque na EFI; isso apenas confirma a ABI V2.
          EOF

      - name: Package artifact
        shell: bash
        run: |
          set -eu

          OUT="${RUNNER_TEMP}/${BUILD_NAME}"
          rm -rf "${OUT}"
          mkdir -p "${OUT}"

          cp -R probe/RTW88TahoeABIProbe.kext "${OUT}/"
          cp probe/test-v903c-on-tahoe.sh probe/LEIA-ME-v9.0.3c.txt "${OUT}/"

          cd "${OUT}"
          shasum -a 256             RTW88TahoeABIProbe.kext/Contents/MacOS/RTW88TahoeABIProbe             RTW88TahoeABIProbe.kext/Contents/Info.plist             test-v903c-on-tahoe.sh             > SHA256SUMS.txt

      - name: Zip artifact
        shell: bash
        run: |
          set -eu
          cd "${RUNNER_TEMP}"
          zip -r "${BUILD_NAME}.zip" "${BUILD_NAME}"
          ls -lh "${BUILD_NAME}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RTW88-v9.0.3c-Tahoe-V2-ABI-Candidate
          path: ${{ runner.temp }}/RTW88-v9.0.3c-Tahoe-V2-ABI-Candidate.zip
          if-no-files-found: error
          retention-days: 7
