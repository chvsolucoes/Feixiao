name: RTW88 v9.0.10 IO80211 V2 PCI Wrapper Foundation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RTL8821CE IO80211ControllerV2 wrapper foundation
    runs-on: macos-26

    env:
      FEIXIAO_REF: e963f43188382eced4ef2fa75d19ce4db2315c68
      RTW88_REF: d029a677c49266fad86750714eb5612becd134d3
      ITLWM_REF: 53c51c2cdd6e4b69beb91f310d74c53422b0f8bd
      BUILD_NAME: RTW88-v9.0.10-IO80211V2-PCI-Wrapper-Foundation

    steps:
      - name: Checkout Feixiao stable
        uses: actions/checkout@v4
        with:
          repository: thegwchr/Feixiao
          ref: ${{ env.FEIXIAO_REF }}
          path: Feixiao
          fetch-depth: 1
          submodules: recursive

      - name: Checkout rtw88-stable
        uses: actions/checkout@v4
        with:
          repository: thegwchr/rtw88-stable
          ref: ${{ env.RTW88_REF }}
          path: rtw88-stable
          fetch-depth: 1

      - name: Checkout AirportItlwm V2 headers
        uses: actions/checkout@v4
        with:
          repository: OpenIntelWireless/itlwm
          ref: ${{ env.ITLWM_REF }}
          path: itlwm
          fetch-depth: 1

      - name: Verify pinned revisions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C Feixiao rev-parse HEAD)" = "${FEIXIAO_REF}"
          test "$(git -C rtw88-stable rev-parse HEAD)" = "${RTW88_REF}"
          test "$(git -C itlwm rev-parse HEAD)" = "${ITLWM_REF}"

      - name: Create RTW88 PCI wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd Feixiao

          cat > src/kext/RTW88PCIWrapper.hpp <<'EOF'
          #pragma once

          #include "Apple80211.h"
          #include <IOKit/IOService.h>
          #include <IOKit/pci/IOPCIDevice.h>

          class RTW88PCIWrapper : public IOService {
              OSDeclareDefaultStructors(RTW88PCIWrapper)

          public:
              IOService *probe(IOService *provider, SInt32 *score) override;
              bool start(IOService *provider) override;
              void stop(IOService *provider) override;

              IOPCIDevice *pciDevice() const { return _pci; }
              IO80211WorkQueue *wifiWorkQueue() const { return _wifiWorkQueue; }

          private:
              IOPCIDevice *_pci = nullptr;
              IO80211WorkQueue *_wifiWorkQueue = nullptr;
          };
          EOF

          cat > src/kext/RTW88PCIWrapper.cpp <<'EOF'
          #include "RTW88PCIWrapper.hpp"
          #include <IOKit/IOLib.h>

          #define super IOService
          OSDefineMetaClassAndStructors(RTW88PCIWrapper, IOService)

          IOService *RTW88PCIWrapper::probe(IOService *provider, SInt32 *score)
          {
              IOLog("rtw88: RTW88PCIWrapper::probe provider=%p\n", provider);

              IOPCIDevice *pci = OSDynamicCast(IOPCIDevice, provider);
              if (!pci) {
                  IOLog("rtw88: wrapper probe: provider is not IOPCIDevice\n");
                  return nullptr;
              }

              UInt16 vendor = pci->configRead16(0x00);
              UInt16 device = pci->configRead16(0x02);
              IOLog("rtw88: wrapper probe PCI %04x:%04x\n", vendor, device);

              if (vendor != 0x10EC || device != 0xC821) {
                  IOLog("rtw88: wrapper probe: not RTL8821CE\n");
                  return nullptr;
              }

              return super::probe(provider, score);
          }

          bool RTW88PCIWrapper::start(IOService *provider)
          {
              IOLog("rtw88: RTW88PCIWrapper::start\n");

              _pci = OSDynamicCast(IOPCIDevice, provider);
              if (!_pci)
                  return false;

              _pci->retain();

              /* AirportItlwm V2 creates this before IO80211Controller::start. */
              _wifiWorkQueue = IO80211WorkQueue::workQueue();
              if (!_wifiWorkQueue) {
                  IOLog("rtw88: wrapper: IO80211WorkQueue creation failed\n");
                  _pci->release();
                  _pci = nullptr;
                  return false;
              }

              if (!super::start(provider)) {
                  IOLog("rtw88: wrapper: IOService::start failed\n");
                  _wifiWorkQueue->release();
                  _wifiWorkQueue = nullptr;
                  _pci->release();
                  _pci = nullptr;
                  return false;
              }

              UInt8 builtIn = 0;
              OSData *data = OSData::withBytes(&builtIn, sizeof(builtIn));
              if (data) {
                  setProperty("built-in", data);
                  data->release();
              }

              PMinit();
              provider->joinPMtree(this);

              IOLog("rtw88: wrapper started; publishing child provider\n");
              registerService();
              return true;
          }

          void RTW88PCIWrapper::stop(IOService *provider)
          {
              IOLog("rtw88: RTW88PCIWrapper::stop\n");

              PMstop();

              if (_wifiWorkQueue) {
                  _wifiWorkQueue->release();
                  _wifiWorkQueue = nullptr;
              }

              if (_pci) {
                  _pci->release();
                  _pci = nullptr;
              }

              super::stop(provider);
          }
          EOF

      - name: Convert RTW88PCIDevice to V2 controller behind wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd Feixiao

          H="src/kext/RTW88PCIDevice.hpp"
          C="src/kext/RTW88PCIDevice.cpp"

          cp "${H}" "${H}.stable"
          cp "${C}" "${C}.stable"

          perl -0pi -e 's@#include <IOKit/network/IOEthernetController\.h>@#include "Apple80211.h"\n#include "RTW88PCIWrapper.hpp"\n#include <IOKit/network/IOEthernetController.h>@' "${H}"
          perl -0pi -e 's@class RTW88PCIDevice : public IOEthernetController@class RTW88PCIDevice : public IO80211Controller@' "${H}"

          perl -0pi -e 's@(\s*/\* IOUserClient creation \*/)@    /* IO80211ControllerV2 ABI foundation */\n    bool isCommandProhibited(int) override;\n    SInt32 handleCardSpecific(IO80211SkywalkInterface *, unsigned long, void *, bool) override;\n    SInt32 enableFeature(IO80211FeatureCode, void *) override;\n    IOReturn getDRIVER_VERSION(IO80211SkywalkInterface *, apple80211_version_data *) override;\n    IOReturn getHARDWARE_VERSION(IO80211SkywalkInterface *, apple80211_version_data *) override;\n    IOReturn getCARD_CAPABILITIES(IO80211SkywalkInterface *, apple80211_capability_data *) override;\n    IOReturn getPOWER(IO80211SkywalkInterface *, apple80211_power_data *) override;\n    IOReturn setPOWER(IO80211SkywalkInterface *, apple80211_power_data *) override;\n    IOReturn getCOUNTRY_CODE(IO80211SkywalkInterface *, apple80211_country_code_data *) override;\n    IOReturn setCOUNTRY_CODE(IO80211SkywalkInterface *, apple80211_country_code_data *) override;\n    IOReturn setGET_DEBUG_INFO(IO80211SkywalkInterface *, apple80211_debug_command *) override;\n    void postMessage(UInt, void *, unsigned long, UInt, void *) override;\n    bool createWorkQueue() override;\n    IO80211WorkQueue *getWorkQueue() override;\n\n$1@' "${H}"

          perl -0pi -e 's@(IOPCIDevice\s+\*_pciDev\s+= nullptr;)@$1\n    RTW88PCIWrapper       *_pciWrapper   = nullptr;@' "${H}"

          perl -0pi -e 's@#define super IOEthernetController\nOSDefineMetaClassAndStructors\(RTW88PCIDevice, IOEthernetController\)@#define super IO80211Controller\nOSDefineMetaClassAndStructors(RTW88PCIDevice, IO80211Controller)@' "${C}"

          perl -0pi -e 's@bool RTW88PCIDevice::start\(IOService \*provider\)\n\{\n    IOLog\("rtw88: RTW88PCIDevice::start\\n"\);\n    if \(!super::start\(provider\)\) return false;\n\n    _pciDev = OSDynamicCast\(IOPCIDevice, provider\);\n    if \(!_pciDev\) \{\n        IOLog\("rtw88: provider is not IOPCIDevice\\n"\);\n        return false;\n    \}\n    _pciDev->retain\(\);@bool RTW88PCIDevice::start(IOService *provider)\n{\n    IOLog("rtw88: RTW88PCIDevice::start ENTER provider=%p\\n", provider);\n\n    _pciWrapper = OSDynamicCast(RTW88PCIWrapper, provider);\n    if (!_pciWrapper) {\n        IOLog("rtw88: provider is not RTW88PCIWrapper\\n");\n        return false;\n    }\n    _pciWrapper->retain();\n\n    _pciDev = _pciWrapper->pciDevice();\n    if (!_pciDev) {\n        IOLog("rtw88: wrapper has no IOPCIDevice\\n");\n        return false;\n    }\n    _pciDev->retain();\n\n    UInt8 builtIn = 0;\n    OSData *builtInData = OSData::withBytes(&builtIn, sizeof(builtIn));\n    if (builtInData) {\n        setProperty("built-in", builtInData);\n        builtInData->release();\n    }\n    setProperty("DriverKitDriver", kOSBooleanFalse);\n\n    IOLog("rtw88: v9.0.10 calling IO80211Controller::start via wrapper\\n");\n    bool superStarted = super::start(provider);\n    IOLog("rtw88: v9.0.10 IO80211Controller::start returned %d\\n", superStarted ? 1 : 0);\n    if (!superStarted) {\n        IOLog("rtw88: v9.0.10 STOP: super-start still failed\\n");\n        return false;\n    }\n    IOLog("rtw88: v9.0.10 super-start passed; entering stable PCI path\\n");@s' "${C}"

          grep -F 'v9.0.10 calling IO80211Controller::start via wrapper' "${C}" >/dev/null

          perl -0pi -e 's@if \(!attachInterface\(\(IONetworkInterface \*\*\)&_iface\)\)@if (!IOEthernetController::attachInterface((IONetworkInterface **)&_iface))@' "${C}"
          perl -0pi -e 's@detachInterface\(_iface\);@IOEthernetController::detachInterface(_iface);@' "${C}"

          perl -0pi -e 's@    if \(_pciDev\)   \{ _pciDev->release\(\);     _pciDev = nullptr; \}@    if (_pciDev)   { _pciDev->release();     _pciDev = nullptr; }\n    if (_pciWrapper) { _pciWrapper->release(); _pciWrapper = nullptr; }@' "${C}"

          cat >> "${C}" <<'EOF'

          bool RTW88PCIDevice::isCommandProhibited(int) { return false; }

          SInt32 RTW88PCIDevice::handleCardSpecific(
              IO80211SkywalkInterface *, unsigned long, void *, bool)
          {
              return kIOReturnUnsupported;
          }

          SInt32 RTW88PCIDevice::enableFeature(IO80211FeatureCode, void *)
          {
              return kIOReturnSuccess;
          }

          IOReturn RTW88PCIDevice::getDRIVER_VERSION(
              IO80211SkywalkInterface *, apple80211_version_data *)
          { return kIOReturnUnsupported; }

          IOReturn RTW88PCIDevice::getHARDWARE_VERSION(
              IO80211SkywalkInterface *, apple80211_version_data *)
          { return kIOReturnUnsupported; }

          IOReturn RTW88PCIDevice::getCARD_CAPABILITIES(
              IO80211SkywalkInterface *, apple80211_capability_data *)
          { return kIOReturnUnsupported; }

          IOReturn RTW88PCIDevice::getPOWER(
              IO80211SkywalkInterface *, apple80211_power_data *)
          { return kIOReturnUnsupported; }

          IOReturn RTW88PCIDevice::setPOWER(
              IO80211SkywalkInterface *, apple80211_power_data *)
          { return kIOReturnUnsupported; }

          IOReturn RTW88PCIDevice::getCOUNTRY_CODE(
              IO80211SkywalkInterface *, apple80211_country_code_data *)
          { return kIOReturnUnsupported; }

          IOReturn RTW88PCIDevice::setCOUNTRY_CODE(
              IO80211SkywalkInterface *, apple80211_country_code_data *)
          { return kIOReturnUnsupported; }

          IOReturn RTW88PCIDevice::setGET_DEBUG_INFO(
              IO80211SkywalkInterface *, apple80211_debug_command *)
          { return kIOReturnUnsupported; }

          void RTW88PCIDevice::postMessage(
              UInt, void *, unsigned long, UInt, void *)
          {
          }

          bool RTW88PCIDevice::createWorkQueue()
          {
              IOLog("rtw88: RTW88PCIDevice::createWorkQueue\n");
              return getWorkQueue() != nullptr;
          }

          IO80211WorkQueue *RTW88PCIDevice::getWorkQueue()
          {
              return _pciWrapper ? _pciWrapper->wifiWorkQueue() : nullptr;
          }
          EOF

      - name: Patch Makefile for V2 and wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd Feixiao

          cp Makefile Makefile.stable

          awk '
            BEGIN { in_cxx=0; inc=0; defs=0; wrapper=0 }

            /^KEXT_CXXFLAGS :=/ { in_cxx=1; print; next }

            in_cxx && /^[[:space:]]+\$\(KEXT_FLAGS\)[[:space:]]*\\/ {
              print
              if (!inc) {
                print "    -I$(PROJ_ROOT)/../itlwm/include/Airport \\"
                print "    -I$(PROJ_ROOT)/../itlwm/include \\"
                inc=1
              }
              next
            }

            in_cxx && /^[[:space:]]+-DKERNEL[[:space:]]*\\/ {
              print
              if (!defs) {
                print "    -DIO80211FAMILY_V2=1 \\"
                print "    -D__IO80211_TARGET=__MAC_11_0 \\"
                defs=1
              }
              next
            }

            /\$\(KEXT_SRC\)\/RTW88PCIDevice\.cpp/ {
              print
              if (!wrapper) {
                print "    $(KEXT_SRC)/RTW88PCIWrapper.cpp \\"
                wrapper=1
              }
              next
            }

            in_cxx && /^[^[:space:]]/ && $0 !~ /^KEXT_CXXFLAGS :=/ { in_cxx=0 }
            { print }

            END {
              if (!inc || !defs || !wrapper) exit 44
            }
          ' Makefile > Makefile.new

          mv Makefile.new Makefile

          grep -F '$(KEXT_SRC)/RTW88PCIWrapper.cpp' Makefile >/dev/null
          grep -F -- '-DIO80211FAMILY_V2=1' Makefile >/dev/null
          grep -F '$(PROJ_ROOT)/../itlwm/include/Airport' Makefile >/dev/null

      - name: Patch Info.plist wrapper topology
        shell: bash
        run: |
          set -euo pipefail
          cd Feixiao

          P="rtw88.kext/Contents/Info.plist"
          cp "${P}" "${P}.stable"

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 9.0.10" "${P}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 9.0.10" "${P}"
          /usr/libexec/PlistBuddy -c "Set :OSBundleCompatibleVersion 9.0.10" "${P}"

          if /usr/libexec/PlistBuddy -c "Print :OSBundleLibraries:com.apple.iokit.IO80211Family" "${P}" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Set :OSBundleLibraries:com.apple.iokit.IO80211Family 1.0.0" "${P}"
          else
            /usr/libexec/PlistBuddy -c "Add :OSBundleLibraries:com.apple.iokit.IO80211Family string 1.0.0" "${P}"
          fi

          /usr/libexec/PlistBuddy -c "Set :IOKitPersonalities:RTL8821CE:IOClass RTW88PCIWrapper" "${P}"
          /usr/libexec/PlistBuddy -c "Set :IOKitPersonalities:RTL8821CE:IOProviderClass IOPCIDevice" "${P}"
          /usr/libexec/PlistBuddy -c "Set :IOKitPersonalities:RTL8821CE:IOProbeScore 70000" "${P}"

          /usr/libexec/PlistBuddy -c "Add :IOKitPersonalities:RTL8821CEController dict" "${P}"
          /usr/libexec/PlistBuddy -c "Add :IOKitPersonalities:RTL8821CEController:CFBundleIdentifier string com.rtw88.driver" "${P}"
          /usr/libexec/PlistBuddy -c "Add :IOKitPersonalities:RTL8821CEController:IOClass string RTW88PCIDevice" "${P}"
          /usr/libexec/PlistBuddy -c "Add :IOKitPersonalities:RTL8821CEController:IOProviderClass string RTW88PCIWrapper" "${P}"
          /usr/libexec/PlistBuddy -c "Add :IOKitPersonalities:RTL8821CEController:IOProbeScore integer 70000" "${P}"
          /usr/libexec/PlistBuddy -c "Add :IOKitPersonalities:RTL8821CEController:IOMatchCategory string WiFiDriver" "${P}"
          /usr/libexec/PlistBuddy -c "Add :IOKitPersonalities:RTL8821CEController:IONetworkRootType string airport" "${P}"

          plutil -lint "${P}"

      - name: Verify stable datapath unchanged
        shell: bash
        run: |
          set -euo pipefail
          cd Feixiao

          grep -q 'kRTW88TxStallAvail = 96' src/kext/RTW88PCIDevice.cpp
          grep -q 'kRTW88TxResumeAvail = 160' src/kext/RTW88PCIDevice.cpp
          git diff --exit-code "${FEIXIAO_REF}" -- src/kext/RTW88IEEE80211.cpp src/kext/RTW88IEEE80211.hpp

      - name: Build real wrapper Kext and rtw88ctl
        shell: bash
        run: |
          set -euo pipefail
          cd Feixiao

          make clean
          LOG="${RUNNER_TEMP}/rtw88-v9010-build.log"

          set +e
          make -j1 all 2>&1 | tee "${LOG}"
          RC=${PIPESTATUS[0]}
          set -e

          if [ "${RC}" -ne 0 ]; then
            echo
            echo "FIRST COMPILER ERRORS"
            grep -n -E '(^|: )[Ff]atal error:|(^|: )error:' "${LOG}" | head -150 || true
            exit "${RC}"
          fi

          test -f build/out/rtw88.kext/Contents/MacOS/rtw88
          test -f build/out/rtw88ctl
          plutil -lint build/out/rtw88.kext/Contents/Info.plist

      - name: Verify wrapper and V2 symbols
        shell: bash
        run: |
          set -euo pipefail
          cd Feixiao

          BIN="build/out/rtw88.kext/Contents/MacOS/rtw88"
          DEM="${RUNNER_TEMP}/v9010-nm.txt"

          nm "${BIN}" | c++filt > "${DEM}"

          grep -F "RTW88PCIWrapper::start(" "${DEM}" >/dev/null
          grep -F "RTW88PCIDevice::getWorkQueue(" "${DEM}" >/dev/null
          grep -F "RTW88PCIDevice::postMessage(" "${DEM}" >/dev/null

          if grep -E '^[[:space:]]*U[[:space:]]+IO80211Controller::postMessage\(' "${DEM}" >/dev/null; then
            echo "ERROR: unresolved base postMessage"
            exit 1
          fi

      - name: Validate wrapper personalities
        shell: bash
        run: |
          set -euo pipefail
          cd Feixiao

          P="build/out/rtw88.kext/Contents/Info.plist"

          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${P}")" = "9.0.10"
          test "$(/usr/libexec/PlistBuddy -c 'Print :IOKitPersonalities:RTL8821CE:IOPCIMatch' "${P}")" = "0xC82110EC"
          test "$(/usr/libexec/PlistBuddy -c 'Print :IOKitPersonalities:RTL8821CE:IOClass' "${P}")" = "RTW88PCIWrapper"
          test "$(/usr/libexec/PlistBuddy -c 'Print :IOKitPersonalities:RTL8821CEController:IOClass' "${P}")" = "RTW88PCIDevice"
          test "$(/usr/libexec/PlistBuddy -c 'Print :IOKitPersonalities:RTL8821CEController:IOProviderClass' "${P}")" = "RTW88PCIWrapper"

      - name: Create Tahoe wrapper test script
        shell: bash
        run: |
          set -euo pipefail
          cd Feixiao

          cat > build/out/test-v9010-load-on-tahoe.sh <<'EOF'
          #!/bin/bash
          set -u

          KEXT="${1:-./rtw88.kext}"
          CTL="${2:-./rtw88ctl}"
          LOG="${HOME}/rtw88-v9010-load-test.txt"

          echo "============================================================"
          echo "RTW88 v9.0.10 REAL KEXT - PCI WRAPPER FOUNDATION TEST"
          echo "============================================================"
          echo
          echo "Do NOT put this Kext in EFI for the first test."
          echo

          if [ ! -d "${KEXT}" ]; then
            echo "Kext not found: ${KEXT}"
            exit 2
          fi

          echo "[0] Existing state"
          kmutil showloaded | grep -Ei 'com\.rtw88\.driver|IO80211Family' || true

          if kmutil showloaded | grep -q 'com\.rtw88\.driver'; then
            echo "Another com.rtw88.driver is already loaded."
            echo "Boot without the older RTW88 Kext before testing."
            exit 3
          fi

          echo
          echo "[1] Ownership / permissions"
          sudo chown -R 0:0 "${KEXT}"
          sudo chmod -R 755 "${KEXT}"

          echo
          echo "[2] kmutil load"
          set +e
          sudo kmutil load -p "${KEXT}" 2>&1 | tee "${LOG}"
          RC=${PIPESTATUS[0]}
          set -e

          echo
          echo "kmutil return code: ${RC}"
          echo "full log: ${LOG}"

          if [ "${RC}" -ne 0 ]; then
            echo "LOAD FAILED. Do not put v9.0.10 in EFI."
            exit "${RC}"
          fi

          echo
          echo "[3] Loaded state"
          kmutil showloaded | grep -Ei 'com\.rtw88\.driver|IO80211Family' || true

          echo
          echo "[4] Wrapper/controller attachment"
          ioreg -p IOService -l -w0 | \
            grep -B20 -A120 -Ei 'RTW88PCIWrapper|RTW88PCIDevice|pci10ec,c821|rtw8821c' || true

          echo
          echo "[5] rtw88ctl visibility"
          if [ -x "${CTL}" ]; then
            "${CTL}" status || true
          fi

          echo
          echo "v9.0.10 WRAPPER FOUNDATION TEST FINISHED."
          EOF

          chmod +x build/out/test-v9010-load-on-tahoe.sh

      - name: Create README
        shell: bash
        run: |
          set -euo pipefail
          cd Feixiao

          cat > build/out/LEIA-ME-v9.0.10.txt <<'EOF'
          RTW88 v9.0.10 — IO80211 V2 PCI WRAPPER FOUNDATION

          A v9.0.9 provou que IO80211Controller::start(provider) retorna 0
          quando o controller recebe diretamente o IOPCIDevice.

          Esta build testa a topologia usada pelo AirportItlwm V2:

            IOPCIDevice 10EC:C821
                    |
                    v
            RTW88PCIWrapper : IOService
                    |
                    v
            RTW88PCIDevice : IO80211Controller

          O wrapper:
          - casa somente com 10EC:C821;
          - mantém o IOPCIDevice real;
          - cria IO80211WorkQueue antes do controller;
          - publica o child provider.

          O controller:
          - recebe RTW88PCIWrapper;
          - usa a work queue do wrapper;
          - chama IO80211Controller::start(wrapper);
          - depois continua pelo PCI real para BAR2/DMA/IRQ/firmware.

          RX/TX, RTW88IEEE80211, DMA bounce e thresholds 96/160 permanecem
          sem alterações intencionais.

          NÃO COLOQUE NA EFI NO PRIMEIRO TESTE.

          Teste:
            chmod +x ./test-v9010-load-on-tahoe.sh
            ./test-v9010-load-on-tahoe.sh ./rtw88.kext ./rtw88ctl

          Depois:
            log show --last 10m --style compact | grep -i 'rtw88:' | tail -160

          Resultado que queremos:
            RTW88PCIWrapper::probe
            wrapper probe PCI 10ec:c821
            RTW88PCIWrapper::start
            wrapper started
            RTW88PCIDevice::start ENTER
            v9.0.10 IO80211Controller::start returned 1

          Se passar do super-start, esperamos também:
            BAR2 mapped ...
            PCI device 10ec:c821
          EOF

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          cd Feixiao

          OUT="${GITHUB_WORKSPACE}/${BUILD_NAME}"
          rm -rf "${OUT}"
          mkdir -p "${OUT}"

          cp -R build/out/rtw88.kext "${OUT}/"
          cp build/out/rtw88ctl "${OUT}/"
          cp build/out/test-v9010-load-on-tahoe.sh "${OUT}/"
          cp build/out/LEIA-ME-v9.0.10.txt "${OUT}/"
          cp src/kext/RTW88PCIWrapper.hpp "${OUT}/"
          cp src/kext/RTW88PCIWrapper.cpp "${OUT}/"
          cp src/kext/RTW88PCIDevice.hpp "${OUT}/RTW88PCIDevice-v9.0.10.hpp"
          cp src/kext/RTW88PCIDevice.cpp "${OUT}/RTW88PCIDevice-v9.0.10.cpp"

          (
            cd "${OUT}"
            shasum -a 256 \
              rtw88.kext/Contents/MacOS/rtw88 \
              rtw88ctl \
              test-v9010-load-on-tahoe.sh \
              > SHA256SUMS.txt
          )

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}
          path: ${{ env.BUILD_NAME }}
          if-no-files-found: error
