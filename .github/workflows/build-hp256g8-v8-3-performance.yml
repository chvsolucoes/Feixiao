          Performance target:

          >100 Mbps download

          >100 Mbps upload


          This is a target, not a guarantee.


          FIRST RUNTIME CHECK
          =============================================

          sudo dmesg | grep -iE \
          "v8.3|connected chandef|SAFE RESYNC|SAFE MBUF|invalid RX|deauth|pci bus timeout|ADDBA|A-MPDU" \
          | tail -250


          Expected on 5 GHz:

          connected chandef: 80 MHz


          No continuous:

          SAFE RESYNC

          SAFE MBUF drop

          invalid RX

          pci bus timeout

          deauth


          IMPORTANT
          =============================================

          Keep v8.2 as known-stable backup.

          Always use rtw88.kext and rtw88ctl
          from the same artifact.

          EOF


          cd \
            "${{ runner.temp }}"


          zip \
            -r \
            Feixiao_HP256G8_v8_3_Performance.zip \
            Feixiao-HP256G8-v8.3-Performance


      # ============================================================
