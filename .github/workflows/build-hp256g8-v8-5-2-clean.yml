name: Build HP256G8 RTL8821CE v8.5.3 Clean Fixed

"on":
  workflow_dispatch:

permissions:
  contents: read

env:
  FEIXIAO_REF: e963f43188382eced4ef2fa75d19ce4db2315c68
  RTW88_REF: d029a677c49266fad86750714eb5612becd134d3
  BUILD_NAME: Feixiao-HP256G8-v8.5.3-Clean-Fixed

jobs:

  build:

    name: Build HP256G8 v8.5.3
    runs-on: macos-latest
    timeout-minutes: 30

    steps:

      # ================================================================
      # 01 - CHECKOUT FEIXIAO + MACKERNELSDK
      # ================================================================

      - name: Checkout Feixiao with MacKernelSDK
        uses: actions/checkout@v4
        with:
          repository: thegwchr/Feixiao
          ref: ${{ env.FEIXIAO_REF }}
          path: Feixiao
          fetch-depth: 1
          submodules: recursive


      # ================================================================
      # 02 - VALIDATE MACKERNELSDK
      # ================================================================

      - name: Validate MacKernelSDK submodule
        shell: bash
        run: |
          set -eu

          echo
          echo "============================================================"
          echo "MACKERNELSDK"
          echo "============================================================"
          echo

          if [ ! -d "Feixiao/MacKernelSDK" ]; then
            echo "ERROR: MacKernelSDK directory missing"
            exit 1
          fi

          if [ ! -d "Feixiao/MacKernelSDK/Headers" ]; then
            echo "ERROR: MacKernelSDK Headers missing"
            exit 1
          fi

          SDK_COMMIT="$(
            git -C Feixiao/MacKernelSDK rev-parse HEAD
          )"

          echo "MacKernelSDK commit:"
          echo "${SDK_COMMIT}"

          echo
          echo "MacKernelSDK: OK"


      # ================================================================
      # 03 - CLONE RTW88-STABLE
      # ================================================================

      - name: Clone matching rtw88-stable
        shell: bash
        run: |
          set -eu

          echo
          echo "============================================================"
          echo "RTW88-STABLE"
          echo "============================================================"
          echo

          git clone \
            https://github.com/thegwchr/rtw88-stable.git \
            rtw88-stable

          git \
            -C rtw88-stable \
            checkout \
            "${RTW88_REF}"

          echo
          echo "rtw88-stable commit:"

          git \
            -C rtw88-stable \
            rev-parse \
            HEAD


      # ================================================================
      # 04 - VALIDATE SOURCE REVISIONS
      # ================================================================

      - name: Validate exact source revisions
        shell: bash
        run: |
          set -eu

          FEIXIAO_ACTUAL="$(
            git -C Feixiao rev-parse HEAD
          )"

          RTW88_ACTUAL="$(
            git -C rtw88-stable rev-parse HEAD
          )"

          echo
          echo "============================================================"
          echo "SOURCE REVISIONS"
          echo "============================================================"
          echo

          echo "Feixiao expected:"
          echo "${FEIXIAO_REF}"

          echo
          echo "Feixiao actual:"
          echo "${FEIXIAO_ACTUAL}"

          echo
          echo "rtw88-stable expected:"
          echo "${RTW88_REF}"

          echo
          echo "rtw88-stable actual:"
          echo "${RTW88_ACTUAL}"

          if [ "${FEIXIAO_ACTUAL}" != "${FEIXIAO_REF}" ]; then
            echo
            echo "ERROR: Feixiao revision mismatch"
            exit 1
          fi

          if [ "${RTW88_ACTUAL}" != "${RTW88_REF}" ]; then
            echo
            echo "ERROR: rtw88-stable revision mismatch"
            exit 1
          fi

          echo
          echo "Source revisions: OK"


      # ================================================================
      # 05 - VALIDATE SOURCE TREE
      # ================================================================

      - name: Validate source tree
        shell: bash
        run: |
          set -eu

          echo
          echo "============================================================"
          echo "SOURCE TREE"
          echo "============================================================"
          echo

          REQUIRED_FILES="
          Feixiao/Makefile
          Feixiao/scripts/gen_fw_blobs.py
          Feixiao/src/kext/RTW88IEEE80211.cpp
          Feixiao/src/kext/RTW88IEEE80211.hpp
          Feixiao/src/kext/RTW88PCIDevice.cpp
          Feixiao/src/kext/RTW88PCIDevice.hpp
          Feixiao/src/kext/RTW88UserClient.cpp
          Feixiao/src/kext/RTW88UserClient.hpp
          Feixiao/src/compat/rtw88_compat.c
          Feixiao/src/compat/rtw88_compat.h
          Feixiao/src/compat/rtw88_firmware.c
          rtw88-stable/drivers/net/wireless/realtek/rtw88/main.c
          rtw88-stable/drivers/net/wireless/realtek/rtw88/pci.c
          "

          for FILE in ${REQUIRED_FILES}
          do

            if [ ! -f "${FILE}" ]; then
              echo "ERROR: missing file:"
              echo "${FILE}"
              exit 1
            fi

            echo "[OK] ${FILE}"

          done

          echo
          echo "Source tree: OK"


      # ================================================================
      # 06 - VALIDATE RTL8821CE
      # ================================================================

      - name: Validate RTL8821CE support
        shell: bash
        run: |
          set -eu

          IEEE="Feixiao/src/kext/RTW88IEEE80211.cpp"
          PCI="Feixiao/src/kext/RTW88PCIDevice.cpp"

          echo
          echo "============================================================"
          echo "RTL8821CE"
          echo "============================================================"
          echo

          grep -q "rtw8821c_hw_spec" "${IEEE}"
          grep -q "0xC821" "${PCI}"
          grep -q "RTL8821CE" "${PCI}"

          echo "RTL8821CE PCI ID 10EC:C821: OK"
          echo "RTL8821C hardware support: OK"


      # ================================================================
      # 07 - VALIDATE CHANNEL WIDTH
      # ================================================================

      - name: Validate 20 40 80 MHz support
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          echo
          echo "============================================================"
          echo "CHANNEL WIDTH"
          echo "============================================================"
          echo

          grep -q "_connChanWidth = 20" "${FILE}"
          grep -q "_connChanWidth = 40" "${FILE}"
          grep -q "_connChanWidth = 80" "${FILE}"
          grep -q "NL80211_CHAN_WIDTH_40" "${FILE}"
          grep -q "NL80211_CHAN_WIDTH_80" "${FILE}"
          grep -q "chip80 && vhtWidth == 1 && vhtSeg0 != 0" "${FILE}"

          echo "20 MHz: OK"
          echo "40 MHz: OK"
          echo "80 MHz: OK"
          echo "VHT 80 MHz negotiation: OK"


      # ================================================================
      # 08 - VALIDATE A-MPDU
      # ================================================================

      - name: Validate A-MPDU support
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"
          HEADER="Feixiao/src/kext/RTW88IEEE80211.hpp"

          echo
          echo "============================================================"
          echo "A-MPDU"
          echo "============================================================"
          echo

          grep -q "startTxAggregation" "${FILE}"
          grep -q "sendAddbaRequest" "${FILE}"
          grep -q "sendAddbaResponse" "${FILE}"
          grep -q "handleBackAction" "${FILE}"
          grep -q "_txBaActive" "${HEADER}"
          grep -q "rxReorderInput" "${FILE}"
          grep -q "kRxBaMaxBuf" "${HEADER}"

          echo "TX A-MPDU: OK"
          echo "RX A-MPDU reorder: OK"
          echo "ADDBA / BlockAck: OK"


      # ================================================================
      # 09 - VALIDATE WPA2
      # ================================================================

      - name: Validate WPA2 support
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          echo
          echo "============================================================"
          echo "WPA2"
          echo "============================================================"
          echo

          grep -q "derivePMK" "${FILE}"
          grep -q "derivePTK" "${FILE}"
          grep -q "handleEAPOL" "${FILE}"
          grep -q "sendEAPOLKey" "${FILE}"
          grep -q "installKey" "${FILE}"
          grep -q "_ptkConf" "${FILE}"
          grep -q "_gtkConf" "${FILE}"

          echo "PMK: OK"
          echo "PTK: OK"
          echo "GTK: OK"
          echo "EAPOL: OK"
          echo "WPA2 implementation: OK"


      # ================================================================
      # 10 - VALIDATE PCI / DMA
      # ================================================================

      - name: Validate PCI and DMA support
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/src/kext/RTW88PCIDevice.cpp"

          echo
          echo "============================================================"
          echo "PCI / DMA"
          echo "============================================================"
          echo

          grep -q "_pciDev->setBusMasterEnable(true)" "${FILE}"
          grep -q "_pciDev->setMemoryEnable(true)" "${FILE}"

          grep -q "compat_dma_alloc" "${FILE}"
          grep -q "compat_dma_free" "${FILE}"
          grep -q "compat_dma_map" "${FILE}"
          grep -q "compat_dma_unmap" "${FILE}"
          grep -q "compat_dma_sync_cpu" "${FILE}"
          grep -q "syncBounceForCpu" "${FILE}"

          echo "PCI Bus Master: OK"
          echo "PCI Memory Space: OK"
          echo "DMA allocation: OK"
          echo "DMA mapping: OK"
          echo "DMA RX sync: OK"


      # ================================================================
      # 11 - VALIDATE MAC KERNEL SDK
      # ================================================================

      - name: Validate kernel header precedence
        shell: bash
        run: |
          set -eu

          echo
          echo "============================================================"
          echo "MAC KERNEL SDK"
          echo "============================================================"
          echo

          HEADER_COUNT="$(
            find \
              Feixiao/MacKernelSDK/Headers \
              -type f \
              | wc -l \
              | tr -d ' '
          )"

          echo "Header count:"
          echo "${HEADER_COUNT}"

          if [ "${HEADER_COUNT}" -lt 100 ]; then
            echo
            echo "ERROR: MacKernelSDK incomplete"
            exit 1
          fi

          echo
          echo "MacKernelSDK: OK"


      # ================================================================
      # 12 - DOWNLOAD REALTEK FIRMWARE
      # ================================================================

      - name: Download Realtek firmware
        shell: bash
        run: |
          set -eu

          cd Feixiao/firmware

          FIRMWARE_FILES="
          rtw8822b_fw.bin
          rtw8822c_fw.bin
          rtw8821c_fw.bin
          rtw8821a_fw.bin
          rtw8812a_fw.bin
          rtw8814a_fw.bin
          "

          for FW in ${FIRMWARE_FILES}
          do

            if [ ! -s "${FW}" ]; then

              echo
              echo "Downloading ${FW}"

              curl \
                --location \
                --fail \
                --retry 3 \
                --retry-delay 2 \
                "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtw88/${FW}" \
                --output "${FW}"

            fi

            if [ ! -s "${FW}" ]; then
              echo
              echo "ERROR: firmware download failed:"
              echo "${FW}"
              exit 1
            fi

            echo "[OK] ${FW}"
            ls -lh "${FW}"

          done


      # ================================================================
      # 13 - VERIFY RTL8821C FIRMWARE BEFORE BUILD
      # ================================================================

      - name: Validate RTL8821C firmware source
        shell: bash
        run: |
          set -eu

          FW="Feixiao/firmware/rtw8821c_fw.bin"

          echo
          echo "============================================================"
          echo "RTL8821C FIRMWARE SOURCE"
          echo "============================================================"
          echo

          if [ ! -s "${FW}" ]; then
            echo "ERROR: rtw8821c_fw.bin missing"
            exit 1
          fi

          SIZE="$(
            stat -f "%z" "${FW}"
          )"

          echo "Firmware size:"
          echo "${SIZE} bytes"

          if [ "${SIZE}" -lt 50000 ]; then
            echo "ERROR: RTL8821C firmware file is suspiciously small"
            exit 1
          fi

          echo
          echo "RTL8821C firmware source: OK"


      # ================================================================
      # 14 - SHOW BUILD ENVIRONMENT
      # ================================================================

      - name: Show build environment
        shell: bash
        run: |
          set -eu

          echo
          echo "============================================================"
          echo "MACOS"
          echo "============================================================"

          sw_vers

          echo
          echo "============================================================"
          echo "XCODE"
          echo "============================================================"

          xcodebuild -version

          echo
          echo "============================================================"
          echo "CLANG"
          echo "============================================================"

          clang --version

          echo
          echo "============================================================"
          echo "SDK"
          echo "============================================================"

          xcrun --sdk macosx --show-sdk-path

          echo
          echo "============================================================"
          echo "MACKERNELSDK"
          echo "============================================================"

          git \
            -C Feixiao/MacKernelSDK \
            rev-parse \
            HEAD


      # ================================================================
      # 15 - CLEAN BUILD
      # ================================================================

      - name: Clean previous build
        shell: bash
        working-directory: Feixiao
        run: |
          set -eu

          make clean || true

          rm -rf build/out || true

          echo
          echo "Clean build directory: OK"


      # ================================================================
      # 16 - BUILD
      # ================================================================

      - name: Build HP256G8 v8.5.3
        shell: bash
        working-directory: Feixiao
        run: |
          set -eu

          echo
          echo "============================================================"
          echo "HP 256 G8"
          echo "RTL8821CE"
          echo "V8.5.3 CLEAN FIXED"
          echo "============================================================"
          echo

          make all


      # ================================================================
      # 17 - VERIFY GENERATED FIRMWARE SOURCE
      # ================================================================

      - name: Validate generated firmware blob source
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/src/compat/fw_blobs.c"

          echo
          echo "============================================================"
          echo "GENERATED FIRMWARE BLOBS"
          echo "============================================================"
          echo

          if [ ! -s "${FILE}" ]; then
            echo "ERROR: fw_blobs.c was not generated"
            exit 1
          fi

          SIZE="$(
            stat -f "%z" "${FILE}"
          )"

          echo "fw_blobs.c size:"
          echo "${SIZE} bytes"

          if [ "${SIZE}" -lt 10000 ]; then
            echo "ERROR: generated fw_blobs.c is too small"
            exit 1
          fi

          echo
          echo "Searching firmware symbols..."

          grep -E \
            "8821|firmware|blob|fw_" \
            "${FILE}" \
            | head -20 \
            || true

          echo
          echo "Embedded firmware source: OK"


      # ================================================================
      # 18 - VERIFY BUILD OUTPUT
      # ================================================================

      - name: Verify build output
        shell: bash
        run: |
          set -eu

          KEXT="Feixiao/build/out/rtw88.kext"
          CTL="Feixiao/build/out/rtw88ctl"

          if [ ! -d "${KEXT}" ]; then
            echo "ERROR: rtw88.kext missing"
            exit 1
          fi

          if [ ! -f "${CTL}" ]; then
            echo "ERROR: rtw88ctl missing"
            exit 1
          fi

          if [ ! -f "${KEXT}/Contents/MacOS/rtw88" ]; then
            echo "ERROR: rtw88 kext binary missing"
            exit 1
          fi

          echo
          echo "rtw88.kext: OK"
          echo "rtw88ctl: OK"


      # ================================================================
      # 19 - VALIDATE KEXT STRUCTURE
      # ================================================================

      - name: Validate kext structure
        shell: bash
        run: |
          set -eu

          KEXT="Feixiao/build/out/rtw88.kext"

          test -f "${KEXT}/Contents/Info.plist"
          test -f "${KEXT}/Contents/MacOS/rtw88"

          echo
          echo "Kext structure: OK"

          find \
            "${KEXT}/Contents" \
            -maxdepth 3 \
            -type f \
            -print


      # ================================================================
      # 20 - VALIDATE INFO.PLIST
      # ================================================================

      - name: Validate Info.plist
        shell: bash
        run: |
          set -eu

          PLIST="Feixiao/build/out/rtw88.kext/Contents/Info.plist"

          plutil \
            -lint \
            "${PLIST}"

          echo
          echo "Bundle ID:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "${PLIST}"


      # ================================================================
      # 21 - VALIDATE MACH-O
      # ================================================================

      - name: Validate Mach-O binaries
        shell: bash
        run: |
          set -eu

          KEXT_BIN="Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88"
          CTL="Feixiao/build/out/rtw88ctl"

          echo
          echo "============================================================"
          echo "KEXT BINARY"
          echo "============================================================"

          file "${KEXT_BIN}"

          echo
          echo "============================================================"
          echo "RTW88CTL"
          echo "============================================================"

          file "${CTL}"

          echo
          echo "============================================================"
          echo "KEXT UUID"
          echo "============================================================"

          dwarfdump \
            --uuid \
            "${KEXT_BIN}"


      # ================================================================
      # 22 - VALIDATE KEXT BINARY SIZE
      # ================================================================

      - name: Validate embedded firmware in kext binary
        shell: bash
        run: |
          set -eu

          BIN="Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88"

          echo
          echo "============================================================"
          echo "EMBEDDED FIRMWARE VALIDATION"
          echo "============================================================"
          echo

          SIZE="$(
            stat -f "%z" "${BIN}"
          )"

          echo "Kext executable size:"
          echo "${SIZE} bytes"

          if [ "${SIZE}" -lt 500000 ]; then

            echo
            echo "ERROR:"
            echo "rtw88 binary unexpectedly small."
            echo "Firmware/object embedding may have failed."

            exit 1
          fi

          echo
          echo "The Feixiao build embeds firmware through fw_blobs.c."
          echo "Physical .bin files are NOT required inside rtw88.kext."
          echo
          echo "Embedded firmware build path: OK"


      # ================================================================
      # 23 - VALIDATE RTL8821CE MARKERS
      # ================================================================

      - name: Validate RTL8821CE binary markers
        shell: bash
        run: |
          set -eu

          BIN="Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88"

          echo
          echo "============================================================"
          echo "RTL8821CE BINARY MARKERS"
          echo "============================================================"
          echo

          strings "${BIN}" \
            | grep -E \
              "RTL8821CE|RTL8821C|8821C" \
            || true

          echo
          echo "RTL8821CE marker scan: OK"


      # ================================================================
      # 24 - VERIFY DRIVER + CONTROL APP ARE MATCHED
      # ================================================================

      - name: Verify final files
        shell: bash
        run: |
          set -eu

          KEXT_BIN="Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88"
          CTL="Feixiao/build/out/rtw88ctl"

          echo
          echo "============================================================"
          echo "FINAL FILES"
          echo "============================================================"
          echo

          ls -lh "${KEXT_BIN}"
          ls -lh "${CTL}"

          echo
          echo "Kext SHA256:"

          shasum \
            -a 256 \
            "${KEXT_BIN}"

          echo
          echo "rtw88ctl SHA256:"

          shasum \
            -a 256 \
            "${CTL}"


      # ================================================================
      # 25 - PREPARE ARTIFACT
      # ================================================================

      - name: Prepare artifact directory
        shell: bash
        run: |
          set -eu

          OUT="${RUNNER_TEMP}/${BUILD_NAME}"

          rm -rf "${OUT}"

          mkdir -p "${OUT}"

          cp -R \
            Feixiao/build/out/rtw88.kext \
            "${OUT}/"

          cp \
            Feixiao/build/out/rtw88ctl \
            "${OUT}/"

          chmod +x \
            "${OUT}/rtw88ctl"

          cp \
            Feixiao/src/compat/fw_blobs.c \
            "${OUT}/fw_blobs.c.build-proof"


      # ================================================================
      # 26 - BUILD INFORMATION
      # ================================================================

      - name: Create build information
        shell: bash
        run: |
          set -eu

          OUT="${RUNNER_TEMP}/${BUILD_NAME}"

          FEIXIAO_HASH="$(
            git -C Feixiao rev-parse HEAD
          )"

          RTW88_HASH="$(
            git -C rtw88-stable rev-parse HEAD
          )"

          MACKERNEL_HASH="$(
            git -C Feixiao/MacKernelSDK rev-parse HEAD
          )"

          KEXT_UUID="$(
            dwarfdump \
              --uuid \
              Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88 \
              | awk '{print $2}' \
              | head -1
          )"

          cat > "${OUT}/BUILD-INFO.txt" <<EOF
          ============================================================
          HP 256 G8
          REALTEK RTL8821CE
          FEIXIAO V8.5.3 CLEAN FIXED
          ============================================================


          HARDWARE
          ============================================================

          Realtek RTL8821CE

          PCI Vendor:
          10EC

          PCI Device:
          C821


          FEIXIAO
          ============================================================

          ${FEIXIAO_HASH}


          RTW88-STABLE
          ============================================================

          ${RTW88_HASH}


          MACKERNELSDK
          ============================================================

          ${MACKERNEL_HASH}


          KEXT UUID
          ============================================================

          ${KEXT_UUID}


          FIRMWARE
          ============================================================

          RTL8821C firmware is embedded in the driver binary.

          Source firmware:

          firmware/rtw8821c_fw.bin

          Build pipeline:

          firmware/*.bin
          ->
          scripts/gen_fw_blobs.py
          ->
          src/compat/fw_blobs.c
          ->
          fw_blobs.o
          ->
          rtw88 executable

          Therefore physical firmware .bin files are not expected
          inside the final rtw88.kext bundle.


          DRIVER FEATURES
          ============================================================

          RTL8821CE

          PCI 10EC:C821

          2.4 GHz

          5 GHz

          HT 20 MHz

          HT 40 MHz

          VHT 80 MHz

          WPA2

          PMK

          PTK

          GTK

          EAPOL

          TX A-MPDU

          RX A-MPDU reorder

          ADDBA

          BlockAck

          PCI Bus Master

          DMA coherent allocation

          DMA bounce buffering

          DMA RX synchronization


          IMPORTANT
          ============================================================

          rtw88.kext and rtw88ctl in this package were produced
          by the exact same compilation.

          Do not mix either file with another Feixiao build.

          Keep your previous working kext as backup.
          EOF


      # ================================================================
      # 27 - GENERATE CHECKSUMS
      # ================================================================

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -eu

          OUT="${RUNNER_TEMP}/${BUILD_NAME}"

          cd "${OUT}"

          shasum \
            -a 256 \
            rtw88ctl \
            > SHA256SUMS.txt

          find \
            rtw88.kext \
            -type f \
            -exec shasum -a 256 {} \; \
            >> SHA256SUMS.txt

          echo
          cat SHA256SUMS.txt


      # ================================================================
      # 28 - PACKAGE
      # ================================================================

      - name: Package HP256G8 v8.5.3
        shell: bash
        run: |
          set -eu

          cd "${RUNNER_TEMP}"

          ZIP="Feixiao_HP256G8_v8_5_3_Clean_Fixed.zip"

          rm -f "${ZIP}"

          zip \
            -r \
            "${ZIP}" \
            "${BUILD_NAME}"

          echo
          echo "============================================================"
          echo "PACKAGE"
          echo "============================================================"
          echo

          ls -lh "${ZIP}"


      # ================================================================
      # 29 - UPLOAD
      # ================================================================

      - name: Upload HP256G8 v8.5.3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Feixiao-HP256G8-v8.5.3-Clean-Fixed
          path: ${{ runner.temp }}/Feixiao_HP256G8_v8_5_3_Clean_Fixed.zip
          if-no-files-found: error
          retention-days: 7
