name: Build HP256G8 RTL8821CE v8.5.2 Clean Fixed

"on":
  workflow_dispatch:

permissions:
  contents: read

env:
  FEIXIAO_REF: e963f43188382eced4ef2fa75d19ce4db2315c68
  RTW88_REF: d029a677c49266fad86750714eb5612becd134d3
  BUILD_NAME: Feixiao-HP256G8-v8.5.2-Clean-Fixed

jobs:

  build:

    name: Build HP256G8 v8.5.2
    runs-on: macos-latest
    timeout-minutes: 30

    steps:

      # ================================================================
      # 01
      # CHECKOUT FEIXIAO + MACKERNELSDK
      # ================================================================

      - name: Checkout Feixiao with MacKernelSDK
        uses: actions/checkout@v4
        with:
          repository: thegwchr/Feixiao
          ref: ${{ env.FEIXIAO_REF }}
          path: Feixiao
          fetch-depth: 1
          submodules: recursive


      # ================================================================
      # 02
      # VERIFY MACKERNELSDK
      # ================================================================

      - name: Validate MacKernelSDK submodule
        shell: bash
        run: |
          set -eu

          echo
          echo "============================================================"
          echo "MACKERNELSDK"
          echo "============================================================"
          echo

          if [ ! -d "Feixiao/MacKernelSDK" ]; then
            echo "ERROR: MacKernelSDK directory missing"
            exit 1
          fi

          if [ ! -d "Feixiao/MacKernelSDK/Headers" ]; then
            echo "ERROR: MacKernelSDK Headers missing"
            exit 1
          fi

          SDK_COMMIT="$(
            git -C Feixiao/MacKernelSDK rev-parse HEAD
          )"

          echo "MacKernelSDK commit:"
          echo "${SDK_COMMIT}"

          echo
          echo "MacKernelSDK: OK"


      # ================================================================
      # 03
      # CLONE RTW88-STABLE
      # ================================================================

      - name: Clone matching rtw88-stable
        shell: bash
        run: |
          set -eu

          echo
          echo "============================================================"
          echo "RTW88-STABLE"
          echo "============================================================"
          echo

          git clone \
            https://github.com/thegwchr/rtw88-stable.git \
            rtw88-stable

          git \
            -C rtw88-stable \
            checkout \
            "${RTW88_REF}"

          echo
          echo "rtw88-stable commit:"

          git \
            -C rtw88-stable \
            rev-parse \
            HEAD


      # ================================================================
      # 04
      # VALIDATE SOURCE REVISIONS
      # ================================================================

      - name: Validate exact source revisions
        shell: bash
        run: |
          set -eu

          FEIXIAO_ACTUAL="$(
            git -C Feixiao rev-parse HEAD
          )"

          RTW88_ACTUAL="$(
            git -C rtw88-stable rev-parse HEAD
          )"

          echo
          echo "============================================================"
          echo "SOURCE REVISIONS"
          echo "============================================================"
          echo

          echo "Feixiao expected:"
          echo "${FEIXIAO_REF}"

          echo

          echo "Feixiao actual:"
          echo "${FEIXIAO_ACTUAL}"

          echo

          echo "rtw88-stable expected:"
          echo "${RTW88_REF}"

          echo

          echo "rtw88-stable actual:"
          echo "${RTW88_ACTUAL}"

          if [ "${FEIXIAO_ACTUAL}" != "${FEIXIAO_REF}" ]; then

            echo
            echo "ERROR: Feixiao revision mismatch"

            exit 1
          fi

          if [ "${RTW88_ACTUAL}" != "${RTW88_REF}" ]; then

            echo
            echo "ERROR: rtw88-stable revision mismatch"

            exit 1
          fi

          echo
          echo "Source revisions: OK"


      # ================================================================
      # 05
      # VALIDATE SOURCE TREE
      # ================================================================

      - name: Validate source tree
        shell: bash
        run: |
          set -eu

          echo
          echo "============================================================"
          echo "SOURCE TREE"
          echo "============================================================"
          echo

          REQUIRED_FILES="
          Feixiao/Makefile
          Feixiao/src/kext/RTW88IEEE80211.cpp
          Feixiao/src/kext/RTW88IEEE80211.hpp
          Feixiao/src/kext/RTW88PCIDevice.cpp
          Feixiao/src/kext/RTW88PCIDevice.hpp
          Feixiao/src/kext/RTW88UserClient.cpp
          Feixiao/src/kext/RTW88UserClient.hpp
          Feixiao/src/compat/rtw88_compat.c
          Feixiao/src/compat/rtw88_compat.h
          rtw88-stable/drivers/net/wireless/realtek/rtw88/main.c
          rtw88-stable/drivers/net/wireless/realtek/rtw88/pci.c
          "

          for FILE in ${REQUIRED_FILES}
          do

            if [ ! -f "${FILE}" ]; then

              echo "ERROR: missing file:"
              echo "${FILE}"

              exit 1
            fi

            echo "[OK] ${FILE}"

          done

          echo
          echo "Source tree: OK"


      # ================================================================
      # 06
      # VALIDATE RTL8821CE
      # ================================================================

      - name: Validate RTL8821CE support
        shell: bash
        run: |
          set -eu

          IEEE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          PCI="Feixiao/src/kext/RTW88PCIDevice.cpp"

          echo
          echo "============================================================"
          echo "RTL8821CE"
          echo "============================================================"
          echo

          grep -q \
            "rtw8821c_hw_spec" \
            "${IEEE}"

          grep -q \
            "0xC821" \
            "${PCI}"

          grep -q \
            "RTL8821CE" \
            "${PCI}"

          echo "RTL8821CE hardware support: OK"


      # ================================================================
      # 07
      # VALIDATE 5 GHZ / VHT
      # ================================================================

      - name: Validate 20 40 80 MHz support
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          echo
          echo "============================================================"
          echo "CHANNEL WIDTH"
          echo "============================================================"
          echo

          grep -q \
            "_connChanWidth = 20" \
            "${FILE}"

          grep -q \
            "_connChanWidth = 40" \
            "${FILE}"

          grep -q \
            "_connChanWidth = 80" \
            "${FILE}"

          grep -q \
            "NL80211_CHAN_WIDTH_40" \
            "${FILE}"

          grep -q \
            "NL80211_CHAN_WIDTH_80" \
            "${FILE}"

          grep -q \
            "chip80 && vhtWidth == 1 && vhtSeg0 != 0" \
            "${FILE}"

          echo "20 MHz: OK"
          echo "40 MHz: OK"
          echo "80 MHz: OK"
          echo "VHT negotiation: OK"


      # ================================================================
      # 08
      # VALIDATE A-MPDU
      # ================================================================

      - name: Validate A-MPDU support
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          HEADER="Feixiao/src/kext/RTW88IEEE80211.hpp"

          echo
          echo "============================================================"
          echo "A-MPDU"
          echo "============================================================"
          echo

          grep -q \
            "startTxAggregation" \
            "${FILE}"

          grep -q \
            "sendAddbaRequest" \
            "${FILE}"

          grep -q \
            "sendAddbaResponse" \
            "${FILE}"

          grep -q \
            "handleBackAction" \
            "${FILE}"

          grep -q \
            "_txBaActive" \
            "${HEADER}"

          grep -q \
            "rxReorderInput" \
            "${FILE}"

          grep -q \
            "kRxBaMaxBuf" \
            "${HEADER}"

          echo "TX A-MPDU: OK"
          echo "RX reorder: OK"
          echo "BlockAck negotiation: OK"


      # ================================================================
      # 09
      # VALIDATE WPA2
      # ================================================================

      - name: Validate WPA2 support
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/src/kext/RTW88IEEE80211.cpp"

          echo
          echo "============================================================"
          echo "WPA2"
          echo "============================================================"
          echo

          grep -q \
            "derivePMK" \
            "${FILE}"

          grep -q \
            "derivePTK" \
            "${FILE}"

          grep -q \
            "handleEAPOL" \
            "${FILE}"

          grep -q \
            "sendEAPOLKey" \
            "${FILE}"

          grep -q \
            "installKey" \
            "${FILE}"

          grep -q \
            "_ptkConf" \
            "${FILE}"

          grep -q \
            "_gtkConf" \
            "${FILE}"

          echo "WPA2 implementation: OK"


      # ================================================================
      # 10
      # VALIDATE PCI/DMA
      # ================================================================

      - name: Validate PCI and DMA support
        shell: bash
        run: |
          set -eu

          FILE="Feixiao/src/kext/RTW88PCIDevice.cpp"

          echo
          echo "============================================================"
          echo "PCI / DMA"
          echo "============================================================"
          echo

          grep -q \
            "_pciDev->setBusMasterEnable(true)" \
            "${FILE}"

          grep -q \
            "_pciDev->setMemoryEnable(true)" \
            "${FILE}"

          grep -q \
            "compat_dma_alloc" \
            "${FILE}"

          grep -q \
            "compat_dma_free" \
            "${FILE}"

          grep -q \
            "compat_dma_map" \
            "${FILE}"

          grep -q \
            "compat_dma_unmap" \
            "${FILE}"

          grep -q \
            "compat_dma_sync_cpu" \
            "${FILE}"

          grep -q \
            "syncBounceForCpu" \
            "${FILE}"

          echo "PCI Bus Master: OK"
          echo "PCI Memory Space: OK"
          echo "DMA bounce path: OK"


      # ================================================================
      # 11
      # VALIDATE MACKERNELSDK HEADERS
      # ================================================================

      - name: Validate kernel header precedence
        shell: bash
        run: |
          set -eu

          echo
          echo "============================================================"
          echo "KERNEL SDK HEADERS"
          echo "============================================================"
          echo

          HEADER_COUNT="$(
            find \
              Feixiao/MacKernelSDK/Headers \
              -type f \
              | wc -l \
              | tr -d ' '
          )"

          echo "MacKernelSDK header count:"
          echo "${HEADER_COUNT}"

          if [ "${HEADER_COUNT}" -lt 100 ]; then

            echo
            echo "ERROR: MacKernelSDK appears incomplete"

            exit 1
          fi

          echo
          echo "MacKernelSDK populated correctly: OK"


      # ================================================================
      # 12
      # DOWNLOAD FIRMWARE
      # ================================================================

      - name: Download Realtek firmware
        shell: bash
        run: |
          set -eu

          cd Feixiao/firmware

          FIRMWARE_FILES="
          rtw8822b_fw.bin
          rtw8822c_fw.bin
          rtw8821c_fw.bin
          rtw8821a_fw.bin
          rtw8812a_fw.bin
          rtw8814a_fw.bin
          "

          for FW in ${FIRMWARE_FILES}
          do

            if [ ! -s "${FW}" ]; then

              echo
              echo "Downloading ${FW}"

              curl \
                --location \
                --fail \
                --retry 3 \
                --retry-delay 2 \
                "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtw88/${FW}" \
                --output "${FW}"

            fi

            if [ ! -s "${FW}" ]; then

              echo
              echo "ERROR: missing firmware:"
              echo "${FW}"

              exit 1
            fi

            ls -lh "${FW}"

          done


      # ================================================================
      # 13
      # BUILD ENVIRONMENT
      # ================================================================

      - name: Show build environment
        shell: bash
        run: |
          set -eu

          echo
          echo "============================================================"
          echo "MACOS"
          echo "============================================================"

          sw_vers

          echo
          echo "============================================================"
          echo "XCODE"
          echo "============================================================"

          xcodebuild -version

          echo
          echo "============================================================"
          echo "CLANG"
          echo "============================================================"

          clang --version

          echo
          echo "============================================================"
          echo "MAC KERNEL SDK"
          echo "============================================================"

          git \
            -C Feixiao/MacKernelSDK \
            rev-parse \
            HEAD


      # ================================================================
      # 14
      # CLEAN
      # ================================================================

      - name: Clean previous build
        shell: bash
        working-directory: Feixiao
        run: |
          set -eu

          make clean || true

          rm -rf \
            build/out \
            || true

          echo
          echo "Build directory cleaned"


      # ================================================================
      # 15
      # BUILD
      # ================================================================

      - name: Build HP256G8 v8.5.2
        shell: bash
        working-directory: Feixiao
        run: |
          set -eu

          echo
          echo "============================================================"
          echo "HP 256 G8"
          echo "RTL8821CE"
          echo "V8.5.2 CLEAN FIXED"
          echo "============================================================"
          echo

          make all


      # ================================================================
      # 16
      # VERIFY OUTPUT
      # ================================================================

      - name: Verify build output
        shell: bash
        run: |
          set -eu

          KEXT="Feixiao/build/out/rtw88.kext"

          CTL="Feixiao/build/out/rtw88ctl"

          if [ ! -d "${KEXT}" ]; then

            echo "ERROR: rtw88.kext missing"

            exit 1
          fi

          if [ ! -f "${CTL}" ]; then

            echo "ERROR: rtw88ctl missing"

            exit 1
          fi

          echo
          echo "rtw88.kext: OK"

          echo "rtw88ctl: OK"


      # ================================================================
      # 17
      # VALIDATE KEXT STRUCTURE
      # ================================================================

      - name: Validate kext structure
        shell: bash
        run: |
          set -eu

          KEXT="Feixiao/build/out/rtw88.kext"

          test -f \
            "${KEXT}/Contents/Info.plist"

          test -f \
            "${KEXT}/Contents/MacOS/rtw88"

          echo
          echo "Kext structure: OK"

          echo

          find \
            "${KEXT}/Contents" \
            -maxdepth 2 \
            -type f \
            -print


      # ================================================================
      # 18
      # VALIDATE INFO.PLIST
      # ================================================================

      - name: Validate Info.plist
        shell: bash
        run: |
          set -eu

          PLIST="Feixiao/build/out/rtw88.kext/Contents/Info.plist"

          plutil \
            -lint \
            "${PLIST}"

          echo
          echo "Bundle ID:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "${PLIST}"


      # ================================================================
      # 19
      # VALIDATE MACH-O
      # ================================================================

      - name: Validate Mach-O binaries
        shell: bash
        run: |
          set -eu

          KEXT_BIN="Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88"

          CTL="Feixiao/build/out/rtw88ctl"

          echo
          echo "============================================================"
          echo "KEXT BINARY"
          echo "============================================================"

          file "${KEXT_BIN}"

          echo
          echo "============================================================"
          echo "RTW88CTL"
          echo "============================================================"

          file "${CTL}"

          echo
          echo "============================================================"
          echo "UUID"
          echo "============================================================"

          dwarfdump \
            --uuid \
            "${KEXT_BIN}"


      # ================================================================
      # 20
      # VALIDATE RTL8821CE MARKERS
      # ================================================================

      - name: Validate RTL8821CE binary markers
        shell: bash
        run: |
          set -eu

          BIN="Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88"

          echo
          echo "============================================================"
          echo "RTL8821CE BINARY"
          echo "============================================================"
          echo

          strings "${BIN}" \
            | grep -E \
              "RTL8821CE|RTL8821C|8821C" \
            || true

          echo
          echo "RTL8821CE marker scan complete"


      # ================================================================
      # 21
      # VALIDATE FIRMWARE
      # ================================================================

      - name: Validate firmware resources
        shell: bash
        run: |
          set -eu

          KEXT="Feixiao/build/out/rtw88.kext"

          echo
          echo "============================================================"
          echo "FIRMWARE"
          echo "============================================================"
          echo

          find \
            "${KEXT}" \
            -type f \
            -name "*.bin" \
            -print

          COUNT="$(
            find \
              "${KEXT}" \
              -type f \
              -name "*.bin" \
              | wc -l \
              | tr -d ' '
          )"

          echo
          echo "Firmware blobs: ${COUNT}"

          if [ "${COUNT}" -lt 1 ]; then

            echo
            echo "ERROR: no firmware inside kext"

            exit 1
          fi


      # ================================================================
      # 22
      # PREPARE ARTIFACT
      # ================================================================

      - name: Prepare artifact directory
        shell: bash
        run: |
          set -eu

          OUT="${RUNNER_TEMP}/${BUILD_NAME}"

          rm -rf \
            "${OUT}"

          mkdir -p \
            "${OUT}"

          cp -R \
            Feixiao/build/out/rtw88.kext \
            "${OUT}/"

          cp \
            Feixiao/build/out/rtw88ctl \
            "${OUT}/"

          chmod +x \
            "${OUT}/rtw88ctl"


      # ================================================================
      # 23
      # BUILD INFO
      # ================================================================

      - name: Create build information
        shell: bash
        run: |
          set -eu

          OUT="${RUNNER_TEMP}/${BUILD_NAME}"

          FEIXIAO_HASH="$(
            git -C Feixiao rev-parse HEAD
          )"

          RTW88_HASH="$(
            git -C rtw88-stable rev-parse HEAD
          )"

          MACKERNEL_HASH="$(
            git -C Feixiao/MacKernelSDK rev-parse HEAD
          )"

          cat > "${OUT}/BUILD-INFO.txt" <<EOF
          ============================================================
          HP 256 G8
          REALTEK RTL8821CE
          FEIXIAO V8.5.2 CLEAN FIXED
          ============================================================


          HARDWARE
          ============================================================

          Realtek RTL8821CE

          Vendor:
          10EC

          Device:
          C821


          FEIXIAO
          ============================================================

          ${FEIXIAO_HASH}


          RTW88-STABLE
          ============================================================

          ${RTW88_HASH}


          MACKERNELSDK
          ============================================================

          ${MACKERNEL_HASH}


          BUILD FIX
          ============================================================

          MacKernelSDK recursive checkout enabled.

          This prevents the build from relying only on the
          macOS 26.5 system Kernel.framework headers.

          No runtime C++ source rewriting is performed.


          NATIVE DRIVER FEATURES
          ============================================================

          RTL8821CE

          2.4 GHz

          5 GHz

          HT 20 MHz

          HT 40 MHz

          VHT 80 MHz

          WPA2

          PTK

          GTK

          TX A-MPDU

          RX A-MPDU reorder

          BlockAck

          PCI Bus Master

          DMA bounce buffering


          IMPORTANT
          ============================================================

          This is a clean compile baseline.

          It does not guarantee a specific Wi-Fi speed.

          Always use rtw88.kext and rtw88ctl from
          the SAME artifact.

          Keep the last known working Kext as backup.
          EOF


      # ================================================================
      # 24
      # CHECKSUM
      # ================================================================

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -eu

          OUT="${RUNNER_TEMP}/${BUILD_NAME}"

          cd "${OUT}"

          shasum \
            -a 256 \
            rtw88ctl \
            > SHA256SUMS.txt

          find \
            rtw88.kext \
            -type f \
            -exec shasum -a 256 {} \; \
            >> SHA256SUMS.txt

          echo
          cat SHA256SUMS.txt


      # ================================================================
      # 25
      # PACKAGE
      # ================================================================

      - name: Package HP256G8 v8.5.2
        shell: bash
        run: |
          set -eu

          cd "${RUNNER_TEMP}"

          rm -f \
            Feixiao_HP256G8_v8_5_2_Clean_Fixed.zip

          zip \
            -r \
            Feixiao_HP256G8_v8_5_2_Clean_Fixed.zip \
            "${BUILD_NAME}"

          echo
          ls -lh \
            Feixiao_HP256G8_v8_5_2_Clean_Fixed.zip


      # ================================================================
      # 26
      # UPLOAD
      # ================================================================

      - name: Upload HP256G8 v8.5.2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Feixiao-HP256G8-v8.5.2-Clean-Fixed
          path: ${{ runner.temp }}/Feixiao_HP256G8_v8_5_2_Clean_Fixed.zip
          if-no-files-found: error
          retention-days: 7
