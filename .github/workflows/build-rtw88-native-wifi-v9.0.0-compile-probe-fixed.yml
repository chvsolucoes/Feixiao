name: RTW88 Native Wi-Fi v9.0.0 Compile Probe

"on":
  workflow_dispatch:

permissions:
  contents: read

env:
  FEIXIAO_REF: e963f43188382eced4ef2fa75d19ce4db2315c68
  RTW88_REF: d029a677c49266fad86750714eb5612becd134d3

jobs:
  compile-probe:
    name: IO80211 Native Wi-Fi Foundation Compile Probe
    runs-on: macos-latest
    timeout-minutes: 20

    steps:

      - name: Checkout exact stable Feixiao
        uses: actions/checkout@v4
        with:
          repository: thegwchr/Feixiao
          ref: ${{ env.FEIXIAO_REF }}
          path: Feixiao
          fetch-depth: 1
          submodules: recursive

      - name: Validate exact Feixiao revision
        shell: bash
        run: |
          set -eu

          ACTUAL="$(git -C Feixiao rev-parse HEAD)"

          echo "Expected: ${FEIXIAO_REF}"
          echo "Actual  : ${ACTUAL}"

          if [ "${ACTUAL}" != "${FEIXIAO_REF}" ]; then
            echo "ERROR: wrong Feixiao revision"
            exit 1
          fi

      - name: Clone exact matching rtw88-stable
        shell: bash
        run: |
          set -eu

          rm -rf rtw88-stable

          git clone \
            https://github.com/thegwchr/rtw88-stable.git \
            rtw88-stable

          git -C rtw88-stable checkout "${RTW88_REF}"

          ACTUAL="$(git -C rtw88-stable rev-parse HEAD)"

          echo "Expected: ${RTW88_REF}"
          echo "Actual  : ${ACTUAL}"

          if [ "${ACTUAL}" != "${RTW88_REF}" ]; then
            echo "ERROR: wrong rtw88-stable revision"
            exit 1
          fi

      - name: Validate MacKernelSDK IO80211 headers
        shell: bash
        run: |
          set -eu

          HEADER1="Feixiao/MacKernelSDK/Headers/IOKit/80211/IO80211Controller.h"
          HEADER2="Feixiao/MacKernelSDK/Headers/IOKit/80211/IO80211Interface.h"

          test -f "${HEADER1}"
          test -f "${HEADER2}"

          echo "IO80211Controller.h: OK"
          echo "IO80211Interface.h : OK"

          grep -q \
            'class IO80211Controller : public IOEthernetController' \
            "${HEADER1}"

          grep -q \
            'virtual SInt32 apple80211Request' \
            "${HEADER1}"

          grep -q \
            'virtual SInt32 stopDMA() = 0;' \
            "${HEADER1}"

          grep -q \
            'virtual UInt32 hardwareOutputQueueDepth' \
            "${HEADER1}"

          grep -q \
            'virtual SInt32 performCountryCodeOperation' \
            "${HEADER1}"

          grep -q \
            'virtual SInt32 enableFeature' \
            "${HEADER1}"

          echo
          echo "Required IO80211 abstract API: found"

      - name: Create RTW88WiFiController foundation header
        shell: bash
        run: |
          set -eu

          cat > Feixiao/src/kext/RTW88WiFiController.hpp <<'EOF'
          #pragma once

          #include <IOKit/80211/IO80211Controller.h>
          #include <IOKit/80211/IO80211Interface.h>

          class RTW88WiFiController : public IO80211Controller
          {
              OSDeclareDefaultStructors(RTW88WiFiController)

          public:
              bool init(OSDictionary *dictionary = nullptr) override;
              void free() override;

              bool start(IOService *provider) override;
              void stop(IOService *provider) override;

              IOReturn enable(IONetworkInterface *interface) override;
              IOReturn disable(IONetworkInterface *interface) override;

              IOReturn getHardwareAddress(IOEthernetAddress *address) override;
              IONetworkInterface *createInterface() override;

              SInt32 apple80211Request(
                  unsigned int request_type,
                  int request_number,
                  IO80211Interface *interface,
                  void *data
              ) override;

              SInt32 stopDMA() override;

              UInt32 hardwareOutputQueueDepth(
                  IO80211Interface *interface
              ) override;

              SInt32 performCountryCodeOperation(
                  IO80211Interface *interface,
                  IO80211CountryCodeOp operation
              ) override;

              SInt32 enableFeature(
                  IO80211FeatureCode feature,
                  void *data
              ) override;
          };
          EOF

      - name: Create RTW88WiFiController foundation implementation
        shell: bash
        run: |
          set -eu

          cat > Feixiao/src/kext/RTW88WiFiController.cpp <<'EOF'
          #include "RTW88WiFiController.hpp"

          #include <IOKit/IOLib.h>

          #define super IO80211Controller

          OSDefineMetaClassAndStructors(
              RTW88WiFiController,
              IO80211Controller
          )

          bool RTW88WiFiController::init(OSDictionary *dictionary)
          {
              IOLog("rtw88-native: RTW88WiFiController::init\n");

              if (!super::init(dictionary))
                  return false;

              return true;
          }

          void RTW88WiFiController::free()
          {
              IOLog("rtw88-native: RTW88WiFiController::free\n");
              super::free();
          }

          bool RTW88WiFiController::start(IOService *provider)
          {
              IOLog("rtw88-native: RTW88WiFiController::start\n");

              if (!super::start(provider)) {
                  IOLog("rtw88-native: IO80211Controller::start failed\n");
                  return false;
              }

              setProperty("RTW88NativeWiFiFoundation", kOSBooleanTrue);
              setProperty("IOUserVisibleName", "Realtek RTL8821CE Wi-Fi");
              setProperty("Vendor", "Realtek");
              setProperty("Model", "RTL8821CE");

              IOLog("rtw88-native: IO80211 foundation initialized\n");

              return true;
          }

          void RTW88WiFiController::stop(IOService *provider)
          {
              IOLog("rtw88-native: RTW88WiFiController::stop\n");
              super::stop(provider);
          }

          IOReturn RTW88WiFiController::enable(
              IONetworkInterface *interface
          )
          {
              IOLog("rtw88-native: Wi-Fi enable requested\n");
              return kIOReturnSuccess;
          }

          IOReturn RTW88WiFiController::disable(
              IONetworkInterface *interface
          )
          {
              IOLog("rtw88-native: Wi-Fi disable requested\n");
              return kIOReturnSuccess;
          }

          IOReturn RTW88WiFiController::getHardwareAddress(
              IOEthernetAddress *address
          )
          {
              if (!address)
                  return kIOReturnBadArgument;

              bzero(address->bytes, sizeof(address->bytes));
              return kIOReturnSuccess;
          }

          IONetworkInterface *
          RTW88WiFiController::createInterface()
          {
              IOLog("rtw88-native: createInterface requested\n");
              return nullptr;
          }

          SInt32 RTW88WiFiController::apple80211Request(
              unsigned int request_type,
              int request_number,
              IO80211Interface *interface,
              void *data
          )
          {
              IOLog(
                  "rtw88-native: apple80211Request type=%u request=%d\n",
                  request_type,
                  request_number
              );

              return kIOReturnUnsupported;
          }

          SInt32 RTW88WiFiController::stopDMA()
          {
              return kIOReturnSuccess;
          }

          UInt32 RTW88WiFiController::hardwareOutputQueueDepth(
              IO80211Interface *interface
          )
          {
              return 256;
          }

          SInt32 RTW88WiFiController::performCountryCodeOperation(
              IO80211Interface *interface,
              IO80211CountryCodeOp operation
          )
          {
              return kIOReturnSuccess;
          }

          SInt32 RTW88WiFiController::enableFeature(
              IO80211FeatureCode feature,
              void *data
          )
          {
              return kIOReturnSuccess;
          }
          EOF

      - name: Show build environment
        shell: bash
        run: |
          set -eu

          echo "============================================================"
          echo "macOS"
          echo "============================================================"
          sw_vers

          echo
          echo "============================================================"
          echo "Xcode"
          echo "============================================================"
          xcodebuild -version

          echo
          echo "============================================================"
          echo "clang++"
          echo "============================================================"
          xcrun clang++ --version

          echo
          echo "============================================================"
          echo "MacKernelSDK commit"
          echo "============================================================"
          git -C Feixiao/MacKernelSDK rev-parse HEAD

      - name: Confirm IO80211 target macro exists
        shell: bash
        run: |
          set -eu

          SDK="$(xcrun --show-sdk-path)"
          MKSDK="${GITHUB_WORKSPACE}/Feixiao/MacKernelSDK"

          cat > /tmp/io80211-target-check.cpp <<'EOF'
          #include <Availability.h>

          #ifndef __MAC_11_0
          #error "__MAC_11_0 is not defined by this SDK"
          #endif

          int main(void) { return 0; }
          EOF

          xcrun clang++ \
            -isysroot "${SDK}" \
            -I"${MKSDK}/Headers" \
            -fsyntax-only \
            /tmp/io80211-target-check.cpp

          echo "__MAC_11_0: OK"

      - name: Compile IO80211 foundation object
        shell: bash
        run: |
          set -eu

          PROJ="${GITHUB_WORKSPACE}/Feixiao"
          SDK="$(xcrun --show-sdk-path)"
          MKSDK="${PROJ}/MacKernelSDK"
          COMPAT="${PROJ}/src/compat"
          KEXT_SRC="${PROJ}/src/kext"

          mkdir -p "${PROJ}/build/native-probe"

          echo
          echo "============================================================"
          echo "COMPILING RTW88WiFiController.cpp"
          echo "============================================================"
          echo

          xcrun clang++ \
            -c \
            "${KEXT_SRC}/RTW88WiFiController.cpp" \
            -o "${PROJ}/build/native-probe/RTW88WiFiController.o" \
            -fno-exceptions \
            -fno-rtti \
            -fno-stack-protector \
            -mkernel \
            -arch x86_64 \
            -mmacosx-version-min=11.0 \
            -isysroot "${SDK}" \
            -I"${MKSDK}/Headers" \
            -I"${SDK}/System/Library/Frameworks/Kernel.framework/Headers" \
            -I"${COMPAT}" \
            -I"${COMPAT}/linux" \
            -I"${KEXT_SRC}" \
            -fapple-kext \
            -std=c++17 \
            -DKERNEL \
            -D__IO80211_TARGET=__MAC_11_0 \
            -Wno-deprecated-declarations \
            -Wno-nullability-completeness

          echo
          echo "Foundation object compiled successfully."

      - name: Validate compiled object
        shell: bash
        run: |
          set -eu

          OBJ="Feixiao/build/native-probe/RTW88WiFiController.o"

          test -s "${OBJ}"

          echo "============================================================"
          echo "OBJECT"
          echo "============================================================"
          file "${OBJ}"

          echo
          echo "============================================================"
          echo "SYMBOLS"
          echo "============================================================"

          nm -g "${OBJ}" \
            | grep -E \
              'RTW88WiFiController|apple80211Request|stopDMA|enableFeature' \
            || true

          NM_FILE="${RUNNER_TEMP}/rtw88-native-v900-nm.txt"
          nm -g "${OBJ}" > "${NM_FILE}"

          if ! grep -F 'RTW88WiFiController' "${NM_FILE}" > /dev/null; then
            echo "ERROR: RTW88WiFiController symbols missing"
            exit 1
          fi

          echo
          echo "Compiled object validation: OK"

      - name: Test class is concrete
        shell: bash
        run: |
          set -eu

          PROJ="${GITHUB_WORKSPACE}/Feixiao"
          SDK="$(xcrun --show-sdk-path)"
          MKSDK="${PROJ}/MacKernelSDK"
          COMPAT="${PROJ}/src/compat"
          KEXT_SRC="${PROJ}/src/kext"

          cat > /tmp/rtw88-native-concrete-check.cpp <<'EOF'
          #include "RTW88WiFiController.hpp"

          static_assert(
              !__is_abstract(RTW88WiFiController),
              "RTW88WiFiController is still abstract: one or more required IO80211 methods are missing"
          );

          void compile_probe(void)
          {
              RTW88WiFiController *controller = nullptr;
              (void)controller;
          }
          EOF

          xcrun clang++ \
            -fsyntax-only \
            /tmp/rtw88-native-concrete-check.cpp \
            -fno-exceptions \
            -fno-rtti \
            -fno-stack-protector \
            -mkernel \
            -arch x86_64 \
            -mmacosx-version-min=11.0 \
            -isysroot "${SDK}" \
            -I"${MKSDK}/Headers" \
            -I"${SDK}/System/Library/Frameworks/Kernel.framework/Headers" \
            -I"${COMPAT}" \
            -I"${COMPAT}/linux" \
            -I"${KEXT_SRC}" \
            -fapple-kext \
            -std=c++17 \
            -DKERNEL \
            -D__IO80211_TARGET=__MAC_11_0 \
            -Wno-deprecated-declarations \
            -Wno-nullability-completeness

          echo
          echo "RTW88WiFiController is concrete: OK"

      - name: Create compile-probe report
        shell: bash
        run: |
          set -eu

          OUT="${RUNNER_TEMP}/RTW88-Native-WiFi-v9.0.0-Compile-Probe"

          rm -rf "${OUT}"
          mkdir -p "${OUT}"

          cp \
            Feixiao/src/kext/RTW88WiFiController.hpp \
            "${OUT}/"

          cp \
            Feixiao/src/kext/RTW88WiFiController.cpp \
            "${OUT}/"

          cp \
            Feixiao/build/native-probe/RTW88WiFiController.o \
            "${OUT}/"

          FEIXIAO_COMMIT="$(git -C Feixiao rev-parse HEAD)"
          SDK_COMMIT="$(git -C Feixiao/MacKernelSDK rev-parse HEAD)"
          RTW88_COMMIT="$(git -C rtw88-stable rev-parse HEAD)"

          cat > "${OUT}/RESULT.txt" <<EOF
          RTW88 Native Wi-Fi v9.0.0 Compile Probe

          RESULT:
          IO80211 foundation compiled successfully.

          This artifact is NOT an installable Wi-Fi kext.

          Purpose:
          Validate the RTW88WiFiController class against MacKernelSDK
          IO80211Controller / IO80211Interface ABI before integrating it
          into the working RTL8821CE driver.

          Feixiao:
          ${FEIXIAO_COMMIT}

          rtw88-stable:
          ${RTW88_COMMIT}

          MacKernelSDK:
          ${SDK_COMMIT}

          IO80211 target:
          __MAC_11_0

          Architecture:
          x86_64

          Next step after successful compile probe:
          bridge native Wi-Fi power ON/OFF to the existing RTW88IEEE80211
          power-control implementation without replacing the stable radio
          datapath.
          EOF

          cd "${OUT}"

          shasum \
            -a 256 \
            RTW88WiFiController.hpp \
            RTW88WiFiController.cpp \
            RTW88WiFiController.o \
            > SHA256SUMS.txt

          cat SHA256SUMS.txt

      - name: Package compile probe
        shell: bash
        run: |
          set -eu

          cd "${RUNNER_TEMP}"

          ZIP="RTW88_Native_WiFi_v9.0.0_Compile_Probe.zip"

          rm -f "${ZIP}"

          zip \
            -r \
            "${ZIP}" \
            RTW88-Native-WiFi-v9.0.0-Compile-Probe

          ls -lh "${ZIP}"

      - name: Upload compile probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: RTW88-Native-WiFi-v9.0.0-Compile-Probe
          path: ${{ runner.temp }}/RTW88_Native_WiFi_v9.0.0_Compile_Probe.zip
          if-no-files-found: error
          retention-days: 7
