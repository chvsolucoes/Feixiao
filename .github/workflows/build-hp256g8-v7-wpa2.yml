name: Build HP256G8 RTL8821CE v7 WPA2 Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      # ============================================================
      # 1. Feixiao base
      # ============================================================
      - name: Checkout Feixiao
        uses: actions/checkout@v4
        with:
          repository: thegwchr/Feixiao
          ref: e963f43188382eced4ef2fa75d19ce4db2315c68
          submodules: recursive
          path: Feixiao
          fetch-depth: 0

      # ============================================================
      # 2. rtw88-stable correspondente
      # ============================================================
      - name: Clone matching rtw88-stable
        run: |
          git clone https://github.com/thegwchr/rtw88-stable.git

          cd rtw88-stable

          git checkout \
            d029a677c49266fad86750714eb5612becd134d3

          echo "===== rtw88-stable ====="
          git rev-parse HEAD

      # ============================================================
      # 3. Patch HP256G8 v7
      # ============================================================
      - name: Apply HP256G8 v7 WPA2 fix
        working-directory: Feixiao
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          ieee = Path("src/kext/RTW88IEEE80211.cpp")
          pci = Path("src/kext/RTW88PCIDevice.cpp")
          compat = Path("src/compat/rtw88_compat.c")

          for f in (ieee, pci, compat):
              if not f.exists():
                  raise SystemExit(
                      f"ERROR: required source missing: {f}"
                  )

          c = ieee.read_text()
          p = pci.read_text()
          r = compat.read_text()

          print("=" * 65)
          print("HP256G8 RTL8821CE v7 WPA2 FIX")
          print("=" * 65)

          # ========================================================
          # CHECK 1 - DMA/TX fix must already exist
          # ========================================================

          if "IOGatedOutputQueue::withTarget" not in p:
              raise SystemExit(
                  "ERROR: IOGatedOutputQueue fix missing"
              )

          if "drainPendingFree()" not in p:
              raise SystemExit(
                  "ERROR: deferred DMA free fix missing"
              )

          print("DMA/TX serialization: OK")
          print("Deferred DMA free: OK")

          # ========================================================
          # PATCH 1
          # Never force the old 6 Mbps 5 GHz rate.
          # ========================================================

          if "rtwdev->dm_info.fix_rate = DESC_RATE6M;" in r:
              r = r.replace(
                  "rtwdev->dm_info.fix_rate = DESC_RATE6M;",
                  "rtwdev->dm_info.fix_rate = 0xFF;"
              )

              print("Removed fixed 6 Mbps rate")

          # ========================================================
          # PATCH 2
          # Keep maximum channel width at 40 MHz during WPA2 testing.
          # ========================================================

          if (
              "false && chip80 && "
              "vhtWidth == 1 && vhtSeg0 != 0"
          ) not in c:

              vht80_pattern = re.compile(
                  r'if\s*\(\s*'
                  r'chip80\s*&&\s*'
                  r'vhtWidth\s*==\s*1\s*&&\s*'
                  r'vhtSeg0\s*!=\s*0\s*'
                  r'\)\s*\{'
              )

              m = vht80_pattern.search(c)

              if not m:
                  raise SystemExit(
                      "ERROR: VHT 80 MHz negotiation block not found"
                  )

              replacement = (
                  "if (false && chip80 && "
                  "vhtWidth == 1 && vhtSeg0 != 0) {"
              )

              c = (
                  c[:m.start()] +
                  replacement +
                  c[m.end():]
              )

          print("Maximum width capped at 40 MHz")

          # ========================================================
          # PATCH 3
          #
          # WPA2 M4 Key Length
          #
          # Current driver:
          #
          #   key[3] = 0;
          #   key[4] = 16;
          #
          # For RSN message 4/4, Key Length must be 0.
          # ========================================================

          if "HP256G8 v7 M4 key_length=0" not in c:

              keylen_pattern = re.compile(
                  r'key\[3\]\s*=\s*0\s*;\s*'
                  r'key\[4\]\s*=\s*16\s*;'
                  r'\s*/\*\s*key length = 16 '
                  r'\(AES-128\)\s*\*/'
              )

              km = keylen_pattern.search(c)

              if not km:
                  raise SystemExit(
                      "ERROR: EAPOL key length assignment not found"
                  )

              new_keylen = r'''if (step == 4) {
        /*
         * HP256G8 v7:
         * RSN/WPA2 EAPOL-Key message 4/4 uses Key Length = 0.
         */
        key[3] = 0;
        key[4] = 0;

        IOLog(
            "rtw88: HP256G8 v7 M4 key_length=0\n"
        );
    } else {
        key[3] = 0;
        key[4] = 16;
    }'''

              c = (
                  c[:km.start()] +
                  new_keylen +
                  c[km.end():]
              )

          print("M4 Key Length fix: OK")

          # ========================================================
          # PATCH 4
          #
          # WPA2 M4 Key Nonce
          #
          # Existing code puts SNonce into every EAPOL-Key.
          # M4 must leave Key Nonce zero.
          # ========================================================

          if "HP256G8 v7 M4 nonce zeroed" not in c:

              nonce_pattern = re.compile(
                  r'memcpy\s*\(\s*'
                  r'key\s*\+\s*13\s*,\s*'
                  r'_snonce\s*,\s*32\s*'
                  r'\)\s*;'
                  r'\s*/\*[^\\n]*SNonce[^\\n]*\*/'
              )

              nm = nonce_pattern.search(c)

              if not nm:
                  # Fallback without depending on the comment.
                  nonce_pattern = re.compile(
                      r'memcpy\s*\(\s*'
                      r'key\s*\+\s*13\s*,\s*'
                      r'_snonce\s*,\s*32\s*'
                      r'\)\s*;'
                  )

                  nm = nonce_pattern.search(c)

              if not nm:
                  raise SystemExit(
                      "ERROR: outgoing EAPOL nonce assignment not found"
                  )

              new_nonce = r'''if (step == 4) {
        /*
         * HP256G8 v7:
         * EAPOL-Key message 4/4 has an all-zero Key Nonce.
         */
        memset(key + 13, 0, 32);

        IOLog(
            "rtw88: HP256G8 v7 M4 nonce zeroed\n"
        );
    } else {
        memcpy(key + 13, _snonce, 32);
    }'''

              c = (
                  c[:nm.start()] +
                  new_nonce +
                  c[nm.end():]
              )

          print("M4 nonce fix: OK")

          # ========================================================
          # PATCH 5 - CRITICAL
          #
          # Existing order:
          #
          #   install PTK
          #   install GTK
          #   send M4
          #
          # New order:
          #
          #   send M4
          #   short TX settle
          #   install PTK
          #   install GTK
          #
          # Regex intentionally ignores source indentation/wrapping.
          # ========================================================

          if "HP256G8 v7 sending EAPOL M4" not in c:

              m4_pattern = re.compile(
                  r'''
                  if\s*\(\s*!installKey\s*\(
                      \s*&_ptkConf\s*,
                      \s*true\s*,
                      \s*0\s*,
                      \s*WLAN_CIPHER_SUITE_CCMP\s*,
                      \s*_ptk\s*\+\s*32\s*,
                      \s*16\s*
                  \)\s*\)
                  \s*return\s*;

                  \s*uint32_t\s+groupCipher\s*=
                  \s*\(
                      _targetBSS\.group_cipher
                      \s*==\s*
                      WLAN_CIPHER_SUITE_TKIP
                  \)
                  \s*\?
                  \s*WLAN_CIPHER_SUITE_TKIP
                  \s*:
                  \s*WLAN_CIPHER_SUITE_CCMP
                  \s*;

                  \s*if\s*\(
                      \s*gtk_len
                      \s*&&
                      \s*!installKey\s*\(
                          \s*&_gtkConf\s*,
                          \s*false\s*,
                          \s*gtk_idx\s*,
                          \s*groupCipher\s*,
                          \s*gtk\s*,
                          \s*gtk_len\s*
                      \)
                  \s*\)
                  \s*return\s*;

                  \s*sendEAPOLKey\s*\(
                      \s*4\s*,
                      \s*_replayCtr\s*,
                      \s*false\s*,
                      \s*false\s*,
                      \s*true\s*
                  \)\s*;

                  \s*_state\s*=
                  \s*RTW88_STATE_CONNECTED
                  \s*;
                  ''',
                  re.VERBOSE |
                  re.MULTILINE |
                  re.DOTALL
              )

              mm = m4_pattern.search(c)

              if not mm:
                  print(
                      "Primary WPA2 regex did not match. "
                      "Trying source-structure fallback..."
                  )

                  # More tolerant fallback:
                  #
                  # Starts at the unique PTK installation following M3
                  # and ends at state=CONNECTED after sendEAPOLKey(4).
                  fallback = re.compile(
                      r'''
                      if\s*\(\s*!installKey\s*\(
                          \s*&_ptkConf
                          .*?
                          _ptk\s*\+\s*32
                          .*?
                      \)\s*\)
                      \s*return\s*;
                      .*?
                      sendEAPOLKey\s*\(
                          \s*4\s*,
                          \s*_replayCtr\s*,
                          \s*false\s*,
                          \s*false\s*,
                          \s*true\s*
                      \)\s*;
                      \s*_state\s*=
                      \s*RTW88_STATE_CONNECTED
                      \s*;
                      ''',
                      re.VERBOSE |
                      re.MULTILINE |
                      re.DOTALL
                  )

                  mm = fallback.search(c)

              if not mm:
                  raise SystemExit(
                      "ERROR: WPA2 PTK/GTK/M4 source block not found"
                  )

              new_m4 = r'''if (
            false
        ) {
            /*
             * Placeholder branch only to preserve a clear source boundary.
             * Never executed.
             */
        }

        /*
         * HP256G8 v7 WPA2 FIX
         *
         * Send EAPOL-Key message 4/4 BEFORE enabling the
         * pairwise CCMP hardware key.
         *
         * Otherwise M4 can be transmitted through the normal
         * protected data path and the AP never accepts completion
         * of the four-way handshake.
         */
        IOLog(
            "rtw88: HP256G8 v7 sending EAPOL M4 before PTK install\n"
        );

        sendEAPOLKey(
            4,
            _replayCtr,
            false,
            false,
            true
        );

        /*
         * txDataFrame() submits M4 through the serialized TX path.
         * Keep a short interval before enabling CCMP.
         */
        IOSleep(40);

        IOLog(
            "rtw88: HP256G8 v7 M4 submitted, installing PTK\n"
        );

        if (!installKey(
                &_ptkConf,
                true,
                0,
                WLAN_CIPHER_SUITE_CCMP,
                _ptk + 32,
                16))
            return;

        uint32_t groupCipher =
            (_targetBSS.group_cipher ==
             WLAN_CIPHER_SUITE_TKIP) ?
            WLAN_CIPHER_SUITE_TKIP :
            WLAN_CIPHER_SUITE_CCMP;

        if (
            gtk_len &&
            !installKey(
                &_gtkConf,
                false,
                gtk_idx,
                groupCipher,
                gtk,
                gtk_len
            )
        )
            return;

        IOLog(
            "rtw88: HP256G8 v7 PTK/GTK installed after M4\n"
        );

        _state = RTW88_STATE_CONNECTED;'''

              c = (
                  c[:mm.start()] +
                  new_m4 +
                  c[mm.end():]
              )

          print("M4/PTK/GTK ordering fix: OK")

          # ========================================================
          # PATCH 6
          #
          # Delay A-MPDU slightly after WPA2 completion.
          # ========================================================

          if "HP256G8 v7 WPA2 settle complete" not in c:

              ampdu_pattern = re.compile(
                  r'startTxAggregation\s*\(\s*\)\s*;'
                  r'\s*/\*[^\\n]*A-MPDU[^\\n]*\*/'
              )

              am = ampdu_pattern.search(c)

              if not am:
                  # More tolerant fallback.
                  ampdu_pattern = re.compile(
                      r'startTxAggregation\s*\(\s*\)\s*;'
                  )

                  # We want the first one after WPA2 CONNECTED area.
                  search_start = c.find(
                      "HP256G8 v7 PTK/GTK installed after M4"
                  )

                  if search_start < 0:
                      raise SystemExit(
                          "ERROR: could not locate patched WPA2 area"
                      )

                  am = ampdu_pattern.search(
                      c,
                      search_start
                  )

              if not am:
                  raise SystemExit(
                      "ERROR: WPA2 A-MPDU start call not found"
                  )

              new_ampdu = r'''/*
         * HP256G8 v7:
         * Give the AP time to commit the completed four-way
         * handshake before opening the BlockAck session.
         */
        IOSleep(100);

        IOLog(
            "rtw88: HP256G8 v7 WPA2 settle complete, starting A-MPDU\n"
        );

        startTxAggregation();'''

              c = (
                  c[:am.start()] +
                  new_ampdu +
                  c[am.end():]
              )

          print("A-MPDU post-WPA2 delay: OK")

          # ========================================================
          # PATCH 7
          #
          # Better M3 diagnostics.
          # ========================================================

          if "HP256G8 v7 received M3" not in c:

              m3_marker = re.compile(
                  r'\}\s*else\s+if\s*\(\s*is_m3\s*\)\s*\{'
              )

              m3 = m3_marker.search(c)

              if not m3:
                  raise SystemExit(
                      "ERROR: M3 handler not found"
                  )

              m3_replacement = r'''} else if (is_m3) {
        IOLog(
            "rtw88: HP256G8 v7 received M3 "
            "replay=%02x%02x%02x%02x%02x%02x%02x%02x\n",
            data[9],
            data[10],
            data[11],
            data[12],
            data[13],
            data[14],
            data[15],
            data[16]
        );'''

              c = (
                  c[:m3.start()] +
                  m3_replacement +
                  c[m3.end():]
              )

          print("M3 diagnostics: OK")

          # ========================================================
          # PATCH 8
          #
          # Explicit build identification.
          # ========================================================

          if "HP256G8 v7 WPA2 Fix active" not in c:

              chandef_marker = (
                  'IOLog("rtw88: connected chandef: '
                  '%u MHz (primary=%u cf1=%u)\\n",'
              )

              if chandef_marker not in c:
                  raise SystemExit(
                      "ERROR: connected chandef log marker not found"
                  )

              c = c.replace(
                  chandef_marker,
                  'IOLog("rtw88: HP256G8 v7 WPA2 Fix active\\n");\n'
                  '    ' +
                  chandef_marker,
                  1
              )

          print("v7 identification log: OK")

          # ========================================================
          # PATCH 9
          #
          # Conservative TX ring headroom from v6.
          # ========================================================

          p = p.replace(
              "static constexpr unsigned int "
              "kRTW88TxStallAvail = 96;",
              "static constexpr unsigned int "
              "kRTW88TxStallAvail = 128;"
          )

          p = p.replace(
              "static constexpr unsigned int "
              "kRTW88TxResumeAvail = 160;",
              "static constexpr unsigned int "
              "kRTW88TxResumeAvail = 192;"
          )

          print("TX ring headroom: OK")

          # ========================================================
          # FINAL VALIDATION BEFORE WRITING
          # ========================================================

          required_v7 = [
              "HP256G8 v7 WPA2 Fix active",
              "HP256G8 v7 received M3",
              "HP256G8 v7 M4 key_length=0",
              "HP256G8 v7 M4 nonce zeroed",
              "HP256G8 v7 sending EAPOL M4 before PTK install",
              "HP256G8 v7 M4 submitted, installing PTK",
              "HP256G8 v7 PTK/GTK installed after M4",
              "HP256G8 v7 WPA2 settle complete",
          ]

          for marker in required_v7:
              if marker not in c:
                  raise SystemExit(
                      f"ERROR: required v7 marker missing: {marker}"
                  )

          ieee.write_text(c)
          pci.write_text(p)
          compat.write_text(r)

          print()
          print("=" * 65)
          print("HP256G8 v7 WPA2 PATCH APPLIED SUCCESSFULLY")
          print("=" * 65)
          PY

          echo
          echo "========================================"
          echo " VERIFY V7 SOURCE "
          echo "========================================"

          grep -n \
            "HP256G8 v7" \
            src/kext/RTW88IEEE80211.cpp

          echo
          echo "========================================"
          echo " VERIFY DMA SERIALIZATION "
          echo "========================================"

          grep -n \
            "IOGatedOutputQueue::withTarget" \
            src/kext/RTW88PCIDevice.cpp

          echo
          echo "========================================"
          echo " VERIFY TX RING "
          echo "========================================"

          grep -n \
            "kRTW88TxStallAvail" \
            src/kext/RTW88PCIDevice.cpp

          grep -n \
            "kRTW88TxResumeAvail" \
            src/kext/RTW88PCIDevice.cpp

          echo
          echo "========================================"
          echo " VERIFY RATE "
          echo "========================================"

          grep -n \
            "fix_rate" \
            src/compat/rtw88_compat.c \
            | head -20

      # ============================================================
      # 4. Firmware
      # ============================================================
      - name: Download firmware
        run: |
          cd Feixiao/firmware

          for fw in \
            rtw8822b_fw.bin \
            rtw8822c_fw.bin \
            rtw8821c_fw.bin \
            rtw8821a_fw.bin \
            rtw8812a_fw.bin \
            rtw8814a_fw.bin
          do
            if [ ! -s "$fw" ]; then

              echo "Downloading $fw"

              curl \
                -L \
                --fail \
                "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtw88/$fw" \
                -o "$fw"

            fi
          done

          echo
          echo "===== Firmware ====="
          ls -lh *.bin

      # ============================================================
      # 5. Build environment
      # ============================================================
      - name: Show build environment
        run: |
          echo "===== macOS ====="
          sw_vers

          echo
          echo "===== Xcode ====="
          xcodebuild -version

          echo
          echo "===== clang ====="
          clang --version

          echo
          echo "===== Feixiao revision ====="
          cd Feixiao
          git rev-parse HEAD

          echo
          echo "===== rtw88-stable revision ====="
          cd ../rtw88-stable
          git rev-parse HEAD

      # ============================================================
      # 6. Build
      # ============================================================
      - name: Build HP256G8 v7
        working-directory: Feixiao
        run: |
          make clean || true

          echo
          echo "========================================"
          echo " HP256G8 RTL8821CE V7 WPA2 FIX "
          echo "========================================"

          make all

      # ============================================================
      # 7. Verify build output
      # ============================================================
      - name: Verify v7 binary
        run: |
          test \
            -d \
            Feixiao/build/out/rtw88.kext

          test \
            -f \
            Feixiao/build/out/rtw88ctl

          echo
          echo "===== KEXT ====="

          file \
            Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88

          echo
          echo "===== RTW88CTL ====="

          file \
            Feixiao/build/out/rtw88ctl

          echo
          echo "===== V7 BINARY MARKERS ====="

          strings \
            Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88 \
            | grep "HP256G8 v7"

          echo
          echo "===== WPA2/A-MPDU MARKERS ====="

          strings \
            Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88 \
            | grep -E \
              "WPA2 connected|EAPOL|ADDBA|A-MPDU" \
            | head -100 \
            || true

      # ============================================================
      # 8. Package
      # ============================================================
      - name: Package HP256G8 v7
        run: |
          OUT="${{ runner.temp }}/Feixiao-HP256G8-v7-WPA2-Fix"

          mkdir -p "$OUT"

          cp -R \
            Feixiao/build/out/rtw88.kext \
            "$OUT/"

          cp \
            Feixiao/build/out/rtw88ctl \
            "$OUT/"

          chmod +x \
            "$OUT/rtw88ctl"

          cat > "$OUT/BUILD-INFO.txt" <<'EOF'
          Feixiao HP 256 G8 / RTL8821CE
          ==============================================
          Build: v7 WPA2 Fix

          Feixiao:
          e963f43188382eced4ef2fa75d19ce4db2315c68

          rtw88-stable:
          d029a677c49266fad86750714eb5612becd134d3

          TARGET PROBLEM:
          ----------------------------------------------
          AP disconnect:
          deauth from AP, reason=15

          V7 WPA2 CHANGES:
          ----------------------------------------------

          1. M4 Key Length
             WPA2/RSN message 4/4 uses Key Length = 0.

          2. M4 Key Nonce
             WPA2/RSN message 4/4 uses zero Key Nonce.

          3. M4/PTK ordering
             EAPOL M4 is submitted BEFORE installing
             the hardware pairwise CCMP key.

          4. GTK ordering
             Group key installation happens after M4.

          5. A-MPDU settling
             BlockAck/A-MPDU begins shortly after WPA2
             handshake completion rather than at the
             exact same instant as M4.

          6. DMA/TX
             Native IOGatedOutputQueue serialization kept.

          7. DMA free
             Native deferred DMA free handling kept.

          8. Channel width
             Maximum 40 MHz during WPA2 validation.

          9. Rate
             No fixed 6 Mbps 5 GHz rate.

          EXPECTED LOG:
          ----------------------------------------------

          HP256G8 v7 WPA2 Fix active

          HP256G8 v7 received M3

          HP256G8 v7 M4 key_length=0

          HP256G8 v7 M4 nonce zeroed

          HP256G8 v7 sending EAPOL M4 before PTK install

          HP256G8 v7 M4 submitted, installing PTK

          HP256G8 v7 PTK/GTK installed after M4

          HP256G8 v7 WPA2 settle complete, starting A-MPDU

          TEST OBJECTIVE:
          ----------------------------------------------

          The AP must NOT produce:

          deauth from AP, reason=15

          after the four-way handshake.

          IMPORTANT:
          ----------------------------------------------

          Experimental driver.

          Keep your known-working previous kext outside
          EFI/OC/Kexts as backup.

          rtw88.kext and rtw88ctl from this artifact
          must be used together.
          EOF

          cd "${{ runner.temp }}"

          zip \
            -r \
            Feixiao_HP256G8_v7_WPA2_Fix.zip \
            Feixiao-HP256G8-v7-WPA2-Fix

      # ============================================================
      # 9. Upload artifact
      # ============================================================
      - name: Upload HP256G8 v7
        uses: actions/upload-artifact@v4
        with:
          name: Feixiao-HP256G8-v7-WPA2-Fix
          path: ${{ runner.temp }}/Feixiao_HP256G8_v7_WPA2_Fix.zip
          retention-days: 7
