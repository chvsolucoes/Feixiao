name: Build HP256G8 RTL8821CE v7 WPA2 Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      # ============================================================
      # 1. Feixiao base da v6
      # ============================================================
      - name: Checkout Feixiao
        uses: actions/checkout@v4
        with:
          repository: thegwchr/Feixiao
          ref: e963f43188382eced4ef2fa75d19ce4db2315c68
          submodules: recursive
          path: Feixiao
          fetch-depth: 0

      # ============================================================
      # 2. rtw88-stable correspondente
      # ============================================================
      - name: Clone matching rtw88-stable
        run: |
          git clone \
            https://github.com/thegwchr/rtw88-stable.git

          cd rtw88-stable

          git checkout \
            d029a677c49266fad86750714eb5612becd134d3

          echo "rtw88-stable:"
          git rev-parse HEAD

      # ============================================================
      # 3. Aplicar correções HP256G8 v7
      # ============================================================
      - name: Apply HP256G8 v7 WPA2 fix
        working-directory: Feixiao
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          ieee = Path("src/kext/RTW88IEEE80211.cpp")
          pci  = Path("src/kext/RTW88PCIDevice.cpp")
          compat = Path("src/compat/rtw88_compat.c")

          for f in (ieee, pci, compat):
              if not f.exists():
                  raise SystemExit(
                      f"ERROR: required source missing: {f}"
                  )

          c = ieee.read_text()
          p = pci.read_text()
          r = compat.read_text()

          print("=" * 60)
          print("HP256G8 RTL8821CE v7 WPA2 FIX")
          print("=" * 60)

          # ========================================================
          # CHECK: manter correção DMA da v6
          # ========================================================

          if "IOGatedOutputQueue::withTarget" not in p:
              raise SystemExit(
                  "ERROR: native IOGatedOutputQueue fix missing"
              )

          if "drainPendingFree()" not in p:
              raise SystemExit(
                  "ERROR: deferred DMA free fix missing"
              )

          print("DMA/TX serialized path: OK")

          # ========================================================
          # PATCH 1
          #
          # Rate adaptation:
          # nunca permitir trava antiga de 6 Mbps.
          # ========================================================

          r = r.replace(
              "rtwdev->dm_info.fix_rate = DESC_RATE6M;",
              "rtwdev->dm_info.fix_rate = 0xFF;"
          )

          # ========================================================
          # PATCH 2
          #
          # Manter largura máxima em 40 MHz durante este teste.
          # O foco da v7 é WPA2, não velocidade máxima ainda.
          # ========================================================

          vht80_pattern = (
              r'if\s*\(\s*chip80\s*&&\s*'
              r'vhtWidth\s*==\s*1\s*&&\s*'
              r'vhtSeg0\s*!=\s*0\s*\)\s*\{'
          )

          m = re.search(vht80_pattern, c)

          if m:
              c = (
                  c[:m.start()] +
                  "if (false && chip80 && "
                  "vhtWidth == 1 && vhtSeg0 != 0) {" +
                  c[m.end():]
              )
              print("80 MHz capped to 40 MHz")
          elif (
              "false && chip80 && "
              "vhtWidth == 1 && vhtSeg0 != 0"
          ) not in c:
              raise SystemExit(
                  "ERROR: VHT80 negotiation block not found"
              )

          # ========================================================
          # PATCH 3 - CRITICAL
          #
          # sendEAPOLKey currently writes:
          #
          #   key[3] = 0;
          #   key[4] = 16;
          #
          # for every EAPOL-Key.
          #
          # RSN/WPA2 M4 must use Key Length = 0.
          # M2 keeps AES key length 16.
          # ========================================================

          old_keylen = (
              "    key[3] = 0; key[4] = 16; "
              "/* key length = 16 (AES-128) */"
          )

          new_keylen = """    /*
               * HP256G8 v7 WPA2:
               *
               * RSN message 4/4 must advertise Key Length = 0.
               * Message 2/4 keeps the pairwise AES key length.
               */
              if (step == 4) {
                  key[3] = 0;
                  key[4] = 0;

                  IOLog(
                      "rtw88: HP256G8 v7 M4 key_length=0\\n"
                  );
              } else {
                  key[3] = 0;
                  key[4] = 16;
              }"""

          if "HP256G8 v7 M4 key_length=0" not in c:
              if old_keylen not in c:
                  raise SystemExit(
                      "ERROR: EAPOL key-length block not found"
                  )

              c = c.replace(
                  old_keylen,
                  new_keylen,
                  1
              )

          # ========================================================
          # PATCH 4 - CRITICAL
          #
          # Existing code copies SNonce into every outgoing
          # EAPOL-Key:
          #
          # memcpy(key + 13, _snonce, 32)
          #
          # M4 must leave Key Nonce zeroed.
          # ========================================================

          nonce_pattern = re.compile(
              r'memcpy\s*\(\s*key\s*\+\s*13\s*,\s*'
              r'_snonce\s*,\s*32\s*\)\s*;'
          )

          nonce_match = nonce_pattern.search(c)

          if nonce_match:
              replacement = """if (step == 4) {
                  /*
                   * Message 4/4 has no nonce.
                   * frame[] was zero-initialized, so keep these
                   * 32 bytes zero.
                   */
                  memset(key + 13, 0, 32);

                  IOLog(
                      "rtw88: HP256G8 v7 M4 nonce zeroed\\n"
                  );
              } else {
                  memcpy(key + 13, _snonce, 32);
              }"""

              c = (
                  c[:nonce_match.start()] +
                  replacement +
                  c[nonce_match.end():]
              )

          elif "HP256G8 v7 M4 nonce zeroed" not in c:
              raise SystemExit(
                  "ERROR: EAPOL nonce block not found"
              )

          # ========================================================
          # PATCH 5 - MOST IMPORTANT
          #
          # Current flow:
          #
          # install PTK
          # install GTK
          # send M4
          #
          # This can cause M4 to go through the normal CCMP protected
          # data path.
          #
          # Reference WPA supplicant sends M4 BEFORE installing PTK.
          #
          # Reorder this block.
          # ========================================================

          old_m4_block = """        if (!installKey(&_ptkConf, true, 0,
                                      WLAN_CIPHER_SUITE_CCMP,
                                      _ptk + 32, 16))
                  return;

              uint32_t groupCipher =
                  (_targetBSS.group_cipher == WLAN_CIPHER_SUITE_TKIP) ?
                  WLAN_CIPHER_SUITE_TKIP : WLAN_CIPHER_SUITE_CCMP;
              if (gtk_len && !installKey(&_gtkConf, false, gtk_idx, groupCipher,
                                         gtk, gtk_len))
                  return;

              sendEAPOLKey(4, _replayCtr, false, false, true);
              _state = RTW88_STATE_CONNECTED;"""

          new_m4_block = """        /*
               * HP256G8 v7 WPA2 handshake fix
               *
               * Send message 4/4 BEFORE installing the hardware PTK.
               * This prevents M4 from accidentally entering the regular
               * CCMP-encrypted data path.
               */
              IOLog(
                  "rtw88: HP256G8 v7 sending EAPOL M4 "
                  "before PTK install\\n"
              );

              sendEAPOLKey(
                  4,
                  _replayCtr,
                  false,
                  false,
                  true
              );

              /*
               * Give the gated TX queue time to submit M4 to hardware
               * before enabling the pairwise cipher.
               *
               * This is intentionally small; it is not an association
               * timeout and keeps the handshake responsive.
               */
              IOSleep(40);

              IOLog(
                  "rtw88: HP256G8 v7 M4 submitted, "
                  "installing PTK\\n"
              );

              if (!installKey(
                      &_ptkConf,
                      true,
                      0,
                      WLAN_CIPHER_SUITE_CCMP,
                      _ptk + 32,
                      16))
                  return;

              uint32_t groupCipher =
                  (_targetBSS.group_cipher ==
                   WLAN_CIPHER_SUITE_TKIP) ?
                  WLAN_CIPHER_SUITE_TKIP :
                  WLAN_CIPHER_SUITE_CCMP;

              if (gtk_len &&
                  !installKey(
                      &_gtkConf,
                      false,
                      gtk_idx,
                      groupCipher,
                      gtk,
                      gtk_len))
                  return;

              IOLog(
                  "rtw88: HP256G8 v7 PTK/GTK installed "
                  "after M4\\n"
              );

              _state = RTW88_STATE_CONNECTED;"""

          if "HP256G8 v7 sending EAPOL M4" not in c:
              if old_m4_block not in c:
                  raise SystemExit(
                      "ERROR: WPA2 M3/M4 install block "
                      "not found exactly"
                  )

              c = c.replace(
                  old_m4_block,
                  new_m4_block,
                  1
              )

          # ========================================================
          # PATCH 6
          #
          # A-MPDU should not start immediately on the same instant
          # as M4/PTK installation.
          #
          # Give the AP a brief interval to finish 4-way handshake.
          # ========================================================

          old_ampdu = (
              "        startTxAggregation();   "
              "/* keys are installed — negotiate uplink A-MPDU */"
          )

          new_ampdu = """        /*
               * Do not negotiate BlockAck at the exact same moment as M4.
               * Let the AP commit the WPA2 state first.
               */
              IOSleep(100);

              IOLog(
                  "rtw88: HP256G8 v7 WPA2 settle complete, "
                  "starting A-MPDU\\n"
              );

              startTxAggregation();"""

          if "HP256G8 v7 WPA2 settle complete" not in c:
              if old_ampdu not in c:
                  raise SystemExit(
                      "ERROR: A-MPDU start block not found"
                  )

              c = c.replace(
                  old_ampdu,
                  new_ampdu,
                  1
              )

          # ========================================================
          # PATCH 7
          #
          # Better diagnostics for received M3.
          # ========================================================

          m3_marker = (
              "    } else if (is_m3) {"
          )

          if (
              "HP256G8 v7 received M3" not in c
              and m3_marker in c
          ):
              c = c.replace(
                  m3_marker,
                  """    } else if (is_m3) {
              IOLog(
                  "rtw88: HP256G8 v7 received M3, "
                  "replay=%02x%02x%02x%02x%02x%02x%02x%02x\\n",
                  data[9], data[10], data[11], data[12],
                  data[13], data[14], data[15], data[16]
              );""",
                  1
              )

          # ========================================================
          # PATCH 8
          #
          # Identification log.
          # ========================================================

          chandef_log = (
              'IOLog("rtw88: connected chandef: '
              '%u MHz (primary=%u cf1=%u)\\n",'
          )

          if (
              "HP256G8 v7 WPA2 Fix active" not in c
              and chandef_log in c
          ):
              c = c.replace(
                  chandef_log,
                  'IOLog("rtw88: HP256G8 v7 WPA2 Fix active\\n");\n'
                  '    ' + chandef_log,
                  1
              )

          # ========================================================
          # TX ring conservador da v6
          # ========================================================

          p = p.replace(
              "static constexpr unsigned int "
              "kRTW88TxStallAvail = 96;",
              "static constexpr unsigned int "
              "kRTW88TxStallAvail = 128;"
          )

          p = p.replace(
              "static constexpr unsigned int "
              "kRTW88TxResumeAvail = 160;",
              "static constexpr unsigned int "
              "kRTW88TxResumeAvail = 192;"
          )

          ieee.write_text(c)
          pci.write_text(p)
          compat.write_text(r)

          print()
          print("========================================")
          print("V7 WPA2 FIX APPLIED SUCCESSFULLY")
          print("========================================")
          PY

          echo
          echo "========= VERIFY V7 ========="

          grep -n \
            "HP256G8 v7" \
            src/kext/RTW88IEEE80211.cpp

          echo
          echo "========= VERIFY M4 ========="

          grep -n \
            -A 25 \
            -B 10 \
            "M4 key_length=0" \
            src/kext/RTW88IEEE80211.cpp

          echo
          echo "========= VERIFY DMA ========="

          grep -n \
            "IOGatedOutputQueue::withTarget" \
            src/kext/RTW88PCIDevice.cpp

          echo
          echo "========= VERIFY RATE ========="

          grep -n \
            "fix_rate" \
            src/compat/rtw88_compat.c \
            | head -20

      # ============================================================
      # 4. Firmware
      # ============================================================
      - name: Download firmware
        run: |
          cd Feixiao/firmware

          for fw in \
            rtw8822b_fw.bin \
            rtw8822c_fw.bin \
            rtw8821c_fw.bin \
            rtw8821a_fw.bin \
            rtw8812a_fw.bin \
            rtw8814a_fw.bin
          do
            if [ ! -s "$fw" ]; then
              echo "Downloading $fw"

              curl \
                -L \
                --fail \
                "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtw88/$fw" \
                -o "$fw"
            fi
          done

      # ============================================================
      # 5. Environment
      # ============================================================
      - name: Show revisions
        run: |
          echo "===== Feixiao ====="
          cd Feixiao
          git rev-parse HEAD

          echo
          echo "===== rtw88-stable ====="
          cd ../rtw88-stable
          git rev-parse HEAD

          echo
          echo "===== Xcode ====="
          xcodebuild -version

      # ============================================================
      # 6. Build
      # ============================================================
      - name: Build HP256G8 v7
        working-directory: Feixiao
        run: |
          make clean || true

          echo
          echo "========================================"
          echo " BUILD HP256G8 RTL8821CE V7 WPA2 FIX "
          echo "========================================"

          make all

      # ============================================================
      # 7. Verify binary
      # ============================================================
      - name: Verify v7 binary
        run: |
          test \
            -d \
            Feixiao/build/out/rtw88.kext

          test \
            -f \
            Feixiao/build/out/rtw88ctl

          echo "===== MACH-O ====="

          file \
            Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88

          echo
          echo "===== V7 STRINGS ====="

          strings \
            Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88 \
            | grep "HP256G8 v7"

          echo
          echo "===== WPA2 STRINGS ====="

          strings \
            Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88 \
            | grep -E \
              "WPA2 connected|EAPOL|ADDBA" \
            | head -80 \
            || true

      # ============================================================
      # 8. Package
      # ============================================================
      - name: Package HP256G8 v7
        run: |
          OUT="${{ runner.temp }}/Feixiao-HP256G8-v7-WPA2-Fix"

          mkdir -p "$OUT"

          cp -R \
            Feixiao/build/out/rtw88.kext \
            "$OUT/"

          cp \
            Feixiao/build/out/rtw88ctl \
            "$OUT/"

          chmod +x \
            "$OUT/rtw88ctl"

          cat > "$OUT/BUILD-INFO.txt" <<'EOF'
          Feixiao HP 256 G8 / RTL8821CE
          =========================================
          Build: v7 WPA2 Fix

          Feixiao:
          e963f43188382eced4ef2fa75d19ce4db2315c68

          rtw88-stable:
          d029a677c49266fad86750714eb5612becd134d3

          FIXES:

          1. WPA2/RSN M4 Key Length:
             M4 now uses Key Length = 0.

          2. WPA2 M4 Key Nonce:
             M4 now leaves Key Nonce zero.

          3. WPA2 PTK install ordering:
             M4 is transmitted BEFORE installing the
             hardware pairwise CCMP key.

          4. WPA2 settling:
             A-MPDU negotiation starts after the M4/PTK
             transition instead of at the exact same moment.

          5. DMA:
             native IOGatedOutputQueue serialization retained.

          6. Channel:
             maximum 40 MHz during WPA2 validation.

          TARGET PROBLEM:
             deauth from AP, reason=15

          EXPECTED LOG:

             HP256G8 v7 WPA2 Fix active
             HP256G8 v7 received M3
             HP256G8 v7 M4 key_length=0
             HP256G8 v7 M4 nonce zeroed
             HP256G8 v7 sending EAPOL M4 before PTK install
             HP256G8 v7 M4 submitted, installing PTK
             HP256G8 v7 PTK/GTK installed after M4
             HP256G8 v7 WPA2 settle complete

          Keep the known-working backup kext.
          EOF

          cd "${{ runner.temp }}"

          zip \
            -r \
            Feixiao_HP256G8_v7_WPA2_Fix.zip \
            Feixiao-HP256G8-v7-WPA2-Fix

      # ============================================================
      # 9. Upload
      # ============================================================
      - name: Upload HP256G8 v7
        uses: actions/upload-artifact@v4
        with:
          name: Feixiao-HP256G8-v7-WPA2-Fix
          path: ${{ runner.temp }}/Feixiao_HP256G8_v7_WPA2_Fix.zip
          retention-days: 7
