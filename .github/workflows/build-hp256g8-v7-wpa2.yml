name: Build HP256G8 RTL8821CE v7 WPA2 Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Feixiao
        uses: actions/checkout@v4
        with:
          repository: thegwchr/Feixiao
          ref: e963f43188382eced4ef2fa75d19ce4db2315c68
          submodules: recursive
          path: Feixiao
          fetch-depth: 0

      - name: Clone matching rtw88-stable
        run: |
          git clone https://github.com/thegwchr/rtw88-stable.git
          cd rtw88-stable
          git checkout d029a677c49266fad86750714eb5612becd134d3
          git rev-parse HEAD

      - name: Apply HP256G8 v7 WPA2 fix
        working-directory: Feixiao
        shell: bash
        run: |
          cat > /tmp/patch_v7.py <<'PY'
          from pathlib import Path

          ieee = Path("src/kext/RTW88IEEE80211.cpp")
          pci = Path("src/kext/RTW88PCIDevice.cpp")
          compat = Path("src/compat/rtw88_compat.c")

          for f in (ieee, pci, compat):
              if not f.exists():
                  raise SystemExit(f"ERROR: missing source file: {f}")

          c = ieee.read_text()
          p = pci.read_text()
          r = compat.read_text()

          print("=== HP256G8 RTL8821CE v7 WPA2 FIX ===")

          # Keep the DMA/TX fixes that worked better in v6.
          if "IOGatedOutputQueue::withTarget" not in p:
              raise SystemExit("ERROR: IOGatedOutputQueue fix missing")
          if "drainPendingFree()" not in p:
              raise SystemExit("ERROR: deferred DMA free fix missing")

          # Do not pin 5 GHz traffic to 6 Mbps.
          r = r.replace(
              "rtwdev->dm_info.fix_rate = DESC_RATE6M;",
              "rtwdev->dm_info.fix_rate = 0xFF;"
          )

          # Keep 40 MHz maximum during WPA2 validation.
          old80 = "if (chip80 && vhtWidth == 1 && vhtSeg0 != 0) {"
          new80 = "if (false && chip80 && vhtWidth == 1 && vhtSeg0 != 0) {"
          if new80 not in c:
              if old80 not in c:
                  raise SystemExit("ERROR: VHT80 negotiation block not found")
              c = c.replace(old80, new80, 1)

          # M4: RSN key length must be zero.
          old_keylen = "    key[3] = 0; key[4] = 16; /* key length = 16 (AES-128) */"
          new_keylen = '''    if (step == 4) {
              key[3] = 0;
              key[4] = 0;
              IOLog("rtw88: HP256G8 v7 M4 key_length=0\\n");
          } else {
              key[3] = 0;
              key[4] = 16;
          }'''
          if "HP256G8 v7 M4 key_length=0" not in c:
              if old_keylen not in c:
                  raise SystemExit("ERROR: EAPOL key length line not found")
              c = c.replace(old_keylen, new_keylen, 1)

          # M4: leave Key Nonce all-zero instead of copying SNonce.
          old_nonce = "    memcpy(key + 13, _snonce, 32);       /* key[13..44] = SNonce */"
          new_nonce = '''    if (step == 4) {
              memset(key + 13, 0, 32);
              IOLog("rtw88: HP256G8 v7 M4 nonce zeroed\\n");
          } else {
              memcpy(key + 13, _snonce, 32);
          }'''
          if "HP256G8 v7 M4 nonce zeroed" not in c:
              if old_nonce not in c:
                  raise SystemExit("ERROR: EAPOL nonce line not found")
              c = c.replace(old_nonce, new_nonce, 1)

          # Exact source block from Feixiao e963f431.
          # Send M4 BEFORE installing PTK/GTK.
          old_order = '''        if (!installKey(&_ptkConf, true, 0, WLAN_CIPHER_SUITE_CCMP,
                          _ptk + 32, 16))
              return;
          uint32_t groupCipher = (_targetBSS.group_cipher == WLAN_CIPHER_SUITE_TKIP) ?
              WLAN_CIPHER_SUITE_TKIP : WLAN_CIPHER_SUITE_CCMP;
          if (gtk_len && !installKey(&_gtkConf, false, gtk_idx, groupCipher,
                                     gtk, gtk_len))
              return;

          sendEAPOLKey(4, _replayCtr, false, false, true);
          _state = RTW88_STATE_CONNECTED;'''

          new_order = '''        IOLog("rtw88: HP256G8 v7 sending EAPOL M4 before PTK install\\n");
          sendEAPOLKey(4, _replayCtr, false, false, true);

          /* Let the serialized TX path submit M4 before enabling CCMP. */
          IOSleep(40);
          IOLog("rtw88: HP256G8 v7 M4 submitted, installing PTK\\n");

          if (!installKey(&_ptkConf, true, 0, WLAN_CIPHER_SUITE_CCMP,
                          _ptk + 32, 16))
              return;

          uint32_t groupCipher = (_targetBSS.group_cipher == WLAN_CIPHER_SUITE_TKIP) ?
              WLAN_CIPHER_SUITE_TKIP : WLAN_CIPHER_SUITE_CCMP;
          if (gtk_len && !installKey(&_gtkConf, false, gtk_idx, groupCipher,
                                     gtk, gtk_len))
              return;

          IOLog("rtw88: HP256G8 v7 PTK/GTK installed after M4\\n");
          _state = RTW88_STATE_CONNECTED;'''

          if "HP256G8 v7 sending EAPOL M4 before PTK install" not in c:
              if old_order not in c:
                  raise SystemExit("ERROR: exact WPA2 PTK/GTK/M4 block not found")
              c = c.replace(old_order, new_order, 1)

          # Start aggregation only after a short WPA2 settle interval.
          old_ampdu = "        startTxAggregation();   /* keys are installed — negotiate uplink A-MPDU */"
          new_ampdu = '''        IOSleep(100);
          IOLog("rtw88: HP256G8 v7 WPA2 settle complete, starting A-MPDU\\n");
          startTxAggregation();'''
          if "HP256G8 v7 WPA2 settle complete" not in c:
              if old_ampdu not in c:
                  raise SystemExit("ERROR: WPA2 A-MPDU start line not found")
              c = c.replace(old_ampdu, new_ampdu, 1)

          # Add an explicit build marker near the chandef log.
          old_log = '    IOLog("rtw88: connected chandef: %u MHz (primary=%u cf1=%u)\\n",'
          new_log = '    IOLog("rtw88: HP256G8 v7 WPA2 Fix active\\n");\n' + old_log
          if "HP256G8 v7 WPA2 Fix active" not in c:
              if old_log not in c:
                  raise SystemExit("ERROR: connected chandef log not found")
              c = c.replace(old_log, new_log, 1)

          # Preserve conservative TX ring headroom from v6.
          p = p.replace(
              "static constexpr unsigned int kRTW88TxStallAvail = 96;",
              "static constexpr unsigned int kRTW88TxStallAvail = 128;"
          )
          p = p.replace(
              "static constexpr unsigned int kRTW88TxResumeAvail = 160;",
              "static constexpr unsigned int kRTW88TxResumeAvail = 192;"
          )

          # Final validation.
          required = [
              "HP256G8 v7 WPA2 Fix active",
              "HP256G8 v7 M4 key_length=0",
              "HP256G8 v7 M4 nonce zeroed",
              "HP256G8 v7 sending EAPOL M4 before PTK install",
              "HP256G8 v7 M4 submitted, installing PTK",
              "HP256G8 v7 PTK/GTK installed after M4",
              "HP256G8 v7 WPA2 settle complete",
          ]
          for marker in required:
              if marker not in c:
                  raise SystemExit(f"ERROR: missing v7 marker: {marker}")

          ieee.write_text(c)
          pci.write_text(p)
          compat.write_text(r)

          print("v7 source patch applied successfully")
          PY

          python3 /tmp/patch_v7.py

          echo "===== VERIFY V7 SOURCE ====="
          grep -n "HP256G8 v7" src/kext/RTW88IEEE80211.cpp
          echo "===== VERIFY DMA ====="
          grep -n "IOGatedOutputQueue::withTarget" src/kext/RTW88PCIDevice.cpp
          echo "===== VERIFY TX RING ====="
          grep -n "kRTW88TxStallAvail\|kRTW88TxResumeAvail" src/kext/RTW88PCIDevice.cpp

      - name: Download firmware
        run: |
          cd Feixiao/firmware
          for fw in \
            rtw8822b_fw.bin \
            rtw8822c_fw.bin \
            rtw8821c_fw.bin \
            rtw8821a_fw.bin \
            rtw8812a_fw.bin \
            rtw8814a_fw.bin
          do
            if [ ! -s "$fw" ]; then
              curl -L --fail \
                "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtw88/$fw" \
                -o "$fw"
            fi
          done

      - name: Build HP256G8 v7
        working-directory: Feixiao
        run: |
          make clean || true
          make all

      - name: Verify binary
        run: |
          test -d Feixiao/build/out/rtw88.kext
          test -f Feixiao/build/out/rtw88ctl

          file Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88
          file Feixiao/build/out/rtw88ctl

          echo "===== V7 BINARY MARKERS ====="
          strings Feixiao/build/out/rtw88.kext/Contents/MacOS/rtw88 \
            | grep "HP256G8 v7"

      - name: Package
        run: |
          OUT="${{ runner.temp }}/Feixiao-HP256G8-v7-WPA2-Fix"
          mkdir -p "$OUT"

          cp -R Feixiao/build/out/rtw88.kext "$OUT/"
          cp Feixiao/build/out/rtw88ctl "$OUT/"
          chmod +x "$OUT/rtw88ctl"

          cat > "$OUT/BUILD-INFO.txt" <<'EOF'
          Feixiao HP 256 G8 / RTL8821CE
          =========================================
          Build: v7 WPA2 Fix

          Feixiao:
          e963f43188382eced4ef2fa75d19ce4db2315c68

          rtw88-stable:
          d029a677c49266fad86750714eb5612becd134d3

          Fixes under test:
          - keep native IOGatedOutputQueue TX serialization
          - keep deferred DMA free handling
          - no fixed 6 Mbps 5 GHz rate
          - maximum 40 MHz during WPA2 validation
          - M4 RSN Key Length = 0
          - M4 Key Nonce = zero
          - send M4 before installing hardware PTK/GTK
          - short WPA2 settle before A-MPDU

          Target symptom:
          deauth from AP, reason=15

          Expected v7 logs:
          HP256G8 v7 WPA2 Fix active
          HP256G8 v7 M4 key_length=0
          HP256G8 v7 M4 nonce zeroed
          HP256G8 v7 sending EAPOL M4 before PTK install
          HP256G8 v7 M4 submitted, installing PTK
          HP256G8 v7 PTK/GTK installed after M4
          HP256G8 v7 WPA2 settle complete, starting A-MPDU

          Experimental build. Keep your known-working backup kext.
          Use rtw88.kext and rtw88ctl from this same artifact together.
          EOF

          cd "${{ runner.temp }}"
          zip -r Feixiao_HP256G8_v7_WPA2_Fix.zip Feixiao-HP256G8-v7-WPA2-Fix

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Feixiao-HP256G8-v7-WPA2-Fix
          path: ${{ runner.temp }}/Feixiao_HP256G8_v7_WPA2_Fix.zip
          retention-days: 7
