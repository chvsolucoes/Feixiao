name: Build HP256G8 80MHz Test v2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Feixiao v1.0.2
        uses: actions/checkout@v4
        with:
          repository: thegwchr/Feixiao
          ref: v1.0.2
          submodules: recursive
          path: Feixiao
          fetch-depth: 0

      - name: Apply HP256G8 40/80 MHz patch v2
        working-directory: Feixiao
        run: |
          python3 <<'PY'
          from pathlib import Path

          cpp = Path("src/kext/RTW88IEEE80211.cpp")
          hpp = Path("src/kext/RTW88IEEE80211.hpp")

          c = cpp.read_text()
          h = hpp.read_text()

          #
          # 1. Adiciona declaração do método na classe v1.0.2
          #
          decl_marker = "void restoreConnectedChannel();"

          if decl_marker not in h:
              raise SystemExit(
                  "ERROR: restoreConnectedChannel declaration not found"
              )

          if "void setConnectedChandef(" not in h:
              h = h.replace(
                  decl_marker,
                  decl_marker +
                  "\n    void setConnectedChandef(struct ieee80211_channel *chan);"
              )

          #
          # 2. Adiciona variável para acompanhar largura do canal.
          #    Na v1.0.2 usamos _txSeq como marcador confiável.
          #
          width_marker = "uint16_t _txSeq = 0;"

          if width_marker not in h:
              raise SystemExit(
                  "ERROR: _txSeq marker not found in v1.0.2 header"
              )

          if "_connChanWidth" not in h:
              h = h.replace(
                  width_marker,
                  "uint32_t _connChanWidth = 20;\n"
                  "    " + width_marker
              )

          #
          # 3. Função adaptada especificamente para a v1.0.2.
          #
          insert_marker = (
              "void RTW88IEEE80211::restoreConnectedChannel()"
          )

          if insert_marker not in c:
              raise SystemExit(
                  "ERROR: restoreConnectedChannel implementation not found"
              )

          if (
              "void RTW88IEEE80211::setConnectedChandef("
              not in c
          ):
              func = r'''
          void RTW88IEEE80211::setConnectedChandef(
              struct ieee80211_channel *chan)
          {
              if (!chan || !_hw || !_hw->wiphy)
                  return;

              /*
               * Safe fallback:
               * start at 20 MHz exactly like v1.0.2.
               */
              _hw->conf.chandef.chan = chan;
              _hw->conf.chandef.width =
                  NL80211_CHAN_WIDTH_20_NOHT;
              _hw->conf.chandef.center_freq1 =
                  chan->center_freq;

              _connChanWidth = 20;

              enum nl80211_band band =
                  (_targetBSS.channel > 14)
                      ? NL80211_BAND_5GHZ
                      : NL80211_BAND_2GHZ;

              struct ieee80211_supported_band *sband =
                  _hw->wiphy->bands[band];

              if (!sband) {
                  IOLog(
                      "rtw88: HP256G8: no supported band, using 20 MHz\n"
                  );
                  return;
              }

              /*
               * Capability of the RTL8821CE/driver.
               */
              bool can40 =
                  (sband->ht_cap.cap &
                   IEEE80211_HT_CAP_SUP_WIDTH_20_40) != 0;

              bool can80 =
                  can40 &&
                  band == NL80211_BAND_5GHZ &&
                  sband->vht_cap.vht_supported;

              int secondaryOffset = 0;
              bool apAllows40 = false;

              int vhtWidth = 0;
              uint8_t vhtCenterSeg0 = 0;

              const uint8_t *ies = _targetBSS.ies;
              uint16_t iesLen = _targetBSS.ies_len;

              /*
               * Read AP HT Operation and VHT Operation IEs.
               */
              for (uint16_t i = 0; i + 2 <= iesLen;) {
                  uint8_t id = ies[i];
                  uint8_t len = ies[i + 1];

                  if (
                      (uint32_t)i + 2U + (uint32_t)len >
                      (uint32_t)iesLen
                  ) {
                      break;
                  }

                  const uint8_t *data =
                      ies + i + 2;

                  if (
                      id == WLAN_EID_HT_OPERATION &&
                      len >= 2
                  ) {
                      /*
                       * HT Operation byte 1:
                       * bits 0-1 secondary-channel offset.
                       * bit 2 STA channel width.
                       */
                      secondaryOffset =
                          data[1] & 0x03;

                      apAllows40 =
                          (data[1] & 0x04) != 0;
                  }
                  else if (
                      id == WLAN_EID_VHT_OPERATION &&
                      len >= 3
                  ) {
                      vhtWidth =
                          data[0];

                      vhtCenterSeg0 =
                          data[1];
                  }

                  i += 2 + len;
              }

              /*
               * Try HT40 first.
               *
               * secondaryOffset:
               *   1 = secondary channel above
               *   3 = secondary channel below
               */
              if (
                  can40 &&
                  apAllows40 &&
                  (
                      secondaryOffset == 1 ||
                      secondaryOffset == 3
                  )
              ) {
                  _connChanWidth = 40;

                  _hw->conf.chandef.width =
                      NL80211_CHAN_WIDTH_40;

                  int center =
                      (int)chan->center_freq +
                      (
                          secondaryOffset == 1
                              ? 10
                              : -10
                      );

                  _hw->conf.chandef.center_freq1 =
                      (uint32_t)center;
              }

              /*
               * VHT Operation width 1 means an 80 MHz
               * channel definition for the cases handled
               * by this driver.
               */
              if (
                  can80 &&
                  vhtWidth == 1 &&
                  vhtCenterSeg0 != 0
              ) {
                  _connChanWidth = 80;

                  _hw->conf.chandef.width =
                      NL80211_CHAN_WIDTH_80;

                  _hw->conf.chandef.center_freq1 =
                      (uint32_t)(
                          5000 +
                          5 * vhtCenterSeg0
                      );
              }

              IOLog(
                  "rtw88: HP256G8 chandef: "
                  "%u MHz primary=%u center=%u "
                  "HT40=%d VHT80=%d\n",
                  _connChanWidth,
                  chan->center_freq,
                  _hw->conf.chandef.center_freq1,
                  can40 ? 1 : 0,
                  can80 ? 1 : 0
              );
          }

          '''

              c = c.replace(
                  insert_marker,
                  func + insert_marker,
                  1
              )

          #
          # 4. Procura os blocos da v1.0.2 que obrigam
          #    o canal a ficar em 20 MHz.
          #
          variants = [
              """_hw->conf.chandef.chan = chan;
              _hw->conf.chandef.width = NL80211_CHAN_WIDTH_20_NOHT;
              _hw->conf.chandef.center_freq1 = chan->center_freq;""",

              """_hw->conf.chandef.chan = chan;
                  _hw->conf.chandef.width = NL80211_CHAN_WIDTH_20_NOHT;
                  _hw->conf.chandef.center_freq1 = chan->center_freq;""",

              """_hw->conf.chandef.chan = chan;
              _hw->conf.chandef.width = NL80211_CHAN_WIDTH_20;
              _hw->conf.chandef.center_freq1 = chan->center_freq;"""
          ]

          replacements = 0

          for old in variants:
              count = c.count(old)

              if count:
                  c = c.replace(
                      old,
                      "setConnectedChandef(chan);"
                  )
                  replacements += count

          cpp.write_text(c)
          hpp.write_text(h)

          print("====================================")
          print("HP256G8 PATCH V2 APPLIED")
          print("====================================")
          print(
              "Fixed-20MHz blocks replaced:",
              replacements
          )

          if replacements == 0:
              print(
                  "WARNING: no fixed 20MHz block matched."
              )
          PY

          echo
          echo "===== HEADER CHECK ====="

          grep -n \
            "setConnectedChandef" \
            src/kext/RTW88IEEE80211.hpp

          grep -n \
            "_connChanWidth" \
            src/kext/RTW88IEEE80211.hpp

          echo
          echo "===== CPP CHECK ====="

          grep -n \
            "HP256G8 chandef" \
            src/kext/RTW88IEEE80211.cpp

          grep -n \
            "setConnectedChandef" \
            src/kext/RTW88IEEE80211.cpp

      - name: Clone rtw88-stable
        run: |
          git clone \
            --depth 1 \
            https://github.com/thegwchr/rtw88-stable.git

      - name: Download firmware
        run: |
          cd Feixiao/firmware

          for fw in \
            rtw8822b_fw.bin \
            rtw8822c_fw.bin \
            rtw8821c_fw.bin \
            rtw8821a_fw.bin \
            rtw8812a_fw.bin \
            rtw8814a_fw.bin
          do
            if [ ! -s "$fw" ]; then

              echo "Downloading $fw"

              curl \
                -L \
                --fail \
                "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtw88/$fw" \
                -o "$fw"

            fi
          done

      - name: Show build environment
        run: |
          echo "===== macOS ====="
          sw_vers

          echo
          echo "===== Xcode ====="
          xcodebuild -version

          echo
          echo "===== Clang ====="
          clang --version

      - name: Build custom Feixiao
        working-directory: Feixiao
        run: |
          make clean || true

          echo
          echo "===================================="
          echo "BUILDING HP256G8 RTL8821CE DRIVER"
          echo "===================================="

          make all

      - name: Verify build output
        run: |
          echo "===== Build output ====="

          find \
            Feixiao/build/out \
            -maxdepth 3 \
            -print

          echo
          echo "===== Checking KEXT ====="

          test \
            -d \
            Feixiao/build/out/rtw88.kext

          echo "rtw88.kext: OK"

          echo
          echo "===== Checking rtw88ctl ====="

          test \
            -f \
            Feixiao/build/out/rtw88ctl

          echo "rtw88ctl: OK"

      - name: Show KEXT information
        run: |
          echo "===== Info.plist ====="

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            Feixiao/build/out/rtw88.kext/Contents/Info.plist

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" \
            Feixiao/build/out/rtw88.kext/Contents/Info.plist \
            || true

      - name: Package HP256G8 build
        run: |
          OUT="${{ runner.temp }}/Feixiao-HP256G8-80MHz-v2"

          mkdir -p "$OUT"

          cp -R \
            Feixiao/build/out/rtw88.kext \
            "$OUT/"

          cp \
            Feixiao/build/out/rtw88ctl \
            "$OUT/"

          chmod +x \
            "$OUT/rtw88ctl"

          cat > "$OUT/BUILD-INFO.txt" <<'EOF'
          Feixiao HP 256 G8 RTL8821CE experimental build

          Base:
          Feixiao v1.0.2

          Changes:
          - preserve stable v1.0.2 connection path
          - negotiate HT 40 MHz
          - negotiate VHT 80 MHz on 5 GHz
          - no newer A-MPDU/A-MSDU patches
          - targeted at RTL8821CE testing

          IMPORTANT:
          Experimental build. Keep the working v1.0.2
          backup before installing.
          EOF

          cd "${{ runner.temp }}"

          zip \
            -r \
            Feixiao_HP256G8_80MHz_v2.zip \
            Feixiao-HP256G8-80MHz-v2

      - name: Upload HP256G8 custom driver
        uses: actions/upload-artifact@v4
        with:
          name: Feixiao-HP256G8-80MHz-v2
          path: ${{ runner.temp }}/Feixiao_HP256G8_80MHz_v2.zip
          retention-days: 7
