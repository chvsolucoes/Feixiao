name: Build HP256G8 DMA Stability v4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Feixiao v1.0.2
        uses: actions/checkout@v4
        with:
          repository: thegwchr/Feixiao
          ref: v1.0.2
          submodules: recursive
          path: Feixiao
          fetch-depth: 0

      - name: Apply HP256G8 PCI DMA stability patch
        working-directory: Feixiao
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path(".")

          candidates = [
              Path("src/kext/RTW88PCIDevice.cpp"),
              Path("src/kext/RTW88IEEE80211.cpp"),
              Path("src/compat/rtw88_compat.c"),
              Path("src/compat/rtw88_compat.h"),
          ]

          print("=== Searching PCIe / ASPM related code ===")

          for p in candidates:
              if not p.exists():
                  continue

              text = p.read_text(errors="ignore")

              hits = []

              for kw in [
                  "ASPM",
                  "aspm",
                  "L1",
                  "L0s",
                  "power",
                  "pci",
                  "PCI",
              ]:
                  if kw in text:
                      hits.append(kw)

              if hits:
                  print(p, hits)

          #
          # Patch RTW88PCIDevice.cpp if present.
          #
          pci = Path("src/kext/RTW88PCIDevice.cpp")

          if not pci.exists():
              raise SystemExit(
                  "ERROR: RTW88PCIDevice.cpp not found"
              )

          c = pci.read_text()

          #
          # Inject helper that forces PCI command/state awake.
          #
          if "hp256g8ForcePCIActive" not in c:

              insert = c.find(
                  "OSDefineMetaClassAndStructors"
              )

              if insert == -1:
                  raise SystemExit(
                      "ERROR: could not find insertion point"
                  )

              helper = r'''
          static void hp256g8ForcePCIActive(IOPCIDevice *dev)
          {
              if (!dev)
                  return;

              /*
               * Keep the RTL8821CE awake and bus-mastering.
               *
               * This is intentionally conservative:
               * - enable memory access
               * - enable bus mastering
               * - avoid transitioning the device into a
               *   low-power PCI state while the driver is active
               */

              dev->setMemoryEnable(true);
              dev->setBusMasterEnable(true);

              dev->enablePCIPowerManagement(
                  kPCIPMCPMESupportFromD0
              );

              dev->setPowerState(
                  1,
                  dev
              );

              IOLog(
                  "rtw88: HP256G8 PCI active state forced\n"
              );
          }

          '''

              c = c[:insert] + helper + c[insert:]

          #
          # Find calls where PCI device is enabled/opened.
          # Add our helper immediately afterwards.
          #
          patterns = [
              (
                  r'(_pcidev->setMemoryEnable\s*\(\s*true\s*\)\s*;)',
                  r'\1\n    hp256g8ForcePCIActive(_pcidev);'
              ),
              (
                  r'(_pcidev->setBusMasterEnable\s*\(\s*true\s*\)\s*;)',
                  r'\1\n    hp256g8ForcePCIActive(_pcidev);'
              ),
          ]

          modifications = 0

          for pattern, repl in patterns:
              newc, count = re.subn(
                  pattern,
                  repl,
                  c,
                  count=1
              )

              if count:
                  c = newc
                  modifications += count
                  break

          #
          # If neither call exists, insert after probe/open path.
          #
          if modifications == 0:
              probes = [
                  r'(rtw_pci_probe\s*\([^;]+;)',
                  r'(_pcidev->open\s*\([^;]+;)',
              ]

              for pattern in probes:
                  m = re.search(pattern, c)

                  if m:
                      pos = m.end()

                      c = (
                          c[:pos] +
                          "\n    hp256g8ForcePCIActive(_pcidev);" +
                          c[pos:]
                      )

                      modifications += 1
                      break

          if modifications == 0:
              raise SystemExit(
                  "ERROR: could not find PCI init path"
              )

          pci.write_text(c)

          print("PCI initialization patched:", modifications)

          #
          # Add extra timeout diagnostics.
          #
          compat = Path("src/compat/rtw88_compat.c")

          if compat.exists():
              x = compat.read_text()

              needle = "pci bus timeout, check dma status"

              if needle in x and "HP256G8 DMA timeout" not in x:
                  x = x.replace(
                      needle,
                      "HP256G8 DMA timeout - pci bus timeout, check dma status"
                  )

                  compat.write_text(x)

                  print("DMA timeout diagnostic marker added")

          print("=== HP256G8 DMA stability patch applied ===")
          PY

          echo
          echo "===== VERIFY PCI PATCH ====="

          grep -n \
            "HP256G8 PCI active" \
            src/kext/RTW88PCIDevice.cpp

          grep -n \
            "hp256g8ForcePCIActive" \
            src/kext/RTW88PCIDevice.cpp

      - name: Clone rtw88-stable
        run: |
          git clone \
            --depth 1 \
            https://github.com/thegwchr/rtw88-stable.git

      - name: Download firmware
        run: |
          cd Feixiao/firmware

          for fw in \
            rtw8822b_fw.bin \
            rtw8822c_fw.bin \
            rtw8821c_fw.bin \
            rtw8821a_fw.bin \
            rtw8812a_fw.bin \
            rtw8814a_fw.bin
          do
            if [ ! -s "$fw" ]; then

              echo "Downloading $fw"

              curl \
                -L \
                --fail \
                "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtw88/$fw" \
                -o "$fw"

            fi
          done

      - name: Show build environment
        run: |
          echo "===== macOS ====="
          sw_vers

          echo
          echo "===== Xcode ====="
          xcodebuild -version

          echo
          echo "===== Clang ====="
          clang --version

      - name: Build HP256G8 DMA Stability
        working-directory: Feixiao
        run: |
          make clean || true

          echo
          echo "===================================="
          echo "BUILDING HP256G8 DMA STABILITY V4"
          echo "===================================="

          make all

      - name: Verify output
        run: |
          echo "===== Build output ====="

          find \
            Feixiao/build/out \
            -maxdepth 3 \
            -print

          test \
            -d \
            Feixiao/build/out/rtw88.kext

          test \
            -f \
            Feixiao/build/out/rtw88ctl

          echo "rtw88.kext OK"
          echo "rtw88ctl OK"

      - name: Package HP256G8 DMA build
        run: |
          OUT="${{ runner.temp }}/Feixiao-HP256G8-DMA-v4"

          mkdir -p "$OUT"

          cp -R \
            Feixiao/build/out/rtw88.kext \
            "$OUT/"

          cp \
            Feixiao/build/out/rtw88ctl \
            "$OUT/"

          chmod +x "$OUT/rtw88ctl"

          cat > "$OUT/BUILD-INFO.txt" <<'EOF'
          Feixiao HP 256 G8 / RTL8821CE

          Base:
          Feixiao v1.0.2

          Goal:
          PCIe / DMA stability

          Changes:
          - no HT40/VHT80 experimental patch
          - no newer A-MPDU/A-MSDU changes
          - force PCI device memory access enabled
          - force PCI bus mastering enabled
          - attempt to keep PCI device in active state
          - additional PCI/DMA diagnostic marker

          Target problem:
          repeated:
          pci bus timeout, check dma status

          IMPORTANT:
          Experimental build.
          Keep working v1.0.2 backup.
          EOF

          cd "${{ runner.temp }}"

          zip \
            -r \
            Feixiao_HP256G8_DMA_v4.zip \
            Feixiao-HP256G8-DMA-v4

      - name: Upload HP256G8 DMA driver
        uses: actions/upload-artifact@v4
        with:
          name: Feixiao-HP256G8-DMA-v4
          path: ${{ runner.temp }}/Feixiao_HP256G8_DMA_v4.zip
          retention-days: 7
