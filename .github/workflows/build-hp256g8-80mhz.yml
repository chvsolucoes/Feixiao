name: Build HP256G8 80MHz Test v3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Feixiao v1.0.2
        uses: actions/checkout@v4
        with:
          repository: thegwchr/Feixiao
          ref: v1.0.2
          submodules: recursive
          path: Feixiao
          fetch-depth: 0

      - name: Apply HP256G8 40/80 MHz patch v3
        working-directory: Feixiao
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          cpp = Path("src/kext/RTW88IEEE80211.cpp")
          hpp = Path("src/kext/RTW88IEEE80211.hpp")

          c = cpp.read_text()
          h = hpp.read_text()

          # --------------------------------------------------
          # 1. Declare setConnectedChandef()
          # --------------------------------------------------

          if "setConnectedChandef" not in h:
              pattern = r'(\s*void\s+restoreConnectedChannel\s*\(\s*\)\s*;)'

              if not re.search(pattern, h):
                  raise SystemExit(
                      "ERROR: restoreConnectedChannel declaration not found"
                  )

              h = re.sub(
                  pattern,
                  r'\1\n'
                  r'    void      setConnectedChandef('
                  r'struct ieee80211_channel *chan);',
                  h,
                  count=1
              )

          # --------------------------------------------------
          # 2. Add channel-width state next to _txSeq
          # --------------------------------------------------

          if "_connChanWidth" not in h:
              pattern = r'(\s*uint16_t\s+_txSeq\s*=\s*0\s*;)'

              if not re.search(pattern, h):
                  raise SystemExit(
                      "ERROR: _txSeq declaration not found"
                  )

              h = re.sub(
                  pattern,
                  r'\n    uint32_t _connChanWidth = 20;'
                  r'\1',
                  h,
                  count=1
              )

          # --------------------------------------------------
          # 3. Insert channel negotiation function
          # --------------------------------------------------

          insert_pattern = (
              r'void\s+RTW88IEEE80211::'
              r'restoreConnectedChannel\s*\(\s*\)'
          )

          match = re.search(insert_pattern, c)

          if not match:
              raise SystemExit(
                  "ERROR: restoreConnectedChannel implementation not found"
              )

          if "RTW88IEEE80211::setConnectedChandef" not in c:

              func = r'''
          void RTW88IEEE80211::setConnectedChandef(
              struct ieee80211_channel *chan)
          {
              if (!chan || !_hw || !_hw->wiphy)
                  return;

              /*
               * Preserve v1.0.2 behaviour as safe fallback.
               */
              _hw->conf.chandef.chan = chan;
              _hw->conf.chandef.width =
                  NL80211_CHAN_WIDTH_20_NOHT;
              _hw->conf.chandef.center_freq1 =
                  chan->center_freq;

              _connChanWidth = 20;

              enum nl80211_band band =
                  (_targetBSS.channel > 14)
                      ? NL80211_BAND_5GHZ
                      : NL80211_BAND_2GHZ;

              struct ieee80211_supported_band *sband =
                  _hw->wiphy->bands[band];

              if (!sband) {
                  IOLog(
                      "rtw88: HP256G8 no band; using 20 MHz\n"
                  );
                  return;
              }

              bool can40 =
                  (sband->ht_cap.cap &
                   IEEE80211_HT_CAP_SUP_WIDTH_20_40) != 0;

              bool can80 =
                  can40 &&
                  band == NL80211_BAND_5GHZ &&
                  sband->vht_cap.vht_supported;

              int secondaryOffset = 0;
              bool apAllows40 = false;

              int vhtWidth = 0;
              uint8_t vhtCenterSeg0 = 0;

              const uint8_t *ies = _targetBSS.ies;
              uint16_t iesLen = _targetBSS.ies_len;

              /*
               * Parse HT Operation and VHT Operation
               * from the target AP.
               */
              for (uint16_t i = 0; i + 2 <= iesLen;) {

                  uint8_t id = ies[i];
                  uint8_t len = ies[i + 1];

                  if (
                      (uint32_t)i + 2U + (uint32_t)len >
                      (uint32_t)iesLen
                  )
                      break;

                  const uint8_t *data = ies + i + 2;

                  if (
                      id == WLAN_EID_HT_OPERATION &&
                      len >= 2
                  ) {
                      secondaryOffset =
                          data[1] & 0x03;

                      apAllows40 =
                          (data[1] & 0x04) != 0;
                  }

                  else if (
                      id == WLAN_EID_VHT_OPERATION &&
                      len >= 3
                  ) {
                      vhtWidth = data[0];
                      vhtCenterSeg0 = data[1];
                  }

                  i += 2 + len;
              }

              /*
               * HT40
               */
              if (
                  can40 &&
                  apAllows40 &&
                  (
                      secondaryOffset == 1 ||
                      secondaryOffset == 3
                  )
              ) {
                  _connChanWidth = 40;

                  _hw->conf.chandef.width =
                      NL80211_CHAN_WIDTH_40;

                  _hw->conf.chandef.center_freq1 =
                      (uint32_t)(
                          (int)chan->center_freq +
                          (
                              secondaryOffset == 1
                                  ? 10
                                  : -10
                          )
                      );
              }

              /*
               * VHT80
               */
              if (
                  can80 &&
                  vhtWidth == 1 &&
                  vhtCenterSeg0 != 0
              ) {
                  _connChanWidth = 80;

                  _hw->conf.chandef.width =
                      NL80211_CHAN_WIDTH_80;

                  _hw->conf.chandef.center_freq1 =
                      (uint32_t)(
                          5000 +
                          5 * vhtCenterSeg0
                      );
              }

              IOLog(
                  "rtw88: HP256G8 chandef "
                  "%u MHz primary=%u center=%u "
                  "can40=%d can80=%d\n",
                  _connChanWidth,
                  chan->center_freq,
                  _hw->conf.chandef.center_freq1,
                  can40 ? 1 : 0,
                  can80 ? 1 : 0
              );
          }

          '''

              c = (
                  c[:match.start()] +
                  func +
                  c[match.start():]
              )

          # --------------------------------------------------
          # 4. Replace v1.0.2 fixed-20MHz configuration
          # --------------------------------------------------

          fixed20 = re.compile(
              r'_hw->conf\.chandef\.chan\s*=\s*chan\s*;\s*'
              r'_hw->conf\.chandef\.width\s*=\s*'
              r'NL80211_CHAN_WIDTH_20_NOHT\s*;\s*'
              r'_hw->conf\.chandef\.center_freq1\s*=\s*'
              r'chan->center_freq\s*;'
          )

          # Do not replace the fallback inside our new function.
          # Split around the function and patch only original code.

          func_start = c.find(
              "void RTW88IEEE80211::setConnectedChandef"
          )

          restore_start = c.find(
              "void RTW88IEEE80211::restoreConnectedChannel"
          )

          before = c[:func_start]
          custom = c[func_start:restore_start]
          after = c[restore_start:]

          after, replacements = fixed20.subn(
              "setConnectedChandef(chan);",
              after
          )

          c = before + custom + after

          hpp.write_text(h)
          cpp.write_text(c)

          print("====================================")
          print("HP256G8 40/80 MHz PATCH V3 APPLIED")
          print("====================================")
          print("Fixed 20MHz blocks replaced:", replacements)

          if replacements == 0:
              print(
                  "WARNING: no original 20 MHz block replaced"
              )
          PY

          echo
          echo "===== HEADER VERIFY ====="
          grep -n "restoreConnectedChannel" \
            src/kext/RTW88IEEE80211.hpp

          grep -n "setConnectedChandef" \
            src/kext/RTW88IEEE80211.hpp

          grep -n "_connChanWidth" \
            src/kext/RTW88IEEE80211.hpp

          echo
          echo "===== CPP VERIFY ====="
          grep -n "HP256G8 chandef" \
            src/kext/RTW88IEEE80211.cpp

          grep -n "setConnectedChandef" \
            src/kext/RTW88IEEE80211.cpp

      - name: Clone rtw88-stable
        run: |
          git clone \
            --depth 1 \
            https://github.com/thegwchr/rtw88-stable.git

      - name: Download firmware
        run: |
          cd Feixiao/firmware

          for fw in \
            rtw8822b_fw.bin \
            rtw8822c_fw.bin \
            rtw8821c_fw.bin \
            rtw8821a_fw.bin \
            rtw8812a_fw.bin \
            rtw8814a_fw.bin
          do
            if [ ! -s "$fw" ]; then
              curl \
                -L \
                --fail \
                "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtw88/$fw" \
                -o "$fw"
            fi
          done

      - name: Show build environment
        run: |
          sw_vers
          xcodebuild -version
          clang --version

      - name: Build custom Feixiao
        working-directory: Feixiao
        run: |
          make clean || true
          make all

      - name: Verify build output
        run: |
          find Feixiao/build/out -maxdepth 3 -print

          test -d Feixiao/build/out/rtw88.kext
          test -f Feixiao/build/out/rtw88ctl

          echo "rtw88.kext OK"
          echo "rtw88ctl OK"

      - name: Package HP256G8 build
        run: |
          OUT="${{ runner.temp }}/Feixiao-HP256G8-80MHz-v3"

          mkdir -p "$OUT"

          cp -R \
            Feixiao/build/out/rtw88.kext \
            "$OUT/"

          cp \
            Feixiao/build/out/rtw88ctl \
            "$OUT/"

          chmod +x "$OUT/rtw88ctl"

          cat > "$OUT/BUILD-INFO.txt" <<'EOF'
          Feixiao HP 256 G8 / RTL8821CE

          Base:
          Feixiao v1.0.2

          Experimental changes:
          - preserve stable v1.0.2 connection path
          - HT 40 MHz negotiation
          - VHT 80 MHz negotiation on 5 GHz
          - no newer A-MPDU/A-MSDU changes
          EOF

          cd "${{ runner.temp }}"

          zip \
            -r \
            Feixiao_HP256G8_80MHz_v3.zip \
            Feixiao-HP256G8-80MHz-v3

      - name: Upload HP256G8 custom driver
        uses: actions/upload-artifact@v4
        with:
          name: Feixiao-HP256G8-80MHz-v3
          path: ${{ runner.temp }}/Feixiao_HP256G8_80MHz_v3.zip
          retention-days: 7
